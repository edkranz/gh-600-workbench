<svg viewBox="0 0 910 200" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Sub-agent state machine: selected, then started, then either completed or failed, and both of those converge on deselected before the invocation ends.">
  <defs>
    <marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="ar-sub-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--good)"/>
    </marker>
    <marker id="ar-sub-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--bad)"/>
    </marker>
  </defs>

  <!-- entry -->
  <circle cx="20" cy="102" r="8" fill="currentColor"/>

  <!-- states -->
  <rect x="62"  y="74"  width="130" height="56" rx="8" fill="var(--surface)"   stroke="var(--line-2)"/>
  <rect x="262" y="74"  width="130" height="56" rx="8" fill="var(--surface)"   stroke="var(--line-2)"/>
  <rect x="482" y="22"  width="150" height="56" rx="8" fill="var(--good-wash)" stroke="var(--good)"/>
  <rect x="482" y="126" width="150" height="56" rx="8" fill="var(--bad-wash)"  stroke="var(--bad)"/>
  <rect x="726" y="74"  width="130" height="56" rx="8" fill="var(--sunken)"    stroke="var(--line-2)"/>

  <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">
    <text x="127" y="107" fill="var(--ink)">Selected</text>
    <text x="327" y="107" fill="var(--ink)">Started</text>
    <text x="557" y="55"  fill="var(--good)">Completed</text>
    <text x="557" y="159" fill="var(--bad)">Failed</text>
    <text x="791" y="107" fill="var(--ink)">Deselected</text>
  </g>

  <!-- terminal -->
  <circle cx="886" cy="102" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="886" cy="102" r="4.5" fill="currentColor"/>

  <!-- linear transitions -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ar-sub)">
    <line x1="28"  y1="102" x2="56"  y2="102"/>
    <line x1="192" y1="102" x2="256" y2="102"/>
    <line x1="856" y1="102" x2="873" y2="102"/>
  </g>

  <!-- fork out of Started -->
  <path d="M392 102 L440 102 L440 50 L476 50"   stroke="var(--good)" stroke-width="1.5" fill="none" marker-end="url(#ar-sub-good)"/>
  <path d="M392 102 L440 102 L440 154 L476 154" stroke="var(--bad)"  stroke-width="1.5" fill="none" marker-end="url(#ar-sub-bad)"/>

  <!-- both outcomes converge on Deselected -->
  <path d="M632 50  L676 50  L676 102 L720 102" stroke="var(--good)" stroke-width="1.5" fill="none" marker-end="url(#ar-sub-good)"/>
  <path d="M632 154 L676 154 L676 102"          stroke="var(--bad)"  stroke-width="1.5" fill="none"/>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5">
    <text x="127" y="66" fill="var(--muted)" text-anchor="middle">selected</text>
    <text x="224" y="94" fill="var(--muted)" text-anchor="middle">started</text>
    <text x="472" y="42"  fill="var(--good)" text-anchor="end">completed</text>
    <text x="472" y="146" fill="var(--bad)"  text-anchor="end">failed</text>
    <text x="640" y="38"  fill="var(--good)">deselected</text>
    <text x="640" y="170" fill="var(--bad)">deselected</text>
  </g>
</svg>
