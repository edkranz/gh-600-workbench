iate steps, and using tools to produce durable artifacts like branches, commits, and pull requests.\n\nThe GitHub Certified: Agentic AI Developer (GH-600) credential establishes a specification for this new era, moving the focus from prompt engineering to complex system integration and governance. Reliability in these systems is achieved not by granting agents more freedom, but by enforcing structure through GitHub's dual role as a **System of Record** (capturing intent and evidence) and a **Control Plane** (enforcing policy through pull requests, environments, and rulesets). Successful agent architecture relies on a \"Plan -> Act -> Evaluate\" lifecycle, ensuring that human oversight remains the final arbiter of changes to production code.\n\n---\n\n## Detailed Analysis of Key Themes\n\n### 1. The Agentic Lifecycle: Plan -> Act -> Evaluate\nAgentic systems operate through iterative cycles rather than one-time decisions. This loop is the foundational model for agent execution:\n\n*   **Plan:** The agent interprets a goal and generates a structured description of intended changes. High-quality systems treat plans as reviewable artifacts (e.g., PR descriptions or markdown checklists) before execution begins.\n*   **Act:** The agent executes the plan by performing repository actions, such as creating branches, modifying files, and pushing commits.\n*   **Evaluate:** Results are assessed using objective system signals (CI checks, security scans, and human reviews). If evaluation fails, the cycle repeats: the agent revises the plan and adjusts actions until success criteria are met.\n\n### 2. GitHub as System of Record and Control Plane\nGitHub provides the environment needed to supervise and constrain agent behavior through existing primitives:\n\n| **Feature** | **Role as System of Record** | **Role as Control Plane** |\n| :--- | :--- | :--- |\n| **Pull Requests** | Records the rationale and history of a change. | Acts as the primary gate for merging code. |\n| **Actions/Workflows** | Logs the evidence of validation (tests, lints). | Executes the agent in isolated runner environments. |\n| **CODEOWNERS** | Tracks who is responsible for specific file paths. | Automatically routes agent changes to human experts. |\n| **Environments** | Records deployment history. | Gates sensitive actions via required approvals. |\n| **Rulesets** | Logs policy definitions. | Enforces branch protections and required status checks. |\n\n### 3. Architectural Boundaries and Responsibility\nA core architectural principle is that **agents propose and humans/policy accept.** To reduce risk, responsibilities must be mapped to specific SDLC stages:\n\n*   **Separation of Planning and Execution:** Reliable systems separate \"what will be done\" from the \"concrete changes.\" \n    *   *Option A (Plan-first):* A plan is approved by humans *before* any code is written. This is preferred for high-risk infrastructure or security-sensitive work.\n    *   *Option B (Plan + Execution):* Planning and code changes are submitted together in a single PR. This is suited for low-risk, high-iteration tasks.\n*   **Risk-Based Autonomy:** Not all tasks require the same level of oversight. Low-risk tasks (docs, formatting) may use automated merging, while high-risk tasks (infrastructure, secrets) require multiple reviews and environment gates.\n\n### 4. Tooling and the Model Context Protocol (MCP)\nAgents interact with the world through tools and APIs. The **Model Context Protocol (MCP)** provides a standard for agents to discover and use external capabilities.\n\n*   **MCP Servers:** Expose tools (e.g., database access, external APIs) to the agent. GitHub provides a remote MCP server to expose its own platform APIs as tools.\n*   **MCP Registries:** Act as a central catalog for approved servers.\n*   **MCP Allow Lists:** Enforce organization-level policy on which servers an agent is permitted to connect to, serving as a primary defense against supply-chain attacks.\n*   **Agent Firewall:** By default, Copilot Cloud Agent's outbound network access is restricted to prevent data exfiltration. Allow lists can be configured for specific domains or URLs.\n\n### 5. Memory, State, and Persistence\nUnlike stateless assistants, agents require memory to maintain context across long-running tasks.\n*   **Copilot Memory:** Stores repository-level facts (coding conventions, build commands) and user-level preferences. \n*   **Lifecycle of Memory:** Information is validated against the current codebase before use. Stored facts that go unused are automatically deleted after **28 days** to prevent stale context.\n*   **Durable Artifacts:** Agents use PR descriptions, checklists, and workflow artifacts to persist state. This allows an agent to resume work after a failure or a workflow cancellation without repeating completed steps.\n\n---\n\n## Important Quotes with Context\n\n> **\"Capability alone doesn't make an agent reliable. Without a well-defined architecture, agents may act too early, produce unclear changes, or operate without sufficient validation.\"**\n*   *Context:* From the Introduction to Agentic Systems. It emphasizes that the power of an agent must be balanced by architectural constraints to avoid operational instability.\n\n> **\"Agents propose; humans and policy accept.\"**\n*   *Context:* A fundamental design boundary discussed in agent responsibility mapping. It reinforces that the agent is a participant in the workflow, not the owner of the final outcome.\n\n> **\"The certification establishes that creating secure, contained environments for agents is now baseline competency.\"**\n*   *Context:* Alberto Montagnese's analysis of the GH-600 exam. It highlights the shift in the AI engineer's role from \"prompt tweaking\" to infrastructure and security operations.\n\n> **\"Treat 'instructions not to edit' as guidance; treat tool allowlists and gates as enforcement.\"**\n*   *Context:* Guidance on enforcing planning boundaries. It warns that prompt-based instructions are fallible and that hard system controls (allowlists/gates) are necessary for security.\n\n> **\"CI passed is necessary, but not always sufficient. Make success criteria reflect the real intent of the task.\"**\n*   *Context:* Discussion on defining success criteria. It reminds developers that a passing build does not always mean a vulnerability has been resolved or a goal has been met.\n\n---\n\n## Actionable Insights\n\n### For Architectural Design\n*   **Implement Plan Gating:** Configure a \"Plan Gate\" as a required status check in GitHub rulesets. This ensures an agent cannot merge code until a structured plan has been produced and reviewed.\n*   **Use PR Templates:** Standardize agent output by requiring an \"Evidence\" section in PR templates that includes links to workflow runs, test reports, and logs.\n*   **Adopt the Contributor Model:** Evaluate agent-generated PRs using the same \"Definition of Done\" as human contributors, focusing on intent, scope, and alignment with repository policy.\n\n### For Security and Governance\n*   **Apply Least Privilege:** Default to read-only `GITHUB_TOKEN` permissions for workflows. Explicitly grant write access only to the specific jobs that require it (e.g., `contents: write`, `pull-requests: write`).\n*   **Establish a `.github-private` Repository:** Use this specific naming convention at the organization level to store custom agent profiles and organization-wide configurations.\n*   **Enable the Agent Firewall:** Keep the firewall enabled with \"Let repositories decide\" as a baseline, and use the recommended allowlist for common package registries.\n*   **Configure CODEOWNERS:** Protect critical configuration files (e.g., `.github/workflows/`, `.github/agents/`, MCP configs) by requiring review from specialized teams.\n\n### For Operational Reliability\n*   **Design for Failure:** Implement bounded retries for transient errors (network/rate limits) and clear escalation paths for logic failures. If an agent fails a check twice, it should automatically tag a human reviewer.\n*   **Leverage Environments:** Use GitHub Environments for any task involving production deployments or sensitive secrets. This forces a human approval gate before the agent can execute high-impact actions.\n*   **Monitor Session Logs:** Use the Agents tab on GitHub.com or the `gh agent-task` CLI command to inspect an agent's \"internal monologue\" and tool usage in real-time."},{"id":"ref-faq","title":"Domain-by-domain FAQ","summary":"Direct answers to the questions each domain tends to raise, organised by exam domain.","source":"Community study guide (jtur671/gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/media/faq.md","markdown":"## 1. Exam Overview and Domain Weighting\nThis FAQ reference is grounded in the GH-600 certification standards, focusing on the professional requirements for building, supervising, and governing AI agents within the GitHub ecosystem. It provides a structured breakdown of the competencies required to integrate agents into the Software Development Lifecycle (SDLC) using GitHub as both the system of record and the primary control plane.\n\n| Exam Domain | Weighting |\n| :--- | :--- |\n| Domain 1: Prepare Agent Architecture & SDLC Processes | 15–20% |\n| Domain 2: Implement Tool Use & Environment Interaction | 20–25% |\n| Domain 3: Manage Memory, State & Execution | 10–15% |\n| Domain 4: Evaluation, Error Analysis & Tuning | 15–20% |\n| Domain 5: Orchestrate Multi-Agent Coordination | 15–20% |\n| Domain 6: Guardrails & Accountability | 10–15% |\n\n---\n\n## 2. Domain 1: Prepare Agent Architecture & SDLC Processes (15–20%)\n\n**Q: What is the fundamental difference between an AI assistant and an AI agent in a GitHub context?**\n**A:** An assistant is reactive and suggestion-only; it requires a user to manually apply commands or code. An agent is goal-driven and capable of taking independent action within a repository, such as creating branches, modifying files, and opening pull requests to move work forward through a \"Plan-Act-Evaluate\" loop.\n\n**Q: How is a \"structured plan\" defined in the agentic lifecycle?**\n**A:** A plan is a reviewable artifact (often in a PR description or a markdown file) that outlines the intended goal, scope, steps, risks, and validation criteria. Architecturally, separating planning from execution ensures intent is validated before irreversible actions occur.\n\n**Q: Why is the pull request considered an \"architectural control point\" for agents?**\n**A:** Pull requests serve as the primary mechanism for governance. They ensure that agent-generated changes are not pushed directly to protected branches but are instead routed through a workflow where required checks, CODEOWNERS reviews, and human approvals are enforced.\n\n**Q: What are the three core components that must be defined for every agent task?**\n**A:** \n1. **Inputs:** The context, constraints, and boundaries the agent requires (e.g., issue links, repository scope).\n2. **Outputs:** The specific artifacts the agent must produce (e.g., a structured plan and a pull request).\n3. **Success Criteria:** Objective signals used to evaluate results (e.g., passing CI checks or resolving a security vulnerability).\n\n**Q: What is the distinction between GitHub as a \"system of record\" versus a \"control plane\"?**\n**A:** This is a dual role: as a **system of record**, GitHub stores all artifacts and evidence (commits, PR timelines, logs). As a **control plane**, GitHub enforces policy and gates activity. The architectural insight is that the same primitives—such as PRs and rulesets—both record the activity and enforce the policy.\n\n---\n\n## 3. Domain 2: Implement Tool Use & Environment Interaction (20–25%)\n\n**Q: What are the four states of tool enablement for a custom agent?**\n**A:** \n*   **All tools enabled: Omit the `tools` key or use `tools: [\"*\"]`.**\n*   **All tools disabled: Use an empty list: `tools: []`.**\n*   **Specific tools: Provide a named list of allowed tools (e.g., `tools: [\"read\", \"edit\"]`).**\n*   **MCP-server-scoped: Prefix tool names with the server name (e.g., `tools: [\"github/*\"]`).**\n\n**Q: What is the processing order and override hierarchy for Model Context Protocol (MCP) configurations?**\n**A:** The processing order is: (1) Out-of-the-box MCP servers (GitHub and Playwright), (2) Custom agent-specific `mcp-servers`, and (3) Repository-level MCP settings. In conflict resolution, the **\"Lowest Level Wins\"** principle applies: a repository-level configuration overrides an organization-level or enterprise-level configuration of the same name.\n\n**Q: What are the specific limitations of the Agent Firewall?**\n**A:** The firewall only applies to processes started by the agent via its **Bash tool** within the GitHub Actions appliance environment. It does **not** cover egress traffic from MCP servers or processes defined in `copilot-setup-steps.yml`, as these operate outside the Bash tool's execution boundary.\n\n**Q: How do \"Agents secrets\" differ from \"GitHub Actions secrets\"?**\n**A:** They are two separate stores. GitHub Actions secrets are for standard CI/CD and are invisible to Copilot. **Agents secrets and variables** are specifically configured at the organization or repository level for the Copilot cloud agent to use during its sessions.\n\n**Q: What is the purpose of the GitHub remote MCP server?**\n**A:** It is a hosted server that exposes GitHub’s internal APIs (such as issues, pull requests, and code search) as tools. This allows custom agents to perform platform-level actions without requiring bespoke API integration code.\n\n---\n\n## 4. Domain 3: Manage Memory, State & Execution (10–15%)\n\n**Q: What is the \"28-day rule\" regarding agent memory?**\n**A:** Any stored fact or preference in Copilot Memory that is not used or validated is automatically deleted after 28 days. This prevents \"context drift\" caused by the accumulation of stale information.\n\n**Q: What is the difference between repository-level facts and user-level preferences?**\n**A:** Repository-level facts (e.g., coding conventions) are available to all users with memory access in that repo. User-level preferences (e.g., personal coding style) are tied to a specific user and are currently exclusive to Copilot Pro/Pro+ plans.\n\n**Q: How does Copilot validate a repository-level memory before using it?**\n**A:** Stored facts include **citations** to the code that supports them. Before applying a memory, Copilot validates these citations against the **current branch** to ensure the information is still substantiated by the current codebase.\n\n**Q: How is \"context drift\" defined in agent execution?**\n**A:** Context drift is the divergence between the agent's internal assumptions and the actual state of the repository. It often occurs in long-running sessions or when external changes are made to the code that the agent's memory does not yet reflect.\n\n---\n\n## 5. Domain 4: Evaluation, Error Analysis & Tuning (15–20%)\n\n**Q: What are the six surfaces available for tracking agent sessions?**\n**A:** \n1. The **Agents tab** on GitHub.com.\n2. **GitHub CLI** (`gh agent-task`).\n3. **VS Code** via the GitHub PR extension.\n4. **JetBrains IDEs** via the **GitHub Cloud Agent Jobs** button.\n5. **Eclipse** via the agents icon.\n6. **GitHub Mobile** via the Home tab.\n\n**Q: How can a developer trace a specific commit back to its session log?**\n**A:** Every agent-authored commit is signed and includes a link to the corresponding agent session logs directly within the commit message, providing a primary traceability primitive.\n\n**Q: What are the three primary categories of root-cause failures for agents?**\n**A:** \n1. **Reasoning:** The agent developed an incorrect plan or misunderstood the goal.\n2. **Tool:** The agent used a tool incorrectly or the tool itself failed.\n3. **Context:** The agent lacked necessary permissions, encountered stale data (drift), or hit firewall restrictions.\n\n**Q: What is the \"Contributor Model\" for evaluating agent output?**\n**A:** This model dictates that agent work is judged by the same engineering standards as humans. There is a **\"No Bypass\" rule**: agents are subject to the exact same CODEOWNERS and branch protection rules as any other contributor.\n\n**Q: Which CLI command is the primary tool for real-time observability?**\n**A:** Use the command `gh agent-task view --log --follow`. Note that this requires GitHub CLI **v2.80.0+**.\n\n---\n\n## 6. Domain 5: Orchestrate Multi-Agent Coordination (15–20%)\n\n**Q: How does the runtime perform \"intent matching\" for sub-agents?**\n**A:** The runtime analyzes the user's prompt against the `name` and `description` fields defined in each agent's configuration to select the specialist most suited to the task.\n\n**Q: What are the five lifecycle events emitted during sub-agent execution?**\n**A:** \n1. `subagent.selected`\n2. `subagent.started`\n3. `subagent.completed`\n4. `subagent.failed`\n5. `subagent.deselected`\n\n**Q: What is the role of the `toolCallId` in multi-agent orchestration?**\n**A:** The `toolCallId` serves as the join key used to track the start, completion, and failure events of a specific sub-agent invocation within a single execution tree.\n\n**Q: How can a developer prevent an agent from being automatically selected by the runtime?**\n**A:** The `infer` property is **RETIRED**. To block the runtime from auto-selecting an agent based on intent matching, you must now use the `disable-model-invocation: true` property.\n\n---\n\n## 7. Domain 6: Guardrails & Accountability (10–15%)\n\n**Q: Who is authorized to trigger the Copilot cloud agent?**\n**A:** Only users with **write access** to the repository can trigger the agent. Comments or assignments from users with read-only access are ignored to prevent unauthorized execution.\n\n**Q: What is the \"any-yes-routes-up\" triage logic for risk-based autonomy?**\n**A:** If *any* dimension of a task is identified as high-risk, the task escalates to a tier requiring stricter oversight. Triage is performed across three axes: **operational, security, and compliance**.\n\n**Q: How is accountability maintained when an agent authors code?**\n**A:** Accountability is preserved through **co-author attribution**. The agent is the author, but the human initiator is recorded as the co-author. Commits are signed and appear as \"Verified.\"\n\n**Q: What is the role of the `.github-private` repository?**\n**A:** This repository hosts organization-level custom agent profiles in the `/agents/` directory, making them available across all repositories in the organization.\n\n**Q: What are the primary defenses against agents executing unreviewed code?**\n**A:** The **\"Approve and run workflows\"** gate ensures Actions do not run on agent PRs until a write-access user manually approves them. Furthermore, agents **cannot** mark their own PRs as \"Ready for Review\" or approve their own work.\n\n---\n\n## 8. Administrative and Custom Agent Configuration Reference\n\n**Q: What are the size and naming constraints for agent profiles?**\n**A:** \n*   **Prompt Limit:** The prompt body in the markdown file cannot exceed 30,000 characters.\n*   **Naming Convention:** Agent files must use the `.agent.md` extension.\n*   **Characters:** Filenames are restricted to alphanumeric characters (`a-z`, `A-Z`, `0-9`), dots (`.`), hyphens (`-`), and underscores (`_`).\n\n**Q: What are the required fields in an agent profile YAML frontmatter?**\n**A:** The **`description`** field is the only mandatory property; it is critical for intent matching.\n\n**Q: Where are custom agents stored?**\n**A:** At the repository level, they must be in `.github/agents/`. At the organization level, they are stored in the `agents/` directory of the `.github-private` repository. Naming conflict resolution follows the \"Lowest Level Wins\" hierarchy (Repo > Org > Enterprise)."},{"id":"ref-labs","title":"Hands-on lab guide","summary":"Six practical labs: custom instructions, MCP servers and allow lists, an agent in a workflow, PR governance, the agent firewall, and environment protection.","source":"Community study guide (jtur671/gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/lab-guide.md","markdown":"> Six labs targeting the highest-weighted exam domain (Tool use + MCP, 20–25%) and the architecture/guardrails domain (15–20% + 10–15%). Do these in a **sandbox repository** you can wreck. Each lab is ~20–40 minutes.\n>\n> Prerequisites: a GitHub account with **Copilot enabled**, `gh` CLI installed (`brew install gh`), and Node 18+. Some MCP/custom-agent features may require Copilot Business/Enterprise — check your subscription if a step is rejected.\n\n---\n\n## Lab 0 — Sandbox setup (5 min)\n\n```bash\n# Create a clean sandbox repo\nmkdir -p ~/sandbox-gh600 && cd ~/sandbox-gh600\ngit init -b main\necho \"# GH-600 Sandbox\" > README.md\ngit add . && git commit -m \"init\"\n\n# Create the remote and push (private)\ngh auth status   # confirm you're logged in\ngh repo create gh600-sandbox --private --source=. --remote=origin --push\n\n# Sanity check\ngh repo view --web\n```\n\nYou now have a private remote `gh600-sandbox` you can mutate freely.\n\n---\n\n## Lab 1 — Repo-level custom instructions for Copilot (15 min)\n\n**Why this lab:** Repository custom instructions are the canonical home for long-term agent memory (Domain 3 + cross-cutting). Knowing where they live and how they're picked up is a guaranteed exam concept.\n\n```bash\nmkdir -p .github\ncat > .github/copilot-instructions.md <<'EOF'\n# Project conventions for Copilot\n\n## Code style\n- Prefer named exports over default exports.\n- Async functions only — never use `.then()` chains.\n- One assertion per test.\n\n## Pull request etiquette\n- Title format: `<area>: <imperative summary>` (e.g., `auth: rotate session token on login`).\n- PR body must include a \"Why\" section before any \"What\" section.\n- Link an issue or skip linking entirely — don't fake-link.\n\n## Tools to avoid\n- Do not call external network APIs unless explicitly listed in `.github/mcp-allowlist.yml`.\nEOF\n\ngit add .github/copilot-instructions.md\ngit commit -m \"Add Copilot custom instructions\"\ngit push\n```\n\n**Verify**: open Copilot Chat in this repo from VS Code (or `gh copilot` in the terminal) and ask \"What's our PR title format?\" — the instructions should ground the answer.\n\n`★ Insight ─────────────────────────────────────`\nThe exam treats `.github/copilot-instructions.md` (or `AGENTS.md`) as the canonical surface for **long-term, project-stable agent memory**. Org-level instructions are layered on top. When you read an exam question about \"where should team conventions live for an agent,\" the answer is almost always this file — *not* the user prompt, *not* environment secrets.\n`─────────────────────────────────────────────────`\n\n---\n\n## Lab 2 — Configure an MCP server for your agent (30 min)\n\n**Why this lab:** MCP is the most heavily weighted concept on the exam. Touching one for real is non-negotiable.\n\nWe'll add the **GitHub remote MCP server** (exposes GitHub APIs as tools) to a local Copilot setup, then add an allow list.\n\n### Step 2.1 — Inspect what Copilot uses for MCP locally\n\nIn VS Code, open Settings → search \"MCP\" — or check `~/.config/github-copilot/mcp.json` (path may vary by client). Most Copilot installations now have a registry-driven MCP config; you'll either edit a local config or use the Copilot UI to \"Add MCP server.\"\n\n```bash\n# Example local config (path varies by client)\nmkdir -p ~/.config/github-copilot\ncat > ~/.config/github-copilot/mcp.json <<'EOF'\n{\n  \"servers\": {\n    \"github-remote\": {\n      \"type\": \"http\",\n      \"url\": \"https://api.githubcopilot.com/mcp\",\n      \"auth\": \"github-token\"\n    }\n  }\n}\nEOF\n```\n\n> 📝 If your Copilot version manages this via a UI registry instead of a local file, use the UI flow — the *concepts* (server name, URL, auth) are identical.\n\n### Step 2.2 — Add a repository-level MCP allow list\n\nThe exam-bullet says **\"Configure MCP allow lists.\"** Practice it:\n\n```bash\ncat > .github/mcp-allowlist.yml <<'EOF'\n# Repository MCP allow list\n# Only servers listed here may be invoked by agents operating on this repo.\nallowed_servers:\n  - github-remote      # GitHub APIs via remote MCP\n  - docs-search        # internal documentation search\ndenied_servers:\n  - \"*\"                # implicit deny for anything not listed above\nEOF\n\ngit add .github/mcp-allowlist.yml\ngit commit -m \"Add MCP allow list\"\ngit push\n```\n\n> 📝 In an enterprise org, the real allow list lives in **organization settings → Copilot → MCP** (or the equivalent admin panel). The repo-local version above is a *policy intent* file your CI can read. Either way, the exam concept is: untrusted servers must be blocked by name.\n\n### Step 2.3 — Test the agent calling MCP\n\nIn Copilot Chat in VS Code, ask: \"Use the `github-remote` MCP server to list open issues in this repo.\" If it does — your MCP config works. If it refuses or fails, check (in order): the server URL, your token scopes, the allow list, the agent's tool permissions.\n\n`★ Insight ─────────────────────────────────────`\nThe most common cause of \"MCP works for me but not for them\" in a real org is the allow list, not the server config. Memorize this exam reflex: **MCP problem + works elsewhere = check the allow list first.** Question 9 in your mock exam tests exactly this.\n`─────────────────────────────────────────────────`\n\n---\n\n## Lab 3 — Custom Copilot agent in a workflow (30 min)\n\n**Why this lab:** Domain 1 + 2 — agent invoked in CI, with branch-based scope and least-privilege permissions.\n\n```bash\nmkdir -p .github/workflows\ncat > .github/workflows/agent-triage.yml <<'EOF'\nname: Agent triage\n\non:\n  issues:\n    types: [opened, labeled]\n\npermissions:\n  contents: read\n  issues: write\n  pull-requests: write\n\njobs:\n  triage:\n    if: contains(github.event.issue.labels.*.name, 'needs-triage')\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n\n      # ---- 1. PLAN ----\n      - name: Produce structured plan\n        id: plan\n        run: |\n          cat > plan.md <<'PLAN'\n          # Triage plan for issue #${{ github.event.issue.number }}\n\n          Steps:\n          1. Read the issue body and labels.\n          2. Categorize: bug | feature | question | docs.\n          3. Assign appropriate label.\n          4. Comment with category and reasoning.\n          PLAN\n          echo \"plan<<EOF\" >> $GITHUB_OUTPUT\n          cat plan.md >> $GITHUB_OUTPUT\n          echo \"EOF\" >> $GITHUB_OUTPUT\n\n      - name: Upload plan as artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: triage-plan-${{ github.event.issue.number }}\n          path: plan.md\n\n      # ---- 2. ACT ----\n      # (Real version would invoke a Copilot agent or MCP-backed action.\n      # For the lab we stub the action; the plan/act/evaluate shape is what matters.)\n      - name: Categorize and label\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          body=\"${{ github.event.issue.body }}\"\n          if echo \"$body\" | grep -qiE \"error|crash|broken|bug\"; then\n            label=\"bug\"\n          elif echo \"$body\" | grep -qiE \"would be nice|feature|request\"; then\n            label=\"feature\"\n          else\n            label=\"question\"\n          fi\n          gh issue edit ${{ github.event.issue.number }} --add-label \"$label\"\n          echo \"category=$label\" >> $GITHUB_OUTPUT\n\n      # ---- 3. EVALUATE ----\n      - name: Comment with traceability record\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          gh issue comment ${{ github.event.issue.number }} --body \"🤖 Agent triage complete.\n          \n          See workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n          Plan artifact: triage-plan-${{ github.event.issue.number }}\"\nEOF\n\ngit add .github/workflows/agent-triage.yml\ngit commit -m \"Add plan/act/evaluate triage agent workflow\"\ngit push\n```\n\n**Test it:**\n```bash\ngh issue create --title \"App crashes on startup\" --body \"Getting an error when I open the app\" --label needs-triage\n# Watch the workflow run\ngh run watch\n```\n\n**What this lab demonstrates (each maps to an exam bullet):**\n- ✅ Plan → Act → Evaluate separation (Domain 1)\n- ✅ Structured plan output as workflow artifact (Domain 1)\n- ✅ Inspectable artifacts within standard tooling (Domain 1)\n- ✅ Agent invoked in a CI workflow (Domain 2)\n- ✅ Least-privilege `permissions:` block (Domain 6)\n- ✅ Traceability via run-link comment (Domain 2)\n\n---\n\n## Lab 4 — PR governance for agent-authored work (20 min)\n\n**Why this lab:** Domain 1 + 6 — branch protection, CODEOWNERS, required checks. This is the \"GitHub as control plane\" embodiment.\n\n```bash\n# CODEOWNERS — require human review on sensitive paths\nmkdir -p .github\ncat > .github/CODEOWNERS <<'EOF'\n# Anything in .github/workflows requires platform-team approval\n.github/workflows/   @your-username\n\n# Anything touching auth requires the security team\n/src/auth/           @your-username\n\n# Migrations are highest-risk\n/migrations/         @your-username\nEOF\n\n# PR template that the agent must fill out\nmkdir -p .github\ncat > .github/PULL_REQUEST_TEMPLATE.md <<'EOF'\n## Why\n<!-- The motivation for this change. Required. -->\n\n## What\n<!-- Concrete changes made. -->\n\n## Plan artifact\n<!-- Link to the workflow artifact containing the agent's structured plan. -->\n\n## Risk\n- [ ] Reversible (no data loss, no prod impact)\n- [ ] Irreversible (requires explicit human approval)\nEOF\n\ngit add .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md\ngit commit -m \"Add CODEOWNERS and PR template for agent governance\"\ngit push\n\n# Branch protection on main\ngh api -X PUT \"repos/$(gh repo view --json nameWithOwner -q .nameWithOwner)/branches/main/protection\" \\\n  --input - <<'EOF'\n{\n  \"required_status_checks\": null,\n  \"enforce_admins\": false,\n  \"required_pull_request_reviews\": {\n    \"required_approving_review_count\": 1,\n    \"require_code_owner_reviews\": true\n  },\n  \"restrictions\": null\n}\nEOF\n```\n\n> ⚠️ `gh api` for branch protection requires admin on the repo. If you get 403, set the protection via the Settings UI instead.\n\n`★ Insight ─────────────────────────────────────`\nThe audience-profile phrase \"GitHub as the control plane\" is concretely *this lab*: CODEOWNERS routes review, branch protection enforces it, the PR template constrains agent output to required fields. The agent has no special powers — it must pass the same gates a human contributor passes. This is the **contributor model** Domain 1 expects you to recognize.\n`─────────────────────────────────────────────────`\n\n---\n\n## Lab 5 — Copilot cloud agent firewall (15 min)\n\n**Why this lab:** Domain 2 bullet \"Configure an agent to handle environment-specific constraints.\" The cloud-agent firewall is the named feature.\n\nThe cloud agent firewall is configured at **organization or repository settings → Copilot → Coding agent → Firewall**. From the CLI you can inspect with:\n\n```bash\n# Inspect the current firewall config (org-level)\ngh api orgs/<your-org>/copilot/cloud-agent/firewall 2>/dev/null || \\\n  echo \"API surface may differ — use the Settings UI\"\n```\n\nIn the UI:\n1. Settings → Copilot → Coding agent → Firewall\n2. Set the **allow list** to only the hosts your agent needs (e.g., `api.github.com`, your package registry)\n3. Confirm the default policy is **deny**\n\n**Read** [Customize the agent firewall](https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/customize-the-agent-firewall) — the exam may use the exact terminology from this doc.\n\n---\n\n## Lab 6 — Environment protection for irreversible actions (15 min)\n\n**Why this lab:** Domain 6's \"Require explicit authorization or controlled paths for irreversible or compliance-sensitive changes.\"\n\n```bash\n# Create a 'production' environment with required reviewers\ngh api -X PUT \"repos/$(gh repo view --json nameWithOwner -q .nameWithOwner)/environments/production\" \\\n  --input - <<EOF\n{\n  \"wait_timer\": 0,\n  \"reviewers\": [\n    {\"type\": \"User\", \"id\": $(gh api user -q .id)}\n  ],\n  \"deployment_branch_policy\": {\n    \"protected_branches\": true,\n    \"custom_branch_policies\": false\n  }\n}\nEOF\n```\n\nThen a workflow that targets this environment:\n\n```bash\ncat > .github/workflows/deploy.yml <<'EOF'\nname: Deploy\n\non:\n  workflow_dispatch:\n    inputs:\n      version:\n        description: 'Version to deploy'\n        required: true\n\npermissions:\n  contents: read\n  deployments: write\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    environment: production    # ← this is the gate\n    steps:\n      - run: echo \"Deploying ${{ inputs.version }} (would actually deploy here)\"\nEOF\n\ngit add .github/workflows/deploy.yml\ngit commit -m \"Add prod deploy workflow gated by environment\"\ngit push\n\n# Trigger and watch the approval flow\ngh workflow run deploy.yml -f version=v1.2.3\ngh run watch\n```\n\nYou'll see the run pause for your approval — that's the controlled path for irreversible actions.\n\n---\n\n## Lab cleanup\n\nWhen done practicing:\n\n```bash\n# Delete the sandbox repo (local + remote)\ncd ~ && rm -rf ~/sandbox-gh600\ngh repo delete <your-username>/gh600-sandbox --yes\n```\n\n---\n\n## What you should be able to explain after these labs\n\nFor each item below, you should be able to say *which feature, where it lives, and what it controls* without looking it up:\n\n- [ ] `.github/copilot-instructions.md` — long-term agent memory at repo scope\n- [ ] MCP server config — where it's declared, how it's invoked\n- [ ] MCP allow list — what's blocked vs. allowed, where it's enforced\n- [ ] GitHub remote MCP server — what APIs it exposes\n- [ ] Workflow `permissions:` block — least-privilege per workflow\n- [ ] `workflow_dispatch` + environment approval — controlled path for irreversible actions\n- [ ] CODEOWNERS — path-scoped required reviewers\n- [ ] Branch protection / required PR reviews — enforce CODEOWNERS at merge\n- [ ] Cloud agent firewall — egress allow list for the Copilot cloud agent\n- [ ] PR template — constrain agent output to required fields\n- [ ] Workflow artifact upload — durable, inspectable plan/state output\n\nIf any of those make you reach for docs, redo that lab."},{"id":"ref-diagrams","title":"Concept diagrams","summary":"Five Mermaid diagrams of the core mechanisms: the lifecycle loop, risk-tiered autonomy, MCP governance, multi-agent isolation, and the failure-recovery path.","source":"Community study guide (jtur671/gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/diagrams.md","markdown":"Centralized source for the 5 study diagrams. Each block is also inlined into the relevant module/research markdown so it renders in NotebookLM, GitHub, and Notion automatically — but maintain them here first.\n\n---\n\n## 1. Plan → Act → Evaluate lifecycle\n\n**Exam domain**: 1 (Architecture & SDLC processes)\n\n```svg Evaluation feeds back into planning. A linear plan-act-evaluate run is the anti-pattern.\n<svg viewBox=\"0 0 880 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\n     aria-label=\"The agent lifecycle is a loop: plan produces an inspectable artifact, act produces a branch and pull request, evaluate consumes checks and scans. Passing gates lead to merge; failing checks send the agent back to revise the plan.\">\n  <defs>\n    <marker id=\"ar-life\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/>\n    <\/marker>\n    <marker id=\"ar-life-accent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/>\n    <\/marker>\n  <\/defs>\n\n  <!-- phases -->\n  <rect x=\"20\"  y=\"52\" width=\"168\" height=\"78\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <rect x=\"264\" y=\"52\" width=\"168\" height=\"78\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <rect x=\"508\" y=\"52\" width=\"168\" height=\"78\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <rect x=\"752\" y=\"52\" width=\"120\" height=\"78\" rx=\"8\" fill=\"var(--accent-wash)\" stroke=\"var(--accent)\"/>\n\n  <g font-family=\"IBM Plex Sans, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"var(--ink)\" text-anchor=\"middle\">\n    <text x=\"104\" y=\"84\">Plan<\/text>\n    <text x=\"348\" y=\"84\">Act<\/text>\n    <text x=\"592\" y=\"84\">Evaluate<\/text>\n    <text x=\"812\" y=\"84\" fill=\"var(--accent-ink)\">Merge<\/text>\n  <\/g>\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10\" fill=\"var(--faint)\" text-anchor=\"middle\">\n    <text x=\"104\" y=\"105\">produces a plan<\/text>\n    <text x=\"104\" y=\"118\">artifact or PR body<\/text>\n    <text x=\"348\" y=\"105\">produces a branch,<\/text>\n    <text x=\"348\" y=\"118\">commits, a PR<\/text>\n    <text x=\"592\" y=\"105\">consumes checks,<\/text>\n    <text x=\"592\" y=\"118\">reviews, scans<\/text>\n    <text x=\"812\" y=\"112\" fill=\"var(--accent-ink)\">outcome<\/text>\n  <\/g>\n\n  <!-- forward flow -->\n  <g stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar-life)\">\n    <line x1=\"188\" y1=\"91\" x2=\"258\" y2=\"91\"/>\n    <line x1=\"432\" y1=\"91\" x2=\"502\" y2=\"91\"/>\n  <\/g>\n  <line x1=\"676\" y1=\"91\" x2=\"746\" y2=\"91\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#ar-life-accent)\"/>\n\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\" fill=\"var(--muted)\" text-anchor=\"middle\">\n    <text x=\"223\" y=\"80\">execute<\/text>\n    <text x=\"467\" y=\"80\">evidence<\/text>\n    <text x=\"711\" y=\"80\" fill=\"var(--accent-ink)\">gates pass<\/text>\n  <\/g>\n\n  <!-- feedback loop -->\n  <path d=\"M592 130 L592 190 L104 190 L104 136\" stroke=\"currentColor\" stroke-width=\"1.5\"\n        fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#ar-life)\"/>\n  <text x=\"348\" y=\"183\" font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\"\n        fill=\"var(--muted)\" text-anchor=\"middle\">checks fail or criteria unmet — revise the plan and run again<\/text>\n<\/svg>\n```\n\nThe loop is the key: evaluate failures don't terminate the agent — they feed back into a new plan. Linear flow is the anti-pattern.\n\n---\n\n## 2. Risk-tiered autonomy decision tree\n\n**Exam domain**: 6 (Guardrails & accountability)\n\n```svg Triage in order, and any single yes escalates - risk is not averaged across the three dimensions.\n<svg viewBox=\"0 0 760 408\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\n     aria-label=\"Risk triage for an agent action, checked in order: operational risk, then security risk, then compliance risk. A yes on operational or security risk routes to human-authored execution; a yes on compliance risk routes to approval-gated execution; only a no on all three allows full automation.\">\n  <defs>\n    <marker id=\"ar-risk\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/>\n    <\/marker>\n  <\/defs>\n\n  <!-- decision column -->\n  <rect x=\"48\"  y=\"16\"  width=\"250\" height=\"46\" rx=\"8\" fill=\"var(--sunken)\"  stroke=\"var(--line-2)\"/>\n  <rect x=\"48\"  y=\"92\"  width=\"250\" height=\"54\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <rect x=\"48\"  y=\"172\" width=\"250\" height=\"54\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <rect x=\"48\"  y=\"252\" width=\"250\" height=\"54\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <rect x=\"48\"  y=\"332\" width=\"250\" height=\"58\" rx=\"8\" fill=\"var(--good-wash)\" stroke=\"var(--good)\"/>\n\n  <g font-family=\"IBM Plex Sans, system-ui, sans-serif\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--ink)\" text-anchor=\"middle\">\n    <text x=\"173\" y=\"44\">Agent action<\/text>\n    <text x=\"173\" y=\"118\">Operational risk?<\/text>\n    <text x=\"173\" y=\"198\">Security risk?<\/text>\n    <text x=\"173\" y=\"278\">Compliance risk?<\/text>\n    <text x=\"173\" y=\"357\" fill=\"var(--good)\">Fully autonomous<\/text>\n  <\/g>\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10\" fill=\"var(--faint)\" text-anchor=\"middle\">\n    <text x=\"173\" y=\"135\">does failure break things?<\/text>\n    <text x=\"173\" y=\"215\">could it leak or expose?<\/text>\n    <text x=\"173\" y=\"295\">regulated or auditable?<\/text>\n    <text x=\"173\" y=\"376\" fill=\"var(--good)\">docs · formatting · lint fixes<\/text>\n  <\/g>\n\n  <!-- outcome column -->\n  <rect x=\"452\" y=\"104\" width=\"284\" height=\"110\" rx=\"8\" fill=\"var(--bad-wash)\"  stroke=\"var(--bad)\"/>\n  <rect x=\"452\" y=\"250\" width=\"284\" height=\"64\"  rx=\"8\" fill=\"var(--warn-wash)\" stroke=\"var(--warn)\"/>\n\n  <g font-family=\"IBM Plex Sans, system-ui, sans-serif\" font-size=\"13.5\" font-weight=\"600\" text-anchor=\"middle\">\n    <text x=\"594\" y=\"145\" fill=\"var(--bad)\">Human-authored<\/text>\n    <text x=\"594\" y=\"275\" fill=\"var(--warn)\">Approval-gated<\/text>\n  <\/g>\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10\" text-anchor=\"middle\">\n    <text x=\"594\" y=\"164\" fill=\"var(--bad)\">production deploys · secrets<\/text>\n    <text x=\"594\" y=\"178\" fill=\"var(--bad)\">schema migrations · deletes<\/text>\n    <text x=\"594\" y=\"294\" fill=\"var(--warn)\">logic changes · dependency bumps<\/text>\n  <\/g>\n\n  <!-- no path, straight down -->\n  <g stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar-risk)\">\n    <line x1=\"173\" y1=\"62\"  x2=\"173\" y2=\"86\"/>\n    <line x1=\"173\" y1=\"146\" x2=\"173\" y2=\"166\"/>\n    <line x1=\"173\" y1=\"226\" x2=\"173\" y2=\"246\"/>\n    <line x1=\"173\" y1=\"306\" x2=\"173\" y2=\"326\"/>\n  <\/g>\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\" fill=\"var(--muted)\">\n    <text x=\"183\" y=\"161\">no<\/text>\n    <text x=\"183\" y=\"241\">no<\/text>\n    <text x=\"183\" y=\"321\">no<\/text>\n  <\/g>\n\n  <!-- yes path, straight right -->\n  <g stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar-risk)\">\n    <line x1=\"298\" y1=\"119\" x2=\"446\" y2=\"119\"/>\n    <line x1=\"298\" y1=\"199\" x2=\"446\" y2=\"199\"/>\n    <line x1=\"298\" y1=\"279\" x2=\"446\" y2=\"279\"/>\n  <\/g>\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\" fill=\"var(--muted)\" text-anchor=\"middle\">\n    <text x=\"372\" y=\"111\">yes<\/text>\n    <text x=\"372\" y=\"191\">yes<\/text>\n    <text x=\"372\" y=\"271\">yes<\/text>\n  <\/g>\n<\/svg>\n```\n\nAny-yes-routes-up: if *any* risk dimension trips, escalate. The exam will test this triage order.\n\n---\n\n## 3. MCP server / registry / allow list interaction\n\n**Exam domain**: 2 (Tool use & environment interaction — highest weighted)\n\n```svg The allow list is checked after registry discovery and before the tool call. Discovery is not permission.\n<svg viewBox=\"0 0 800 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\n     aria-label=\"Order of operations for MCP governance: the developer or agent discovers servers in the registry, then asks the organization allow list for permission, and only then invokes a tool on the MCP server. If the server is not on the allow list the request is blocked and the tool call never happens.\">\n  <defs>\n    <marker id=\"ar-mcp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/>\n    <\/marker>\n    <marker id=\"ar-mcp-good\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--good)\"/>\n    <\/marker>\n    <marker id=\"ar-mcp-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--bad)\"/>\n    <\/marker>\n  <\/defs>\n\n  <!-- participants -->\n  <rect x=\"17\"  y=\"14\" width=\"150\" height=\"40\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <rect x=\"217\" y=\"14\" width=\"150\" height=\"40\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <rect x=\"417\" y=\"14\" width=\"150\" height=\"40\" rx=\"7\" fill=\"var(--accent-wash)\" stroke=\"var(--accent)\"/>\n  <rect x=\"625\" y=\"14\" width=\"150\" height=\"40\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <g font-family=\"IBM Plex Sans, system-ui, sans-serif\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--ink)\" text-anchor=\"middle\">\n    <text x=\"92\"  y=\"39\">Developer / agent<\/text>\n    <text x=\"292\" y=\"39\">MCP registry<\/text>\n    <text x=\"492\" y=\"39\" fill=\"var(--accent-ink)\">Org allow list<\/text>\n    <text x=\"700\" y=\"39\">MCP server<\/text>\n  <\/g>\n\n  <!-- lifelines -->\n  <g stroke=\"var(--line-2)\" stroke-width=\"1\" stroke-dasharray=\"3 4\">\n    <line x1=\"92\"  y1=\"54\" x2=\"92\"  y2=\"306\"/>\n    <line x1=\"292\" y1=\"54\" x2=\"292\" y2=\"306\"/>\n    <line x1=\"492\" y1=\"54\" x2=\"492\" y2=\"306\"/>\n    <line x1=\"700\" y1=\"54\" x2=\"700\" y2=\"306\"/>\n  <\/g>\n\n  <!-- messages -->\n  <g stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\">\n    <line x1=\"92\"  y1=\"88\"  x2=\"286\" y2=\"88\"  marker-end=\"url(#ar-mcp)\"/>\n    <line x1=\"292\" y1=\"118\" x2=\"98\"  y2=\"118\" marker-end=\"url(#ar-mcp)\" stroke-dasharray=\"5 4\"/>\n    <line x1=\"92\"  y1=\"154\" x2=\"486\" y2=\"154\" marker-end=\"url(#ar-mcp)\"/>\n    <line x1=\"92\"  y1=\"218\" x2=\"694\" y2=\"218\" marker-end=\"url(#ar-mcp)\"/>\n    <line x1=\"700\" y1=\"248\" x2=\"98\"  y2=\"248\" marker-end=\"url(#ar-mcp)\" stroke-dasharray=\"5 4\"/>\n  <\/g>\n  <line x1=\"492\" y1=\"186\" x2=\"98\" y2=\"186\" stroke=\"var(--good)\" stroke-width=\"1.5\"\n        stroke-dasharray=\"5 4\" marker-end=\"url(#ar-mcp-good)\"/>\n\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\" fill=\"var(--muted)\">\n    <text x=\"104\" y=\"79\">1 · discover available servers<\/text>\n    <text x=\"104\" y=\"109\">2 · server catalog<\/text>\n    <text x=\"104\" y=\"145\">3 · may I enable server X?<\/text>\n    <text x=\"104\" y=\"177\" fill=\"var(--good)\">4 · allowed<\/text>\n    <text x=\"104\" y=\"209\">5 · invoke tool<\/text>\n    <text x=\"104\" y=\"239\">6 · tool result<\/text>\n  <\/g>\n\n  <!-- blocked branch -->\n  <line x1=\"17\" y1=\"272\" x2=\"783\" y2=\"272\" stroke=\"var(--line-2)\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n  <rect x=\"17\" y=\"262\" width=\"86\" height=\"19\" rx=\"4\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <text x=\"60\" y=\"276\" font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10\"\n        fill=\"var(--faint)\" text-anchor=\"middle\">otherwise<\/text>\n\n  <line x1=\"492\" y1=\"300\" x2=\"98\" y2=\"300\" stroke=\"var(--bad)\" stroke-width=\"1.5\"\n        stroke-dasharray=\"5 4\" marker-end=\"url(#ar-mcp-bad)\"/>\n  <text x=\"104\" y=\"291\" font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\"\n        fill=\"var(--bad)\">4 · blocked — not on the allow list, so steps 5 and 6 never happen<\/text>\n<\/svg>\n```\n\nThe allow list is enforced *after* registry discovery, *before* the tool call. Skipping the allow-list check is the most common exam-trap scenario.\n\n---\n\n## 4. SDLC integration: control plane + system of record\n\n**Exam domain**: 1 (Architecture & SDLC) + 6 (Guardrails)\n\n```svg The same primitives that enforce policy are the ones that record what happened - that is what \"system of record and control plane\" means.\n<svg viewBox=\"0 0 900 470\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\n     aria-label=\"A closed loop: GitHub's control-plane primitives enforce constraints on the agent workflow, the workflow produces artifacts into GitHub's system of record, and that record is audited back through the same control-plane primitives.\">\n  <defs>\n    <marker id=\"ar-cp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/>\n    <\/marker>\n    <marker id=\"ar-cp-accent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/>\n    <\/marker>\n  <\/defs>\n\n  <!-- control plane -->\n  <rect x=\"28\" y=\"16\" width=\"772\" height=\"104\" rx=\"10\" fill=\"none\" stroke=\"var(--accent)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"44\" y=\"38\" font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\"\n        letter-spacing=\"1.4\" fill=\"var(--accent-ink)\">GITHUB CONTROL PLANE — ENFORCES<\/text>\n  <g>\n    <rect x=\"44\"  y=\"50\" width=\"172\" height=\"52\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"236\" y=\"50\" width=\"172\" height=\"52\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"428\" y=\"50\" width=\"172\" height=\"52\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"620\" y=\"50\" width=\"172\" height=\"52\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <\/g>\n  <g font-family=\"IBM Plex Sans, system-ui, sans-serif\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--ink)\" text-anchor=\"middle\">\n    <text x=\"130\" y=\"72\">Rulesets and<\/text><text x=\"130\" y=\"88\">branch protection<\/text>\n    <text x=\"322\" y=\"80\">Required checks<\/text>\n    <text x=\"514\" y=\"80\">CODEOWNERS<\/text>\n    <text x=\"706\" y=\"72\">Environments<\/text><text x=\"706\" y=\"88\">with reviewers<\/text>\n  <\/g>\n\n  <!-- enforces -->\n  <line x1=\"414\" y1=\"120\" x2=\"414\" y2=\"158\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#ar-cp-accent)\"/>\n  <text x=\"426\" y=\"144\" font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\"\n        fill=\"var(--accent-ink)\">enforces<\/text>\n\n  <!-- pipeline -->\n  <rect x=\"28\" y=\"164\" width=\"772\" height=\"140\" rx=\"10\" fill=\"none\" stroke=\"var(--line-2)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"44\" y=\"186\" font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\"\n        letter-spacing=\"1.4\" fill=\"var(--faint)\">AGENT WORKFLOW — GITHUB ACTIONS<\/text>\n  <g>\n    <rect x=\"50\"  y=\"210\" width=\"164\" height=\"62\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"238\" y=\"210\" width=\"164\" height=\"62\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"426\" y=\"210\" width=\"164\" height=\"62\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"614\" y=\"210\" width=\"164\" height=\"62\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <\/g>\n  <g font-family=\"IBM Plex Sans, system-ui, sans-serif\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--ink)\" text-anchor=\"middle\">\n    <text x=\"132\" y=\"234\">Trigger<\/text>\n    <text x=\"320\" y=\"234\">Plan job<\/text>\n    <text x=\"508\" y=\"234\">Act job<\/text>\n    <text x=\"696\" y=\"234\">Eval job<\/text>\n  <\/g>\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"9.5\" fill=\"var(--faint)\" text-anchor=\"middle\">\n    <text x=\"132\" y=\"252\">PR · issue<\/text><text x=\"132\" y=\"264\">workflow_dispatch<\/text>\n    <text x=\"320\" y=\"252\">uploads the plan<\/text><text x=\"320\" y=\"264\">as an artifact<\/text>\n    <text x=\"508\" y=\"252\">scoped token<\/text><text x=\"508\" y=\"264\">on its own branch<\/text>\n    <text x=\"696\" y=\"252\">checks, scans,<\/text><text x=\"696\" y=\"264\">review outcomes<\/text>\n  <\/g>\n  <g stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar-cp)\">\n    <line x1=\"214\" y1=\"241\" x2=\"232\" y2=\"241\"/>\n    <line x1=\"402\" y1=\"241\" x2=\"420\" y2=\"241\"/>\n    <line x1=\"590\" y1=\"241\" x2=\"608\" y2=\"241\"/>\n  <\/g>\n\n  <!-- produces -->\n  <line x1=\"414\" y1=\"304\" x2=\"414\" y2=\"342\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#ar-cp-accent)\"/>\n  <text x=\"426\" y=\"328\" font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\"\n        fill=\"var(--accent-ink)\">produces<\/text>\n\n  <!-- system of record -->\n  <rect x=\"28\" y=\"348\" width=\"772\" height=\"104\" rx=\"10\" fill=\"none\" stroke=\"var(--accent)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"44\" y=\"370\" font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\"\n        letter-spacing=\"1.4\" fill=\"var(--accent-ink)\">GITHUB SYSTEM OF RECORD — REMEMBERS<\/text>\n  <g>\n    <rect x=\"44\"  y=\"382\" width=\"172\" height=\"52\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"236\" y=\"382\" width=\"172\" height=\"52\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"428\" y=\"382\" width=\"172\" height=\"52\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n    <rect x=\"620\" y=\"382\" width=\"172\" height=\"52\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--line-2)\"/>\n  <\/g>\n  <g font-family=\"IBM Plex Sans, system-ui, sans-serif\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--ink)\" text-anchor=\"middle\">\n    <text x=\"130\" y=\"404\">Pull requests<\/text><text x=\"130\" y=\"420\">and commits<\/text>\n    <text x=\"322\" y=\"404\">Workflow runs<\/text><text x=\"322\" y=\"420\">and job logs<\/text>\n    <text x=\"514\" y=\"412\">Artifacts<\/text>\n    <text x=\"706\" y=\"404\">Reviews and<\/text><text x=\"706\" y=\"420\">security alerts<\/text>\n  <\/g>\n\n  <!-- audited via -->\n  <path d=\"M800 400 L840 400 L840 68 L806 68\" stroke=\"var(--accent)\" stroke-width=\"1.5\"\n        fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#ar-cp-accent)\"/>\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\" fill=\"var(--accent-ink)\">\n    <text x=\"850\" y=\"230\">audited<\/text>\n    <text x=\"850\" y=\"244\">via<\/text>\n  <\/g>\n<\/svg>\n```\n\nSame GitHub primitives both *record* activity and *enforce* policy — that's what \"system of record AND control plane\" means in the audience profile.\n\n---\n\n## 5. Sub-agent lifecycle (Copilot SDK state machine)\n\n**Exam domain**: 5 (Multi-agent orchestration)\n\n```svg Five events, and both outcomes converge on deselected. toolCallId is the join key across all of them.\n<svg viewBox=\"0 0 910 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"\n     aria-label=\"Sub-agent state machine: selected, then started, then either completed or failed, and both of those converge on deselected before the invocation ends.\">\n  <defs>\n    <marker id=\"ar-sub\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/>\n    <\/marker>\n    <marker id=\"ar-sub-good\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--good)\"/>\n    <\/marker>\n    <marker id=\"ar-sub-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--bad)\"/>\n    <\/marker>\n  <\/defs>\n\n  <!-- entry -->\n  <circle cx=\"20\" cy=\"102\" r=\"8\" fill=\"currentColor\"/>\n\n  <!-- states -->\n  <rect x=\"62\"  y=\"74\"  width=\"130\" height=\"56\" rx=\"8\" fill=\"var(--surface)\"   stroke=\"var(--line-2)\"/>\n  <rect x=\"262\" y=\"74\"  width=\"130\" height=\"56\" rx=\"8\" fill=\"var(--surface)\"   stroke=\"var(--line-2)\"/>\n  <rect x=\"482\" y=\"22\"  width=\"150\" height=\"56\" rx=\"8\" fill=\"var(--good-wash)\" stroke=\"var(--good)\"/>\n  <rect x=\"482\" y=\"126\" width=\"150\" height=\"56\" rx=\"8\" fill=\"var(--bad-wash)\"  stroke=\"var(--bad)\"/>\n  <rect x=\"726\" y=\"74\"  width=\"130\" height=\"56\" rx=\"8\" fill=\"var(--sunken)\"    stroke=\"var(--line-2)\"/>\n\n  <g font-family=\"IBM Plex Sans, system-ui, sans-serif\" font-size=\"13.5\" font-weight=\"600\" text-anchor=\"middle\">\n    <text x=\"127\" y=\"107\" fill=\"var(--ink)\">Selected<\/text>\n    <text x=\"327\" y=\"107\" fill=\"var(--ink)\">Started<\/text>\n    <text x=\"557\" y=\"55\"  fill=\"var(--good)\">Completed<\/text>\n    <text x=\"557\" y=\"159\" fill=\"var(--bad)\">Failed<\/text>\n    <text x=\"791\" y=\"107\" fill=\"var(--ink)\">Deselected<\/text>\n  <\/g>\n\n  <!-- terminal -->\n  <circle cx=\"886\" cy=\"102\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"886\" cy=\"102\" r=\"4.5\" fill=\"currentColor\"/>\n\n  <!-- linear transitions -->\n  <g stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar-sub)\">\n    <line x1=\"28\"  y1=\"102\" x2=\"56\"  y2=\"102\"/>\n    <line x1=\"192\" y1=\"102\" x2=\"256\" y2=\"102\"/>\n    <line x1=\"856\" y1=\"102\" x2=\"873\" y2=\"102\"/>\n  <\/g>\n\n  <!-- fork out of Started -->\n  <path d=\"M392 102 L440 102 L440 50 L476 50\"   stroke=\"var(--good)\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar-sub-good)\"/>\n  <path d=\"M392 102 L440 102 L440 154 L476 154\" stroke=\"var(--bad)\"  stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar-sub-bad)\"/>\n\n  <!-- both outcomes converge on Deselected -->\n  <path d=\"M632 50  L676 50  L676 102 L720 102\" stroke=\"var(--good)\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ar-sub-good)\"/>\n  <path d=\"M632 154 L676 154 L676 102\"          stroke=\"var(--bad)\"  stroke-width=\"1.5\" fill=\"none\"/>\n\n  <g font-family=\"IBM Plex Mono, ui-monospace, monospace\" font-size=\"10.5\">\n    <text x=\"127\" y=\"66\" fill=\"var(--muted)\" text-anchor=\"middle\">selected<\/text>\n    <text x=\"224\" y=\"94\" fill=\"var(--muted)\" text-anchor=\"middle\">started<\/text>\n    <text x=\"472\" y=\"42\"  fill=\"var(--good)\" text-anchor=\"end\">completed<\/text>\n    <text x=\"472\" y=\"146\" fill=\"var(--bad)\"  text-anchor=\"end\">failed<\/text>\n    <text x=\"640\" y=\"38\"  fill=\"var(--good)\">deselected<\/text>\n    <text x=\"640\" y=\"170\" fill=\"var(--bad)\">deselected<\/text>\n  <\/g>\n<\/svg>\n```\n\nFive events, three terminal-ish states. `toolCallId` is the join key across all events for a given sub-agent invocation.\n\n---"},{"id":"ref-advanced","title":"Advanced implementation guide","summary":"The implementation layer the Learn modules skip: agent frontmatter, MCP transport types, Copilot CLI flags, hook events, and the artifact-reading labs. This is where the advanced questions come from.","source":"Community study guide (jtur671/gh-600-study-guide)","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","markdown":"## GH-600 Public Study Guide\n\nMarkdown-only workbook for Exam GH-600: Developing in Agentic AI Systems.\n\nLast updated: May 24, 2026.\n\nThis version is organized around the official GH-600 domains. Each domain explains the concepts, shows the GitHub implementation artifacts, and includes examples you should be able to read in YAML, Markdown, CLI output, PR timelines, and audit logs.\n\nPublic sharing note: this guide is not an exam dump and does not contain real exam questions or answer choices. It is a structured study workbook built from official Microsoft and GitHub documentation, with practical examples written for learning and review.\n\nPrimary source of truth:\n\n*   GH-600 Microsoft Learn study guide: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/gh-600\n*   GitHub Copilot cloud agent docs: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent\n*   GitHub Copilot CLI docs: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference\n*   GitHub Copilot CLI config directory: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference\n*   GitHub custom agents configuration: https://docs.github.com/en/copilot/reference/custom-agents-configuration\n*   GitHub customization cheat sheet: https://docs.github.com/en/copilot/reference/customization-cheat-sheet\n*   GitHub Actions workflow syntax: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax\n*   GitHub Actions contexts: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts\n*   GitHub audit log events: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise\n\nUse the official GH-600 skills outline as the map, then use the linked GitHub Docs pages for exact syntax and product behavior.\n\n## 1. Exam Map And Study Model\n\nThe exam domains:\n\n| Domain | Weight | What it means in practice |\n|--------|--------|--------------------------|\n| Prepare agent architecture and SDLC processes | 15-20% | Choose good agent tasks, define outputs, manage autonomy, use PR/check/review flow |\n| Implement tool use and environment interaction | 20-25% | Custom agents, tools, MCP, CLI, cloud-agent setup, CI workflows, branches, PRs |\n| Manage memory, state, and execution | 10-15% | Sessions, resume/continue, Copilot Memory, durable artifacts, context drift |\n| Perform evaluation, error analysis, and tuning | 15-20% | Logs, scans, workflow artifacts, root cause, instructions/tools/environment tuning |\n| Orchestrate multi-agent coordination | 15-20% | `/fleet`, `agent` tool, matrix jobs, `needs`, artifacts, conflict prevention |\n| Implement guardrails and accountability | 10-15% | Least privilege, hooks, branch protection, workflow approvals, audit logs |\n\nThe key is not just knowing definitions. GH-600 expects you to recognize implementation evidence:\n\n| Concept | Artifact examples |\n|---------|-------------------|\n| Agent profile | `.github/agents/*.agent.md` |\n| Instructions | `.github/copilot-instructions.md`, `.github/instructions/*.instructions.md`, `AGENTS.md` |\n| Prompt/skill reuse | `.github/prompts/*.prompt.md`, `.github/skills/<skill>/SKILL.md` |\n| Tools | `tools: [read, search, edit, execute, agent]` |\n| MCP | `mcp-servers` in agent YAML, `mcpServers` in JSON |\n| Cloud setup | `.github/workflows/copilot-setup-steps.yml` |\n| CI invocation | `copilot -p`, `--agent`, `COPILOT_GITHUB_TOKEN`, `--no-ask-user` |\n| Workflow orchestration | `needs`, `strategy.matrix`, artifacts, `$GITHUB_OUTPUT` |\n| Overlap control | top-level or job-level `concurrency` |\n| Evaluation | tests, scans, session logs, workflow artifacts |\n| Accountability | PR timeline, session logs, audit log events |\n\n## 2. Domain 1: Prepare Agent Architecture And SDLC Processes\n\n### What This Domain Tests\n\nThis domain asks whether you can decide where an agent belongs in a software delivery workflow. The right answer usually preserves GitHub-native accountability: issue, branch, PR, checks, review, merge.\n\nUse an agent when:\n\n*   Inputs and outputs are clear.\n*   Work can be scoped to a repository, branch, issue, PR, or workflow.\n*   The result can be reviewed through a diff, artifact, log, or check.\n*   Tests/scans/reviews can validate the output.\n*   The agent can operate with least-privilege tools and permissions.\n\nDo not rely only on an agent when:\n\n*   The task has unclear success criteria.\n*   The task is irreversible or production-sensitive.\n*   The agent would need broad secrets or broad external write access.\n*   The agent would approve its own output.\n*   Human judgment is required for policy, compliance, legal, security, or product decisions.\n\n### Planning Versus Execution\n\nPlanning is reviewable intent. Execution changes state.\n\nUse planning first for:\n\n*   Large refactors.\n*   Security-sensitive work.\n*   Workflow/deployment changes.\n*   Cross-repository work.\n*   Multi-agent coordination.\n*   Any task where a human should approve scope before edits.\n\nExample plan artifact:\n\n```\n# Agent plan\n\nGoal: Update dependency review workflow.\n\nSteps:\n1. Inspect current workflow permissions.\n2. Add dependency review gate.\n3. Validate workflow syntax.\n4. Open PR with risk notes.\n\nValidation:\n- Existing required checks still run.\n- Dependency review runs on pull requests.\n- PR requires human review.\n```\n\nWhat to notice:\n\n*   A plan is not validation.\n*   The plan becomes useful when it is stored in an issue, PR, comment, file, or workflow artifact.\n\n### SDLC Pattern\n\nSafe GitHub-native agent work:\n\n1.  Task is defined in a prompt, issue, or PR comment.\n2.  Agent works on a branch.\n3.  Agent commits changes.\n4.  Agent opens or updates a PR.\n5.  Workflow checks run.\n6.  CodeQL, secret scanning, dependency review, and tests provide evidence.\n7.  Humans inspect diff, session logs, and artifacts.\n8.  Branch protection/rulesets gate merge.\n9.  Audit logs and PR history preserve accountability.\n\n### Autonomy Levels\n\n| Level | Agent can do | Typical tools | Controls |\n|-------|--------------|---------------|----------|\n| Low | Read, search, summarize, plan | `read`, `search` | no write, no shell |\n| Medium | Edit files, run tests, open PR | `read`, `search`, `edit`, `execute` | PR checks, required review |\n| High | Use MCP, modify workflows, coordinate agents | `agent`, MCP tools, shell | narrow tools, hooks, approvals, audit |\n\nExamples:\n\n```yaml\n# Low-autonomy reviewer\ntools:\n  - read\n  - search\n\n# Medium-autonomy implementer\ntools:\n  - read\n  - search\n  - edit\n  - execute\n\n# Coordinator\ntools:\n  - read\n  - search\n  - agent\n```\n\n### Domain 1 Traps\n\n*   \"Tell the agent to be careful\" is not a control.\n*   An agent-generated plan does not prove the implementation is safe.\n*   High autonomy requires enforceable controls: permissions, reviews, scans, rulesets, hooks, and logs.\n*   Do not let agents make unreviewed changes to protected or production-sensitive paths.\n\n### Domain 1 Implementation Examples\n\nDefine success criteria before giving the agent tools.\n\nWeak task:\n\n```\nImprove the payment service.\n```\n\nBetter task:\n\n```\nUpdate payment retry logic so transient gateway failures retry three times with exponential backoff. Add unit tests for success, permanent failure, and transient retry. Do not modify public API contracts. Open a draft PR and include validation output.\n```\n\nWhy it is better:\n\n*   Scope is bounded.\n*   Output is testable.\n*   API compatibility is explicit.\n*   The PR is reviewable.\n*   Validation is required.\n\nInputs, outputs, and controls:\n\n| Element | Example |\n|---------|---------|\n| Input | issue, failing test, PR comment, workflow log, Sentry issue |\n| Output | branch, commit, PR, test artifact, summary file |\n| Success criteria | tests pass, scan clean, reviewer approves |\n| Control | required checks, rulesets, limited tools, human review |\n| Evidence | session log, PR diff, workflow logs, audit log |\n\nAutonomy selection:\n\n| Scenario | Better autonomy |\n|----------|-----------------|\n| Summarize repo conventions | low |\n| Add tests for existing code | medium |\n| Modify deployment workflow | high control, low initial autonomy |\n| Use Jira/Sentry for diagnosis | medium/high with narrow MCP |\n| Change production rollout behavior | human approval required |\n\n### Domain 1 Self-Check\n\n*   What makes a task suitable for an agent?\n*   What artifact proves the plan was reviewed?\n*   What GitHub control blocks unreviewed merge?\n*   What is the difference between agent guidance and enforceable policy?\n\n## 3. Domain 2: Implement Tool Use And Environment Interaction\n\nThis is the largest technical area. It covers custom agents, tools, MCP, Copilot CLI, cloud setup, workflow invocation, branches, PRs, and environment constraints.\n\n### Copilot Customization File Inventory\n\nKnow these paths cold:\n\n| File or directory | Purpose |\n|-------------------|---------|\n| `.github/copilot-instructions.md` | Repository-wide instructions |\n| `.github/instructions/*.instructions.md` | Path-specific instructions |\n| `AGENTS.md` | Agent-oriented instructions; nearest file can take precedence |\n| `.github/prompts/*.prompt.md` | Reusable prompt templates |\n| `.github/agents/*.md` or `.github/agents/*.agent.md` | Custom agent profiles |\n| `.github/skills/<skill-name>/SKILL.md` | Agent skills |\n| `.github/hooks/*.json` | CLI/cloud-agent hooks |\n| `.github/workflows/copilot-setup-steps.yml` | Cloud-agent environment setup |\n| `.mcp.json`, `.github/mcp.json`, `.vscode/mcp.json` | MCP config, depending on surface |\n\nRepository instructions:\n\n```markdown\n# Repository instructions\n\nUse npm for package management.\nRun `npm test` before proposing a PR.\nDo not edit files under `legacy/` unless explicitly asked.\n```\n\nPath-specific instructions:\n\n```yaml\n---\napplyTo: \"src/payments/**\"\n---\n\nPayment changes must include tests for refunds, retries, and idempotency.\n```\n\nPrompt file:\n\n```markdown\n# Security review\n\nReview selected changes for authentication, authorization, secret exposure, dependency risk, and workflow permission risk.\nReturn findings with severity, file path, and recommended fix.\n```\n\nSkill:\n\n```yaml\n---\nname: actions-failure-debugging\ndescription: Debug failing GitHub Actions workflows.\n---\n\n1. Inspect the failing job.\n2. Identify the first failing command.\n3. Check runner, permissions, secrets, and artifact paths.\n4. Propose the smallest fix.\n```\n\n### Custom Agent YAML\n\nRepository agent path:\n\n```\n.github/agents/reviewer.agent.md\n```\n\nOrganization or enterprise custom agents can live under `/agents/` in a `.github-private` repository.\n\nMinimal read-only reviewer:\n\n```yaml\n---\nname: reviewer\ndescription: Reviews changes and writes concise findings.\ntools:\n  - read\n  - search\n---\n\nReview repository changes. Do not edit files. Report findings with file paths and rationale.\n```\n\nImportant frontmatter:\n\n| Key | Meaning |\n|-----|---------|\n| `description` | Required purpose/capability description |\n| `name` | Optional display name |\n| `tools` | Tool list available to the agent |\n| `mcp-servers` | MCP config in YAML form |\n| `target` | Surface such as `github-copilot` or `vscode` |\n| `model` | Model choice where supported |\n| `disable-model-invocation` | Prevent inferred invocation |\n| `user-invocable` | Whether users can invoke directly |\n| `metadata` | Extra metadata |\n\nTraps:\n\n*   `description` is required; `name` is not the required field.\n*   If `tools` is omitted, all available tools may be enabled.\n*   `tools: []` disables tools.\n*   `handoffs` may appear in other formats, but is ignored by Copilot cloud agent.\n\n### Tool Meanings\n\n| Tool | Meaning | Use when |\n|------|---------|----------|\n| `read` | Read file contents | Agent must inspect files |\n| `search` | Search files/text in repository | Agent must find code/files |\n| `edit` | Edit/write files | Agent must modify files |\n| `execute` | Run shell commands | Agent must run tests/scripts |\n| `agent` | Invoke another custom agent | Agent coordinates subagents |\n| `web` | Fetch URLs/web search | Not applicable for cloud agent today |\n| `todo` | Task list | Not supported in cloud agent today |\n\nLeast-privilege choices:\n\n```yaml\n# Inspect but do not edit\ntools:\n  - read\n  - search\n\n# Modify files and run tests\ntools:\n  - read\n  - search\n  - edit\n  - execute\n\n# Orchestrate another specialist\ntools:\n  - read\n  - search\n  - agent\n```\n\nWhat to notice:\n\n*   `search` is repository search, not internet search.\n*   Add `edit` only when changes are required.\n*   Add `execute` only when shell execution is required.\n*   Add `agent` when invoking another custom agent.\n\n### Agent-To-Agent Invocation\n\nCustom-agent tool aliases for invoking another custom agent:\n\n```\nagent\ncustom-agent\nTask\n```\n\nExample orchestrator:\n\n```yaml\n---\nname: orchestrator\ndescription: Coordinates review, audit, and consolidation.\ntools:\n  - read\n  - search\n  - agent\n---\n\nUse the reviewer agent for code review.\nUse the auditor agent for compliance and traceability.\nThen consolidate both outputs into one recommendation.\n```\n\n### MCP In Agents\n\nMCP exposes external tools and data sources.\n\nKnow this distinction:\n\n| Surface | Key |\n|---------|-----|\n| Custom agent YAML | `mcp-servers` |\n| MCP JSON config | `mcpServers` |\n\nMCP inside custom agent:\n\n```yaml\n---\nname: jira-triage\ndescription: Reads Jira issue context and proposes repository changes.\ntools:\n  - read\n  - search\n  - jira/get_issue\nmcp-servers:\n  jira:\n    type: local\n    command: npx\n    args:\n      - -y\n      - jira-mcp\n    tools:\n      - get_issue\n    env:\n      JIRA_TOKEN: ${{ secrets.COPILOT_MCP_JIRA_TOKEN }}\n---\n\nUse Jira only for issue context. Never print secrets.\n```\n\nMCP JSON:\n\n```json\n{\n  \"mcpServers\": {\n    \"jira\": {\n      \"type\": \"local\",\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"jira-mcp\"],\n      \"tools\": [\"get_issue\"],\n      \"env\": {\n        \"JIRA_TOKEN\": \"$COPILOT_MCP_JIRA_TOKEN\"\n      }\n    }\n  }\n}\n```\n\n### MCP Transport Types\n\nThis is a likely fill-in-the-blank area. Choose the MCP `type` from the shape of the server configuration.\n\n| Server shape | `type` | Required fields | Meaning |\n|--------------|--------|-----------------|---------|\n| local process | `local` or `stdio` | `command`, `args` | starts a subprocess and talks over stdin/stdout |\n| remote Streamable HTTP server | `http` | `url` | connects to a remote MCP endpoint over HTTP |\n| remote Server-Sent Events server | `sse` | `url` | legacy SSE transport, still supported |\n\nDecision rule:\n\n*   If the config has top-level `command` and `args`, it is local process transport: `local` or `stdio`.\n*   If the config has top-level `url`, it is remote transport: usually `http`, or `sse` if the endpoint/documentation says SSE or the URL clearly uses an SSE endpoint.\n*   If the config has top-level `url` and the available choices do not include `http`, choose `sse` over `stdio`/`local`.\n*   Do not choose `stdio` for a top-level `url`-based server. `stdio` does not connect to a URL; it starts a local process.\n*   Modern remote MCP usually means `http`. `sse` exists for older Server-Sent Events MCP servers.\n*   Some UI labels say `HTTP/SSE`, but GitHub/Copilot JSON values are still `http` or `sse`.\n\nRemote MCP JSON:\n\n```json\n{\n  \"mcpServers\": {\n    \"context7\": {\n      \"type\": \"http\",\n      \"url\": \"https://mcp.context7.com/mcp\",\n      \"headers\": {\n        \"CONTEXT7_API_KEY\": \"$COPILOT_MCP_CONTEXT7_API_KEY\"\n      },\n      \"tools\": [\"*\"]\n    }\n  }\n}\n```\n\nRemote MCP in custom-agent YAML:\n\n```yaml\n---\nname: docs-researcher\ndescription: Reads approved external documentation through a remote MCP server.\ntools:\n  - read\n  - search\n  - context7/*\nmcp-servers:\n  context7:\n    type: http\n    url: https://mcp.context7.com/mcp\n    headers:\n      CONTEXT7_API_KEY: ${{ secrets.COPILOT_MCP_CONTEXT7_API_KEY }}\n    tools:\n      - \"*\"\n---\n\nUse Context7 only for library documentation.\n```\n\nSSE example:\n\n```json\n{\n  \"mcpServers\": {\n    \"cloudflare\": {\n      \"type\": \"sse\",\n      \"url\": \"https://docs.mcp.cloudflare.com/sse\",\n      \"tools\": [\"*\"]\n    }\n  }\n}\n```\n\nImportant nuance: a URL can appear inside `args` for a local bridge command. In that case the MCP client is still launching a local process, so the top-level `type` remains `local` or `stdio`.\n\n```json\n{\n  \"mcpServers\": {\n    \"atlassian-rovo-mcp\": {\n      \"type\": \"local\",\n      \"command\": \"npx\",\n      \"args\": [\n        \"mcp-remote@latest\",\n        \"https://mcp.atlassian.com/v1/mcp\",\n        \"--header\",\n        \"Authorization: Basic $ATLASSIAN_API_KEY\"\n      ],\n      \"env\": {\n        \"ATLASSIAN_API_KEY\": \"$COPILOT_MCP_ATLASSIAN_API_KEY\"\n      },\n      \"tools\": [\"*\"]\n    }\n  }\n}\n```\n\nHow to read the artifact:\n\n*   Top-level `url`: remote MCP, choose `http` or `sse`.\n*   Top-level `url` and no `http` option: choose `sse`.\n*   URL inside `args` with `command: npx` or another executable: local bridge, choose `local` or `stdio`.\n*   `headers`: remote HTTP/SSE authentication.\n*   `env`: environment variables for local server process.\n*   For Copilot cloud agent, referenced secret/variable names must start with `COPILOT_MCP_`.\n*   Copilot cloud agent does not currently support remote MCP servers that rely on OAuth authorization.\n\nTool naming:\n\n```yaml\ntools:\n  - jira/get_issue\n  - github/*\n```\n\nFacts:\n\n*   `server/tool` exposes one tool.\n*   `server/*` exposes all tools from that server.\n*   GitHub MCP server is read-only by default and scoped to source repository.\n*   Playwright MCP is constrained to localhost by default.\n*   `.vscode/mcp.json` can be reused/adapted for cloud agent.\n\nAdapting `.vscode/mcp.json`:\n\n*   Add `tools`.\n*   Replace `inputs` with `env`.\n*   Replace `envFile` with `env`.\n*   Store credentials as Agents secrets/variables.\n\nMCP governance:\n\n*   MCP registry URL controls approved registry.\n*   `Registry only` is stricter than `Allow all`.\n*   Enterprise policy can override organization policy.\n*   MCP allowlist is different from firewall allowlist.\n*   Firewall governs network egress; MCP allowlist governs MCP server usage.\n\n### Copilot CLI Basics\n\n| Command/flag | Meaning |\n|--------------|---------|\n| `copilot` | Start interactive CLI |\n| `copilot login` | Authenticate |\n| `copilot init` | Generate/update repository instructions |\n| `copilot -p \"...\"` | Programmatic prompt |\n| `--agent=NAME` | Use a custom agent |\n| `--allow-tool` | Allow tool pattern |\n| `--deny-tool` | Deny tool pattern |\n| `--available-tools` | Limit visible tools |\n| `--no-ask-user` | Prevent interactive questions |\n| `--autopilot` | Local autonomous continuation |\n| `--resume` | Resume named session |\n| `--continue` | Continue latest session |\n| `--output-format=json` | Machine-readable output |\n\nSlash commands:\n\n| Slash command | Meaning |\n|---------------|---------|\n| `/plan` | Plan first |\n| `/review` | Review changes |\n| `/pr` | Pull request workflow |\n| `/mcp` | Inspect/configure MCP |\n| `/agent` | Select/manage custom agents |\n| `/session` | Inspect session |\n| `/ide` | Inspect/switch IDE connection |\n| `/delegate` | Hand off to cloud agent |\n| `/fleet` | Parallel subagent decomposition |\n\nCI example:\n\n```yaml\nname: Copilot report\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  report:\n    runs-on: ub
