","correct":true,"why":"Yes. Code scanning surfaces alerts and check runs, including via SARIF upload from third-party tools."},{"text":"Dependency review checks","correct":true,"why":"Yes. Dependency review runs as a check on the PR and flags known-vulnerable dependencies before merge."},{"text":"Secret scanning and push protection","correct":true,"why":"Yes. Secret scanning produces alerts, and push protection prevents supported secrets from being committed at all."},{"text":"Branch protection rules","correct":false,"why":"No. Branch protection enforces policy on merges - it consumes signals rather than producing them."}],"takeaway":"Scanners produce the signals; rulesets and required checks turn those signals into a gate. Treat alerts and failed security checks as blockers."},{"id":"auth-d4-07","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.2.1","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"An agent's change technically works but solves the wrong problem. Which comparison exposes that fastest?","options":[{"text":"Compare the workflow run duration against previous runs.","correct":false,"why":"Timing tells you nothing about whether the right problem was solved."},{"text":"Compare intent - the issue's requirements and the PR's stated plan - against results: the actual commits, code changes, and workflow outputs.","correct":true,"why":"Comparing intent with results is the documented diagnostic. It distinguishes three cases: the agent misinterpreted the task, implemented an incorrect solution, or failed during execution or validation."},{"text":"Check whether the branch name follows the team's convention.","correct":false,"why":"Naming conventions help attribution and scanning, not root-cause analysis."},{"text":"Count how many files the change touched.","correct":false,"why":"File count is a rough scope signal, not evidence about correctness of intent."}],"takeaway":"Diagnose by comparing captured intent (issue, plan) with captured results (commits, outputs, logs). The gap is the diagnosis."},{"id":"auth-d4-08","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.2.2","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"An agent updated a file based on a version it had read hours earlier, overwriting changes another contributor merged in the meantime. Which root-cause category is this?","options":[{"text":"Reasoning error","correct":false,"why":"Reasoning errors are incorrect assumptions or decisions - misinterpreting requirements, implementing wrong logic, ignoring acceptance criteria. The agent's logic here was fine; its inputs were out of date."},{"text":"Tool misuse","correct":false,"why":"Tool misuse is calling the wrong tool or using one incorrectly - misconfigured workflows, wrong commands. The tool worked as asked."},{"text":"Context issue","correct":true,"why":"Context issues cover missing, stale, or conflicting information: using outdated pull request state, missing prior decisions, or conflicting information across artifacts. Acting on a stale read is the textbook case."},{"text":"Policy violation","correct":false,"why":"Not one of the three root-cause categories the module defines."}],"takeaway":"Three root causes: reasoning errors (wrong decisions), tool misuse (wrong or wrongly used tools), context issues (missing, stale, or conflicting information)."},{"id":"auth-d4-09","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.2.2","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"An agent's workflow never ran because its trigger was set to push when the task required pull_request. Which root cause, and which tuning area?","options":[{"text":"Reasoning error; tune the prompts and instructions.","correct":false,"why":"The decision-making was not the failure. A misconfigured trigger is an execution-configuration fault."},{"text":"Tool misuse; tune the tool configuration - fix the workflow trigger and verify permissions and required checks.","correct":true,"why":"Failing to trigger or use workflows properly is explicitly listed under tool misuse, and the matching tuning area is tool configuration: update files in .github/workflows/, ensure the correct events, and verify permissions and required checks."},{"text":"Context issue; tune memory and state.","correct":false,"why":"No information was stale or conflicting - the wiring was simply wrong."},{"text":"Reasoning error; tune memory and state.","correct":false,"why":"Neither half matches. This is configuration, not cognition or context."}],"takeaway":"Root cause selects the tuning lever: reasoning to instructions, context to memory and state, tool misuse to tool and workflow configuration."},{"id":"auth-d4-10","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.3.1","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"Which sequence describes the improvement feedback loop for agent behavior?","options":[{"text":"Run the agent, observe failures through logs and artifacts, identify the root cause, apply fixes to prompts, memory, or tools, then re-run the workflow.","correct":true,"why":"This is the documented loop, and GitHub supports it directly by allowing workflows to be re-run and by preserving logs and artifacts for inspection. Improvements should themselves be visible and traceable - documented in PR updates with related commits and runs referenced."},{"text":"Run the agent, re-run on failure, escalate if it fails twice, close the pull request.","correct":false,"why":"That is an execution recovery policy, not a behavior-improvement loop. Nothing gets better next time."},{"text":"Collect metrics for a quarter, then retrain the underlying model.","correct":false,"why":"The tuning levers are instructions, memory, and tool configuration - the things you control - not model retraining."},{"text":"Increase autonomy until failures stop appearing in review.","correct":false,"why":"Fewer failures in review usually means less review, not better behavior."}],"takeaway":"Observe, diagnose, tune (instructions / memory / tools), re-run - and document the change so the tuning itself is auditable."},{"id":"auth-d4-11","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.3.2","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"Failure analysis shows the agent keeps applying an approach that was explicitly rejected three sessions ago. Which tuning area is the right lever?","options":[{"text":"Tool configuration - restrict the tools that let it make that change.","correct":false,"why":"That blocks the symptom by removing capability the agent legitimately needs, and it will not stop the same misunderstanding elsewhere."},{"text":"Memory and state - record the rejected approach and the reason as a decision in the pull request, remove outdated or conflicting context, and keep a single source of truth.","correct":true,"why":"The memory-and-state tuning lever is exactly this: update issues or pull requests with clearer decisions, remove outdated or conflicting context, and maintain one source of truth. A decision that was never written down durably cannot be honored later."},{"text":"Prompts and instructions - add \"do not use approach X\" to every task prompt.","correct":false,"why":"This scales badly, one prohibition per past mistake, and puts task-specific history into a general instruction file."},{"text":"Increase retries so the agent has more chances to reach the right approach.","correct":false,"why":"Retries repeat the same misunderstanding."}],"takeaway":"Refine memory by writing decisions where they persist and stripping stale or conflicting copies - not by piling prohibitions into prompts."},{"id":"auth-d4-12","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.3.2","module":"m4","unit":"m4-agent-memory-strategies","type":"single","text":"An agent's answers have become vague and it frequently cites requirements that were superseded weeks ago. Which memory refinement addresses both symptoms?","options":[{"text":"Load more context so the agent has the full picture.","correct":false,"why":"More context deepens the dilution and adds more superseded material."},{"text":"Scope memory more tightly to task-relevant information, and prune or summarize outdated artifacts so stale requirements are not retrievable.","correct":true,"why":"Vagueness comes from dilution, which tighter scoping fixes; citing superseded requirements comes from stale context, which pruning and summarization fix. The module ties both to limiting memory to information that affects the outcome."},{"text":"Reset memory entirely at the start of every task.","correct":false,"why":"A full reset also discards the requirements and decisions the agent legitimately needs. Reset rules are for when premises genuinely changed."},{"text":"Move all memory into short-term context.","correct":false,"why":"That trades staleness for amnesia - nothing survives the session."}],"takeaway":"Scope tightly and prune regularly. Dilution and staleness are two symptoms of the same failure to curate memory."},{"id":"auth-d4-13","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.3.3","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"After adding several MCP tools, an agent starts making unpredictable calls and its blast radius has grown. Which tuning follows the module's operational guidance?","options":[{"text":"Enable broad wildcards so the agent has consistent access and behaves predictably.","correct":false,"why":"The guidance is the reverse: prefer enabling a narrow tool subset rather than broad wildcards."},{"text":"Narrow the enabled tool subset, and treat any expansion of MCP tools as a governance-sensitive, high-risk-dependency-style review.","correct":true,"why":"Adding or expanding MCP tools increases blast radius and should be reviewed like a high-risk dependency. Namespace control - enabling a narrow subset - is the specific lever, and changes to tool allowlists are governance-sensitive changes."},{"text":"Leave the tools enabled but add instructions telling the agent which to prefer.","correct":false,"why":"Instructions are guidance. Tool access is the enforcement boundary."},{"text":"Remove MCP entirely and rely on the built-in toolset.","correct":false,"why":"Discarding the integration is not tuning. Narrow the namespace and review expansions instead."}],"takeaway":"Refine tool access by narrowing the namespace, not by instructing around it - and review allowlist expansion like a high-risk dependency change."},{"id":"auth-d4-14","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.2.1","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"You are investigating a failed agent run. Where do you look first for the error itself?","options":[{"text":"The repository's commit graph, to see how the branch diverged.","correct":false,"why":"Useful for scope and drift questions, but it does not tell you what errored during execution."},{"text":"The pull request's Checks tab, then the workflow logs in the Actions tab for the failing run.","correct":true,"why":"The documented sequence is: open the PR and review recent changes, check the Checks tab for failed workflows, inspect the workflow logs to identify errors, then compare expected outcome with actual result."},{"text":"The organization audit log.","correct":false,"why":"The audit log answers governance questions - such as who deleted an artifact - rather than why a run failed."},{"text":"Issue labels applied to the task.","correct":false,"why":"Labels organize work. They carry no execution detail."}],"takeaway":"Failure triage path: PR changes, then Checks tab, then workflow logs, then compare expected against actual."},{"id":"auth-d4-15","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.1.4","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"single","text":"A repository has code scanning enabled, but agent pull requests with new alerts still merge. What is missing?","options":[{"text":"Nothing - alerts are advisory by design.","correct":false,"why":"The guidance is to treat security alerts or failed checks as blockers, which requires configuring the block."},{"text":"The scan result is not configured as a required status check under branch protection or a ruleset, so nothing prevents the merge.","correct":true,"why":"Producing a signal and enforcing it are separate steps. Required status checks are what turn evaluation into an enforceable gate rather than an informal suggestion."},{"text":"Code scanning cannot run on pull requests.","correct":false,"why":"It runs on pull requests and surfaces results in the PR - that is its main use."},{"text":"The agent needs security-events: write permission to see the alerts.","correct":false,"why":"That permission lets a job upload analysis results. It has nothing to do with whether merging is blocked."}],"takeaway":"Scanners generate signals; required status checks make them binding. Without the required-check configuration, an alert is just information."},{"id":"auth-d5-01","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.1","module":"m5","unit":"m5-multi-agent-responsibilities","type":"single","text":"Three agents operate in one repository: a dependency agent, a refactoring agent, and a security agent. Which scope split follows the module's responsibility model?","options":[{"text":"All three may change anything, and conflicts get resolved at merge time.","correct":false,"why":"If multiple agents act as general developers across the whole repository, including workflows and infrastructure, the result is repeated collisions, inconsistent review routing, and uncontrolled risk."},{"text":"Dependency agent: manifests and lockfiles only. Refactoring agent: src/ but not manifests, lockfiles, or workflows. Security agent: validates outcomes and reports, proposing changes without broadening into refactoring.","correct":true,"why":"This is the scope-boundary model. Each agent gets a narrow role limited by path and artifact type, with completion signals verifiable through GitHub checks and review outcomes - which prevents overlap and reduces conflict."},{"text":"Dependency and refactoring agents share src/; the security agent owns everything else.","correct":false,"why":"Two agents sharing src/ is exactly the overlap that produces conflicting pull requests and duplicated work."},{"text":"Each agent gets its own repository so scopes cannot overlap.","correct":false,"why":"Splitting repositories to avoid coordination avoids the problem rather than solving it, and it fragments the codebase."}],"takeaway":"Define what each agent is allowed to change, by path and artifact type. Narrow roles are what make multi-agent systems enforceable."},{"id":"auth-d5-02","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.1","module":"m5","unit":"m5-agent-orchestration-github-workflows","type":"single","text":"A spec analyzer and a risk reviewer must both finish before a plan merger runs. Which GitHub Actions construct expresses this fan-out / fan-in?","options":[{"text":"A matrix strategy on the merger job.","correct":false,"why":"strategy.matrix controls parallelism within a run - it fans out copies of a job rather than waiting on distinct upstream jobs."},{"text":"needs: [spec_analyzer, risk_reviewer] on the plan_merger job.","correct":true,"why":"needs is the fan-in: the merger waits for both upstream jobs to complete. The two analysis jobs run in parallel because neither declares a dependency on the other."},{"text":"A workflow_run trigger on the merger workflow listening for both.","correct":false,"why":"workflow_run chains separate workflows after one completes; it is the sequential pattern, and coordinating two upstreams that way is awkward compared with needs inside a single workflow."},{"text":"concurrency: group on all three jobs.","correct":false,"why":"Concurrency prevents overlapping runs. It does not express dependency ordering."}],"takeaway":"Parallel jobs plus needs is fan-out/fan-in. workflow_run chains workflows sequentially. Concurrency stops overlap - three different tools."},{"id":"auth-d5-03","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.1","module":"m5","unit":"m5-agent-orchestration-github-workflows","type":"single","text":"Why does the module prefer artifact-based coordination over direct agent-to-agent communication?","options":[{"text":"Artifacts are faster to transfer than messages.","correct":false,"why":"Performance is not the argument. Artifact upload and download add latency, not remove it."},{"text":"It creates an explicit boundary between reasoning and writing, and leaves evidence reviewers can inspect.","correct":true,"why":"The robust pattern is: run an agent with restricted permissions, produce a structured output as an artifact, then use a controlled step to apply only the operations the workflow allows. Hidden coordination that leaves no evidence in PRs or workflow runs makes failures impossible to diagnose."},{"text":"Direct communication between agents is not technically possible on GitHub.","correct":false,"why":"It is possible; the module argues it is less reliable and less observable, not impossible."},{"text":"Artifacts are retained indefinitely, unlike messages.","correct":false,"why":"Artifacts expire - 90 days by default. Their advantage is inspectability, not permanence."}],"takeaway":"Shared, reviewable artifacts separate reasoning from writing and leave a diagnosable trail. Hidden coordination destroys both."},{"id":"auth-d5-04","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.2","module":"m5","unit":"m5-execution-isolation-permissions-concurrency","type":"single","text":"A team sets concurrency group to ${{ github.ref }} alone. What goes wrong?","options":[{"text":"Nothing - branch-level grouping is the recommended configuration.","correct":false,"why":"The recommended group is ${{ github.workflow }}-${{ github.ref }}, precisely to avoid the problem below."},{"text":"Concurrency becomes global to the branch, so unrelated workflows on that branch block each other.","correct":true,"why":"Omitting the workflow component makes every workflow on that ref share one concurrency group. Including github.workflow isolates runs per workflow and per branch, so unrelated automation still runs in parallel."},{"text":"In-progress runs stop being cancelled.","correct":false,"why":"Cancellation is controlled by cancel-in-progress, independently of how the group is composed."},{"text":"Jobs within a single run stop running in parallel.","correct":false,"why":"That is job-level concurrency, which applies within a workflow run rather than across runs."}],"takeaway":"Use group: ${{ github.workflow }}-${{ github.ref }} with cancel-in-progress. Ref alone makes concurrency branch-global."},{"id":"auth-d5-05","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.2","module":"m5","unit":"m5-execution-isolation-permissions-concurrency","type":"multi","text":"Which layers make up execution isolation in a multi-agent system? (Select all that apply.)","options":[{"text":"Branch isolation - a dedicated branch per agent, such as agent/dependency/<ticket>","correct":true,"why":"Yes. Bounded branches make scope and intent legible and keep changes separable."},{"text":"Workflow isolation - a dedicated workflow or job per agent with distinct permissions","correct":true,"why":"Yes. It keeps triggers, permissions, and outputs easy to reason about and reduces accidental coupling as workflows evolve."},{"text":"Permission isolation - minimum-scope permissions per workflow","correct":true,"why":"Yes. Shared broad write permissions make failures harder to diagnose and attribute."},{"text":"Model isolation - a different LLM per agent","correct":false,"why":"No. Model choice is not an isolation boundary. Isolation in GitHub is about branches, workflows, permissions, and concurrency."}],"takeaway":"Isolation = branches + workflows + permissions + concurrency. It makes parallelism safe and attribution clear."},{"id":"auth-d5-06","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.2","module":"m5","unit":"m5-execution-isolation-permissions-concurrency","type":"single","text":"A team wants several agent tasks running in parallel. Which invocation mode does not support parallel sessions across multiple tasks?","options":[{"text":"Copilot Cloud","correct":false,"why":"Cloud supports parallel sessions across multiple tasks."},{"text":"Copilot CLI","correct":false,"why":"CLI supports parallel sessions across multiple tasks."},{"text":"Local","correct":true,"why":"Local invocation is serial only - one task at a time. If a workload needs genuine parallelism across tasks, it must run through Cloud or CLI."},{"text":"All three support parallel sessions equally.","correct":false,"why":"They do not; local is the exception."}],"takeaway":"Copilot Cloud and CLI support parallel sessions across tasks; local invocation is serial."},{"id":"auth-d5-07","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.3","module":"m5","unit":"m5-conflict-resolution-github-arbitration","type":"single","text":"Two agent pull requests merge cleanly but the combined behavior is broken. Which conflict type is this, and what catches it?","options":[{"text":"A textual merge conflict; git surfaces it automatically.","correct":false,"why":"Textual conflicts are same-file, same-line collisions. This one merged cleanly, so git had nothing to flag."},{"text":"A semantic conflict; it merges cleanly, so it is caught by required checks and review rather than by merge machinery.","correct":true,"why":"Semantic conflicts are defined as a clean merge with broken combined behavior. Because git cannot see them, the defense is validation - required checks and human review - not conflict detection."},{"text":"A policy conflict; CODEOWNERS resolves it.","correct":false,"why":"Policy conflicts are about protected areas requiring different reviews or approvals, not about broken combined behavior."},{"text":"Duplicate effort; deduplicate at the issue level.","correct":false,"why":"Duplicate effort is two PRs solving the same problem differently. Here the two changes are different but interact badly."}],"takeaway":"Four conflict types: textual, semantic, policy, and duplicate effort. Only textual ones show up as merge conflicts."},{"id":"auth-d5-08","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.3","module":"m5","unit":"m5-conflict-resolution-github-arbitration","type":"single","text":"Rather than waiting for reviewers to spot conflicts with main, a team wants conflicts to fail fast. What do they add?","options":[{"text":"A required review from the platform team on every agent PR.","correct":false,"why":"That adds human load without making detection automatic or early."},{"text":"A merge validation step - fetch origin/main and attempt a merge - configured as a required check so conflicts become enforceable.","correct":true,"why":"GitHub shows merge conflicts on the PR, but adding a merge validation step turns them into a failing check. As a required check, conflicts stop depending on reviewers noticing them manually."},{"text":"A concurrency group so only one agent PR is open at a time.","correct":false,"why":"Concurrency controls workflow runs, not open pull requests, and serializing PRs would surrender the parallelism."},{"text":"Squash merging on all pull requests.","correct":false,"why":"Squashing changes history shape. It neither detects nor prevents conflicts."}],"takeaway":"Make conflict detection a required check so it fails fast and does not depend on a reviewer noticing."},{"id":"auth-d5-09","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.3","module":"m5","unit":"m5-conflict-resolution-github-arbitration","type":"multi","text":"Which conditions should trigger escalation to a human under a multi-agent escalation policy? (Select all that apply.)","options":[{"text":"A pull request conflicts twice after rebasing attempts","correct":true,"why":"Yes. Repeated conflict after automated resolution attempts is a named escalation threshold."},{"text":"The same required check fails twice with the same failure signature","correct":true,"why":"Yes. A repeated identical failure means automation is not converging."},{"text":"Two agents propose incompatible fixes to the same alert","correct":true,"why":"Yes. Incompatible fixes to one alert require arbitration that automation should not make silently."},{"text":"Any workflow takes longer than the previous run","correct":false,"why":"No. Run duration variance is normal and is not an escalation signal. Escalate on repeated failure to converge, not on timing noise."}],"takeaway":"Escalate when automation stops converging - repeat conflicts, repeat identical check failures, incompatible fixes - with a short report of what was attempted."},{"id":"auth-d5-10","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.2.1","module":"m5","unit":"m5-system-observability-evidence-workflows","type":"multi","text":"What does a practical observability goal require every meaningful step in a multi-agent workflow to leave behind? (Select all that apply.)","options":[{"text":"A pull request that links to context and describes intent","correct":true,"why":"Yes. The PR carries intent and links the change to its context."},{"text":"Checks and workflow runs that produce evidence","correct":true,"why":"Yes. Runs and checks are the objective evidence layer."},{"text":"Artifacts and logs that explain outcomes, plus clear attribution through titles, labels, and owners","correct":true,"why":"Yes. Artifacts and logs explain what happened, and attribution answers which agent did it."},{"text":"A private debug transcript retained on the runner for the engineering team","correct":false,"why":"No. Runner-local output is discarded with the runner and is not reviewable. Observability in GitHub means durable, native artifacts."}],"takeaway":"Every meaningful step should leave a durable trace: a PR with intent, checks and runs as evidence, artifacts and logs, and clear attribution."},{"id":"auth-d5-11","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.2.1","module":"m5","unit":"m5-system-observability-evidence-workflows","type":"single","text":"A multi-agent system uses attribution conventions so reviewers can tell agents apart at a glance. Which set matches the module's recommendation?","options":[{"text":"PR titles prefixed like [agent: dependency], labels such as agent: security, and PR body sections for Plan, Evidence, Risks, and Rollback/Escalation.","correct":true,"why":"These are the recommended conventions. Consistent titles and labels make attribution scannable, and the standard body sections make handoffs and decisions consistently locatable."},{"text":"One shared bot account for all agents so attribution is simple.","correct":false,"why":"A single identity destroys attribution - you can no longer tell which agent produced which change."},{"text":"Randomly generated branch names to guarantee uniqueness.","correct":false,"why":"Uniqueness without meaning defeats the purpose. Branches like agent/refactor/<ticket> convey scope and owner."},{"text":"Attribution recorded only in the workflow logs.","correct":false,"why":"Logs expire and are not the review surface. Attribution belongs where reviewers actually look."}],"takeaway":"Consistent titles, labels, branch naming, and PR body sections turn a pile of agent PRs into a legible system."},{"id":"auth-d5-12","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.2.2","module":"m5","unit":"m5-system-observability-evidence-workflows","type":"single","text":"Which pull request structure best captures decisions and handoffs across agents?","options":[{"text":"A single free-text summary paragraph written by the last agent to touch the branch.","correct":false,"why":"Free text is inconsistent and loses the specific fields reviewers and auditors need."},{"text":"Objective, Plan, Evidence, Decisions and handoffs (decision, rationale, next owner), and Risks and rollback.","correct":true,"why":"This standard structure ensures every decision is captured, every action is justified, and every handoff names the next owner if escalation is needed."},{"text":"A checklist of files changed with no narrative.","correct":false,"why":"A file list is already in the Files tab and explains nothing about why."},{"text":"Links to the agents' internal reasoning traces only.","correct":false,"why":"Raw traces are neither summarized nor decision-oriented, and they are not the durable review surface."}],"takeaway":"Standardize the PR body: objective, plan, evidence, decisions and handoffs with a named next owner, risks and rollback."},{"id":"auth-d5-13","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.2.3","module":"m5","unit":"m5-system-observability-evidence-workflows","type":"single","text":"During a post-hoc investigation the workflow artifact you need is missing. Which audit log event tells you what happened to it?","options":[{"text":"action:workflow_run.delete","correct":false,"why":"Not the documented event for artifact removal."},{"text":"action:artifact.destroy","correct":true,"why":"Searching the organization audit log for action:artifact.destroy shows who deleted an artifact, when, and in which repository. This matters because deleted artifacts cannot be restored."},{"text":"action:repo.artifact_removed","correct":false,"why":"Not a real event name."},{"text":"action:actions.retention_expired","correct":false,"why":"Expiry is automatic under the retention policy rather than an audited deletion event."}],"takeaway":"Artifacts are the primary post-hoc evidence source; when one is missing, the organization audit log's artifact.destroy event tells you who removed it."},{"id":"auth-d5-14","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.3.1","module":"m5","unit":"m5-scale-failure-recovery","type":"multi","text":"Which are recognized multi-agent coordination failure modes? (Select all that apply.)","options":[{"text":"Partial execution - a pull request exists but evidence or validation is missing","correct":true,"why":"Yes. The work started but did not produce what makes it acceptable."},{"text":"Stalled workflows - checks fail repeatedly or approvals never arrive","correct":true,"why":"Yes. Progress stops without a definite failure to react to."},{"text":"Flapping - workflows rerun repeatedly with no convergence","correct":true,"why":"Yes. Repeated runs that never reach a stable outcome consume budget and hide the underlying problem."},{"text":"A single unit test failing once in a run","correct":false,"why":"No. That is an ordinary individual execution issue, not a coordination failure between agents."}],"takeaway":"Coordination failures: partial execution, stalled workflows, conflicting outputs, and flapping. They are system-level, not single-agent, problems."},{"id":"auth-d5-15","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.3.1","module":"m5","unit":"m5-scale-failure-recovery","type":"single","text":"You need to watch a long-running agent session live to work out why it appears stuck. Which command does that?","options":[{"text":"gh run watch","correct":false,"why":"That follows a GitHub Actions workflow run, not the agent session's own log stream."},{"text":"gh agent-task view --log --follow","correct":true,"why":"This live-streams agent session logs from the GitHub CLI and is the documented way to debug a stalled or long-running agent run in real time."},{"text":"gh copilot debug --session","correct":false,"why":"Not a documented command for this purpose."},{"text":"gh workflow view --agent","correct":false,"why":"Not a documented command for this purpose."}],"takeaway":"gh agent-task view --log --follow streams a live agent session - the first tool for a stalled or long-running run."},{"id":"auth-d5-16","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.3.2","module":"m5","unit":"m5-scale-failure-recovery","type":"single","text":"An agent run halts with: \"Error: Command blocked by policy. Reason: destructive_operation_detected. [agent] Escalating to human review...\" What happened?","options":[{"text":"The workflow ran out of permissions midway and failed open.","correct":false,"why":"A permission failure produces an authorization error, and nothing here \"failed open\" - the action was stopped."},{"text":"A preToolUse hook inspected the requested action before execution, matched a blocked pattern, stopped it, and handed off to a human.","correct":true,"why":"Pre-execution (preToolUse) hooks run before a tool is executed, inspect the requested action, and stop it when it matches a blocked pattern - ensuring risky actions such as deleting infrastructure trigger a human handoff rather than proceeding."},{"text":"The model refused the task based on its own reasoning.","correct":false,"why":"The distinguishing value of hooks is that they operate independently of the model's reasoning. This was an enforced control, not a choice."},{"text":"A required status check failed after the change was applied.","correct":false,"why":"The block happened before execution, which is the point - the destructive operation never ran."}],"takeaway":"Hooks are enforceable control points independent of model reasoning: pre-action hooks block, post-action hooks log, error hooks escalate."},{"id":"auth-d5-17","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.3.2","module":"m5","unit":"m5-scale-failure-recovery","type":"single","text":"An orchestrator cannot invoke one of its subagents at all, and the run degrades. Which configuration setting most likely explains it?","options":[{"text":"user-invocable: false on the subagent","correct":false,"why":"That setting only stops a human selecting the agent directly in chat or the UI. Orchestration invocation is unaffected."},{"text":"disable-model-invocation: true on the subagent","correct":true,"why":"An agent with disable-model-invocation: true cannot be called as a subagent via orchestration, which is a documented cause of orchestration failures."},{"text":"A concurrency group shared with the orchestrator","correct":false,"why":"Shared concurrency can cancel or queue runs, but it does not make an agent uninvokable."},{"text":"Missing applyTo globs on the subagent","correct":false,"why":"applyTo narrows which files the agent focuses on; it does not govern whether the agent can be invoked."}],"takeaway":"disable-model-invocation: true blocks subagent orchestration; user-invocable: false only hides the agent from direct human selection."},{"id":"auth-d5-18","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.3.3","module":"m5","unit":"m5-scale-failure-recovery","type":"multi","text":"Which recovery strategies does the module prescribe for reliable multi-agent operation? (Select all that apply.)","options":[{"text":"Bounded retries - the agent may revise a PR branch to fix failures, but only within limits","correct":true,"why":"Yes. Bounded means the loop terminates, which is what prevents endless iteration."},{"text":"An escalation threshold - stop automated iteration and escalate to a human with links and a concise summary after the same required check fails twice","correct":true,"why":"Yes. A defined threshold with an actionable handoff is the published rule."},{"text":"Rollback readiness - prefer small, scoped pull requests so reverting is safe","correct":true,"why":"Yes. Small scope is what makes rollback cheap and low-risk when it is needed."},{"text":"Automatic force-push of the orchestrator's branch to reset system state","correct":false,"why":"No. Force-pushing destroys history and the audit trail. Recovery is retry, rollback via revert, and human escalation."}],"takeaway":"Design for failure: bounded retries, a defined escalation threshold with a useful report, and small PRs that revert cleanly."},{"id":"auth-d5-19","source":"authored","sourceLabel":"Authored for coverage","difficulty":"advanced","domain":"d5","objective":"5.4.1","module":"m5","unit":"m5-scale-failure-recovery","type":"single","text":"A planner agent should hand work to an implementer and then a code reviewer, running on the Copilot cloud agent. Which mechanism actually makes that possible?","options":[{"text":"A handoffs: block in the planner's frontmatter, listing each transition.","correct":false,"why":"This is the trap. `handoffs` appears in some agent formats, but the Copilot cloud agent ignores it — a profile relying on it will simply never delegate."},{"text":"Granting the planner the agent tool, so it can invoke the other custom agents.","correct":true,"why":"Subagent invocation is a capability, not a declaration. The `agent` tool (aliases `custom-agent`, `Task`) is what lets one custom agent call another; the profile's prose then says which specialist to use for what."},{"text":"A needs: list in the planner's frontmatter naming the downstream agents.","correct":false,"why":"`needs` orders jobs in a GitHub Actions workflow. It has no meaning in agent frontmatter."},{"text":"Setting user-invocable: true on the implementer and reviewer.","correct":false,"why":"That controls whether a *human* can select them directly. It does not let another agent call them — and `disable-model-invocation: true` would actively block it."}],"takeaway":"On the cloud agent, subagent delegation comes from the `agent` tool. `handoffs` is ignored there, so never treat it as the mechanism."},{"id":"auth-d5-20","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.4.2","module":"m5","unit":"m5-scale-failure-recovery","type":"single","text":"You must swap an agent's configuration for a new version while runs are in flight. Which approach avoids disrupting active workflows?","options":[{"text":"Edit the agent file in place on the default branch so every run picks up the change immediately.","correct":false,"why":"In-flight work changes behavior mid-task, producing exactly the inconsistent, hard-to-diagnose outcomes you are trying to avoid."},{"text":"Version the agent configuration, roll the new version out gradually while in-flight runs complete on the old one, and promote only after parity is confirmed.","correct":true,"why":"Versioned configuration plus gradual rollout is the disruption-free path: active runs finish on the version they started with, and the new version is promoted on evidence rather than hope. It also preserves a rollback target."},{"text":"Cancel all running workflows, then replace the configuration.","correct":false,"why":"Cancelling active runs is disruption, not avoidance of it, and it discards partial work and evidence."},{"text":"Delete the old agent file and let orchestration fall back to defaults.","correct":false,"why":"Deleting the configuration mid-flight causes orchestration failures and loses the rollback target."}],"takeaway":"Version agent configuration, let in-flight runs finish on the old version, promote the new one only after parity - and keep the old version as a rollback path."},{"id":"auth-d5-21","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.4.2","module":"m6","unit":"m6-maintain-governance-operational-reliability","type":"single","text":"What does the module say agent lifecycle management requires beyond deploying and retiring agents?","options":[{"text":"A dedicated repository per agent.","correct":false,"why":"Not a lifecycle requirement, and it fragments the codebase agents work on."},{"text":"Clearly defined ownership, plus supporting elements such as runbooks and a regular review cadence, because both agents and their guardrails evolve.","correct":true,"why":"Lifecycle management is a continuous sequence of deployment, monitoring, updating, and retirement. Because agents and their guardrails both change over time, ownership must be explicit and runbooks and review cadences must exist to keep governance effective."},{"text":"An annual model upgrade schedule.","correct":false,"why":"Model versioning is not the lifecycle concern the module describes."},{"text":"Automatic retirement after a fixed number of runs.","correct":false,"why":"Retirement is a decision, made and documented deliberately, not a run counter."}],"takeaway":"Lifecycle = deploy, monitor, update, retire - held together by named ownership, runbooks, and a review cadence."},{"id":"auth-d5-22","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.1.1","module":"m5","unit":"m5-exercise","type":"single","text":"In the Copilot CLI custom agents exercise, an Orchestrator coordinates a Planner, a Designer, and a Coder. What does the Orchestrator itself contribute?","options":[{"text":"It writes the dashboard code so the specialists can focus on review.","correct":false,"why":"Implementation belongs to the Coder agent; the Orchestrator delegates rather than implements."},{"text":"It coordinates the specialists - delegating planning, design, and implementation in turn, then summarizing the coordinated handoff.","correct":true,"why":"The exercise has the Orchestrator involve the Planner for an implementation plan, delegate design to the Designer, delegate implementation to the Coder, and finally summarize the coordinated handoff identifying each agent's contribution and the validation steps."},{"text":"It runs the validation workflows in GitHub Actions.","correct":false,"why":"Validation in the exercise is running the dashboard in a Codespace and checking it, not an Actions job the Orchestrator runs."},{"text":"It merges each specialist's branch after review.","correct":false,"why":"The exercise coordinates agents in a Codespace via the CLI; the Orchestrator's role is delegation and summary, not merging."}],"takeaway":"The supervisor/orchestrator pattern in practice: dispatch to specialists, then produce a documented handoff summary of who did what."},{"id":"auth-d6-01","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.1.1","module":"m6","unit":"m6-define-risk-based-autonomy","type":"multi","text":"Risk is not determined by the action alone. Which additional factors does the module say determine an action's risk? (Select all that apply.)","options":[{"text":"Where the change is applied","correct":true,"why":"Yes. Editing a README and editing .github/workflows/ are the same verb with very different consequences."},{"text":"How easily the change can be reversed","correct":true,"why":"Yes. Reversibility is the pivot: full automation is appropriate only when failures are reversible."},{"text":"How quickly it affects users or systems","correct":true,"why":"Yes. Blast speed determines how much time a control has to catch a problem before it reaches production."},{"text":"How many lines of code the change contains","correct":false,"why":"No. Diff size is a poor proxy - workflow and infrastructure paths are explicitly called out as \"small diff, big consequence\" areas."}],"takeaway":"Classify risk by location, reversibility, and speed of impact - never by diff size."},{"id":"auth-d6-02","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.1.2","module":"m6","unit":"m6-define-risk-based-autonomy","type":"single","text":"Which autonomy level describes an agent that can create branches and pull requests but cannot merge or deploy?","options":[{"text":"Read-only autonomy","correct":false,"why":"Read-only means the agent can inspect, summarize, classify, and recommend, but cannot modify anything - including creating branches."},{"text":"Propose-only autonomy","correct":true,"why":"Propose-only is exactly this level: the agent can create branches and pull requests but cannot merge or deploy. It is the level that implements \"agents propose; humans and policy accept\"."},{"text":"Execute with guardrails","correct":false,"why":"That level allows running pre-approved workflows such as tests, builds, and staging deploys within defined limits."},{"text":"Human-authorized execution","correct":false,"why":"That level allows high-impact actions - production deploys, workflow changes, secret access - but only after a human approves."}],"takeaway":"Four levels: read-only, propose-only, execute with guardrails, and human-authorized execution. Autonomy is usually a combination of controls, not one setting."},{"id":"auth-d6-03","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.1.2","module":"m6","unit":"m6-define-risk-based-autonomy","type":"single","text":"A team wants to grow agent autonomy safely over several quarters. Which progression matches the module's guidance?","options":[{"text":"Start with production deploy access and remove permissions if incidents occur.","correct":false,"why":"This starts at maximum blast radius and learns from damage. Progressive autonomy starts strict and relaxes on evidence."},{"text":"Open pull requests only, then merge low-risk PRs after checks, then deploy to staging automatically, then deploy to production only through environment approval.","correct":true,"why":"This is the documented safe progression. Teams begin with strict controls and relax them gradually as agent behavior proves reliable, so autonomy scales on evidence rather than optimism."},{"text":"Grant full autonomy in a sandbox repository, then copy the same settings to production repositories.","correct":false,"why":"Sandbox behavior does not transfer: the risk profile of the repository, not the agent's sandbox record, determines appropriate controls."},{"text":"Alternate weekly between full and read-only autonomy to gather comparative data.","correct":false,"why":"Unpredictable capability makes both the agent and the review process unreliable, and it gathers noise rather than evidence."}],"takeaway":"Progressive autonomy: PRs only, then low-risk merges after checks, then automatic staging deploys, then production only via environment approval."},{"id":"auth-d6-04","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.1.1","module":"m6","unit":"m6-define-risk-based-autonomy","type":"single","text":"An agent emits a plan with a risk rating. What is the recommended way to act on that rating?","options":[{"text":"Include a narrative risk paragraph in the PR description for reviewers to interpret.","correct":false,"why":"The guidance is explicit: do not rely on narrative explanations of risk. Interpretation varies between reviewers and cannot be enforced."},{"text":"Emit a machine-readable signal, such as a risk field in plan.json, and route execution on it - low risk applies automatically, anything else goes to a job in an approval-gated environment.","correct":true,"why":"Reading the risk value into a job output and using it in an if: condition to choose between an auto-apply job and an approval-gated one enforces the decision consistently, rather than leaving it to interpretation."},{"text":"Have the agent decide for itself whether approval is needed.","correct":false,"why":"The agent proposing the rating and enforcing it are different responsibilities. Enforcement belongs to the workflow."},{"text":"Apply the strictest gate to every plan regardless of the rating.","correct":false,"why":"That discards the rating entirely and reintroduces approval fatigue on low-risk work."}],"takeaway":"Emit risk as a machine-readable signal and enforce routing on it. Narrative risk is not a control."},{"id":"auth-d6-05","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.1","module":"m6","unit":"m6-design-human-workflows","type":"multi","text":"Which decision points should human oversight be placed at, according to the module? (Select all that apply.)","options":[{"text":"Merge","correct":true,"why":"Yes. Merge is where a proposal becomes part of the codebase."},{"text":"Deployment","correct":true,"why":"Yes. Deployment is where a change reaches users and systems."},{"text":"Access to sensitive resources such as production secrets","correct":true,"why":"Yes. Secret access is a named high-impact decision point."},{"text":"Every analysis and formatting step the agent performs","correct":false,"why":"No. The guidance is to put humans at decision points, not at every step - analysis, formatting, and routine checks should flow automatically."}],"takeaway":"Humans at merge, deploy, and secret access. Analysis, formatting, and routine checks stay automated."},{"id":"auth-d6-06","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.1","module":"m6","unit":"m6-design-human-workflows","type":"single","text":"A terminal agent should search and read freely, but any edit or command execution must be approved at the time of use. How do you express that?","options":[{"text":"Grant all tools and instruct the agent to ask before editing.","correct":false,"why":"Asking is voluntary. Tool-based approval boundaries are a control; instructions are not."},{"text":"Allow the low-risk tools explicitly - for example --allow-tool 'read,search' - leaving edit and execute available but approval-gated at the point of use.","correct":true,"why":"This is the tool-based approval boundary pattern: it removes friction for low-risk tools while ensuring high-risk tools remain available but require explicit approval when they are actually invoked."},{"text":"Remove the edit and execute tools entirely.","correct":false,"why":"That removes the capability rather than gating it, so the agent can never do the work even when a human would approve."},{"text":"Require a human to approve the whole session before it starts.","correct":false,"why":"A blanket session approval cannot distinguish the read the human intended from the destructive edit they did not."}],"takeaway":"Auto-allow low-risk tools; leave high-risk tools available but approval-gated at the moment of use."},{"id":"auth-d6-07","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"Your organization wants sudo, rm -rf /, and curl-piped-to-bash blocked before a local agent can execute them. What implements this?","options":[{"text":"A banner printed at session start warning against dangerous commands.","correct":false,"why":"The guidance is blunt: logging and banners are helpful, but they do not prevent execution."},{"text":"A Copilot CLI preToolUse hook with deny rules matching those patterns for shell tools.","correct":true,"why":"A preToolUse hook with permissionDecision: deny rules turns policy into a technical control by blocking the command before execution, reducing the risk of unintended or destructive actions."},{"text":"A CODEOWNERS entry for the scripts directory.","correct":false,"why":"CODEOWNERS routes review of file changes. It cannot intercept a command at runtime."},{"text":"A required status check that scans commits for those strings.","correct":false,"why":"A check runs after a commit exists. The hook prevents the command from running at all."}],"takeaway":"Use enforceable hooks for blocking. If the platform cannot enforce it, it will eventually be bypassed."},{"id":"auth-d6-08","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"A team needs a rule that branch protection settings cannot express: agent-authored pull requests must never be approved solely by another bot. What is the recommended approach?","options":[{"text":"Accept the limitation - if settings cannot express it, it cannot be enforced.","correct":false,"why":"Guardrail workflows exist precisely to enforce rules that are not expressible via settings alone."},{"text":"Add a guardrail workflow that inspects reviews via the API and fails the check unless at least one approval comes from a human user.","correct":true,"why":"This is the defense-in-depth pattern: a workflow that lists PR reviews and calls core.setFailed unless an approval exists from a user account that is not the agent identity. You still keep branch protections and CODEOWNERS - the guardrail workflow adds what settings cannot express."},{"text":"Remove the agent's ability to open pull requests.","correct":false,"why":"That eliminates the workflow rather than governing it."},{"text":"Document the rule in CONTRIBUTING.md and rely on reviewer discipline.","correct":false,"why":"\"Controls in docs only\" is a named anti-pattern."}],"takeaway":"Layer enforcement: rulesets and CODEOWNERS for what settings can express, guardrail workflows for what they cannot."},{"id":"auth-d6-09","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"The layered enforcement model spans three stages. Which listing is correct?","options":[{"text":"Pre-action constraints (permissions), in-action validation (checks), post-action traceability (logs and artifacts).","correct":true,"why":"These are the three layers. The accompanying rule is decisive: if a control is not enforced by the platform, treat it as optional."},{"text":"Planning review, implementation review, deployment review.","correct":false,"why":"These are review moments, not the enforcement layers the module defines."},{"text":"Repository rules, organization rules, enterprise rules.","correct":false,"why":"That is a scope hierarchy, not the temporal enforcement model."},{"text":"Authentication, authorization, auditing.","correct":false,"why":"A reasonable general security triad, but not the model taught here."}],"takeaway":"Constrain before (permissions), validate during (checks), trace after (logs and artifacts) - and treat unenforced controls as optional."},{"id":"auth-d6-10","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.3","module":"m6","unit":"m6-control-agent-capabilities","type":"multi","text":"Beyond the permissions block, which additional controls support least-privilege agent execution? (Select all that apply.)","options":[{"text":"Restrict secrets access using environments","correct":true,"why":"Yes. Environment-scoped secrets mean a job that does not target the environment cannot read them."},{"text":"Isolate workflows so high-risk jobs do not share permissions with low-risk jobs","correct":true,"why":"Yes. Separation stops a low-risk job inheriting capability it never needs."},{"text":"Minimize third-party actions and pin versions where possible","correct":true,"why":"Yes. Every third-party action is executing code inside your permission context; fewer and pinned reduces that exposure."},{"text":"Store a broadly scoped personal access token as a repository secret for convenience","correct":false,"why":"No. A broad PAT is the excess-permissions anti-pattern - a small mistake becomes a major incident."}],"takeaway":"Least privilege is layered: minimal permissions, environment-scoped secrets, workflow isolation, and minimal pinned third-party actions."},{"id":"auth-d6-11","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.4","module":"m6","unit":"m6-enforce-governance-github-controls","type":"multi","text":"For a protected branch such as main, which rules should a ruleset enforce for agent-driven work? (Select all that apply.)","options":[{"text":"Require a pull request to merge and require checks to pass","correct":true,"why":"Yes. These make the PR the mandatory path and evaluation an enforceable gate."},{"text":"Require approving reviews per risk, including CODEOWNERS review for sensitive paths","correct":true,"why":"Yes - and note the caveat: unless \"require CODEOWNERS review\" is enabled, CODEOWNERS is advisory only."},{"text":"Restrict direct pushes and block force pushes and branch deletion","correct":true,"why":"Yes. These close the bypass paths that would otherwise let policy be skipped."},{"text":"Require every pull request to be squash-merged","correct":false,"why":"No. Merge strategy is a history-shape preference, not a governance control for agent work."}],"takeaway":"Protected-branch rules: PR required, checks required, reviews per risk with CODEOWNERS on sensitive paths, no direct or force pushes, no branch deletion."},{"id":"auth-d6-12","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.5","module":"m6","unit":"m6-maintain-governance-operational-reliability","type":"single","text":"Six months after setup, required checks have been renamed, CODEOWNERS lists people who left, and several workflow tokens now hold write permissions. What is this, and what is the remedy?","options":[{"text":"A configuration bug; restore the repository from a backup.","correct":false,"why":"Each individual change was probably deliberate and reasonable at the time. The failure is cumulative, not a single fault."},{"text":"Governance drift; treat governance as an ongoing operational responsibility with a periodic review cadence - weekly failed runs and policy violations, monthly permissions and secret scopes, quarterly rulesets, CODEOWNERS, environment reviewers, and retention.","correct":true,"why":"Controls degrade as checks are renamed or removed, review requirements are relaxed, CODEOWNERS goes stale, permissions expand, and secrets move into broader scopes. The prescribed answer is a continuous governance loop on that cadence."},{"text":"Normal evolution; no action is needed as long as no incident has occurred.","correct":false,"why":"Waiting for an incident is how small gaps accumulate into a large one."},{"text":"Excess permissions only; revoke all write tokens.","correct":false,"why":"That addresses one symptom and leaves the stale checks and ownership untouched."}],"takeaway":"Governance drifts. Run the loop: weekly failures and violations, monthly permissions and secrets, quarterly rulesets, ownership, reviewers, and retention."},{"id":"auth-d6-13","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.5","module":"m6","unit":"m6-maintain-governance-operational-reliability","type":"single","text":"Match the governance anti-pattern to its mitigation: approvals have become \"click to unblock\" and nobody actually reviews.","options":[{"text":"Unbounded autonomy; add environments with required reviewers.","correct":false,"why":"That anti-pattern is having no approval at all for production deploys. Here approvals exist - they are just hollow."},{"text":"Rubber-stamping; fix it with better evidence, CODEOWNERS routing, and smaller pull requests.","correct":true,"why":"Rubber-stamping is the named anti-pattern where approvals become a formality. The mitigation is making review genuinely easy: attach evidence so review is fast, route to people with context, and keep PRs small enough to actually read."},{"text":"Missing audit trail; fix it with artifact uploads.","correct":false,"why":"That is about being unable to prove what happened, not about approvals losing meaning."},{"text":"Bypass paths exist; fix it with branch protections.","correct":false,"why":"Bypass paths are direct pushes to main or disabled checks - policy being skipped rather than performed emptily."}],"takeaway":"Rubber-stamping is fixed by making review worth doing: good evidence, targeted routing, and small scope."},{"id":"auth-d6-14","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.4","module":"m6","unit":"m6-make-actions-observable-traceable-auditable","type":"single","text":"A change is ready to merge but no artifacts, plan, or execution report were produced. What does the governance module say to do?","options":[{"text":"Merge it - the required checks passed, which is the enforceable signal.","correct":false,"why":"Passing checks is necessary, not sufficient. The module treats missing evidence as a failure in its own right."},{"text":"Treat missing evidence as a failure: if a change cannot be audited, it should not be merged.","correct":true,"why":"The rule is stated directly - missing evidence equals failure. Without durable evidence you cannot debug reliably, investigate incidents, prove compliance, or trust autonomous changes over time."},{"text":"Merge it and backfill evidence afterwards from the run logs.","correct":false,"why":"Logs expire under retention and cannot reconstruct a plan that was never produced."},{"text":"Merge it but add a label indicating evidence was missing.","correct":false,"why":"A label records the gap without closing it, and the unauditable change still lands."}],"takeaway":"Missing evidence = failure. Every meaningful action must leave a trace a reviewer can inspect."},{"id":"auth-d6-15","source":"authored","sourceLabel":"Authored for coverage","domain":"d6","objective":"6.2.3","module":"m6","unit":"m6-make-actions-observable-traceable-auditable","type":"multi","text":"Under the observability model, what must every meaningful agent action produce? (Select all that apply.)","options":[{"text":"Pull request and commit history","correct":true,"why":"Yes. What changed, and in what sequence."},{"text":"Workflow results including job logs, timing, and the acting identity","correct":true,"why":"Yes. What ran, how long it took, and who or what ran it."},{"text":"Uploaded artifacts such as a plan, test results, or an execution report - and for production, the environment approval record","correct":true,"why":"Yes. Machine-readable evidence such as plan.json and execution-report, plus approval and merge events, is what makes the action auditable."},{"text":"A screenshot of the agent's chat session attached to the pull request","correct":false,"why":"No. Chat screenshots are neither machine-readable nor authoritative. Evidence-first workflows output structured artifacts."}],"takeaway":"Produce PR and commits, workflow results with actor and timing, structured artifacts, and approval and merge events - including the environment approval record for production."},{"id":"auth-fill-01","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.4.1","module":"m2","unit":"m2-agent-operations-controls","type":"multi","text":"Where should error handling live in an agent workflow so that a failure is never silent? (Select all that apply.)","options":[{"text":"At the tool-call boundary, so a failing tool invocation is caught rather than ignored","correct":true,"why":"Yes. The first boundary is where the agent calls out to a tool; an unhandled failure there propagates as confusing downstream behavior."},{"text":"At the step and job level in the wrapping workflow, using explicit failure conditions instead of letting execution continue","correct":true,"why":"Yes. Failing fast at the step level prevents partial or inconsistent changes from being committed by later steps."},{"text":"In a finalizing step that always runs, uploading logs and posting the outcome to the pull request","correct":true,"why":"Yes. A step that runs regardless of outcome guarantees evidence exists even for failed runs - which is exactly when you need it most."},{"text":"In the agent's system prompt, instructing it to report any errors it notices","correct":false,"why":"No. That is guidance, not handling. An error the agent does not notice is not reported, and a prompt cannot stop a workflow."}],"takeaway":"Handle errors at every boundary: the tool call, the workflow step and job, and a finalizer that always emits evidence."},{"id":"auth-fill-02","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.4.3","module":"m6","unit":"m6-maintain-governance-operational-reliability","type":"single","text":"Which recovery strategy does the module specifically warn against retrying, and what should happen instead?","options":[{"text":"Transient network failures - escalate immediately rather than retrying.","correct":false,"why":"Backwards. Transient failures are exactly what bounded retries are for."},{"text":"Security failures - investigate them rather than repeatedly retrying.","correct":true,"why":"The recovery guidance lists this explicitly: retry transient failures within bounds, escalate after repeated failures, roll back quickly using small PRs and safe revert paths, and investigate security failures instead of repeatedly retrying. A blocked security check is telling you something, and retrying only hides it."},{"text":"Merge conflicts - always retry until the rebase succeeds.","correct":false,"why":"Repeated conflicts are an escalation trigger, not something to retry indefinitely."},{"text":"Test failures - roll back the entire branch on the first failure.","correct":false,"why":"A failing test is normal iteration; the agent may revise the branch within retry limits."}],"takeaway":"Retry transient faults, escalate on repetition, roll back with small PRs - but investigate security failures rather than retrying them."},{"id":"auth-fill-03","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.4.4","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"An escalation fires and a human is paged. What should the escalation itself contain to be useful?","options":[{"text":"A link to the failing workflow run and nothing else, to keep the notification short.","correct":false,"why":"A bare link makes the human reconstruct the entire situation from scratch, which is the slow path."},{"text":"What failed, what was attempted, what evidence exists, and what the suggested next step is.","correct":true,"why":"This is the escalation payload the safe-iteration policy prescribes. It converts a notification into an actionable handoff and is what stops escalations becoming noise."},{"text":"A full dump of the agent's reasoning trace.","correct":false,"why":"A raw trace is unsummarized. The receiving human needs a decision-ready brief, with the trace available if they want it."},{"text":"A request for the human to re-run the workflow and see what happens.","correct":false,"why":"That delegates the diagnosis back to the human without any of the context the system already has."}],"takeaway":"Escalate with a brief: what failed, what was tried, what evidence exists, and the suggested next step."},{"id":"auth-fill-04","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.2.2","module":"m5","unit":"m5-system-observability-evidence-workflows","type":"single","text":"A handoff between two agents is recorded as \"passed to the security agent\". Why is that insufficient?","options":[{"text":"It should name the model version used by the receiving agent.","correct":false,"why":"Model provenance is useful telemetry but is not what makes a handoff reviewable."},{"text":"It records the transition but not the decision, the rationale, or the next owner - so a reviewer cannot tell why the handoff happened or who is accountable now.","correct":true,"why":"The recommended structure captures decision, rationale, and next owner. Without those three, the handoff is an event rather than a documented decision, and accountability is ambiguous."},{"text":"Handoffs should never be documented in pull requests.","correct":false,"why":"The pull request is exactly where handoffs should be documented, in a standard structure."},{"text":"It should be recorded in the audit log rather than the pull request.","correct":false,"why":"The audit log records platform events. Design decisions and handoff rationale belong where reviewers read them."}],"takeaway":"Document handoffs as decision, rationale, and next owner - not just as \"who has it now\"."},{"id":"auth-fill-05","source":"authored","sourceLabel":"Authored for coverage","domain":"d5","objective":"5.4.3","module":"m6","unit":"m6-maintain-governance-operational-reliability","type":"multi","text":"An agent is being retired. Which steps preserve auditability and workflow continuity? (Select all that apply.)","options":[{"text":"Leave the agent's configuration in git history rather than scrubbing it","correct":true,"why":"Yes. Git history is the durable record of what the agent was configured to do at any point in the past."},{"text":"Retain its past workflow runs and artifacts under the retention policy","correct":true,"why":"Yes. Those are the evidence for anything the agent did, and deleted artifacts cannot be restored."},{"text":"Document the retirement decision and reassign ownership of anything it used to handle","correct":true,"why":"Yes. Lifecycle management requires clearly defined ownership, so retirement must say who now owns the work and why the agent was retired."},{"text":"Delete the agent's branches and close its open pull requests without comment","correct":false,"why":"No. Silent deletion destroys context. Open work should be reassigned or closed with a recorded reason so the trail stays intact."}],"takeaway":"Retire by preserving: config in git history, runs and artifacts under retention, a documented decision, and reassigned ownership."},{"id":"mock-1","source":"community-mock","sourceLabel":"Community mock exam (gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/mock-exam.md","domain":"d1","objective":"1.2.2","module":"m2","unit":"m2-plan-reason-execution","type":"single","text":"Your team is integrating a Copilot custom agent that produces draft refactors. Reviewers complain that they can't tell what the agent intended before code changes appear in a PR. Which configuration most directly addresses the complaint?","options":[{"text":"Increase the agent's autonomy level so it produces more diff context per PR.","correct":false,"why":"More diff context is more output, not earlier insight. The complaint is that reviewers cannot see intent before the code exists, and a bigger diff arrives at the same time as the small one."},{"text":"Configure the agent to output a structured plan as a workflow artifact before any code changes are written.","correct":true,"why":"Correct. A structured plan published as a workflow artifact (or PR description) before any code is written is exactly the 'separate planning from execution' pattern. Reviewers validate intent first."},{"text":"Require two CODEOWNER approvals on every agent-authored PR.","correct":false,"why":"CODEOWNERS approvals gate the merge, which happens after the code already exists. It does not surface the agent's intent any earlier."},{"text":"Reduce the agent's tool list to read-only operations.","correct":false,"why":"Making the agent read-only removes the capability entirely instead of making its reasoning visible. That solves the symptom by deleting the feature."}],"takeaway":"Reviewers' complaint is about *visibility before code*. A structured plan artifact published before any change addresses that exactly. CODEOWNER counts (C) gate merge but don't show intent earlier; (A) is opposite of the issue; (D) discards capability."},{"id":"mock-2","source":"community-mock","sourceLabel":"Community mock exam (gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/mock-exam.md","domain":"d1","objective":"1.1.2","module":"m1","unit":"m1-identify-risks-traceability","type":"multi","text":"Which of the following is an anti-pattern when integrating an agent into the SDLC? (Select all that apply.)","options":[{"text":"The agent acts immediately without producing an inspectable plan.","correct":true,"why":"Correct. 'Planless execution' is the canonical anti-pattern in the Foundations module: the agent starts changing code without an inspectable approach, so reviewers only ever see the diff."},{"text":"The agent runs in a workflow with `permissions: { contents: read }`.","correct":false,"why":"A read-only permissions block is least privilege done right, not an anti-pattern."},{"text":"The agent's commit author is the human who triggered the workflow.","correct":false,"why":"Attribution to the human who triggered the run is acceptable; the anti-pattern is having no attribution or audit trail at all."},{"text":"The agent operates on a feature branch protected by branch protection rules.","correct":false,"why":"Working on a protected feature branch is exactly the bounded, PR-based pattern the modules recommend."}],"takeaway":"Acting without an inspectable plan is the canonical anti-pattern. (B) is fine (read-only is safe), (C) is acceptable when the human triggers it, (D) is good practice."},{"id":"mock-3","source":"community-mock","sourceLabel":"Community mock exam (gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/mock-exam.md","domain":"d1","objective":"1.2.1","module":"m2","unit":"m2-plan-reason-execution","type":"single","text":"You are designing a \"research → propose → apply\" agent flow. Which separation produces the most inspectable workflow?","options":[{"text":"One job that does all three phases sequentially with grouped logs.","correct":false,"why":"Grouped logs improve readability but nothing gates the transition from planning to action, so an unreviewed plan still becomes code."},{"text":"A planning job that uploads a plan artifact, a reviewer-approved `workflow_dispatch` to begin the action job, then an evaluation job.","correct":true,"why":"Correct. Plan artifact → human approval → action job → evaluation is the inspectable separation: each phase leaves durable evidence and execution cannot start until the plan is accepted."},{"text":"A single job with `if: github.actor == 'admin'` gating the action step.","correct":false,"why":"Gating on `github.actor` is identity checking, not plan validation. Any admin-triggered run still executes an unreviewed plan."},{"text":"Three sequential jobs in the same workflow with `needs:` dependencies.","correct":false,"why":"`needs:` only enforces ordering. Sequential jobs with no approval gate still run straight through from plan to action."}],"takeaway":"Separation of plan/approve/act/evaluate into discrete artifact-producing steps is the inspectability pattern. (A) groups logs but doesn't gate; (C) is identity gating only; (D) sequential jobs alone don't add approval gates."},{"id":"mock-4","source":"community-mock","sourceLabel":"Community mock exam (gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/mock-exam.md","domain":"d1","objective":"1.3.1","module":"m6","unit":"m6-define-risk-based-autonomy","type":"single","text":"A regulated team is concerned about agent autonomy. Which design preserves velocity while controlling risk?","options":[{"text":"Require human approval on every agent-authored PR regardless of change category.","correct":false,"why":"Blanket approval on every PR is the 'governance fatigue' failure mode: reviewers rubber-stamp low-risk changes and stop reading the high-risk ones."},{"text":"Disable agent access during business hours.","correct":false,"why":"Time-of-day restrictions do not correlate with risk. A destructive change at 2am is as damaging as one at 2pm."},{"text":"Categorize actions by operational/security/compliance risk and require approval only for high-risk categories.","correct":true,"why":"Correct. Risk-based autonomy — classify by operational, security, and compliance risk, then require approval only where risk is material — is the published guidance in the Governance module."},{"text":"Run agents only in a dedicated repository disconnected from production.","correct":false,"why":"Isolating agents in a scratch repository removes the risk by removing the value. It does not let agents contribute to real work safely."}],"takeaway":"Risk-tiered autonomy is the published guidance. (A) is approval theater; (B)(D) reduce velocity without proportionate safety gain."},{"id":"mock-5","source":"community-mock","sourceLabel":"Community mock exam (gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/mock-exam.md","domain":"d1","objective":"1.3.2","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"Which artifact is the most appropriate \"inspectable artifact\" for an agent's plan in a standard GitHub workflow?","options":[{"text":"A console log line in the workflow run.","correct":false,"why":"Console output scrolls away and is bound to a single run's retention. The modules explicitly recommend uploading artifacts precisely because logs are not durable enough."},{"text":"An `actions/upload-artifact`-uploaded JSON or markdown plan document referenced from the PR description.","correct":true,"why":"Correct. A plan uploaded with `actions/upload-artifact` and linked from an 'Evidence' section in the PR is the canonical GitHub-native inspectable artifact: durable, traceable to a run and commit, reviewable in place."},{"text":"An entry in an external Notion database.","correct":false,"why":"External systems break the 'GitHub as system of record' model — the evidence is no longer attached to the change it justifies."},{"text":"A comment in the agent's source code.","correct":false,"why":"A source comment is not produced per run, so it cannot record what this particular execution intended or did."}],"takeaway":"A workflow artifact referenced from the PR is the canonical inspectable artifact. (A) is ephemeral, (C) is off-platform, (D) isn't an artifact."},{"id":"mock-6","source":"community-mock","sourceLabel":"Community mock exam (gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/mock-exam.md","domain":"d1","objective":"1.1.3","module":"m2","unit":"m2-inputs-outputs-success-criteria","type":"single","text":"You want to define success criteria for an agent task that performs a dependency upgrade. Which combination is most robust?","options":[{"text":"Tests pass; no new code scanning alerts; PR template required fields completed.","correct":true,"why":"Correct. Success criteria should be objective and enforceable: required checks pass, no new scanning alerts, and the PR template's required fields are complete. These map directly to status checks the platform can gate on."},{"text":"The agent reports \"success\" in its trace log.","correct":false,"why":"A self-reported 'success' is the agent grading its own homework. The modules are explicit that evaluation must be grounded in system signals, not agent confidence."},{"text":"The PR is opened within 5 minutes of triggering.","correct":false,"why":"Elapsed time measures speed, not whether the upgrade actually resolved the vulnerability."},{"text":"A human approves the PR description.","correct":false,"why":"Approving the description validates the narrative, not the change. 'CI passed' plus a good story is still not proof the intent was met."}],"takeaway":"Multiple objective criteria mirroring human-contributor judgment. (B) is self-reported, (C) measures speed not quality, (D) is s
