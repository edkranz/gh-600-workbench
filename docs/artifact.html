prevent planless execution from being merged?","options":[{"text":"Ask the agent to be careful.","correct":false,"why":"Asking for caution relies on voluntary behavior and doesn't create enforceable controls."},{"text":"Require a plan template only.","correct":false,"why":"Templates encourage good behavior, but templates alone don't prevent merges when requirements are skipped."},{"text":"Make a plan check a required status check and require pull request reviews.","correct":true,"why":"Templates encourage good behavior, but required checks and required reviews enforce it. This converts plan required into a guaranteed merge condition."},{"text":"Allow direct pushes but require tests.","correct":false,"why":"Direct pushes bypass pull request governance and review controls."}],"takeaway":"Templates encourage good behavior, but required checks and required reviews enforce it. This converts plan required into a guaranteed merge condition."},{"id":"off-m2-2","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d1","objective":"1.3.1","module":"m2","unit":"m2-pull-request-governance-controls","type":"single","text":"Which GitHub feature most directly routes reviews based on changed file paths?","options":[{"text":"Issues","correct":false,"why":"Issues track work but don't automatically assign code reviewers by path."},{"text":"CODEOWNERS","correct":true,"why":"CODEOWNERS maps paths to owners so the right experts are automatically requested for review and can be enforced with required review policies."},{"text":"Actions artifacts","correct":false,"why":"Artifacts store outputs from workflows, not review routing rules."},{"text":"Releases","correct":false,"why":"Releases package delivered versions but don't control code review ownership."}],"takeaway":"CODEOWNERS maps paths to owners so the right experts are automatically requested for review and can be enforced with required review policies."},{"id":"off-m2-3","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d1","objective":"1.3.2","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"In a plan-act-evaluate architecture, where should evaluation evidence primarily live?","options":[{"text":"Only inside the agent's private logs","correct":false,"why":"Private logs are not easily reviewable or auditable by collaborators."},{"text":"In PR comments only","correct":false,"why":"Comments can help explain results, but they are not the strongest source of durable execution evidence."},{"text":"In GitHub-native artifacts like workflow runs, checks, and uploaded artifacts","correct":true,"why":"Workflow runs, checks, and artifacts are durable, reviewable, and auditable. They provide objective evidence independent of the agent."},{"text":"In a separate external document","correct":false,"why":"External documents may be harder to verify and disconnect evidence from the workflow."}],"takeaway":"Workflow runs, checks, and artifacts are durable, reviewable, and auditable. They provide objective evidence independent of the agent."},{"id":"off-m2-4","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d1","objective":"1.3.1","module":"m2","unit":"m2-reliable-workflows","type":"single","text":"Which design best expresses risk-based autonomy for production deployments?","options":[{"text":"Let the agent deploy after tests pass","correct":false,"why":"Passing tests alone may not be sufficient for high-risk production changes."},{"text":"Use GitHub Environments with required reviewers for production","correct":true,"why":"Environments create a human approval gate for high-risk execution and can restrict access to protected secrets and deployments."},{"text":"Allow direct pushes to main","correct":false,"why":"Direct pushes reduce governance and increase deployment risk."},{"text":"Disable workflow approvals","correct":false,"why":"Removing approvals weakens controls for sensitive deployments."}],"takeaway":"Environments create a human approval gate for high-risk execution and can restrict access to protected secrets and deployments."},{"id":"off-m2-5","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d1","objective":"1.1.2","module":"m2","unit":"m2-plan-reason-execution","type":"single","text":"Which is an architectural anti-pattern in agent design?","options":[{"text":"Clear success criteria","correct":false,"why":"Clear success criteria improve reliability and accountability."},{"text":"Required checks","correct":false,"why":"Required checks are a governance best practice."},{"text":"Mixed planning and execution with no inspectable plan","correct":true,"why":"Without an inspectable plan, reviewers can't validate intent or scope. This increases hidden reasoning and reduces reliability."},{"text":"Uploading artifacts","correct":false,"why":"Uploading artifacts can improve traceability and evidence collection."}],"takeaway":"Without an inspectable plan, reviewers can't validate intent or scope. This increases hidden reasoning and reduces reliability."},{"id":"off-m3-1","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.3.1","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"Where do agents execute tasks when working with GitHub repositories?","options":[{"text":"Directly on the developer's local machine.","correct":false,"why":"Agents do not execute tasks on your local machine."},{"text":"Within workflows powered by GitHub Actions.","correct":true,"why":"Agent tasks are executed through workflows."},{"text":"Inside the GitHub web interface without workflows.","correct":false,"why":"Execution is not handled directly in the UI."},{"text":"On external servers without using GitHub workflows.","correct":false,"why":"Agent execution in GitHub relies on workflows."}],"takeaway":"Agent tasks are executed through workflows."},{"id":"off-m3-2","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.3.4","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"How are agent-generated code changes isolated before review?","options":[{"text":"By committing directly to the default branch.","correct":false,"why":"Changes are not made directly to the default branch."},{"text":"By creating and working within a separate branch.","correct":true,"why":"Changes are isolated on a branch before review."},{"text":"By storing changes in a temporary external system.","correct":false,"why":"Changes are made within the repository."},{"text":"By applying changes only after deployment.","correct":false,"why":"Changes are reviewed before deployment."}],"takeaway":"Changes are isolated on a branch before review."},{"id":"off-m3-3","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.1.3","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"What determines what an agent can do during workflow execution?","options":[{"text":"The number of contributors in the repository.","correct":false,"why":"Contributors do not control permissions."},{"text":"Workflow permissions and the GITHUB_TOKEN scope.","correct":true,"why":"Permissions define allowed actions."},{"text":"The size of the repository.","correct":false,"why":"Repository size does not affect permissions."},{"text":"The number of workflow runs completed.","correct":false,"why":"Execution count does not determine permissions."}],"takeaway":"Permissions define allowed actions."},{"id":"off-m3-4","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.3.5","module":"m3","unit":"m3-agent-execution-limits-protections","type":"single","text":"What is the purpose of a pull request in agent workflows?","options":[{"text":"To automatically merge agent changes into the default branch.","correct":false,"why":"Pull requests require review before merging."},{"text":"To provide a place to review and validate changes before merging.","correct":true,"why":"Pull requests enable review and validation."},{"text":"To bypass workflow execution.","correct":false,"why":"Pull requests often trigger workflows."},{"text":"To execute code changes immediately without checks.","correct":false,"why":"Changes are validated before merging."}],"takeaway":"Pull requests enable review and validation."},{"id":"off-m3-5","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.3.3","module":"m3","unit":"m3-interact-github-apis-workflows","type":"single","text":"How can workflows be triggered after an agent updates code?","options":[{"text":"Only manually by a repository administrator.","correct":false,"why":"Workflows can run automatically."},{"text":"Through events such as push or pull request.","correct":true,"why":"Events trigger workflow runs."},{"text":"Only when a repository is forked.","correct":false,"why":"Forking does not trigger workflows."},{"text":"Only when code is downloaded locally.","correct":false,"why":"Local downloads do not trigger workflows."}],"takeaway":"Events trigger workflow runs."},{"id":"off-m3-6","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.2.1","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"What is the role of an MCP server?","options":[{"text":"To replace GitHub workflows.","correct":false,"why":"MCP does not replace workflows."},{"text":"To expose tools and services that agents can use.","correct":true,"why":"MCP servers provide access to tools."},{"text":"To store repository code.","correct":false,"why":"Code is stored in repositories."},{"text":"To execute workflows instead of GitHub Actions.","correct":false,"why":"Workflows are handled by GitHub Actions."}],"takeaway":"MCP servers provide access to tools."},{"id":"off-m3-7","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.2.4","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"What controls which MCP servers an agent can use?","options":[{"text":"Repository size limits.","correct":false,"why":"Size does not control access."},{"text":"Registries and allow lists.","correct":true,"why":"Registries provide discovery and allow lists enforce usage."},{"text":"Workflow execution time limits.","correct":false,"why":"Time limits do not control MCP access."},{"text":"The number of commits in the repository.","correct":false,"why":"Commits do not affect MCP access."}],"takeaway":"Registries provide discovery and allow lists enforce usage."},{"id":"off-m3-8","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.3.6","module":"m3","unit":"m3-agent-execution-limits-protections","type":"single","text":"Why are environment protections used in GitHub workflows?","options":[{"text":"To increase workflow execution speed.","correct":false,"why":"Protections are not for performance."},{"text":"To require approvals and protect sensitive operations.","correct":true,"why":"Environments enforce approvals and access control."},{"text":"To automatically merge pull requests.","correct":false,"why":"Protections do not merge changes."},{"text":"To disable workflows on certain branches.","correct":false,"why":"Protections control execution, not disable workflows."}],"takeaway":"Environments enforce approvals and access control."},{"id":"off-m3-9","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.1.3","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"What is the effect of using least-privilege permissions in workflows?","options":[{"text":"It gives agents full access to all resources.","correct":false,"why":"Least privilege restricts access."},{"text":"It limits actions to only what is required.","correct":true,"why":"Permissions are restricted to necessary actions."},{"text":"It prevents workflows from running.","correct":false,"why":"Workflows still run."},{"text":"It automatically approves pull requests.","correct":false,"why":"Permissions do not approve PRs."}],"takeaway":"Permissions are restricted to necessary actions."},{"id":"off-m3-10","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d2","objective":"2.4.5","module":"m3","unit":"m3-agent-execution-limits-protections","type":"single","text":"How are agent actions kept visible and reviewable?","options":[{"text":"By hiding logs and restricting access.","correct":false,"why":"Visibility is required."},{"text":"Through workflow logs and pull request review.","correct":true,"why":"Logs and PRs provide visibility."},{"text":"By executing actions outside GitHub.","correct":false,"why":"Actions remain within GitHub systems."},{"text":"By skipping validation steps.","correct":false,"why":"Validation improves visibility and safety."}],"takeaway":"Logs and PRs provide visibility."},{"id":"off-m5-1","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d5","objective":"5.1.1","module":"m5","unit":"m5-agent-orchestration-github-workflows","type":"single","text":"What is the most effective coordination primitive for multi-agent work in GitHub?","options":[{"text":"Private agent-to-agent messaging","correct":false,"why":"Private coordination lacks durable visibility and reviewability for repository governance."},{"text":"Pull requests and surrounding artifacts (checks, reviews, history)","correct":true,"why":"Pull requests define the boundary of change and expose the evidence needed for review, validation, and auditing."},{"text":"A shared spreadsheet","correct":false,"why":"Spreadsheets don't provide enforceable repository workflows or integrated validation."},{"text":"A single long-running workflow without branches","correct":false,"why":"Without isolation boundaries like branches and pull requests, coordination becomes difficult and risky."}],"takeaway":"Pull requests define the boundary of change and expose the evidence needed for review, validation, and auditing."},{"id":"off-m5-2","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d5","objective":"5.1.2","module":"m5","unit":"m5-execution-isolation-permissions-concurrency","type":"single","text":"Which configuration helps prevent repeated overlapping workflow runs when a PR is updated frequently?","options":[{"text":"Larger runners","correct":false,"why":"Larger runners may improve performance, but they don't prevent overlapping executions."},{"text":"Concurrency with cancel-in-progress","correct":true,"why":"Concurrency reduces workflow noise and prevents overlapping runs from creating instability."},{"text":"Removing required checks","correct":false,"why":"Removing checks weakens governance and doesn't address overlapping runs."},{"text":"Disabling PR triggers","correct":false,"why":"Disabling triggers prevents automation rather than coordinating it safely."}],"takeaway":"Concurrency reduces workflow noise and prevents overlapping runs from creating instability."},{"id":"off-m5-3","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d5","objective":"5.1.3","module":"m5","unit":"m5-conflict-resolution-github-arbitration","type":"single","text":"What is the best GitHub-native mechanism to route review for sensitive paths touched by agent pull requests?","options":[{"text":"Asking reviewers in chat","correct":false,"why":"Chat requests are informal and not enforceable repository controls."},{"text":"CODEOWNERS (with required reviews policy)","correct":true,"why":"CODEOWNERS routes review based on file paths and ensures consistent and enforceable review ownership."},{"text":"Adding more labels","correct":false,"why":"Labels help organize work but don't enforce review routing."},{"text":"Squashing commits","correct":false,"why":"Squashing affects commit history but not review ownership."}],"takeaway":"CODEOWNERS routes review based on file paths and ensures consistent and enforceable review ownership."},{"id":"off-m5-4","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d5","objective":"5.3.1","module":"m5","unit":"m5-scale-failure-recovery","type":"single","text":"Which is an example of a coordination failure rather than an individual agent failure?","options":[{"text":"A single unit test fails once","correct":false,"why":"A single test failure is typically an isolated execution issue."},{"text":"Two agent pull requests repeatedly conflict because they change the same files","correct":true,"why":"Persistent pull request conflicts indicate missing isolation or coordination rules between agents."},{"text":"A reviewer requests changes","correct":false,"why":"Requested changes are part of the normal review process."},{"text":"A workflow run finishes successfully","correct":false,"why":"A successful workflow run is not a failure condition."}],"takeaway":"Persistent pull request conflicts indicate missing isolation or coordination rules between agents."},{"id":"off-m5-5","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d5","objective":"5.3.3","module":"m5","unit":"m5-scale-failure-recovery","type":"single","text":"What is a safe pattern for high-risk actions like production deployments?","options":[{"text":"Auto-deploy after tests pass","correct":false,"why":"High-risk actions should include explicit authorization steps beyond automated testing."},{"text":"Use environments with required reviewers so jobs pause for approval","correct":true,"why":"Environment approvals separate preparation from authorization, ensuring high-risk actions require explicit review."},{"text":"Allow direct pushes to main","correct":false,"why":"Direct pushes bypass governance and increase operational risk."},{"text":"Disable workflow approvals","correct":false,"why":"Disabling approvals removes an important safety control for sensitive operations."}],"takeaway":"Environment approvals separate preparation from authorization, ensuring high-risk actions require explicit review."},{"id":"off-m4-1","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d3","objective":"3.1.1","module":"m4","unit":"m4-agent-memory-strategies","type":"single","text":"Which type of memory is considered the most reliable source of truth in agent workflows?","options":[{"text":"Short-term memory stored in prompts.","correct":false,"why":"Short-term memory is temporary and not reliable across sessions."},{"text":"Long-term memory stored in cached responses.","correct":false,"why":"Cached responses aren't authoritative sources of truth."},{"text":"External memory stored in GitHub artifacts such as issues and pull requests.","correct":true,"why":". External memory is durable and serves as the source of truth."},{"text":"Logs that are automatically deleted after execution.","correct":false,"why":"Logs are temporary and not intended as the primary source of truth."}],"takeaway":". External memory is durable and serves as the source of truth."},{"id":"off-m4-2","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d3","objective":"3.2.1","module":"m4","unit":"m4-agent-state-context-drift","type":"single","text":"What is the primary role of a pull request in agent workflows?","options":[{"text":"To automatically deploy changes to production.","correct":false,"why":"Deployment is handled separately."},{"text":"To act as a central place to track progress, decisions, and validation results.","correct":true,"why":". Pull requests serve as a state anchor for agent workflows."},{"text":"To store workflow logs permanently.","correct":false,"why":"Logs are stored in workflow runs, not PRs."},{"text":"To replace issues as the source of requirements.","correct":false,"why":"Issues typically define requirements."}],"takeaway":". Pull requests serve as a state anchor for agent workflows."},{"id":"off-m4-3","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d3","objective":"3.2.3","module":"m4","unit":"m4-agent-state-context-drift","type":"single","text":"What is context drift in agent workflows?","options":[{"text":"When workflows exceed their execution time.","correct":false,"why":"Execution time is unrelated to drift."},{"text":"When the agent’s actions no longer align with the original goal or prior decisions.","correct":true,"why":". Context drift occurs when alignment is lost."},{"text":"When logs are deleted after retention expires.","correct":false,"why":"This is artifact expiration."},{"text":"When a branch is merged into the default branch.","correct":false,"why":"Merging doesn't indicate drift."}],"takeaway":". Context drift occurs when alignment is lost."},{"id":"off-m4-4","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d4","objective":"4.1.1","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"single","text":"Which GitHub feature ensures validation must pass before merging changes?","options":[{"text":"Workflow logs.","correct":false,"why":"Logs provide information but don't enforce rules."},{"text":"Required status checks.","correct":true,"why":". Required checks must pass before merging."},{"text":"Issue comments.","correct":false,"why":"Comments don't enforce validation."},{"text":"Commit messages.","correct":false,"why":"Messages don't control merging."}],"takeaway":". Required checks must pass before merging."},{"id":"off-m4-5","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d4","objective":"4.2.1","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"Which GitHub artifacts are most useful for analyzing agent failures?","options":[{"text":"Workflow logs, workflow runs, and pull requests.","correct":true,"why":". These provide execution and decision history."},{"text":"Repository stars and watchers.","correct":false,"why":"These are unrelated to execution."},{"text":"Branch names only.","correct":false,"why":"Names don't provide failure details."},{"text":"Issue labels.","correct":false,"why":"Labels don't show execution behavior."}],"takeaway":". These provide execution and decision history."},{"id":"off-m4-6","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d4","objective":"4.3.1","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"How can agent behavior be improved after identifying a failure?","options":[{"text":"By rerunning the workflow without changes.","correct":false,"why":"This doesn't address the root cause."},{"text":"By adjusting prompts, memory structure, or workflow configuration.","correct":true,"why":". Improvements should target the root cause."},{"text":"By deleting the pull request.","correct":false,"why":"This removes useful context."},{"text":"By ignoring the failure.","correct":false,"why":"Failures should be analyzed and fixed."}],"takeaway":". Improvements should target the root cause."},{"id":"off-m6-1","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d6","objective":"6.2.3","module":"m6","unit":"m6-define-risk-based-autonomy","type":"single","text":"What is the best way to allow a terminal agent to perform a low-risk, read-only task like summarizing recent commits without granting broad capabilities?","options":[{"text":"Allow all tools so the agent never prompts for approval","correct":false,"why":"This option does not match what the module teaches."},{"text":"Scope tool access to only what is required for read-only Git inspection","correct":true,"why":"Tool-scoped autonomy limits the agent to only the minimum read-only capability needed, reducing blast radius and preventing accidental high-risk actions."},{"text":"Grant write access by default and rely on audits afterward","correct":false,"why":"This option does not match what the module teaches."},{"text":"Deny all shell access and require manual copy/paste of commit history","correct":false,"why":"This option does not match what the module teaches."}],"takeaway":"Tool-scoped autonomy limits the agent to only the minimum read-only capability needed, reducing blast radius and preventing accidental high-risk actions."},{"id":"off-m6-2","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d6","objective":"6.2.4","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"Which GitHub-native control is most effective for requiring explicit approval before production workflows access production secrets?","options":[{"text":"A PR template that asks for review","correct":false,"why":"This option does not match what the module teaches."},{"text":"A repository README policy statement","correct":false,"why":"This option does not match what the module teaches."},{"text":"A protected environment with required reviewers","correct":true,"why":"Protected environments enforce approvals and can scope secrets so they are only released after authorization."},{"text":"A label applied by the agent","correct":false,"why":"This option does not match what the module teaches."}],"takeaway":"Protected environments enforce approvals and can scope secrets so they are only released after authorization."},{"id":"off-m6-3","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d6","objective":"6.2.3","module":"m6","unit":"m6-control-agent-capabilities","type":"single","text":"What is the recommended least-privilege pattern for GITHUB_TOKEN permissions in agent-driven workflows?","options":[{"text":"Set write permissions globally so any job can push if needed","correct":false,"why":"This option does not match what the module teaches."},{"text":"Default to read-only and elevate permissions only for the job that performs write operations","correct":true,"why":"Read-only defaults prevent unintended writes across the workflow, and job-level elevation limits high-risk capability to the smallest necessary scope."},{"text":"Disable permissions entirely and store a PAT in the repository","correct":false,"why":"This option does not match what the module teaches."},{"text":"Grant all permissions during business hours only","correct":false,"why":"This option does not match what the module teaches."}],"takeaway":"Read-only defaults prevent unintended writes across the workflow, and job-level elevation limits high-risk capability to the smallest necessary scope."},{"id":"off-m6-4","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d6","objective":"6.2.4","module":"m6","unit":"m6-design-human-workflows","type":"single","text":"Which configuration helps prevent overlapping production deployments and cancels in-progress deployments when a newer run starts?","options":[{"text":"Using larger runners","correct":false,"why":"This option does not match what the module teaches."},{"text":"Adding more approvals","correct":false,"why":"This option does not match what the module teaches."},{"text":"Concurrency with a shared group and cancel-in-progress","correct":true,"why":"Concurrency serializes deployments by group, and cancel-in-progress prevents overlapping deployments that can create inconsistent production state."},{"text":"Disabling workflow_dispatch","correct":false,"why":"This option does not match what the module teaches."}],"takeaway":"Concurrency serializes deployments by group, and cancel-in-progress prevents overlapping deployments that can create inconsistent production state."},{"id":"off-m6-5","source":"official","sourceLabel":"Microsoft Learn knowledge check","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"What is the best GitHub-native mechanism to route required review for sensitive paths like .github/workflows/ and infra/?","options":[{"text":"Asking reviewers in chat","correct":false,"why":"This option does not match what the module teaches."},{"text":"CODEOWNERS (with required reviews policy)","correct":true,"why":"CODEOWNERS routes review based on file paths and, when required, ensures sensitive changes cannot merge without the correct approvals."},{"text":"Adding labels and milestones","correct":false,"why":"This option does not match what the module teaches."},{"text":"Squashing commits before merge","correct":false,"why":"This option does not match what the module teaches."}],"takeaway":"CODEOWNERS routes review based on file paths and, when required, ensures sensitive changes cannot merge without the correct approvals."}],"flashcards":[{"id":"fc-1","domain":"d1","section":"1.1 Integrate agents into the SDLC","front":"What is the conceptual lifecycle every agent task should follow?","back":"plan → act → evaluate. The plan is inspectable, the act is bounded by tools/permissions, and the evaluate step gates the merge."},{"id":"fc-2","domain":"d1","section":"1.1 Integrate agents into the SDLC","front":"Name three common agent anti-patterns to mitigate.","back":"(1) Acting before producing a structured plan; (2) granting blanket repo-wide write access instead of branch-scoped; (3) running without producing inspectable artifacts (PRs, run logs, traces)."},{"id":"fc-3","domain":"d1","section":"1.1 Integrate agents into the SDLC","front":"What three things must be defined for *every* agent task?","back":"Inputs (what the agent receives), outputs (what artifacts it must produce — usually a PR), and success criteria (the checks that must pass for the work to be accepted)."},{"id":"fc-4","domain":"d1","section":"1.2 Boundaries: planning vs. reasoning vs. action","front":"Why configure planning as a distinct phase from execution?","back":"A separately produced plan is *inspectable*: a human or another agent can review and approve it before any irreversible action runs. This is the basis of human-in-the-loop without bottlenecking."},{"id":"fc-5","domain":"d1","section":"1.2 Boundaries: planning vs. reasoning vs. action","front":"What does a \"structured plan\" output from an agent look like in practice?","back":"Machine-parseable artifact (markdown checklist, JSON, or a PR description) listing intended steps, files to touch, tools to invoke, and rollback steps — committed as a draft PR, issue comment, or workflow artifact *before* execution begins."},{"id":"fc-6","domain":"d1","section":"1.2 Boundaries: planning vs. reasoning vs. action","front":"How do you prevent an agent from acting until its plan is approved?","back":"Gate execution on an external signal — a required reviewer's approval, a \"planner\" job that uploads the plan as an artifact, then a manually-triggered workflow_dispatch or environment approval to start the \"act\" job."},{"id":"fc-7","domain":"d1","section":"1.3 Observability and control","front":"What are the standard \"inspectable artifacts\" an agent should produce in GitHub?","back":"Pull requests, run logs, workflow artifacts (uploaded via actions/upload-artifact), check-run outputs, issue comments, and security alerts (code scanning, secret scanning, Dependabot)."},{"id":"fc-8","domain":"d1","section":"1.3 Observability and control","front":"How do you raise an agent's autonomy level without losing safety?","back":"Restrict the *blast radius* (branch scope, allow-listed tools, least-privilege token) rather than restricting the agent's actions case-by-case. Then required checks and CODEOWNERS act as the safety net."},{"id":"fc-9","domain":"d1","section":"1.3 Observability and control","front":"How do you add human intervention *without* slowing delivery?","back":"Require approval only for irreversible or compliance-sensitive actions (production deploys, external API calls, dependency bumps). Use environment protection rules to scope approvals; let routine PRs flow."},{"id":"fc-10","domain":"d2","section":"2.1 Select and configure agent tools","front":"Where do you declare what tools a Copilot custom agent can use?","back":"In the agent's manifest / configuration — tools are listed explicitly, with permissions (read/write/execute) per tool. The agent cannot invoke tools not on its list."},{"id":"fc-11","domain":"d2","section":"2.1 Select and configure agent tools","front":"What's the principle behind agent tool permissions?","back":"Least privilege per tool, scoped per task. Each tool gets the narrowest permission needed; the agent's overall token gets the union, not the maximum."},{"id":"fc-12","domain":"d2","section":"2.2 Configure MCP servers","front":"What does an MCP (Model Context Protocol) server do for an agent?","back":"Exposes external tools, APIs, or data sources to the agent through a standardized protocol, so the agent can invoke them without bespoke integration code per tool."},{"id":"fc-13","domain":"d2","section":"2.2 Configure MCP servers","front":"How do you add an MCP server as a tool to a Copilot agent?","back":"Register the server in the agent's MCP configuration (local config file or organization-level setting), declare which of the server's tools the agent may use, and ensure the server appears in the org/enterprise MCP registry."},{"id":"fc-14","domain":"d2","section":"2.2 Configure MCP servers","front":"What is the GitHub remote MCP server for?","back":"A hosted MCP server that exposes GitHub's own APIs (issues, PRs, code search, etc.) as MCP tools — letting Copilot custom agents act on the GitHub platform itself without per-action API plumbing."},{"id":"fc-15","domain":"d2","section":"2.2 Configure MCP servers","front":"What does an MCP allow list do?","back":"Restricts which MCP servers an agent (or organization's agents) may connect to. Any server not on the allow list is blocked — the primary defense against supply-chain attacks via untrusted MCP servers."},{"id":"fc-16","domain":"d2","section":"2.2 Configure MCP servers","front":"Where do MCP registries fit in?","back":"They're the curated catalog of approved MCP servers for the org/enterprise. Agents discover available servers through the registry; admins control the registry to enforce the allow list centrally."},{"id":"fc-17","domain":"d2","section":"2.3 Integrate agents within development environments","front":"How do you scope a Copilot custom agent to a single repository?","back":"Define the agent in that repo's .github/ directory (custom instructions / agent config) so it isn't visible at org scope, and/or limit the token used by the agent's workflow to that single repo."},{"id":"fc-18","domain":"d2","section":"2.3 Integrate agents within development environments","front":"How do you invoke an agent inside a CI workflow?","back":"Trigger a GitHub Actions workflow on the relevant event (pull_request, issue_comment, workflow_dispatch); a step in that workflow runs the agent (e.g., via Copilot setup steps or a custom action), with the workflow's GITHUB_TOKEN providing scoped access."},{"id":"fc-19","domain":"d2","section":"2.3 Integrate agents within development environments","front":"What does \"branch-based scope\" mean for an agent?","back":"The agent can only read/write a specific branch (often a feature branch it creates), enforced by token permissions and branch protection rules on protected branches."},{"id":"fc-20","domain":"d2","section":"2.3 Integrate agents within development environments","front":"What lets an agent autonomously create branches and PRs?","back":"A token with contents: write and pull-requests: write permissions (either a fine-grained PAT, a GitHub App installation token, or a properly scoped GITHUB_TOKEN), plus workflow code that invokes the REST/GraphQL endpoints or gh pr create."},{"id":"fc-21","domain":"d2","section":"2.3 Integrate agents within development environments","front":"How does an agent handle environment-specific constraints (network egress, secrets)?","back":"Copilot cloud agent firewall controls outbound network access; environment secrets and protection rules gate access to credentials per environment (dev/staging/prod); the agent must operate within those constraints rather than around them."},{"id":"fc-22","domain":"d2","section":"2.4 Safe execution paths and error handling","front":"Where does error handling live in an agent workflow?","back":"At every boundary: tool-call failure handlers in the agent loop, continue-on-error / step-level if: failure() in the GitHub Actions wrapping job, and a finalizer step that always uploads logs and posts a comment."},{"id":"fc-23","domain":"d2","section":"2.4 Safe execution paths and error handling","front":"How are retries implemented safely?","back":"Bounded retry count, exponential backoff, idempotency keys on the underlying operation, and *retry only on transient errors* (network, rate limit) — not on logic errors that would compound damage."},{"id":"fc-24","domain":"d2","section":"2.4 Safe execution paths and error handling","front":"How are rollbacks implemented for agent-authored changes?","back":"PR-based changes give natural rollback (revert the merge). For runtime changes, use environment promotion patterns: roll back by re-deploying the previous artifact. Agents shouldn't perform direct prod mutations without a versioned, reversible artifact."},{"id":"fc-25","domain":"d2","section":"2.4 Safe execution paths and error handling","front":"What is an \"escalation path\" for an agent?","back":"A predefined route to human attention when the agent's confidence is low or it hits an unsafe condition — typically by tagging a CODEOWNER, opening an issue with a needs-human label, or pausing in an environment that requires approval."},{"id":"fc-26","domain":"d2","section":"2.4 Safe execution paths and error handling","front":"How do you ensure traceability for agent actions?","back":"Every agent action runs inside a workflow run with full logs, every artifact (plans, diffs, evaluations) is uploaded as a workflow artifact or PR comment, and every commit is signed/attributed to the agent's identity (bot account or GitHub App)."},{"id":"fc-27","domain":"d3","section":"3.1 Memory strategies","front":"When do you use short-term vs. long-term vs. external memory?","back":"Short-term for context within a single task/run (prompt window). Long-term for stable facts about the project/team (custom instructions, AGENTS.md, repo-level config). External for task-spanning artifacts (issue history, PR comments, knowledge bases accessed via MCP)."},{"id":"fc-28","domain":"d3","section":"3.1 Memory strategies","front":"What does \"scope agent memory to task-relevant information\" mean?","back":"Only inject memory items that the *current task* needs. Avoid loading the entire project context — it dilutes signal, increases cost, and leaks information across task boundaries."},{"id":"fc-29","domain":"d3","section":"3.1 Memory strategies","front":"How do you define memory expiration, pruning, and reset rules?","back":"Expire ephemeral memory at task end; prune long-term memory items that aren't referenced for N runs; reset memory on context change (new branch, new issue) — implemented via the agent's config and/or a memory store TTL."},{"id":"fc-30","domain":"d3","section":"3.2 State persistence and drift","front":"What is a \"durable artifact\" for agent task progress?","back":"A persisted, inspectable record — PR description checkboxes, an issue with progress comments, a workflow artifact JSON, or a state file in a tracking branch — that survives a run termination."},{"id":"fc-31","domain":"d3","section":"3.2 State persistence and drift","front":"How does an agent resume work without repeating steps?","back":"Read its durable state artifact at the start of every run, skip already-completed steps, and continue from the last incomplete step. Idempotent tools make this safe."},{"id":"fc-32","domain":"d3","section":"3.2 State persistence and drift","front":"What is \"context drift\" during extended execution?","back":"Gradual divergence between the agent's working assumptions and the actual repo/task state — e.g., the agent edits an outdated copy of a file because it's still working from cached context. Detected by re-reading source state at checkpoints and comparing to in-memory state."},{"id":"fc-33","domain":"d3","section":"3.3 Continuity across tools and environments","front":"How do you share agent state across tools and runs?","back":"A canonical state artifact (issue, PR, dedicated tracking branch, or external store) that every tool reads/writes. No tool keeps private mutable state."},{"id":"fc-34","domain":"d3","section":"3.3 Continuity across tools and environments","front":"How do you prevent conflicting context?","back":"Single source of truth (one state artifact), serialized writes (no two agents updating the same state simultaneously), and explicit handoffs between agents."},{"id":"fc-35","domain":"d3","section":"3.3 Continuity across tools and environments","front":"How do you prevent stale context?","back":"Re-read the canonical state at the start of each tool invocation, and validate any cached assumption against current repo state before acting on it."},{"id":"fc-36","domain":"d4","section":"4.1 Success criteria and evaluation signals","front":"How are success criteria specified for an agent task?","back":"As pass/fail checks against expected outcomes: tests must pass, code scanning must be clean, the PR must meet template requirements, performance metrics must stay within bounds. Encoded as required status checks."},{"id":"fc-37","domain":"d4","section":"4.1 Success criteria and evaluation signals","front":"Qualitative vs. quantitative evaluation signals — examples of each.","back":"Quantitative: test pass rate, code scanning alerts count, performance delta, coverage delta. Qualitative: reviewer comments, custom-rubric LLM-judge scores, adherence to coding conventions."},{"id":"fc-38","domain":"d4","section":"4.1 Success criteria and evaluation signals","front":"How do you align evaluation with development intent?","back":"The eval signals should be the *same signals a human developer would be judged on* — tests, lint, security scans, review comments — not artificial agent-only metrics. This keeps agents accountable to the team's actual quality bar."},{"id":"fc-39","domain":"d4","section":"4.1 Success criteria and evaluation signals","front":"What automated scanning tools produce evaluation signals?","back":"GitHub code scanning (CodeQL), secret scanning, Dependabot, dependency review action, and any third-party scanners surfaced as check runs or SARIF uploads."},{"id":"fc-40","domain":"d4","section":"4.2 Failure analysis","front":"What artifacts do you inspect to diagnose an agent failure?","back":"Workflow run logs, the agent's structured plan, execution traces (tool calls in order), final outputs/diffs, and any uploaded artifacts (intermediate state, evaluations)."},{"id":"fc-41","domain":"d4","section":"4.2 Failure analysis","front":"Three root-cause categories for agent failures.","back":"(1) Reasoning errors — wrong plan, wrong inference; (2) Tool misuse — calling the right tool incorrectly or the wrong tool; (3) Context/environment issues — stale context, missing permissions, network/firewall blocks."},{"id":"fc-42","domain":"d4","section":"4.3 Tuning","front":"How do you tune an agent that produces wrong reasoning?","back":"Revise its custom instructions / system prompt, add few-shot examples in the agent config, or constrain its allowed plans via a structured planning schema."},{"id":"fc-43","domain":"d4","section":"4.3 Tuning","front":"How do you tune memory usage problems?","back":"Adjust what's loaded into context (scope memory more tightly), shorten or expire stale memory, or move stable facts from prompt-context into long-term memory."},{"id":"fc-44","domain":"d4","section":"4.3 Tuning","front":"How do you tune tool-usage problems?","back":"Remove or rename ambiguously named tools, tighten permissions, add tool descriptions/examples to the agent config, or route through an orchestrator agent that picks the tool for sub-agents."},{"id":"fc-45","domain":"d5","section":"5.1 Operate multi-agent workflows","front":"Common orchestration patterns for coordinating multiple agents.","back":"Sequential pipeline (planner → coder → reviewer), fan-out/fan-in (planner splits work to N parallel agents, then merges), supervisor pattern (one agent dispatches and reviews others), debate/critic pattern (two agents argue, third decides)."},{"id":"fc-46","domain":"d5","section":"5.1 Operate multi-agent workflows","front":"How do you isolate agents for parallel execution?","back":"Each agent works on its own branch (no shared working directory), with non-overlapping file scopes, separate workflow runs, and independent token scopes. Merge conflicts are detected at the PR layer."},{"id":"fc-47","domain":"d5","section":"5.1 Operate multi-agent workflows","front":"How do you detect overlapping code changes between agents?","back":"Branch-level conflict detection at merge time, file-scope declarations in each agent's plan compared before execution, or a coordination layer (supervisor) that allocates non-overlapping file sets."},{"id":"fc-48","domain":"d5","section":"5.1 Operate multi-agent workflows","front":"Resolving contradictory outputs from multiple agents — approaches.","back":"A judge/reconciler agent with a defined arbitration rule, a voting scheme over N agent outputs, or human-in-the-loop review when disagreement exceeds a threshold."},{"id":"fc-49","domain":"d5","section":"5.2 Multi-agent observability","front":"What artifacts make multi-agent workflows auditable?","back":"Per-agent workflow runs with logs, a top-level orchestration record (issue or workflow run) that links every sub-run, decision logs at each handoff, and a final reconciled output artifact."},{"id":"fc-50","domain":"d5","section":"5.2 Multi-agent observability","front":"How do you perform post-hoc analysis of multi-agent behavior?","back":"Replay traces from logs, compare each agent's plan vs. outcome, look for repeated handoff failures, and use the audit trail to identify which agent introduced the divergence."},{"id":"fc-51","domain":"d5","section":"5.3 Failure detection and recovery","front":"How do you identify a stalled agent execution?","back":"Workflow timeouts (timeout-minutes), heartbeat artifacts the agent updates periodically, and orchestrator checks that flag sub-agents that have produced no progress within a budget."},{"id":"fc-52","domain":"d5","section":"5.3 Failure detection and recovery","front":"Recovery patterns for multi-agent failures.","back":"Rollback the entire pipeline (revert orchestrator's branch), rerun the failed sub-agent in isolation, fall back to a simpler agent or human, and circuit-break further automation when failure rates exceed a threshold."},{"id":"fc-53","domain":"d5","section":"5.4 Lifecycle of agents in multi-agent workflows","front":"How do you safely add a new agent to an existing workflow?","back":"Deploy in shadow mode first (run alongside, compare outputs, no merge authority), gate behind a feature flag, then promote once metrics are equivalent or better."},{"id":"fc-54","domain":"d5","section":"5.4 Lifecycle of agents in multi-agent workflows","front":"How do you replace an agent without disrupting active workflows?","back":"Versioned agent configs, route a percentage of traffic to the new agent (canary), then swap once parity confirmed. In-flight runs complete on the old version."},{"id":"fc-55","domain":"d5","section":"5.4 Lifecycle of agents in multi-agent workflows","front":"How do you retire an agent while preserving auditability?","back":"Archive the agent's config in git history, retain all past workflow runs and artifacts (subject to retention policy), and document the retirement decision in a CHANGELOG or governance doc so the audit trail survives."},{"id":"fc-56","domain":"d6","section":"6.1 Autonomy levels","front":"How do you classify agent actions by risk?","back":"Triage on three axes: operational risk (does failure break things?), security risk (could it leak or compromise secrets/data?), compliance risk (does it touch regulated systems or require auditable change-control?). Highest risk → most human oversight."},{"id":"fc-57","domain":"d6","section":"6.1 Autonomy levels","front":"How do you \"right-size\" human intervention?","back":"Map each action category to an autonomy level: fully autonomous for low-risk (lint fixes, doc updates), approval-gated for medium-risk (logic changes, dependency bumps), human-authored for highest-risk (production deploys, secrets, schema migrations)."},{"id":"fc-58","domain":"d6","section":"6.2 Guardrails and human-in-the-loop","front":"What actions require explicit human authorization?","back":"Irreversible changes (data deletion, schema destructive ops), compliance-sensitive changes, anything touching production secrets, dependency additions, and CI/CD pipeline modifications."},{"id":"fc-59","domain":"d6","section":"6.2 Guardrails and human-in-the-loop","front":"How do you block actions that violate policy?","back":"Pre-action policy checks in the agent (refusal logic), org-level rulesets preventing forbidden push patterns, required workflows that enforce policy scans, and CODEOWNERS on sensitive paths requiring named approvers."},{"id":"fc-60","domain":"d6","section":"6.2 Guardrails and human-in-the-loop","front":"How do you enforce least-privilege execution context?","back":"Use the smallest-scope token possible (GITHUB_TOKEN with minimal permissions: block, fine-grained PAT scoped to one repo, or GitHub App installation token per repo), environment-scoped secrets, branch-scoped workflows."},{"id":"fc-61","domain":"d6","section":"6.2 Guardrails and human-in-the-loop","front":"What does \"controlled path for irreversible changes\" mean?","back":"Wrap the change in a workflow that requires environment approval, runs only on a specific protected branch, produces an inspectable plan before applying, and emits an immutable audit record."},{"id":"fc-62","domain":"d6","section":"6.2 Guardrails and human-in-the-loop","front":"How do you preserve velocity while still enforcing guardrails?","back":"Approvals only where they actually reduce risk. Routine, reversible PRs flow through automated checks; high-risk operations get gated. Every approval should buy meaningful safety, not perform compliance theater."},{"id":"fc-63","domain":null,"section":"Cross-cutting","front":"What does \"GitHub as the system of record\" mean for an agent?","back":"All agent activity is anchored in a GitHub primitive — commit, PR, issue, workflow run, artifact, or check — so there's no off-platform state to lose, dispute, or hide. Everything is auditable, attributable, and replayable."},{"id":"fc-64","domain":null,"section":"Cross-cutting","front":"What does \"GitHub as the control plane\" mean?","back":"The same GitHub primitives that record activity (branch protection, CODEOWNERS, required checks, environments) also *enforce* policy. Control and observation use the same surface."},{"id":"fc-65","domain":null,"section":"Cross-cutting","front":"Where do custom instructions live for an agent?","back":"Repository-level: .github/copilot-instructions.md (or AGENTS.md per repo). Org-level: organization custom instructions. The agent reads these in addition to its task-specific prompt."},{"id":"fc-66","domain":null,"section":"Cross-cutting","front":"What's the \"contributor model\" for agent-generated work?","back":"Agents are treated as contributors: they open PRs, get reviewed by humans/CODEOWNERS, follow the same branch protection rules, and their work is judged by the same standards. They don't get a bypass lane."},{"id":"fc-67","domain":null,"section":"Cross-cutting","front":"Copilot setup steps — what are they?","back":"Per-repository configuration steps that prepare the Copilot agent's environment for that codebase (install dependencies, set up tools, configure language servers) so it has the context to be effective on first invocation."},{"id":"nlm-1","domain":null,"section":"Rapid recall","front":"In the context of GitHub agents, how does an 'agent' differ from an 'assistant'?","back":"An agent is goal-driven and uses tools to take repository actions, whereas an assistant is reactive and suggestion-only."},{"id":"nlm-2","domain":null,"section":"Rapid recall","front":"What are the three stages of the foundational agentic AI lifecycle loop?","back":"Plan, Act, and Evaluate."},{"id":"nlm-3","domain":null,"section":"Rapid recall","front":"Why is GitHub defined as the 'system of record' for agent workflows?","back":"It stores all artifacts, including plans, commits, PR discussions, and workflow evidence, for inspectability."},{"id":"nlm-4","domain":null,"section":"Rapid recall","front":"What does it mean for GitHub to function as the 'control plane' for AI agents?","back":"It provides enforcement points such as rulesets, required checks, and environments to govern agent behavior."},{"id":"nlm-5","domain":null,"section":"Rapid recall","front":"Which SDLC stage is mapped to 'Workflow runs, checks, and artifacts' in GitHub?","back":"Validation."},{"id":"nlm-6","domain":null,"section":"Rapid recall","front":"According to the task contract model, what are the three essential components of a structured agent task?","back":"Inputs, Outputs, and Success criteria."},{"id":"nlm-7","domain":null,"section":"Rapid recall","front":"What is the primary architectural benefit of a 'Plan-first' pull request workflow?","back":"It allows human validation of intent before any code is generated, reducing early risk exposure."},{"id":"nlm-8","domain":null,"section":"Rapid recall","front":"True or False: In a 'Plan + execution' workflow, human validation is still required before the work is merged.","back":"True."},{"id":"nlm-9","domain":null,"section":"Rapid recall","front":"What is the specific GitHub mechanism used to route reviews automatically based on changed file paths?","back":"CODEOWNERS."},{"id":"nlm-10","domain":null,"section":"Rapid recall","front":"Concept: Model Context Protocol (MCP)","back":"Definition: A standard protocol allowing AI clients to discover and use external tools and services through MCP servers."},{"id":"nlm-11","domain":null,"section":"Rapid recall","front":"How does an 'MCP allow list' differ from an 'MCP registry' in agent governance?","back":"The registry provides discovery of available servers, while the allow list enforces which specific servers are permitted for use."},{"id":"nlm-12","domain":null,"section":"Rapid recall","front":"What is the only required field in a custom agent's YAML frontmatter profile?","back":"description."},{"id":"nlm-13","domain":null,"section":"Rapid recall","front":"Where must an agent profile be stored to be considered a repository-level custom agent?","back":"The .github/agents/ directory."},{"id":"nlm-14","domain":null,"section":"Rapid recall","front":"What is the mandatory name for the repository used to store organization-level custom agents?","back":".github-private."},{"id":"nlm-15","domain":null,"section":"Rapid recall","front":"In a custom agent profile, what does setting 'tools: []' accomplish?","back":"It disables all tools for that specific agent."},{"id":"nlm-16","domain":null,"section":"Rapid recall","front":"Which YAML property in custom agent configuration recently replaced the retired 'infer' field?","back":"disable-model-invocation."},{"id":"nlm-17","domain":null,"section":"Rapid recall","front":"What is the default permission level of the out-of-the-box 'github' MCP server?","back":"Read-only."},{"id":"nlm-18","domain":null,"section":"Rapid recall","front":"To what network range is the out-of-the-box 'playwright' MCP server restricted?","back":"localhost only."},{"id":"nlm-19","domain":null,"section":"Rapid recall","front":"The GitHub Copilot cloud agent firewall only applies to processes started via which specific tool?","back":"The Bash tool."},{"id":"nlm-20","domain":null,"section":"Rapid recall","front":"In agent firewall rules, how does a 'Domain' rule differ from a 'URL' rule?","back":"A domain rule allows the domain and all subdomains, while a URL rule is limited to a specific scheme, host, and path-prefix."},{"id":"nlm-21","domain":null,"section":"Rapid recall","front":"How long do Copilot Memory entries persist if they remain unused?","back":"28 days."},{"id":"nlm-22","domain":null,"section":"Rapid recall","front":"Who is permitted to create repository-level facts in Copilot Memory?","back":"Users with write access to the repository who have Copilot Memory enabled."},{"id":"nlm-23","domain":null,"section":"Rapid recall","front":"The gradual divergence between an agent's working assumptions and the actual repository state is known as _____.","back":"Context drift."},{"id":"nlm-24","domain":null,"section":"Rapid recall","front":"What is the recommended method for an agent to resume work across different workflow runs without repeating steps?","back":"Persisting progress in a durable artifact, such as a PR checklist or state file."},{"id":"nlm-25","domain":null,"section":"Rapid recall","front":"In agent failure analysis, what are the three primary root-cause categories?","back":"Reasoning errors, Tool misuse, and Context/Environment issues."},{"id":"nlm-26","domain":null,"section":"Rapid recall","front":"How should an architect tune an agent that consistently uses the correct tool but provides the wrong arguments?","back":"By revising the tool's description and adding usage examples in the agent configuration."},{"id":"nlm-27","domain":null,"section":"Rapid recall","front":"According to the contributor model, what is the 'natural unit of contribution' for evaluating agent work?","back":"The pull request."},{"id":"nlm-28","domain":null,"section":"Rapid recall","front":"What criteria does the sub-agent runtime use to match user intent to a specific specialized agent?","back":"The agent's name and description."},{"id":"nlm-29","domain":null,"section":"Rapid recall","front":"Concept: Supervisor Pattern","back":"Definition: An orchestration pattern where one agent dispatches sub-tasks to worker agents and reviews their outputs."},{"id":"nlm-30","domain":null,"section":"Rapid recall","front":"Which sub-agent lifecycle event is emitted when the runtime first picks an agent for a task?","back":"subagent.selected."},{"id":"nlm-31","domain":null,"section":"Rapid recall","front":"What is the purpose of the 'toolCallId' in multi-agent orchestration events?","back":"It acts as a join key to track a specific sub-agent's lifecycle from start to completion or failure."},{"id":"nlm-32","domain":null,"section":"Rapid recall","front":"Which autonomy design is recommended for 'Critical' risk tasks like production deployments?","back":"The agent prepares the changes, but execution is blocked until human approval in an Environment."},{"id":"nlm-33","domain":null,"section":"Rapid recall","front":"What is the purpose of a 'pre-action hook' in agent operations?","back":"To validate or block unsafe actions before they are executed by a tool."},{"id":"nlm-34","domain":null,"section":"Rapid recall","front":"How does GitHub prevent 'untrusted' changes from running privileged workflows automatically in an agent PR?","back":"By requiring a user with write access to click the 'Approve and run workflows' button."},{"id":"nlm-35","domain":null,"section":"Rapid recall","front":"True or False: The user who triggers a Copilot cloud agent to create a PR is allowed to approve that same PR.","back":"False."},{"id":"nlm-36","domain":null,"section":"Rapid recall","front":"How does a GitHub Agentic Workflow differ from a traditional GitHub Actions workflow?","back":"Agentic workflows describe outcomes in Markdown for an agent to interpret, rather than explicitly defining steps in YAML."},{"id":"nlm-37","domain":null,"section":"Rapid recall","front":"What is the maximum character limit for the prompt body in a custom agent profile?","back":"30,000 characters."},{"id":"nlm-38","domain":null,"section":"Rapid recall","front":"Which custom agent property is used to restrict an agent to either 'vscode' or 'github-copilot'?","back":"target."},{"id":"nlm-39","domain":null,"section":"Rapid recall","front":"Who remains accountable for the outcomes and controls of an autonomous agent system?","back":"The humans who defined the task, set permissions, and approved the changes."},{"id":"nlm-40","domain":null,"section":"Rapid recall","front":"What mechanism ensures that custom agent interactions within a PR remain consistent even if the agent profile is updated?","back":"The session is pinned to the Git commit SHA of the agent profile at the time of assignment."},{"id":"nlm-41","domain":null,"section":"Rapid recall","front":"Which tool alias is used in agent profiles to grant permission for executing shell commands?","back":"execute."},{"id":"nlm-42","domain":null,"section":"Rapid recall","front":"What is the override hierarchy for custom agent profiles with the same name?","back":"The lowest level wins (Repository > Organization > Enterprise)."},{"id":"nlm-43","domain":null,"section":"Rapid recall","front":"How does Copilot ensure its stored 'memories' haven't become stale?","back":"It re-validates the memory's citation against the current branch's code before use."},{"id":"nlm-44","domain":null,"section":"Rapid recall","front":"What is the primary method for preventing parallel agents from creating conflicting code changes?","back":"Assigning non-overlapping file scopes to each agent in their respective plans."},{"id":"nlm-45","domain":null,"section":"Rapid recall","front":"A pattern where two agents critique each other's work and a third agent makes a final decision is called _____.","back":"The debate or critic pattern."},{"id":"nlm-46","domain":null,"section":"Rapid recall","front":"What is the standard escalation path if an agent fails the same required check multiple times?","back":"Handing off to a human reviewer with a summary of attempts, evidence, and suggested next steps."},{"id":"nlm-47","domain":null,"section":"Rapid recall","front":"What is the purpose of the 'copilot-setup-steps.yml' file?","back":"To define the environment setup steps required for the agent to function effectively in a specific repository."},{"id":"nlm-48","domain":null,"section":"Rapid recall","front":"Can a Copilot cloud agent access standard GitHub Actions secrets?","back":"No, it can only access specifically configured 'Agents secrets'."},{"id":"nlm-49","domain":null,"section":"Rapid recall","front":"How does GitHub mitigate prompt injection risks from hidden characters in issues or comments?","back":"It filters out hidden characters and HTML comments before passing input to the agent."},{"id":"nlm-50","domain":null,"section":"Rapid recall","front":"Which 'Traceability Primitive' allows developers to view the internal monologue of an agent for a specific change?","back":"The session-log link included in every agent-authored commit message."},{"id":"nlm-51","domain":null,"section":"Rapid recall","front":"Which GitHub CLI command is used to follow live agent task logs?","back":"gh agent-task view --log --follow."},{"id":"nlm-52","domain":null,"section":"Rapid recall","front":"What is the default state of 'Agentic Workflows' relative to traditional CI/CD pipelines?","back":"They augment and extend traditional pipelines with 'Continuous AI' rather than replacing them."},{"id":"nlm-53","domain":null,"section":"Rapid recall","front":"What happens if an MCP server is listed in a registry but is not on the organization's allow list?","back":"The server is blocked and the tool call will fail."},{"id":"nlm-54","domain":null,"section":"Rapid recall","front":"In the YAML frontmatter of an Agentic Workflow, what does 'safe outputs' refer to?","back":"A mechanism where the agent proposes actions that are only applied after passing a gated validation step."},{"id":"nlm-55","domain":null,"section":"Rapid recall","front":"If an agent produces a diff but provides no plan or rationale, it is exhibiting the anti-pattern of _____.","back":"Planless execution."},{"id":"nlm-56","domain":null,"section":"Rapid recall","front":"What is the syntax for referencing an 'Agents secret' within a custom agent profile?","back":"${{ secrets.VAR_NAME }}."},{"id":"nlm-57","domain":null,"section":"Rapid recall","front":"Which GitHub primitive provides a 'Verified' status to agent-authored commits?","back":"Digital signatures (Signed commits)."},{"id":"nlm-58","domain":null,"section":"Rapid recall","front":"What is the primary purpose of 'retries' in a reliable agent workflow?","back":"To handle transient failures like network issues or rate limits."},{"id":"nlm-59","domain":null,"section":"Rapid recall","front":"Which YAML property identifies an agent that should not be visible in the user interface?","back":"user-invocable: false."},{"id":"nlm-60","domain":null,"section":"Rapid recall","front":"The 'Any-yes-routes-up' principle for guardrails dictates that if any risk dimension trips, the system must _____.","back":"Escalate to the next tier of human oversight."},{"id":"nlm-61","domain":null,"section":"Rapid recall","front":"What is the URL for the centralized Agents tab on GitHub.com?","back":"github.com/copilot/agents."},{"id":"nlm-62","domain":null,"section":"Rapid recall","front":"True or False: Environment variables in GitHub should be used as a replacement for structured job outputs.","back":"False."},{"id":"nlm-63","domain":null,"section":"Rapid recall","front":"Which context is used to determine 'what triggered this run' in a GitHub workflow?","back":"github.*."},{"id":"nlm-64","domain":null,"section":"Rapid recall","front":"Why should agent tool allowlists be treated as 'governance-sensitive' changes?","back":"Expanding tools increases the agent's potential blast radius and security risk."},{"id":"nlm-65","domain":null,"section":"Rapid recall","front":"In an agentic workflow, what is the role of the 'lock file'?","back":"It contains the compiled execution instructions derived from the Markdown intent and frontmatter."},{"id":"nlm-66","domain":null,"section":"Rapid recall","front":"What happens when the 'Registry only' policy is enabled for MCP access?","back":"Developers are restricted to using only MCP servers defined in the configured organization/enterprise registry."},{"id":"nlm-67","domain":null,"section":"Rapid recall","front":"Which artifact type makes agent evidence 'durable' even after workflow logs are rotated?","back":"Uploaded workflow artifacts (e.g., test reports, logs)."},{"id":"nlm-68","domain":null,"section":"Rapid recall","front":"How are 'user-level preferences' in Copilot Memory isolated?","back":"They are only available to the specific user who created them across different repositories."},{"id":"nlm-69","domain":null,"section":"Rapid recall","front":"What is the 'Capability boundary' of a planning agent?","back":"It should be limited to read-only tools to prevent accidental modifications during the planning phase."},{"id":"nlm-70","domain":null,"section":"Rapid recall","front":"What is the 'Delegation boundary' in multi-agent systems?","back":"The policy defining which sub-agents can be invoked and how handoffs are managed."}],"reference":[{"id":"ref-study-guide","title":"Condensed study guide","summary":"A single-sitting distillation of the whole syllabus, ending with short-answer practice and a glossary.","source":"Community study guide (jtur671/gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/media/study-guide.md","markdown":"This study guide provides a comprehensive synthesis of the GH-600 \"GitHub Certified: Agentic AI Developer\" certification requirements. It covers agent architecture, Model Context Protocol (MCP), GitHub governance, and safe execution patterns within the software development lifecycle (SDLC).\n\n---\n\n## Part 1: Core Concepts of Agentic AI\n\n### Defining Agents vs. Assistants\nThe shift from AI assistants to AI agents marks a transition from reactive suggestion-based tools to goal-driven systems capable of autonomous execution.\n\n| Feature | AI Assistant | AI Agent |\n| :--- | :--- | :--- |\n| **Primary Behavior** | Reactive: responds to prompts with suggestions or explanations. | Goal-driven: interprets high-level goals and decides on intermediate steps. |\n| **Action Capability** | Suggestion-only: requires the user to manually apply changes. | Tool-use: creates durable artifacts (branches, commits, pull requests). |\n| **Control** | User maintains constant control over next steps. | Agent independently moves work forward inside a repository. |\n| **Feedback Loop** | Linear interaction. | Iterative: refines approach based on CI signals, security scans, and reviews. |\n\n### The Agent Lifecycle: Plan → Act → Evaluate\nReliable agent systems follow a continuous loop rather than a linear sequence:\n\n1.  **Plan:** The agent interprets a goal and creates a structured, reviewable description of intended changes. High-quality plans include scope, success criteria, and escalation paths.\n2.  **Act:** The agent executes the plan by performing repository actions, such as creating branches, modifying files, and opening pull requests.\n3.  **Evaluate:** The system (and humans) uses objective signals—workflow results, security alerts, and human reviews—to judge the outcome. If the evaluation fails, the cycle repeats (Plan again → Act again).\n\n---\n\n## Part 2: GitHub as the System of Record and Control Plane\n\nGitHub provides the infrastructure to both record what an agent does and enforce policy on those actions.\n\n### Mapping Agent Responsibilities to the SDLC\nMapping agent work to specific SDLC stages allows for enforceable boundaries and improved auditability.\n\n| SDLC Stage | Typical Agent Responsibility | Primary GitHub Artifact |\n| :--- | :--- | :--- |\n| **Planning** | Drafting scope, step-by-step plans, and success criteria. | Issues, PR descriptions, Agents tab. |\n| **Implementation** | Creating branches, making file changes, and opening PRs. | Branches, Commits, Pull Requests. |\n| **Validation** | Running tests, attaching artifacts, and iterating on failures. | Workflow runs, status checks, uploaded artifacts. |\n| **Deployment** | (Usually restricted) Preparing environments for human approval. | Environments, Deployment approvals. |\n\n### Governance Primitives\n*   **Pull Requests (PRs):** The central architectural control point. Work is proposed and discussed here before merging.\n*   **CODEOWNERS:** Automatically routes reviews to specific experts for sensitive file paths (e.g., infrastructure or workflows).\n*   **Required Status Checks:** Converts \"evaluation\" into enforceable policy; the PR cannot be merged unless CI passes.\n*   **Rulesets/Branch Protection:** Prevents direct pushes to default branches and enforces consistent guardrails.\n*   **Environments:** Gated control points that pause execution for secrets access or production deployments until a human approves.\n\n---\n\n## Part 3: Custom Agents and Tooling\n\n### Custom Agent Configuration\nCustom agents are defined via **agent profiles**—Markdown files with YAML frontmatter.\n\n*   **Location:** \n    *   **Repository-level:** `.github/agents/NAME.agent.md`\n    *   **Organization-level:** `/agents/NAME.md` within a `.github-private` repository.\n*   **Key YAML Properties:**\n    *   `description` (Required): Explains the agent's purpose.\n    *   `tools`: A list of allowed tools (e.g., `read`, `edit`, `search`). If omitted, all tools are enabled.\n    *   `disable-model-invocation`: Set to `true` to block the runtime from auto-selecting the agent.\n    *   `user-invocable`: Set to `false` for programmatic-only agents.\n*   **Prompt Body:** Markdown instructions below the YAML frontmatter, limited to **30,000 characters**.\n\n### Model Context Protocol (MCP)\nMCP is a standardized protocol allowing agents to connect to external tools and services.\n\n1.  **MCP Servers:** Expose specific tools (e.g., the GitHub MCP server exposes repository APIs).\n2.  **MCP Registries:** Centralized catalogs of approved servers for an organization.\n3.  **MCP Allow Lists:** Security policies that restrict which servers an agent is permitted to connect to.\n\n---\n\n## Part 4: Managing State, Memory, and Orchestration\n\n### Memory Strategies\nCopilot Memory allows the agent to build understanding over time, reducing prompt overhead.\n\n*   **Repository-level Facts:** Project-specific rules, conventions, and architectural decisions. Created by users with write access and stored with code citations.\n*   **User-level Preferences:** Personal interaction styles (available on Pro/Pro+ plans).\n*   **28-Day Expiry:** Stored facts or preferences are automatically deleted if unused for 28 days; the timer resets upon successful use.\n*   **Validation:** Copilot re-validates citations against current code before using a stored memory to prevent acting on stale data.\n\n### Multi-Agent Orchestration (Copilot SDK)\nAgents can act as \"parent\" sessions that delegate sub-tasks to specialized \"sub-agents.\"\n\n*   **Sub-agent Events:** The parent session tracks sub-agent status through five lifecycle events: `selected`, `started`, `completed`, `failed`, and `deselected`.\n*   **Intent Matching:** The runtime selects a sub-agent based on its `name` and `description`.\n*   **toolCallId:** The unique identifier used to join events across a sub-agent's execution tree.\n\n---\n\n## Part 5: Guardrails, Risk, and Accountability\n\n### Security Mitigations\nGitHub applies built-in mitigations for agentic risks:\n\n*   **Unvalidated Code:** Agents use **CodeQL** (security issues), the **GitHub Advisory Database** (vulnerable dependencies), and **Secret Scanning** to validate their own output before finishing a PR.\n*   **Execution Isolation:** Agents push to a single `copilot/` branch or the existing PR branch; they cannot push directly to default branches.\n*   **Approval Gates:** Workflows on agent-authored PRs are blocked by default until a user with write access clicks \"Approve and run workflows.\"\n*   **The Contributor Model:** Agents are treated as standard contributors. Their work is evaluated by the same engineering standards as humans (scope, checks, reviews, policy).\n\n### The Agent Firewall\nControls network egress from the agent environment to prevent data exfiltration.\n\n*   **Scope:** Applies only to processes started via the **Bash tool**. It does **not** cover MCP servers or `copilot-setup-steps.yml`.\n*   **Rule Types:** \n    *   **Domain:** Allows domain and all subdomains.\n    *   **URL:** Restricted to specific scheme, host, and path-prefix.\n*   **Visibility:** If a request is blocked, a warning is posted to the PR body or as a comment.\n\n---\n\n## Part 6: Short-Answer Practice Quiz\n\n1.  **What is the \"Plan-first\" pull request pattern, and when should it be used?**\n    *   *Answer:* A workflow where the agent opens a PR containing only a structured plan for approval before writing any code. It should be used for high-risk changes (e.g., infrastructure or security-sensitive areas) where alignment on intent is critical.\n2.  **How does the `CODEOWNERS` file improve agent safety?**\n    *   *Answer:* It ensures that changes to sensitive file paths are automatically routed to the correct human experts for review, preventing agents from modifying critical files without specialized oversight.\n3.  **What is the difference between \"GitHub Actions secrets\" and \"Agents secrets\"?**\n    *   *Answer:* GitHub Actions secrets are protected and inaccessible to Copilot. Agents secrets are specifically configured at the org or repo level to be readable by Copilot cloud agent for provisioning tasks.\n4.  **How are agent commits identified for audit purposes?**\n    *   *Answer:* Commits are authored by \"Copilot\" with the human requester as a co-author. They are signed and appear as \"Verified\" on GitHub, often containing a link to the session logs in the commit message.\n5.  **Which MCP component is used to prevent supply-chain attacks from untrusted servers?**\n    *   *Answer:* The MCP Allow List (often combined with a Registry) which restricts server connections to only those approved by organization administrators.\n\n---\n\n## Part 7: Essay Questions for Deeper Exploration\n\n1.  **The \"System of Record\" vs. \"Control Plane\":** Explain how GitHub's dual role as both a system of record and a control plane creates a \"trust but verify\" environment for agentic AI. How do these roles interact when an agent attempts a high-risk production deployment?\n2.  **The Impact of State and Memory on Reliability:** Discuss the risks of \"context drift\" in long-running agent sessions. How does Copilot Memory’s 28-day expiration and citation validation mechanism address the challenges of maintaining a \"stateless\" vs. \"stateful\" architecture?\n3.  **Risk-Based Autonomy:** Propose a tiered autonomy model for a large enterprise. For which file paths would you allow \"automerge,\" and for which would you require environment approvals and multiple human reviews? Justify your choices using the \"blast radius\" concept.\n\n---\n\n## Part 8: Comprehensive Glossary\n\n*   **Agent Profile:** A Markdown file (YAML + instructions) used to define the behavior, tools, and identity of a custom agent.\n*   **Blast Radius:** The potential extent of impact or damage if an agent action fails or is malicious; minimized via least-privilege permissions and branch isolation.\n*   **Context Drift:** A divergence between the agent's internal reasoning/memory and the actual state of the repository, often caused by stale or cached information.\n*   **Copilot Setup Steps:** A file (`copilot-setup-steps.yml`) used to prepare the agent's environment, such as installing dependencies or setting up tools.\n*   **Durable Artifact:** A persisted record of progress (e.g., a PR checklist or workflow artifact) that allows an agent to resume work after a failure or interruption.\n*   **Escalation Path:** A predefined procedure for an agent to hand off a task to a human when it encounters uncertainty, errors, or low confidence.\n*   **GITHUB_TOKEN:** A temporary security token used in workflows; best practice dictates setting this to \"read-only\" by default to enforce least privilege.\n*   **MCP (Model Context Protocol):** An open standard that enables agents to interact with external tools and APIs through a consistent interface.\n*   **Plan (Artifact):** A structured description in a PR or issue outlining the goal, steps, risks, and validation criteria for an agent's intended work.\n*   **Prompt Injection:** A security risk where malicious user input (like hidden HTML comments) attempts to override the agent's system instructions.\n*   **SARIF (Static Analysis Results Interchange Format):** A standard format for code scanning results; used by agents to provide objective evidence of security validation.\n*   **Traceability:** The ability to reconstruct the \"monologue\" of an agent’s reasoning, tool usage, and decision-making via logs, artifacts, and PR history."},{"id":"ref-briefing","title":"Executive briefing","summary":"The themes an examiner keeps returning to, with the quotable phrasing the modules use.","source":"Community study guide (jtur671/gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/media/briefing.md","markdown":"## Executive Summary\n\nThe emergence of agentic AI represents a fundamental shift in software development, transitioning from simple AI assistants that suggest code to autonomous agents that participate in the full Software Development Lifecycle (SDLC). In the GitHub ecosystem, agents are goal-driven entities capable of interpreting objectives, deciding on intermed
