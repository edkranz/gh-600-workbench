ssigning work to an agent, tasks should be clearly defined with acceptance criteria, constraints and non-goals, specified files or paths, and clear validation and rollout expectations. If a task can't be defined precisely, it shouldn't be executed autonomously.\n\n### Apply recovery strategies\n\n- Retry transient failures (bounded retries)\n- Escalate after repeated failures\n- Rollback quickly using small PRs and safe revert paths\n- Investigate security failures instead of repeatedly retrying\n\n### Run continuous governance loop\n\nRecommended cadence:\n\n- Weekly: review failed runs and common policy violations\n- Monthly: review workflow permissions and secret scopes\n- Quarterly: audit rulesets, CODEOWNERS, environment reviewers, retention/evidence\n\n### Identify governance failure patterns\n\n| Anti-pattern | Example | Why it fails | Mitigation |\n|----|----|----|----|\n| Unbounded autonomy | no approval for prod deploys | irreversible changes happen without oversight | environments + required reviewers + rulesets |\n| Excess permissions | token can write-all and read-all secrets | small mistake becomes major incident | least privilege + env scoping + job-level permissions |\n| Missing audit trail | no artifacts, only console logs | can't prove what happened | artifact uploads + evidence-first workflows |\n| Bypass paths exist | direct push to main, disabled checks | policy can be skipped | branch protections/rulesets + restrict push |\n| Rubber-stamping | approvals become “click to unblock” | humans stop reviewing | better evidence + CODEOWNERS + smaller PRs |\n\n## Why continuous governance matters\n\nControls naturally degrade over time as systems evolve—checks are renamed, permissions expand, ownership changes, and workflows are updated. Without regular review, these small changes accumulate and increase risk, creating gaps in enforcement and visibility. Continuous governance ensures that controls remain effective, aligned with current usage, and capable of managing new risks as they emerge.\n\n## Key takeaway\n\nGovernance requires continuous monitoring and improvement. Treat it as an ongoing operational responsibility, not a one-time setup, so systems remain secure, reliable, and aligned with real-world usage as they scale."},{"id":"m6-knowledge-check","uid":"learn.github.governance-guardrails-operations.knowledge-check","title":"Knowledge check","url":"https://learn.microsoft.com/en-us/training/modules/governance-guardrails-operations/8-knowledge-check/","minutes":5,"kind":"knowledge-check","markdown":""},{"id":"m6-summary","uid":"learn.github.governance-guardrails-operations.summary","title":"Summary","url":"https://learn.microsoft.com/en-us/training/modules/governance-guardrails-operations/9-summary/","minutes":5,"kind":"reading","markdown":"In this module, you learned how to:\n\n- Define autonomy levels and action boundaries so agents operate with bounded autonomy aligned to risk, security, and compliance requirements.\n- Classify agent actions (low, medium, high, critical) and map each risk tier to GitHub-native enforcement controls such as rulesets, required checks, CODEOWNERS, and environments.\n- Enforce governance through rulesets/branch protection, required status checks, path-based review routing, and deployment gates so policy is technically enforced and can't be bypassed.\n- Design human-in-the-loop workflows that place approvals at high-impact decision points (merge, deploy, secret access) while keeping low-risk work automated for velocity.\n- Apply least-privilege execution by setting read-only defaults for workflow tokens and granting write permissions only to the job(s) that require them, with secrets scoped to protected environments.\n- Improve operational reliability with workflow concurrency controls, risk-based plan gating, durable evidence (logs and artifacts), drift detection, and recovery patterns (retry limits, rollback, escalation).\n\n## Learn more\n\nFor deeper reading, use official GitHub documentation on:\n\n- [Available rules for rulesets - GitHub Docs](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets)\n- [About code owners - GitHub Docs](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners)\n- [Managing environments for deployment - GitHub Docs](https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment)\n- [Secure use reference - GitHub Docs](https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions)\n- [Store and share data with workflow artifacts - GitHub Docs](https://docs.github.com/en/actions/using-workflows/storing-workflow-data-as-artifacts)"}]}],"questions":[{"id":"adv-01","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.1.2","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"A custom agent profile is committed with this frontmatter:\n\n---\nname: reviewer\ndescription: Reviews changes and writes concise findings.\n---\n\nWhat can this agent do?","options":[{"text":"Nothing — with no tools key it has no capabilities at all.","correct":false,"why":"That is what `tools: []` means. An omitted key and an empty list are opposite outcomes, and this is the single most common misreading of an agent profile."},{"text":"Potentially everything — omitting tools may leave all available tools enabled, including edit and execute.","correct":true,"why":"Omission is not restriction. If `tools` is absent the agent may have the full toolset, so a profile whose prose says \"do not edit files\" is guidance with nothing enforcing it. A review agent must list `tools: [read, search]` explicitly."},{"text":"Only read, because a description mentioning review implies read-only scope.","correct":false,"why":"The description is documentation for humans and for model selection. It grants and withholds nothing."},{"text":"It is invalid and will not load, because tools is a required key.","correct":false,"why":"`description` is the required key. `tools` is optional — which is exactly what makes this dangerous."}],"takeaway":"Omitted `tools` may enable everything; `tools: []` disables everything. Never rely on prose to keep an agent read-only."},{"id":"adv-02","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.1.2","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"Which field is required in custom-agent YAML frontmatter?","options":[{"text":"name","correct":false,"why":"`name` is optional — it supplies a display name. This is the intended trap: `name` feels like the identity field, so it feels required."},{"text":"description","correct":true,"why":"`description` is the required field. It states the agent's purpose and capability, and it is what surfaces the agent for selection."},{"text":"tools","correct":false,"why":"Optional, and omitting it may enable every available tool."},{"text":"target","correct":false,"why":"Optional. It names the surface, such as `github-copilot` or `vscode`."}],"takeaway":"`description` is the only required key. `name`, `tools`, `target`, `model` are all optional."},{"id":"adv-03","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.1.1","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"An agent must locate every call site of a deprecated function across the repository and report them. It must not change anything. Which tool list is correct?","options":[{"text":"read, web","correct":false,"why":"`web` fetches URLs and web search — it is not repository search, and it is not applicable to the cloud agent today. It cannot find call sites in your code."},{"text":"read, search","correct":true,"why":"`search` is repository/file search. Paired with `read` the agent can find the call sites and inspect them, with no ability to modify anything."},{"text":"read, search, execute","correct":false,"why":"`execute` would let it run `grep` via a shell, but shell execution is a far broader capability than the task needs. Add `execute` only when the task genuinely requires running commands."},{"text":"read, search, edit","correct":false,"why":"`edit` is exactly the capability the requirement excludes."}],"takeaway":"`search` is repository search, not the internet. `web` is a different tool and is not available to the cloud agent."},{"id":"adv-04","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.1.2","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"An orchestrator agent should call a reviewer agent and an auditor agent, then merge their findings. It never edits files itself. Which tool list fits?","options":[{"text":"read, search, execute","correct":false,"why":"`execute` runs shell commands. It does not invoke another custom agent."},{"text":"read, search, agent","correct":true,"why":"`agent` is the tool that invokes another custom agent — it also appears as the aliases `custom-agent` and `Task`. Read and search let the orchestrator gather context before delegating."},{"text":"read, search, edit, execute","correct":false,"why":"This is the implementer profile. It can change files and run commands but cannot delegate to a subagent."},{"text":"read, search, handoffs","correct":false,"why":"`handoffs` is not a tool. It appears as frontmatter in some formats and is ignored by the Copilot cloud agent."}],"takeaway":"Subagent invocation needs the `agent` tool (aliases: `custom-agent`, `Task`). Nothing else grants it."},{"id":"adv-05","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.1.2","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"An agent should remain available for a human to pick in chat, but must never be selected automatically by the model as part of an orchestration. Which frontmatter setting?","options":[{"text":"user-invocable: false","correct":false,"why":"Backwards. This hides the agent from direct human selection while leaving model invocation intact — the exact opposite of the requirement."},{"text":"disable-model-invocation: true","correct":true,"why":"This blocks inferred/model invocation, so the agent cannot be pulled into an orchestration as a subagent, while a human can still choose it explicitly."},{"text":"tools: []","correct":false,"why":"That strips the agent's capabilities but does not change who or what can invoke it."},{"text":"target: vscode","correct":false,"why":"`target` names the surface the agent is intended for. It is not an invocation control."}],"takeaway":"`disable-model-invocation` blocks the model from selecting it; `user-invocable` controls whether a human can. They are independent, and easy to swap under pressure."},{"id":"adv-06","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.1.2","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"Where must a custom agent live so it is available across every repository in an organization?","options":[{"text":"In .github/agents/ of each repository that needs it.","correct":false,"why":"That is repository-scoped. It works, but it means copying and maintaining the profile everywhere."},{"text":"Under /agents/ in a .github-private repository.","correct":true,"why":"Organization and enterprise custom agents live under `/agents/` in a `.github-private` repository. Note the repository name — `.github-private`, not `.github`."},{"text":"Under /agents/ in the organization's .github repository.","correct":false,"why":"Close, and the intended distractor. The public `.github` repository holds community health files; agent profiles go in `.github-private`."},{"text":"In ~/.copilot/agents/ on each developer's machine.","correct":false,"why":"That is the per-user CLI location. It is local to one machine and invisible to the organization."}],"takeaway":"Org-wide agents: `/agents/` inside `.github-private`. Repo agents: `.github/agents/*.agent.md`. User CLI agents: `~/.copilot/agents/`."},{"id":"adv-07","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.2.1","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"You are given this MCP server entry:\n\n\"atlassian\": {\n  \"command\": \"npx\",\n  \"args\": [\"mcp-remote@latest\", \"https://mcp.atlassian.com/v1/mcp\", \"--header\", \"...\"],\n  \"tools\": [\"*\"]\n}\n\nWhat is the correct type?","options":[{"text":"http, because the configuration contains an https:// endpoint.","correct":false,"why":"This is the trap the whole item is built on. The URL is an argument passed to a local bridge process, not a top-level connection target."},{"text":"local (or stdio), because the client starts a subprocess and speaks over stdin/stdout.","correct":true,"why":"Transport is decided by the top-level shape. `command` plus `args` means the client launches a process — `mcp-remote` happens to proxy onward to a URL, but the MCP client's own transport is still local."},{"text":"sse, because mcp-remote streams responses.","correct":false,"why":"`sse` requires a top-level `url`. Nothing here connects the client directly to an endpoint."},{"text":"remote, because the underlying service is hosted.","correct":false,"why":"`remote` is not a valid transport value. The values are `local`/`stdio`, `http`, and `sse`."}],"takeaway":"Read the top level, not the strings inside it. `command`+`args` = local; a top-level `url` = http or sse."},{"id":"adv-08","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.2.1","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"A server entry has a top-level url and no command. The available type choices are stdio, sse, and local. Which do you pick?","options":[{"text":"stdio","correct":false,"why":"`stdio` starts a local process and talks over standard streams. It has no way to connect to a URL."},{"text":"local","correct":false,"why":"Same problem — local transport launches a subprocess, and none is specified here."},{"text":"sse","correct":true,"why":"A top-level `url` means remote transport. Modern remote MCP is normally `http`, but when `http` is not among the choices, `sse` is the remote option and the correct pick."},{"text":"None of these — the configuration is invalid without a command.","correct":false,"why":"A `url`-based remote server is perfectly valid; it simply uses a remote transport."}],"takeaway":"Top-level `url` ⇒ remote. Prefer `http`; if `http` is not offered, choose `sse`. Never pick `stdio`/`local` for a URL."},{"id":"adv-09","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.2.1","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"You are adding MCP configuration inside a custom agent's YAML frontmatter. Which key do you use?","options":[{"text":"mcpServers","correct":false,"why":"That is the camelCase key used in JSON MCP configuration files such as `.vscode/mcp.json` or `~/.copilot/mcp-config.json`."},{"text":"mcp-servers","correct":true,"why":"Custom agent YAML frontmatter uses the hyphenated `mcp-servers`. The two spellings are surface-specific and are a favourite fill-in-the-blank."},{"text":"servers","correct":false,"why":"Not a valid key in either surface."},{"text":"Either — the parser accepts both spellings.","correct":false,"why":"They are not interchangeable. YAML frontmatter expects `mcp-servers`; JSON config expects `mcpServers`."}],"takeaway":"YAML agent frontmatter: `mcp-servers`. JSON config file: `mcpServers`."},{"id":"adv-10","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.2.4","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"multi","text":"An agent declares tools: [read, search, jira/get_issue, github/*]. Which statements are accurate? (Select all that apply.)","options":[{"text":"jira/get_issue exposes exactly one tool from the jira server.","correct":true,"why":"Correct. `server/tool` is single-tool scoping — the narrow, preferred form."},{"text":"github/* exposes every tool the github server offers.","correct":true,"why":"Correct. The wildcard grants the server's whole surface, which widens blast radius and should be justified."},{"text":"search will also query the jira server.","correct":false,"why":"No. `search` is repository search. MCP tools are reached only through their `server/tool` names."},{"text":"The GitHub MCP server is read-only by default and scoped to the source repository.","correct":true,"why":"Correct, and worth knowing — `github/*` is broad in tool count but still bounded by that default posture."}],"takeaway":"`server/tool` = one tool. `server/*` = all of that server's tools. The GitHub MCP server defaults to read-only, scoped to the source repo."},{"id":"adv-11","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.2.4","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"A cloud agent MCP server needs an API token. The team stores it as an Agents secret named JIRA_TOKEN and references it. The server fails to authenticate. What is wrong?","options":[{"text":"Secrets cannot be used with MCP servers at all.","correct":false,"why":"They can — that is the supported way to supply credentials at runtime."},{"text":"For the Copilot cloud agent, referenced secret and variable names must start with COPILOT_MCP_.","correct":true,"why":"The naming prefix is the requirement. `COPILOT_MCP_JIRA_TOKEN` would be picked up; a bare `JIRA_TOKEN` will not be."},{"text":"The token should be committed to .github/mcp.json instead.","correct":false,"why":"Never commit credentials. Secrets are injected at runtime precisely so they stay out of repository content."},{"text":"MCP servers must use Actions secrets, not Agents secrets.","correct":false,"why":"Agents secrets and variables are a distinct store from Actions secrets, and are the right home here. The problem is the name, not the store."}],"takeaway":"Cloud agent MCP credentials must be named with the `COPILOT_MCP_` prefix, and Agents secrets are a separate store from Actions secrets."},{"id":"adv-12","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.2.2","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"A vendor's remote MCP server authenticates with OAuth. You want the Copilot cloud agent to use it. What should you expect?","options":[{"text":"It works once you add the OAuth client ID and secret as Agents secrets.","correct":false,"why":"Adding credentials does not enable an unsupported authorization flow."},{"text":"The cloud agent does not currently support remote MCP servers that rely on OAuth authorization.","correct":true,"why":"This is a stated product limitation. A remote server requiring OAuth is not usable from the cloud agent — you would need a server supporting header/token auth, or a local bridge."},{"text":"It works only if the server is also listed in the MCP registry.","correct":false,"why":"Registry listing governs which servers are permitted, not which authorization flows are supported."},{"text":"It works if you set type: sse instead of http.","correct":false,"why":"Transport choice does not change the supported authorization mechanisms."}],"takeaway":"Cloud agent + remote MCP + OAuth = unsupported today. Header or token auth, or a local bridge process, are the workarounds."},{"id":"adv-13","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.2.3","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"multi","text":"You are adapting an existing .vscode/mcp.json for use by the cloud agent. Which changes are needed? (Select all that apply.)","options":[{"text":"Add a tools list to each server.","correct":true,"why":"Correct. Explicit tool scoping is expected rather than inheriting whatever the server exposes."},{"text":"Replace inputs with env.","correct":true,"why":"Correct. `inputs` is a VS Code prompting mechanism with no meaning to the cloud agent."},{"text":"Replace envFile with env.","correct":true,"why":"Correct. There is no local env file to read in the cloud environment."},{"text":"Rename the top-level mcpServers key to mcp-servers.","correct":false,"why":"No. It is still a JSON config file, so `mcpServers` stays. The hyphenated form belongs only in agent YAML frontmatter."}],"takeaway":"Porting `.vscode/mcp.json`: add `tools`, convert `inputs`/`envFile` to `env`, store credentials as Agents secrets — but keep the `mcpServers` key."},{"id":"adv-14","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.3.6","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"An agent can reach an approved MCP server but its own outbound HTTP calls to a third-party API are blocked. Which control is responsible?","options":[{"text":"The MCP allowlist — it governs all outbound access.","correct":false,"why":"The MCP allowlist decides which MCP servers may be used. It says nothing about arbitrary network egress."},{"text":"The firewall allowlist — it governs network egress, which is a different problem from MCP server permission.","correct":true,"why":"Two separate controls that are constantly conflated. MCP allowlist = which servers an agent may use. Firewall allowlist = which hosts the environment may reach."},{"text":"The MCP registry URL setting.","correct":false,"why":"The registry is the catalog of discoverable servers. It is not an egress control."},{"text":"Branch protection on the default branch.","correct":false,"why":"A merge policy has no bearing on runtime network access."}],"takeaway":"Firewall allowlist governs egress; MCP allowlist governs which MCP servers may be used. Different problems, different controls."},{"id":"adv-15","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.2.4","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"An organization sets its MCP policy to Allow all. The enterprise above it is set to Registry only. What applies to a developer in that organization?","options":[{"text":"Allow all — the more specific organization policy wins.","correct":false,"why":"Specificity does not override hierarchy here. Treating org policy as the last word is the trap."},{"text":"Registry only — enterprise policy can override organization policy.","correct":true,"why":"Enterprise policy sits above organization policy, and `Registry only` is the stricter of the two settings. The developer is limited to registry-listed servers."},{"text":"Whichever was configured most recently.","correct":false,"why":"Policy resolution is by scope, not by timestamp."},{"text":"Neither — conflicting policies disable MCP entirely.","correct":false,"why":"The conflict resolves to the enterprise setting rather than switching MCP off."}],"takeaway":"Enterprise policy can override organization policy, and `Registry only` is stricter than `Allow all`."},{"id":"adv-16","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.3.3","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"A scheduled workflow runs the Copilot CLI. It succeeds locally but in CI the job hangs until it times out. Which flag is missing?","options":[{"text":"--autopilot","correct":false,"why":"`--autopilot` lets the CLI continue autonomously on the local runner. It addresses continuation, not the blocking prompt."},{"text":"--no-ask-user","correct":true,"why":"Without it the CLI can stop and ask an interactive question. Nothing is there to answer in CI, so the job waits until the timeout. This is the canonical CI hang."},{"text":"--output-format=json","correct":false,"why":"That changes the shape of the output for machine parsing. It does not stop the CLI from asking."},{"text":"--continue","correct":false,"why":"That resumes the latest session. Irrelevant to an interactive prompt blocking a fresh run."}],"takeaway":"`--no-ask-user` is the CI flag. An agent that can ask questions in a non-interactive environment will hang."},{"id":"adv-17","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.3.3","module":"m3","unit":"m3-interact-github-apis-workflows","type":"single","text":"Match the mechanism to where the work actually executes: --autopilot, /delegate, /fleet.","options":[{"text":"--autopilot runs locally; /delegate hands off to the cloud agent; /fleet splits work into parallel subagents in the CLI.","correct":true,"why":"That is the split. `--autopilot` continues autonomously on the local CLI or runner, `/delegate` (or the `&` prefix) pushes a background task to the cloud agent which produces a PR, and `/fleet` decomposes work into parallel subagents under CLI orchestration."},{"text":"All three hand work to the Copilot cloud agent; they differ only in verbosity.","correct":false,"why":"Only `/delegate` moves execution to the cloud agent."},{"text":"--autopilot delegates to the cloud; /delegate splits into subagents; /fleet runs locally.","correct":false,"why":"All three are shuffled."},{"text":"/fleet delegates to the cloud agent; /delegate runs a single local session; --autopilot enables MCP.","correct":false,"why":"`/fleet` is CLI-side decomposition, and `--autopilot` has nothing to do with MCP."}],"takeaway":"`--autopilot` = keep going locally. `/delegate` (or `&`) = background cloud agent task. `/fleet` = parallel subagents under CLI orchestration."},{"id":"adv-18","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.3.3","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"You need to reattach to one specific earlier CLI session by name, not simply pick up the most recent one. Which flag?","options":[{"text":"--continue","correct":false,"why":"`--continue` resumes the latest session. If another session ran since, you get the wrong one."},{"text":"--resume","correct":true,"why":"`--resume` targets a named session, which is what \"one specific earlier session\" requires. A stable session id is what makes it addressable."},{"text":"--autopilot","correct":false,"why":"Autonomous continuation of the current run; not a session selector."},{"text":"/session","correct":false,"why":"The slash command inspects the current session from inside the CLI. It does not reattach to a prior one at launch."}],"takeaway":"`--resume` = a named session. `--continue` = whatever ran last."},{"id":"adv-19","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.3.6","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"A team adds .github/workflows/copilot-setup-steps.yml on a feature branch, with the job id setup. The cloud agent still starts without their dependencies installed. What are the two problems?","options":[{"text":"The file must be on the default branch, and the job must be named copilot-setup-steps.","correct":true,"why":"Both conditions are required. The file is only picked up from the default branch, and the job id must be exactly `copilot-setup-steps` for it to be recognised as the setup job."},{"text":"The file must be in .github/ rather than .github/workflows/, and needs a schedule trigger.","correct":false,"why":"The path is right as given; setup steps live under `.github/workflows/`."},{"text":"The workflow needs contents: write, and must run on pull_request.","correct":false,"why":"Neither is required, and elevating permissions would not make the file discoverable."},{"text":"Setup steps must be defined in the agent profile, not a workflow file.","correct":false,"why":"The cloud agent environment is prepared by this workflow file, not by agent frontmatter."}],"takeaway":"`copilot-setup-steps.yml` must sit on the default branch and use the job id `copilot-setup-steps`."},{"id":"adv-20","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.4.1","module":"m3","unit":"m3-agent-execution-limits-protections","type":"single","text":"A step inside copilot-setup-steps.yml fails partway through. What happens next?","options":[{"text":"The agent session is cancelled and the task never starts.","correct":false,"why":"Setup failure is not fatal to the session, which is precisely why it can be confusing to debug."},{"text":"Remaining setup steps are skipped and Copilot starts with the current environment.","correct":true,"why":"The agent proceeds with whatever state setup managed to reach. That produces puzzling downstream failures — missing dependencies, wrong toolchain — that look like agent errors but are environment errors."},{"text":"The whole workflow retries from the beginning up to three times.","correct":false,"why":"There is no automatic retry of setup."},{"text":"Copilot falls back to the previous successful setup run's environment.","correct":false,"why":"There is no cached previous environment to fall back to."}],"takeaway":"Setup failure skips the rest and starts anyway. Suspect setup when an agent behaves as if the toolchain is missing."},{"id":"adv-21","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.3.3","module":"m3","unit":"m3-interact-github-apis-workflows","type":"single","text":"Which statement correctly distinguishes copilot-setup-steps.yml from a workflow that installs the Copilot CLI and runs copilot -p?","options":[{"text":"They are the same thing under different names.","correct":false,"why":"Conflating them is the point of the question. They serve different purposes and run at different times."},{"text":"copilot-setup-steps.yml prepares the cloud agent's environment; a workflow running copilot -p is separate CI automation that invokes the CLI.","correct":true,"why":"Setup steps provision the environment the cloud agent will work inside. A workflow that installs `@github/copilot` and calls `copilot -p` is ordinary CI that happens to use the CLI as a tool."},{"text":"copilot-setup-steps.yml runs after the agent finishes, to clean up.","correct":false,"why":"It runs beforehand, to prepare."},{"text":"Only copilot-setup-steps.yml can use secrets.","correct":false,"why":"Both are workflows and both can reference secrets."}],"takeaway":"Setup steps prepare the cloud agent's environment. A `copilot -p` workflow is CI invoking the CLI. Different mechanisms."},{"id":"adv-22","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d2","objective":"2.1.3","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"In a CI step invoking the Copilot CLI, which environment variable does GitHub's own example use to authenticate it?","options":[{"text":"GITHUB_TOKEN","correct":false,"why":"The workflow's `GITHUB_TOKEN` authorises Actions API calls. It is not what the documented CLI example passes."},{"text":"COPILOT_GITHUB_TOKEN","correct":true,"why":"This is the variable GitHub's CI example sets, typically from a PAT stored as a secret."},{"text":"COPILOT_MCP_TOKEN","correct":false,"why":"The `COPILOT_MCP_` prefix is the naming rule for MCP server credentials, not CLI authentication."},{"text":"GH_COPILOT_PAT","correct":false,"why":"Not a documented variable name."}],"takeaway":"`COPILOT_GITHUB_TOKEN` authenticates the CLI in CI. Distinct from `GITHUB_TOKEN` and from `COPILOT_MCP_*`."},{"id":"adv-23","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d1","objective":"1.3.1","module":"m6","unit":"m6-define-risk-based-autonomy","type":"single","text":"Using the low/medium/high autonomy model, which tool set and control pairing describes a medium-autonomy implementer?","options":[{"text":"read, search — with no write and no shell.","correct":false,"why":"That is low autonomy: read, search, summarize, plan."},{"text":"read, search, edit, execute — gated by PR checks and required review.","correct":true,"why":"Medium autonomy edits files and runs tests, then opens a PR. The controls that make it safe are required checks and review, not restricted tooling."},{"text":"agent plus MCP tools and shell — gated by narrow tools, hooks, approvals, and audit.","correct":false,"why":"That is high autonomy: coordinating agents, MCP, workflow modification."},{"text":"read, search, agent — gated by branch protection alone.","correct":false,"why":"That is a coordinator's tool set, and branch protection alone is thin for it."}],"takeaway":"Low = read/search. Medium = +edit/execute, gated by checks and review. High = agent/MCP/shell, gated by hooks, approvals and audit."},{"id":"adv-24","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d1","objective":"1.1.1","module":"m2","unit":"m2-inputs-outputs-success-criteria","type":"multi","text":"Which conditions indicate a task should NOT be handed to an agent alone? (Select all that apply.)","options":[{"text":"Success criteria are unclear.","correct":true,"why":"Yes. With nothing to validate against, neither the agent nor a reviewer can tell whether the work is done."},{"text":"The agent would need broad secrets or broad external write access.","correct":true,"why":"Yes. Breadth of credential is breadth of blast radius."},{"text":"The agent would approve its own output.","correct":true,"why":"Yes. Self-approval removes the acceptance boundary entirely — agents propose, humans and policy accept."},{"text":"The work can be scoped to a single repository and branch.","correct":false,"why":"No — that is one of the conditions that makes a task well suited to an agent."}],"takeaway":"Rule the agent out when criteria are vague, credentials must be broad, the change is irreversible, or the agent would accept its own work."},{"id":"adv-25","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d3","objective":"3.2.2","module":"m4","unit":"m4-agent-state-context-drift","type":"single","text":"You are handed this CLI log excerpt:\n\nsession.id=abc123\nloaded ~/.copilot/session-state/abc123/events.jsonl\nresume=true\n\nWhat does it tell you?","options":[{"text":"A new session started and immediately wrote its first events file.","correct":false,"why":"A new session would show `resume=false` and would not load an existing events file."},{"text":"An existing session was resumed — its prior event stream was replayed from session-state.","correct":true,"why":"Three signals agree: a session id that already existed, `resume=true`, and the load of `session-state/<id>/events.jsonl`. That file is the per-session event stream."},{"text":"Copilot Memory was loaded for the repository.","correct":false,"why":"Copilot Memory is a separate mechanism from CLI session state. Session persistence is not Copilot Memory."},{"text":"The session was deleted and recreated with the same id.","correct":false,"why":"Deletion would discard the events file, leaving nothing to load."}],"takeaway":"Resume evidence: a reused session id, `resume=true`, and a load from `~/.copilot/session-state/<id>/events.jsonl`."},{"id":"adv-26","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d3","objective":"3.3.1","module":"m4","unit":"m4-memory-state-continuity","type":"single","text":"A workstation must keep Copilot CLI configuration and session state on an encrypted volume rather than the home directory. Which environment variable moves it?","options":[{"text":"COPILOT_CACHE_HOME","correct":false,"why":"That relocates the cache only. Config and session state stay where they were — a partial move that looks like it worked."},{"text":"COPILOT_HOME","correct":true,"why":"`COPILOT_HOME` changes the config and state root, which is where `agents/`, `session-state/`, `logs/`, `config.json` and `mcp-config.json` live."},{"text":"COPILOT_CONFIG_PATH","correct":false,"why":"Not a documented variable."},{"text":"XDG_CONFIG_HOME","correct":false,"why":"A general convention, but the CLI's documented override is `COPILOT_HOME`."}],"takeaway":"`COPILOT_HOME` = config and state root. `COPILOT_CACHE_HOME` = cache only."},{"id":"adv-27","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d3","objective":"3.2.1","module":"m4","unit":"m4-memory-state-continuity","type":"single","text":"Using the Copilot SDK, a session finishes and the client calls disconnect(). A week later you try to resume the same session id. What happens?","options":[{"text":"It fails — disconnect() destroys the session.","correct":false,"why":"That is `deleteSession()`. Confusing the two is the trap: one closes the connection, the other destroys the data."},{"text":"It resumes — disconnect() keeps session data, and a stable sessionId is what makes resume possible.","correct":true,"why":"`disconnect()` ends the connection while preserving session data. Note what does not survive: provider or API keys, and in-memory tool state."},{"text":"It resumes, including any API keys the session was using.","correct":false,"why":"Half right. The session resumes, but provider and API keys are not persisted and must be supplied again."},{"text":"It creates a new session, silently ignoring the id.","correct":false,"why":"A stable id is precisely what addresses an existing session."}],"takeaway":"`disconnect()` preserves session data; `deleteSession()` destroys it. Keys and in-memory tool state never persist."},{"id":"adv-28","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d3","objective":"3.3.3","module":"m4","unit":"m4-memory-state-continuity","type":"single","text":"An agent keeps applying a naming convention the team abandoned three months ago. Copilot Memory holds it as a repository-level fact. What is the correct diagnosis?","options":[{"text":"Session state was resumed from a stale session.","correct":false,"why":"Session state is per-execution. A convention applied consistently across new sessions points at memory, not at one resumed run."},{"text":"Stale repository memory — repository facts should be validated against the current branch before use.","correct":true,"why":"Repository-level facts are scoped to the repository and can outlive the practice they describe. The guidance is to check stored facts against current branch state; stale memory produces exactly this wrong-convention symptom."},{"text":"A user-level preference is overriding the repository convention.","correct":false,"why":"Possible in principle, but the question states the fact is stored at repository level. User preferences are a separate scope."},{"text":"The agent lacks the search tool and cannot see current code.","correct":false,"why":"It is applying a specific remembered convention, not failing to find anything."}],"takeaway":"Repository facts and user preferences are different scopes, and repository facts must be re-validated against the current branch."},{"id":"adv-29","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d3","objective":"3.3.2","module":"m4","unit":"m4-memory-state-continuity","type":"multi","text":"Match the need to the right storage. Which pairings are correct? (Select all that apply.)","options":[{"text":"Share a plan between two workflow jobs → workflow artifact or job output.","correct":true,"why":"Correct. Jobs are isolated; artifacts and job outputs are the supported handoffs."},{"text":"Continue the same CLI or SDK run later → session id and session-state.","correct":true,"why":"Correct. That is what session persistence is for."},{"text":"Preserve a review decision → PR comment or review.","correct":true,"why":"Correct. Decisions belong on the PR timeline where reviewers and auditors will look."},{"text":"Store an MCP server's API token → repository instructions file.","correct":false,"why":"No. Memory, prompts, instructions and comments must never hold secrets. Credentials go in Agents secrets and are injected at runtime."}],"takeaway":"Artifacts/outputs for cross-job data, session-state for run continuity, PR comments for decisions — and never instructions or memory for secrets."},{"id":"adv-30","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d4","objective":"4.1.4","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"single","text":"A workflow uploads review.md but the job log shows:\n\nWarning: No files were found with the provided path: review.md\n\nThe run is still green. Which change makes this fail loudly?","options":[{"text":"Set retention-days: 1 so the problem surfaces sooner.","correct":false,"why":"Retention governs how long an artifact is kept. It has nothing to do with a missing file."},{"text":"Set if-no-files-found: error on the upload step.","correct":true,"why":"The input's default is `warn`, which is why the run stayed green. `error` turns a missing artifact into a failure; `ignore` suppresses it entirely."},{"text":"Set overwrite: true.","correct":false,"why":"That replaces an existing artifact of the same name. It does not detect an absent file."},{"text":"Set include-hidden-files: true.","correct":false,"why":"Only relevant if the file were hidden — `review.md` is not."}],"takeaway":"`if-no-files-found` defaults to `warn`. Use `error` when a missing artifact should fail the run."},{"id":"adv-31","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d4","objective":"4.3.3","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"An agent's workflow fails with:\n\nnpm ci\nERR! code E401\n\nWhat is the correct first fix?","options":[{"text":"Grant the agent broad shell access so it can authenticate manually.","correct":false,"why":"Widening capability in response to an auth failure is the wrong instinct and the trap here. Broad shell access is never the first fix."},{"text":"Fix the setup steps, package registry authentication, or the missing secret.","correct":true,"why":"E401 is unauthorized — a registry credential problem. It belongs to the setup and environment layer, so fix the auth or the secret rather than changing the agent."},{"text":"Switch the agent to a more capable model.","correct":false,"why":"Model choice is the last lever, and this is not a reasoning failure at all."},{"text":"Add --no-ask-user so the install does not prompt.","correct":false,"why":"That addresses interactive hangs. The install is failing on authorization, not waiting for input."}],"takeaway":"Match the fix to the layer. Dependency and auth failures are environment problems — never answer them by widening agent capability."},{"id":"adv-32","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d4","objective":"4.3.1","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"In the recommended tuning order, where does changing the model sit?","options":[{"text":"First — an underpowered model is the most common root cause.","correct":false,"why":"It is the most tempting and least often correct first move."},{"text":"Last, unless documentation explicitly points there — after prompt clarity, instructions, tool scope, setup, repo state and memory.","correct":true,"why":"The order runs from cheapest and most likely to most expensive and least likely: task clarity, instructions, tool scope, setup/environment, current repo state, memory/session state, then model."},{"text":"Immediately after checking prompt clarity.","correct":false,"why":"Instructions, tools, environment, repo state and memory all come before it."},{"text":"It is never appropriate to change the model.","correct":false,"why":"It is a legitimate lever — just the last one."}],"takeaway":"Tuning order: prompt → instructions → tools → setup → repo state → memory/session → model last."},{"id":"adv-33","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d4","objective":"4.2.1","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"multi","text":"A workflow artifact has vanished and you must establish who removed it. Which are true? (Select all that apply.)","options":[{"text":"The audit event to search for is artifact.destroy.","correct":true,"why":"Correct — that is the event recorded for manual artifact deletion."},{"text":"You search the organization or enterprise audit log, not the repository's Actions tab.","correct":true,"why":"Correct. The Actions tab shows that it is gone; the audit log shows who removed it and when."},{"text":"Useful fields include actor, repo, created_at or @timestamp, operation_type and user_agent.","correct":true,"why":"Correct — those are the fields that turn the event into an account of what happened."},{"text":"A deleted artifact can be restored from the audit log entry.","correct":false,"why":"No. The audit log records the deletion; it does not retain the artifact. Deleted artifacts cannot be restored."}],"takeaway":"`artifact.destroy` in the org or enterprise audit log names the actor and time — but the artifact itself is gone for good."},{"id":"adv-34","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d4","objective":"4.2.2","module":"m4","unit":"m4-agent-failures-behavior-improvement","type":"single","text":"A session log shows:\n\ntool=execute command=\"git push origin main\"\n\nWhich response best matches the guidance?","options":[{"text":"Add an instruction telling the agent to open a pull request instead.","correct":false,"why":"Necessary but not sufficient. An instruction is guidance; the capability is still there and will be used again."},{"text":"Deny the command through tool policy or a pre-tool hook, and enforce branch protection or a ruleset as well.","correct":true,"why":"Layered: the hook or tool policy blocks the action before it executes, and branch protection makes the push impossible even if the hook is bypassed or fails open. Instructing the agent to open a PR is a third, softer layer."},{"text":"Remove the execute tool entirely.","correct":false,"why":"Too blunt if the agent legitimately needs to run tests. Deny the specific dangerous command rather than the whole capability."},{"text":"Rotate the token the agent used.","correct":false,"why":"A response to credential compromise, not to an agent using a capability it was granted."}],"takeaway":"Block at the hook or tool-policy layer, and back it with branch protection — hooks can fail open, repository policy does not."},{"id":"adv-35","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d5","objective":"5.1.2","module":"m5","unit":"m5-execution-isolation-permissions-concurrency","type":"single","text":"Several agents push to the same PR branch. Every push must be validated in order, with no run cancelled. Which concurrency block?","options":[{"text":"group: ${{ github.workflow }}-${{ github.head_ref }} with cancel-in-progress: true","correct":false,"why":"That is the right choice when only the latest result matters — it cancels the older runs the requirement says must complete."},{"text":"group: production-agent-work with queue: max","correct":true,"why":"`queue: max` serialises runs so each one executes in turn rather than being cancelled. That is the pattern for \"every run must happen\"."},{"text":"group: production-agent-work with queue: max and cancel-in-progress: true","correct":false,"why":"Explicitly warned against — do not combine `queue: max` with `cancel-in-progress: true`. They express contradictory intents."},{"text":"Job-level concurrency on the validate job.","correct":false,"why":"Job-level concurrency applies within a workflow run. It does not serialise separate runs triggered by successive pushes."}],"takeaway":"`cancel-in-progress: true` = only the latest matters. `queue: max` = every run must happen. Never both."},{"id":"adv-36","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d5","objective":"5.1.2","module":"m5","unit":"m5-execution-isolation-permissions-concurrency","type":"single","text":"Why is the concurrency group written as ${{ github.workflow }}-${{ github.head_ref || github.run_id }} rather than just ${{ github.head_ref }}?","options":[{"text":"github.run_id makes the group unique so nothing is ever cancelled.","correct":false,"why":"That would defeat the purpose. `run_id` is a fallback for the case where `head_ref` is unset, not the normal grouping key."},{"text":"github.workflow stops other workflows on the same branch being cancelled, and github.run_id is a fallback for events with no head_ref.","correct":true,"why":"Both halves matter. Omitting `github.workflow` makes the group branch-global, so unrelated workflows cancel each other. `head_ref` is only populated for pull_request events, so `run_id` keeps the expression valid elsewhere."},{"text":"github.head_ref is unavailable on pull_request events, so a fallback is always required.","correct":false,"why":"Reversed — `head_ref` is the PR source branch and is populated *on* pull_request events. It is empty on push or schedule."},{"text":"It is stylistic; the two behave identically.","correct":false,"why":"They behave very differently for any repository with more than one workflow."}],"takeaway":"`github.workflow` scopes the group per workflow; `head_ref || run_id` keeps it valid when there is no PR branch."},{"id":"adv-37","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d5","objective":"5.1.1","module":"m5","unit":"m5-agent-orchestration-github-workflows","type":"multi","text":"A matrix job fans out one agent per area. Which statements are correct? (Select all that apply.)","options":[{"text":"fail-fast: false prevents one failed matrix job cancelling the others.","correct":true,"why":"Correct, and important for agent fan-out — you usually want every area's result even if one fails."},{"text":"A matrix can generate up to 256 jobs in a single workflow run.","correct":true,"why":"Correct. That is the documented ceiling."},{"text":"matrix.agent is a list of agent names expanded into one job each.","correct":true,"why":"Correct — each value produces a job, typically passed to `--agent=${{ matrix.agent }}`."},{"text":"strategy.matrix orders the jobs so each waits for the previous one.","correct":false,"why":"No. Matrix jobs run in parallel. Ordering comes from `needs`."}],"takeaway":"Matrix = parallel fan-out, up to 256 jobs, with `fail-fast: false` to keep the rest alive. Ordering is `needs`, never matrix."},{"id":"adv-38","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d5","objective":"5.2.2","module":"m5","unit":"m5-system-observability-evidence-workflows","type":"single","text":"A review job and an audit job each produce a markdown file. A third job must read both. What is the mechanism?","options":[{"text":"Write both files to the workspace; the third job checks out the same repository and reads them.","correct":false,"why":"Jobs run on separate runners with separate filesystems. Files written in one job do not exist in another."},{"text":"Upload each file with actions/upload-artifact, then download both in the consolidating job, which declares needs: [review, audit].","correct":true,"why":"Artifacts carry files between jobs and `needs` guarantees both producers finished first. This is also the auditable handoff — the artifacts survive as evidence."},{"text":"Pass the file contents through job outputs.","correct":false,"why":"Job outputs carry values, not files. Multi-kilobyte markdown is the wrong shape and hits output limits."},{"text":"Have the first two jobs commit their files to the branch.","correct":false,"why":"Committing generated files pollutes history and races when two jobs push."}],"takeaway":"Files between jobs = artifacts. Values between jobs = job outputs. Ordering = `needs`."},{"id":"adv-39","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d5","objective":"5.2.3","module":"m5","unit":"m5-system-observability-evidence-workflows","type":"single","text":"A workflow reruns after a failure. You need to know who clicked rerun, as distinct from who originally triggered the run. Which context?","options":[{"text":"github.actor","correct":false,"why":"`github.actor` is the original actor who triggered the run — it does not change on rerun."},{"text":"github.triggering_actor","correct":true,"why":"`triggering_actor` is the account that started this attempt, which is what differs on a rerun. Pair it with `github.run_attempt` to see which attempt you are looking at."},{"text":"github.run_number","correct":false,"why":"The workflow's run number — an ordinal, not a person."},{"text":"github.sha","correct":false,"why":"The triggering commit. Identifies code, not the actor."}],"takeaway":"`github.actor` = original trigger. `github.triggering_actor` = who started this attempt. `run_attempt` = which attempt."},{"id":"adv-40","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d5","objective":"5.1.3","module":"m5","unit":"m5-conflict-resolution-github-arbitration","type":"multi","text":"When should you NOT split work across multiple agents? (Select all that apply.)","options":[{"text":"The task is inherently sequential.","correct":true,"why":"Yes. Parallelism buys nothing when step two cannot start until step one finishes."},{"text":"The agents would have to edit the same files.","correct":true,"why":"Yes. Shared file ownership is the primary source of collisions and reverted work."},{"text":"State handoff between them is unclear.","correct":true,"why":"Yes. Without a defined handoff artifact the coordination is invisible and undiagnosable."},{"text":"The agents have different areas of expertise.","correct":false,"why":"No — that is an argument *for* multiple agents, provided the work splits cleanly by area."}],"takeaway":"Split by area with disjoint files and a defined handoff. Do not split sequential work or work that shares files."},{"id":"adv-41","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"You must block a cloud agent from running a destructive shell command. Which hook event and response shape?","options":[{"text":"permissionRequest, returning { \"behavior\": \"deny\", \"message\": \"...\" }","correct":false,"why":"`permissionRequest` is CLI-only — it runs before the CLI's own permission flow and is not used for cloud-agent permissioning. Its shape is right for the CLI, wrong for this scenario."},{"text":"preToolUse, returning { \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"...\" }","correct":true,"why":"`preToolUse` fires before a tool executes and is the cloud-agent decision point. It returns `permissionDecision` with an accompanying `permissionDecisionReason` when denying."},{"text":"postToolUse, returning { \"permissionDecision\": \"deny\" }","correct":false,"why":"`postToolUse` runs after a successful tool call. By then the command has already run."},{"text":"agentStop, returning { \"interrupt\": true }","correct":false,"why":"`agentStop` fires when the main agent finishes a turn and can force another turn. It is not a tool gate."}],"takeaway":"Cloud-agent gating is `preToolUse` with `permissionDecision`. `permissionRequest` with `behavior` is CLI-only."},{"id":"adv-42","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"A preToolUse hook returns \"ask\" for a risky command. The cloud agent is running the task unattended. What happens?","options":[{"text":"The agent pauses until someone responds in the session UI.","correct":false,"why":"There is no interactive prompt to answer — that is precisely the situation the rule exists for."},{"text":"It is treated as a denial, because the cloud agent is non-interactive.","correct":true,"why":"`ask` only means something in an interactive CLI. In the cloud agent it resolves to deny, so a hook written for local use will silently become stricter there."},{"text":"It is treated as allow, since no one objected.","correct":false,"why":"Failing open on an explicit `ask` would invert the intent of the hook."},{"text":"The session errors out with an unsupported-decision fault.","correct":false,"why":"It is a valid decision value; it simply resolves to deny in a non-interactive context."}],"takeaway":"`allow` / `deny` / `ask` are the three decisions — and `ask` becomes `deny` in the cloud agent."},{"id":"adv-43","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.3","module":"m6","unit":"m6-control-agent-capabilities","type":"single","text":"A hook is configured with matcher: \"bash\" to intercept shell commands. A colleague argues it will also catch a tool named bash-runner. Who is right?","options":[{"text":"The colleague — matcher is a substring test.","correct":false,"why":"This is the intuitive reading and it is wrong."},{"text":"You — the matcher regex is anchored, so \"bash\" matches exactly bash and nothing else.","correct":true,"why":"The matcher is a full-match regex. `\"bash\"` matches only `bash`; `\"bash|powershell\"` matches exactly those two names, not any string containing them."},{"text":"Neither — matcher applies to the command string, not the tool name.","correct":false,"why":"`matcher` filters on the event-specific value, which for `preToolUse` is the tool name."},{"text":"The colleague, but only on Windows.","correct":false,"why":"Anchoring is not platform-dependent."}],"takeaway":"`matcher` is an anchored full-match regex. `\"bash|powershell\"` means exactly those two tool names."},{"id":"adv-44","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"A repository hook defines only a powershell command for its preToolUse entry. It works on a developer's Windows machine but never fires for the cloud agent. Why?","options":[{"text":"Cloud agent hooks must be registered in the agent profile as well.","correct":false,"why":"Repository hooks in `.github/hooks/*.json` are picked up from the cloned repo without profile registration."},{"text":"The cloud agent runs on Linux, so a PowerShell-only entry has nothing to execute — it needs bash or command.","correct":true,"why":"Cloud agent hooks run in Linux with a working directory of `/workspace` when a repo is cloned. Only `bash` or the cross-platform `command` field is usable there."},{"text":"Cloud agent hooks only support HTTP hooks, not command hooks.","correct":false,"why":"Command, HTTP and prompt hooks are all valid entry types."},{"text":"The hook needs a longer timeoutSec than the 30-second default.","correct":false,"why":"A timeout would show as a failure after running, not as never firing."}],"takeaway":"Cloud agent hooks are Linux, cwd `/workspace`. Provide `bash` or `command`; PowerShell-only entries never run there."},{"id":"adv-45","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-make-actions-observable-traceable-auditable","type":"single","text":"A hook log records toolName: \"grep\". What did the agent do?","options":[{"text":"Searched the internet.","correct":false,"why":"Web access is `web_fetch`. Nothing about `grep` reaches outside the repository."},{"text":"Searched repository file contents — grep maps to the search capability.","correct":true,"why":"Hook tool names sit a level below the agent `tools` list. `grep` searches file contents and `glob` finds files by pattern; both roll up to `search`."},{"text":"Read a single file's contents.","correct":false,"why":"That is `view`, which maps to `read`."},{"text":"Ran a shell command.","correct":false,"why":"That is `bash` (or `powershell`), which maps to `execute`."}],"takeaway":"Hook names → capability: `view`=read, `grep`/`glob`=search, `edit`/`create`=edit, `bash`/`powershell`=execute, `task`=agent, `web_fetch`=web."},{"id":"adv-46","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.4","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"Your team relies on a preToolUse hook as the sole control preventing agents from pushing to main. What is the flaw?","options":[{"text":"Hooks cannot inspect command arguments.","correct":false,"why":"They can — the payload carries `toolArgs`, commonly as a JSON string that must be parsed."},{"text":"Hook failures usually fail open, so hard enforcement must come from branch protection, required checks and reviews.","correct":true,"why":"If the hook script errors, times out, or returns nothing, default behaviour continues. A control that fails open cannot be the only thing standing between an agent and the default branch."},{"text":"Hooks only run for interactive CLI sessions.","correct":false,"why":"Repository hooks in `.github/hooks/*.json` apply to both the CLI and the cloud agent."},{"text":"preToolUse cannot deny — only ask.","correct":false,"why":"`deny` is a valid decision and is the intended way to block."}],"takeaway":"Hooks intercept, rulesets enforce. Hooks fail open; branch protection does not. Layer them."},{"id":"adv-47","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.3","module":"m6","unit":"m6-control-agent-capabilities","type":"single","text":"A developer's ~/.copilot/hooks/ contains a policy hook that works locally. Does the cloud agent enforce it?","options":[{"text":"Yes — hooks are synchronised to the cloud agent from the user's configuration.","correct":false,"why":"There is no synchronisation of user configuration into the cloud environment."},{"text":"No — the cloud agent only gets repository hooks from the cloned repo, and does not load user-level hooks, local settings or plugins.","correct":true,"why":"User-level hooks are a CLI convenience on that machine. Anything that must apply to cloud-agent work belongs in `.github/hooks/*.json`, committed to the repository."},{"text":"Yes, if the hook file is also referenced from the agent profile.","correct":false,"why":"Agent profiles do not reference hook files, and the cloud agent still would not read the user's home directory."},{"text":"Only if the developer is the one who assigned the task.","correct":false,"why":"Who assigns the task has no bearing on which hook files the cloud environment loads."}],"takeaway":"Cloud agent loads repository hooks only. User-level hooks, local settings and plugins are CLI-side."},{"id":"adv-48","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.1","module":"m6","unit":"m6-design-human-workflows","type":"single","text":"A PR shows \"Copilot started work\" but no commits appear and nothing has changed for twenty minutes. What is the first diagnostic step?","options":[{"text":"Unassign and reassign Copilot to the issue.","correct":false,"why":"A valid recovery for issue-assigned work that is genuinely stuck, but it discards context before you have looked at what happened."},{"text":"Open View session to see what the agent is actually doing.","correct":true,"why":"Look before you act. The session view shows the agent's actions and whether it is working, blocked, or waiting — which determines which recovery applies."},{"text":"Comment @copilot on the pull request.","correct":false,"why":"Useful when Copilot is not responding to a comment on an open assigned PR, but it is a nudge, not a diagnosis."},{"text":"Approve and run workflows.","correct":false,"why":"That is the fix when workflows are blocked after a Copilot push — but you would only know that from the session or the checks."}],"takeaway":"Diagnose first with View session, then choose: reassign for stuck issue work, `@copilot` for an unresponsive PR, Approve and run workflows for blocked checks."},{"id":"adv-49","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.2.2","module":"m6","unit":"m6-enforce-governance-github-controls","type":"single","text":"Copilot pushes a change to .github/workflows/ on a PR. Checks do not start. What is happening?","options":[{"text":"A build error is preventing the workflow from compiling.","correct":false,"why":"Nothing has run yet, so there is nothing to fail."},{"text":"An accountability gate — a reviewer must select \"Approve and run workflows\" before they execute.","correct":true,"why":"Workflow changes pushed by Copilot require explicit human approval before running. It is a deliberate control against unreviewed privileged execution, not a fault."},{"text":"The workflow lacks contents: write permission.","correct":false,"why":"Permissions govern what a run can do once started. They do not prevent it starting."},{"text":"Concurrency cancelled the run before it began.","correct":false,"why":"A cancelled run appears in the run history as cancelled. Here nothing was queued at all."}],"takeaway":"\"Approve and run workflows\" after a Copilot push is a governance gate, not an error."},{"id":"adv-50","difficulty":"advanced","source":"advanced-guide","sourceLabel":"Advanced study guide","sourceUrl":"https://gist.github.com/naim149/a8aa41c7468685b7d984822c38863aae","domain":"d6","objective":"6.1.1","module":"m6","unit":"m6-define-risk-based-autonomy","type":"multi","text":"Classify these as preventive, detective, or corrective — which pairings are right? (Select all that apply.)","options":[{"text":"MCP allowlists and least-privilege tools are preventive.","correct":true,"why":"Correct. They stop the unsafe action from being possible in the first place."},{"text":"Secret scanning, session logs and audit logs are detective.","correct":true,"why":"Correct. They surface what happened; they do not block it."},{"text":"Reverting a PR, rotating secrets and unassigning Copilot are corrective.","correct":true,"why":"Correct. They restore a safe state after something has occurred."},{"text":"Branch protection is detective, because it reports policy violations.","correct":false,"why":"No. Branch protection prevents the merge outright, which makes it preventive."}],"takeaway":"Preventive stops it, detective reveals it, corrective repairs it. High-risk work needs all three."},{"id":"auth-d1-01","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.1.1","module":"m1","unit":"m1-explain-agent-lifecycle-plan-act-evaluate","type":"single","text":"An agent opens a pull request, CI fails on a lint rule, and the agent pushes a fixing commit and waits for the checks again. Which phase of the agent lifecycle drove that second commit?","options":[{"text":"Plan - the agent re-derived the goal from the original issue.","correct":false,"why":"Planning is where the goal is interpreted and steps are chosen. Here the goal never changed; a system signal did."},{"text":"Evaluate - the failing status check is the feedback signal that sent the loop back around.","correct":true,"why":"Plan to act to evaluate is a loop, not a one-way sequence. Evaluation consumes objective signals (workflow runs, status checks, review feedback, security alerts) and, when they fail, the agent revises and re-runs until success criteria are met or it escalates."},{"text":"Act - pushing a commit is action, so the loop never left the act phase.","correct":false,"why":"The commit is indeed an action, but the question asks what drove it. The trigger was the evaluation signal; the action is the consequence."},{"text":"None - re-running checks happens outside the lifecycle.","correct":false,"why":"Iteration on feedback is the defining behavior of an agentic system, not something outside its lifecycle."}],"takeaway":"Plan to act to evaluate is a loop. Objective GitHub signals (checks, reviews, scans) feed the next iteration - the agent's own confidence does not."},{"id":"auth-d1-02","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.1.1","module":"m2","unit":"m2-agent-responsibilities","type":"single","text":"You are scoping a dependency-remediation agent for the first time. Which SDLC stages should it own, and where should its responsibility end?","options":[{"text":"Planning through deployment, so it can ship the fix end to end without waiting on people.","correct":false,"why":"Deployment is the stage the modules say to restrict. Agents prepare; environments and approvals decide whether the change ships."},{"text":"Implementation and validation: detect, branch, update the dependency, open a PR with a plan - then stop and let checks, reviews, and policy decide.","correct":true,"why":"Most teams start by scoping agents to implementation and validation, because pull requests and workflows give natural control points there. The design boundary is: agents propose; humans and policy accept."},{"text":"Validation only, reviewing other people's dependency PRs rather than raising its own.","correct":false,"why":"That is a legitimate agent role, but it wastes the capability in question. A remediation agent's value is producing the bounded change, and implementation is a controllable stage."},{"text":"Planning only, so a human writes every line of the actual change.","correct":false,"why":"Planning-only is appropriate for high-risk work such as infrastructure. A routine dependency bump is exactly the reversible, well-checked change agents handle well."}],"takeaway":"Map agents to specific SDLC stages where GitHub can enforce a boundary. Implementation and validation are the usual starting point; deployment stays gated."},{"id":"auth-d1-03","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.1.2","module":"m1","unit":"m1-identify-risks-traceability","type":"single","text":"A team's post-incident review says: \"The agent's PR passed CI, so we merged it. Nobody looked at the blast radius.\" Which anti-pattern does this describe?","options":[{"text":"Planless execution","correct":false,"why":"Planless execution is starting to change code with no inspectable approach. Here the problem is what happened at review time, not at planning time."},{"text":"Over-permissioned agents","correct":false,"why":"Over-permissioning is about the agent's token and tool access being broader than the task requires. Nothing here suggests the agent could do more than it should."},{"text":"Blind trust in automation","correct":true,"why":"\"CI passed, ship it\" is the named anti-pattern. Checks only validate what they were designed to detect; a green build does not mean the change is complete, appropriate, or low risk. The mitigation is combining checks with CODEOWNERS, required reviews, and risk-based approvals."},{"text":"Hidden reasoning","correct":false,"why":"Hidden reasoning is the absence of plan, assumptions, and decision trail. The failure described is trusting the signals that were present, not missing ones."}],"takeaway":"A passing check is evidence, not a verdict. Pair automated signals with ownership routing and risk-proportionate human review."},{"id":"auth-d1-04","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.1.2","module":"m1","unit":"m1-identify-risks-traceability","type":"multi","text":"Which of the following belong in a minimum audit trail for an agent contribution? (Select all that apply.)","options":[{"text":"A stated goal, linked to an issue or captured in the PR description","correct":true,"why":"Yes. Without a stated goal you cannot judge whether the change did what it was supposed to."},{"text":"An inspectable plan and a bounded changeset on a branch","correct":true,"why":"Yes. The plan makes intent reviewable and the bounded changeset keeps scope assessable."},{"text":"Automated evidence (workflow runs and artifacts) plus the human review outcome","correct":true,"why":"Yes. Evidence and judgment are both required - the modules pair objective signals with human decisions."},{"text":"The model name and token count for the agent's inference calls","correct":false,"why":"Interesting telemetry, but not part of the minimum audit trail. The trail is about goal, plan, change, evidence, judgment, and outcome - what a reviewer needs to reconstruct the decision."}],"takeaway":"Minimum audit trail: goal, plan, bounded changeset, automated evidence, human judgment, and a clear outcome (merge, revert, or escalation)."},{"id":"auth-d1-05","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.1.3","module":"m2","unit":"m2-inputs-outputs-success-criteria","type":"single","text":"An agent closes a vulnerability task with a green build, but the vulnerable version is still reachable through a transitive dependency. Which part of the task contract was defective?","options":[{"text":"The inputs - the agent was not given the security alert.","correct":false,"why":"The agent clearly acted on the alert; it produced a change aimed at that dependency. The defect showed up at acceptance, not at input."},{"text":"The success criteria - they measured \"tests pass\" instead of \"the vulnerability is resolved\".","correct":true,"why":"Success criteria must reflect the real intent of the task. \"CI passed\" is necessary but not sufficient; the criterion should be that the security signal is actually resolved, which a transitive path leaves unmet."},{"text":"The outputs - the agent should have produced a report instead of a pull request.","correct":false,"why":"A pull request with a plan and evidence links is the right output shape. Swapping it for a report would not have caught the transitive path."},{"text":"Nothing - transitive dependencies are outside any reasonable task contract.","correct":false,"why":"They are exactly what a well-specified success criterion catches, and dependency review and code scanning surface them."}],"takeaway":"Write success criteria against intent (\"vulnerability resolved\"), not against proxies (\"tests passed\"), and enforce them as required checks."},{"id":"auth-d1-06","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.1.3","module":"m2","unit":"m2-inputs-outputs-success-criteria","type":"single","text":"Which item belongs under Inputs rather than Outputs in an agent task contract?","options":[{"text":"A structured plan in the pull request description","correct":false,"why":"The plan is something the agent produces, so it is an output."},{"text":"Repository scope: changes allowed under src/ and dependency files,
