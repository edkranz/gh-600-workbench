untu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-node@v4\n      - run: npm install -g @github/copilot\n      - name: Run Copilot CLI\n        env:\n          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}\n        run: |\n          copilot -p \"Summarize the current branch in summary.md\" \\\n            --allow-tool='read,search,edit,shell(git:*)' \\\n            --no-ask-user\n          cat summary.md >> \"$GITHUB_STEP_SUMMARY\"\n```\n\nWhat to notice:\n\n*   `COPILOT_GITHUB_TOKEN` authenticates the CLI in GitHub's examples.\n*   `--no-ask-user` avoids CI hangs.\n*   `permissions` should be least privilege.\n\n### `/delegate`, `--autopilot`, And `/fleet`\n\n| Feature | Where work happens | Purpose |\n|---------|-------------------|---------|\n| `--autopilot` | local CLI/runner | continue locally |\n| `/delegate` or `& prompt` | Copilot cloud agent | background cloud task/PR |\n| `/fleet` | CLI orchestration | split into parallel subagents |\n\nExamples:\n\n```\n/delegate fix failing tests and open a draft PR\n```\n\n```\n& investigate why deployment fails\n```\n\n```\n/fleet Review frontend, backend, and workflow tests. Split by area and summarize findings.\n```\n\n### Cloud-Agent Setup\n\nCloud-agent setup file:\n\n```\n.github/workflows/copilot-setup-steps.yml\n```\n\nRequired job name:\n\n```yaml\njobs:\n  copilot-setup-steps:\n```\n\nExample:\n\n```yaml\nname: Copilot Setup Steps\n\non:\n  workflow_dispatch:\n\njobs:\n  copilot-setup-steps:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-node@v4\n        with:\n          node-version: \"22\"\n          cache: npm\n      - run: npm ci\n```\n\nRemember:\n\n*   Setup steps prepare the cloud-agent environment.\n*   They are not the same as an Actions workflow that runs `copilot -p`.\n*   File must be on the default branch.\n*   If setup fails, remaining setup steps are skipped and Copilot starts with current environment.\n\n### Domain 2 Self-Check\n\n*   What is the required field in custom-agent YAML?\n*   What does `search` mean?\n*   Which tool allows sub-agent invocation?\n*   Where does `mcp-servers` go?\n*   What is the difference between `mcp-servers` and `mcpServers`?\n*   What file configures cloud-agent setup?\n*   Why use `--no-ask-user` in CI?\n*   What is the difference between `/delegate` and `/fleet`?\n\n### Domain 2 Additional Traps\n\nTool traps:\n\n*   `search` means repository/file search, not web.\n*   `web` is not a replacement for `search`.\n*   `agent` is needed for custom-agent-to-custom-agent invocation.\n*   `edit` should be omitted for pure review.\n*   `execute` should be omitted if shell execution is not needed.\n*   `tools: [\"*\"]` is usually too broad unless the scenario explicitly says trusted or sandboxed.\n\nMCP traps:\n\n*   `mcp-servers` is YAML inside agent frontmatter.\n*   `mcpServers` is JSON MCP config.\n*   `server/tool` exposes one tool.\n*   `server/*` exposes all tools on one server.\n*   Agents secrets/variables are not the same as Actions secrets.\n*   Firewall allowlist and MCP allowlist solve different problems.\n\nCLI traps:\n\n*   `copilot -p` is noninteractive prompt mode.\n*   `--no-ask-user` matters in CI.\n*   `/delegate` hands work to cloud agent.\n*   `/fleet` splits work into subagents.\n*   `--autopilot` continues locally.\n\nCloud setup traps:\n\n*   `copilot-setup-steps.yml` must have job name `copilot-setup-steps`.\n*   Setup steps prepare the cloud-agent environment.\n*   A workflow that installs Copilot CLI and runs `copilot -p` is separate CI automation.\n\n## 4. Domain 3: Manage Memory, State, And Execution\n\nThis domain is about continuity: what the agent knows now, what persists, what can be resumed, and how stale context is detected.\n\n### Memory Types\n\n| Type | Use |\n|------|-----|\n| Short-term context | Current prompt/session |\n| Copilot Memory | Reusable facts/preferences |\n| Session state | Resumable agent execution |\n| External durable state | PRs, issues, artifacts, logs, files, databases |\n\nUse durable GitHub artifacts when state must be auditable:\n\n*   PR description.\n*   Issue comment.\n*   Workflow artifact.\n*   Session log.\n*   Commit.\n*   Check run.\n*   Audit log.\n\nDo not store secrets in memory, prompts, instructions, or comments.\n\n### Copilot Memory\n\nCopilot Memory can store repository-level facts and user-level preferences.\n\nRemember:\n\n*   Repository facts are scoped to repository.\n*   User preferences differ from repository facts.\n*   Repository facts should be checked against the current branch.\n*   Stale memory can cause wrong conventions.\n\n### Copilot CLI Logs And Session State\n\nDefault root:\n\n```\n~/.copilot/\n```\n\nImportant paths:\n\n| Path | Meaning |\n|------|---------|\n| `~/.copilot/agents/` | user custom agents |\n| `~/.copilot/config.json` | account/auth metadata |\n| `~/.copilot/ide/` | IDE connection state |\n| `~/.copilot/logs/` | process logs |\n| `~/.copilot/logs/process-{timestamp}-{pid}.log` | one process log |\n| `~/.copilot/mcp-config.json` | user MCP config |\n| `~/.copilot/session-state/` | per-session state |\n| `~/.copilot/session-state/<id>/events.jsonl` | session events |\n| `~/.copilot/session-store.db` | indexed session database |\n| `~/.copilot/settings.json` | user settings |\n\nEnvironment overrides:\n\n```\nCOPILOT_HOME\nCOPILOT_CACHE_HOME\n```\n\n`COPILOT_HOME` changes config/state root. `COPILOT_CACHE_HOME` changes cache location.\n\n### Reading CLI Logs\n\nChecklist:\n\n1.  Count unique session IDs.\n2.  Check whether the same session ID is reused.\n3.  Look for `--resume`, `--continue`, `/resume`, or `resume=true`.\n4.  Look for `session-state/<id>/events.jsonl`.\n5.  Look for `Visual Studio Code connected` or `/ide`.\n6.  Look for MCP config load lines.\n7.  Look for disabling flags: `--disable-builtin-mcps`, `--disable-mcp-server`.\n8.  Look for tool calls: `read`, `search`, `edit`, `execute`, `jira/get_issue`.\n\nMock log:\n\n```\n2026-05-24T08:31:03Z session.id=run-101 cwd=/work/repo\n2026-05-24T08:31:04Z ide=Visual Studio Code connected\n2026-05-24T08:31:05Z mcp loaded ~/.copilot/mcp-config.json servers=[github,jira]\n2026-05-24T08:31:15Z tool=search args=\"refund\"\n2026-05-24T08:31:20Z tool=jira/get_issue args=\"PAY-144\"\n```\n\nInterpretation:\n\n*   One session ID: `run-101`.\n*   VS Code/editor is connected.\n*   MCP is enabled with GitHub and Jira.\n*   Agent used repository search and an MCP tool.\n\nMock resume:\n\n```\nsession.id=run-101 resume=true\nloaded ~/.copilot/session-state/run-101/events.jsonl\n```\n\nInterpretation:\n\n*   Existing session was resumed.\n\n### SDK Session Persistence\n\nTypeScript:\n\n```typescript\nconst client = new CopilotClient();\nawait client.start();\n\nconst session = await client.createSession({\n  sessionId: \"review-pr-42\",\n  model: \"gpt-4.1\",\n});\n\nawait session.sendAndWait({ prompt: \"Review this branch.\" });\nawait session.disconnect();\n\nconst resumed = await client.resumeSession(\"review-pr-42\");\n```\n\nPython:\n\n```python\nfrom copilot import CopilotClient, PermissionHandler\n\nclient = CopilotClient()\nawait client.start()\n\nsession = await client.create_session(\n    on_permission_request=PermissionHandler.approve_all,\n    model=\"gpt-4.1\",\n)\n\nresponse = await session.send_and_wait({\"prompt\": \"Summarize this repo.\"})\nprint(response.data.content)\n\nawait client.stop()\n```\n\nRemember:\n\n*   A stable `sessionId` enables resume.\n*   Provider/API keys are not persisted.\n*   In-memory tool state is not persisted.\n*   `disconnect()` keeps session data.\n*   `deleteSession()` permanently deletes session data.\n\n### Context Drift\n\nDrift happens when the agent's assumptions diverge from reality.\n\nCauses:\n\n*   Stale memory.\n*   Old instructions.\n*   Repository changed after task start.\n*   Multiple agents edited same files.\n*   Handoff artifact missing.\n*   Wrong session resumed.\n\nFixes:\n\n*   Re-read files.\n*   Check current branch/ref.\n*   Store handoff notes in PR/artifact.\n*   Update instructions or memory.\n*   Re-run tests/scans.\n*   Use branch isolation and concurrency.\n\n### Domain 3 Scenario Patterns\n\nNew session:\n\n```\nsession.id=abc123\nresume=false\n```\n\nResumed session:\n\n```\nsession.id=abc123\nloaded ~/.copilot/session-state/abc123/events.jsonl\nresume=true\n```\n\nIDE attached:\n\n```\nide=Visual Studio Code connected\n```\n\nMCP enabled:\n\n```\nmcp loaded ~/.copilot/mcp-config.json servers=[github,jira]\n```\n\nMCP disabled:\n\n```\nargv=[\"copilot\",\"--disable-builtin-mcps\",\"-p\",\"review\"]\n```\n\nState storage choices:\n\n| Need | Store in |\n|------|----------|\n| Continue same SDK/CLI session | session ID/session-state |\n| Share plan between workflow jobs | artifact or job output |\n| Preserve review decision | PR comment/review |\n| Preserve long-term repo convention | instructions or repository memory |\n| Preserve audit trail | PR/session/workflow/audit logs |\n\nDomain 3 traps:\n\n*   Memory is not secret storage.\n*   Session persistence is not the same as Copilot Memory.\n*   PR comments/artifacts are better than hidden session context when humans or other agents need the handoff.\n*   Stale memory should be verified against the current branch.\n\n## 5. Domain 4: Evaluation, Error Analysis, And Tuning\n\nEvaluation is evidence-based. The answer is usually in logs, scans, checks, artifacts, or review comments.\n\n### Evaluation Signals\n\n| Signal | What it proves |\n|--------|----------------|\n| Tests | behavior still works |\n| Lint/typecheck | code quality/compile correctness |\n| CodeQL/code scanning | vulnerability detection |\n| Secret scanning | leaked secret detection |\n| Dependency review | dependency risk |\n| Workflow logs | command and environment failures |\n| Workflow artifacts | files/results produced by workflow |\n| Session logs | what the agent did and why |\n| PR comments | human/agent review trail |\n| Audit logs | administrative/security events |\n\n### Root Cause Table\n\n| Symptom | Likely root cause | Fix |\n|---------|-------------------|-----|\n| Agent edits wrong files | scope/tools too broad | narrow tools, path instructions |\n| Agent cannot install dependencies | setup/environment missing | setup steps, package auth, runner fix |\n| Agent cannot reach external service | MCP/secret/firewall issue | check MCP config, secret, firewall |\n| Agent repeats work | missing durable state | session persistence or artifacts |\n| Agent asks questions in CI | interactive prompt | add `--no-ask-user` |\n| Agent uses stale style | stale instructions/memory | update instructions/memory |\n| Agents conflict | shared branch/files | branch ownership, concurrency |\n| Workflow blocked after Copilot push | approval needed | Approve and run workflows |\n| Artifact missing | wrong path/retention/deletion | inspect artifact inputs/logs/audit |\n\n### Tuning Levers\n\nTune instructions when:\n\n*   The style or convention is wrong.\n*   Agent repeatedly ignores local patterns.\n\nTune tools when:\n\n*   The agent lacks required capability.\n*   The agent has too much access.\n*   Wrong external tool is used.\n\nTune setup/environment when:\n\n*   Dependency install fails.\n*   Runner OS/toolchain is wrong.\n*   Firewall blocks needed access.\n\nTune workflow when:\n\n*   Validation is missing.\n*   Artifact output is missing.\n*   Runs overlap or cancel incorrectly.\n*   Human approval should happen earlier.\n\nTune memory/state when:\n\n*   Agent repeats work.\n*   Agent uses stale facts.\n*   Work must resume across sessions.\n\n### Artifact And Audit Evaluation\n\nArtifacts:\n\n```yaml\n- uses: actions/upload-artifact@v4\n  with:\n    name: review-output\n    path: review.md\n    retention-days: 7\n    if-no-files-found: error\n```\n\nDownload:\n\n```yaml\n- uses: actions/download-artifact@v4\n  with:\n    name: review-output\n```\n\nInputs to remember:\n\n| Input | Meaning |\n|-------|---------|\n| `name` | artifact name |\n| `path` | files/directories/globs |\n| `retention-days` | retention period |\n| `if-no-files-found` | `warn`, `error`, `ignore` |\n| `overwrite` | replace same-name artifact |\n| `include-hidden-files` | include hidden files |\n\nManual artifact deletion is logged as:\n\n```\nartifact.destroy\n```\n\nWhere to find who deleted an artifact:\n\n*   Organization audit log or enterprise audit log.\n*   Filter/search event `artifact.destroy`.\n*   Use `actor`, `user`, `repo`, `created_at`, `@timestamp`, `operation_type`, `user_agent`.\n\nExample:\n\n```\naction=artifact.destroy actor=octocat repo=org/app created_at=2026-05-24T09:14:22Z\n```\n\n### Domain 4 Evaluation Examples\n\nWorkflow failure:\n\n```\nnpm ci\nERR! code E401\n```\n\nLikely issue:\n\n*   package registry authentication or missing secret.\n\nBest tuning:\n\n*   fix setup steps, package auth, or secrets.\n*   do not grant broad shell access as the first fix.\n\nSecurity scan failure:\n\n```\nCodeQL detected: path traversal in upload handler\n```\n\nBest response:\n\n*   fix code.\n*   keep CodeQL/check as required.\n*   do not suppress the alert unless validated as a false positive.\n\nAgent tool misuse:\n\n```\ntool=execute command=\"git push origin main\"\n```\n\nBest response:\n\n*   deny direct push with tool policy or hook.\n*   enforce branch protection/rulesets.\n*   instruct agent to open a PR instead.\n\nArtifact missing:\n\n```\nWarning: No files were found with the provided path: review.md\n```\n\nBest response:\n\n*   inspect artifact `path`.\n*   use `if-no-files-found: error` if missing artifact should fail.\n*   confirm the agent wrote the file before upload.\n\nTuning order:\n\n1.  Check prompt/task clarity.\n2.  Check instructions.\n3.  Check tool scope.\n4.  Check setup/environment.\n5.  Check current repo state.\n6.  Check memory/session state.\n7.  Check model choice last, unless docs explicitly point there.\n\n## 6. Domain 5: Orchestrate Multi-Agent Coordination\n\nThis domain asks whether multiple agents can work safely without stepping on each other.\n\n### When To Use Multiple Agents\n\nUse multi-agent coordination when:\n\n*   Work splits cleanly by area.\n*   Agents have different expertise.\n*   Outputs can be merged/reviewed.\n*   Coordination cost is lower than doing it serially.\n\nAvoid multi-agent coordination when:\n\n*   The task is inherently sequential.\n*   Agents must edit the same files.\n*   State handoff is unclear.\n*   Review/integration cost is high.\n\n### Coordination Patterns\n\n| Pattern | Use |\n|---------|-----|\n| Coordinator/worker | one agent plans/integrates, others do bounded tasks |\n| Reviewer/verifier | one implements, another checks |\n| Pipeline | plan -> implement -> review -> consolidate |\n| Matrix | same job runs for multiple areas/agents |\n| `/fleet` | CLI decomposes work into subagents |\n\n### Agent Tool Handoff\n\nGive an orchestrator the `agent` tool:\n\n```yaml\ntools:\n  - read\n  - search\n  - agent\n```\n\nThen describe how to use specialists:\n\n```\nUse reviewer for code quality.\nUse auditor for compliance and traceability.\nConsolidate both outputs.\n```\n\n### Actions Pipeline: Review, Audit, Consolidate\n\n```yaml\nname: Agent review pipeline\n\non:\n  workflow_dispatch:\n    inputs:\n      task:\n        required: true\n        type: string\n\npermissions:\n  contents: read\n\njobs:\n  review:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-node@v4\n      - run: npm install -g @github/copilot\n      - env:\n          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}\n        run: |\n          copilot --agent=reviewer -p \"Review: ${{ inputs.task }}\" --no-ask-user > review.md\n      - uses: actions/upload-artifact@v4\n        with:\n          name: review-output\n          path: review.md\n\n  audit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-node@v4\n      - run: npm install -g @github/copilot\n      - env:\n          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}\n        run: |\n          copilot --agent=auditor -p \"Audit: ${{ inputs.task }}\" --no-ask-user > audit.md\n      - uses: actions/upload-artifact@v4\n        with:\n          name: audit-output\n          path: audit.md\n\n  consolidate:\n    needs: [review, audit]\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/download-artifact@v4\n        with:\n          name: review-output\n      - uses: actions/download-artifact@v4\n        with:\n          name: audit-output\n      - run: |\n          {\n            echo \"# Consolidated result\"\n            cat review.md\n            cat audit.md\n          } >> \"$GITHUB_STEP_SUMMARY\"\n```\n\nWhat to notice:\n\n*   `needs` orders jobs.\n*   Artifacts pass files.\n*   `$GITHUB_STEP_SUMMARY` creates readable output.\n\n### Matrix Agents\n\n```yaml\njobs:\n  agent-check:\n    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n      matrix:\n        agent: [reviewer, auditor]\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-node@v4\n      - run: npm install -g @github/copilot\n      - env:\n          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}\n        run: |\n          copilot --agent=${{ matrix.agent }} \\\n            -p \"Analyze as ${{ matrix.agent }}\" \\\n            --no-ask-user > \"${{ matrix.agent }}.md\"\n      - uses: actions/upload-artifact@v4\n        with:\n          name: ${{ matrix.agent }}-output\n          path: ${{ matrix.agent }}.md\n```\n\nFacts:\n\n*   `matrix.agent` is an array/list of agent names.\n*   `fail-fast: false` prevents one failed matrix job from canceling others.\n*   Matrix can generate up to 256 jobs per workflow run.\n\n### Concurrency For Same PR Branch\n\nScenario: multiple agents commit to the same PR branch. Each commit triggers validation. Only the latest run matters.\n\nUse workflow-level concurrency:\n\n```yaml\nname: Validate agent PR\n\non:\n  pull_request:\n\nconcurrency:\n  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}\n  cancel-in-progress: true\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - run: npm test\n```\n\nWhy:\n\n*   Top-level `concurrency` applies to the whole workflow.\n*   `github.workflow` avoids canceling other workflows.\n*   `github.head_ref` groups by PR source branch.\n*   `github.run_id` is fallback if `head_ref` is unset.\n*   `cancel-in-progress: true` cancels stale runs.\n\nIf every run must happen in order:\n\n```yaml\nconcurrency:\n  group: production-agent-work\n  queue: max\n```\n\nDo not combine `queue: max` with `cancel-in-progress: true`.\n\n### Conflict Prevention\n\nUse:\n\n*   Separate branches.\n*   Disjoint file ownership.\n*   `needs` for ordered work.\n*   Artifacts for handoff.\n*   Concurrency for overlap control.\n*   Required checks/reviews before merge.\n\nAvoid:\n\n*   Agents editing same files at same time.\n*   Hidden handoffs only in chat memory.\n*   Shared mutable state without locking.\n*   Agents reverting each other's changes.\n\n### Domain 5 Handoff Artifacts\n\nGood handoff artifacts:\n\n*   `plan.md`\n*   `review.md`\n*   `audit.md`\n*   PR comment\n*   workflow artifact\n*   `$GITHUB_STEP_SUMMARY`\n*   issue checklist\n*   session link\n\nWeak handoff:\n\n```\nThe first agent told the second agent in chat.\n```\n\nBetter handoff:\n\n```yaml\n- uses: actions/upload-artifact@v4\n  with:\n    name: review-output\n    path: review.md\n```\n\nthen:\n\n```yaml\n- uses: actions/download-artifact@v4\n  with:\n    name: review-output\n```\n\nSame-branch risk:\n\n*   Multiple agents commit to the same PR branch.\n*   Each push triggers workflows.\n*   Older validation runs may become stale.\n\nBest control when latest result is enough:\n\n```yaml\nconcurrency:\n  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}\n  cancel-in-progress: true\n```\n\nBest control when every run must happen:\n\n```yaml\nconcurrency:\n  group: production-agent-work\n  queue: max\n```\n\nDo not combine `queue: max` with `cancel-in-progress: true`.\n\n## 7. Domain 6: Implement Guardrails And Accountability\n\nGuardrails keep agent autonomy safe.\n\n### Control Types\n\n| Type | Examples |\n|------|----------|\n| Preventive | least-privilege tools, branch protection, rulesets, MCP allowlists, firewall, required reviews |\n| Detective | session logs, workflow logs, artifacts, CodeQL, secret scanning, dependency review, audit logs |\n| Corrective | revert PR, stop session, unassign/reassign Copilot, rotate secrets, remove MCP, narrow tools |\n\n### GitHub Controls\n\nUse GitHub as the control plane:\n\n*   Issues define work.\n*   Branches isolate changes.\n*   PRs review changes.\n*   Checks validate changes.\n*   Rulesets and branch protection gate merge.\n*   Environments gate deployments.\n*   Audit logs track administrative/security events.\n*   Session logs explain agent behavior.\n\n### Workflow Approval After Copilot Pushes\n\nIf Copilot pushes workflow changes to a PR, workflows may not automatically run. The reviewer may need to select:\n\n```\nApprove and run workflows\n```\n\nThis is an accountability gate, not a build error.\n\n### Stalled Agent Recovery\n\n| Situation | Action |\n|-----------|--------|\n| PR exists but no progress | Click **View session** |\n| Copilot not responding to PR comment | Comment `@copilot` on open PR assigned to Copilot |\n| User cannot trigger response | Confirm write access |\n| Issue-assigned work stuck | Unassign issue, then reassign Copilot |\n| Stuck replying to comment | Repeat the comment |\n| Workflows not running after Copilot push | Approve and run workflows |\n\n### Hooks\n\nTwo hook families:\n\n| Family | Shape | Names |\n|--------|-------|-------|\n| SDK hooks | code callbacks | `onPreToolUse`, `onPostToolUse` |\n| CLI/cloud hooks | JSON files | `preToolUse`, `postToolUse` |\n\nSDK example:\n\n```typescript\nconst session = await client.createSession({\n  hooks: {\n    onPreToolUse: async (input) => {\n      if (input.toolName === \"execute\" && String(input.toolArgs?.command).includes(\"git push\")) {\n        return {\n          permissionDecision: \"deny\",\n          permissionDecisionReason: \"Open a PR instead of pushing directly.\",\n        };\n      }\n      return { permissionDecision: \"allow\" };\n    },\n  },\n});\n```\n\nCLI/cloud hook:\n\n```json\n{\n  \"version\": 1,\n  \"hooks\": {\n    \"preToolUse\": [\n      {\n        \"type\": \"command\",\n        \"bash\": \"scripts/check-tool.sh\",\n        \"timeoutSec\": 30\n      }\n    ]\n  }\n}\n```\n\nRepository-level hook files live in `.github/hooks/*.json`. Copilot CLI can also load user hooks from `~/.copilot/hooks/` on macOS/Linux or `%USERPROFILE%\\.copilot\\hooks\\` on Windows. Copilot cloud agent only gets the repository hooks from the cloned repo.\n\nHook entries can be command hooks, HTTP hooks, or prompt hooks. For command hooks, the important fields are:\n\n| Field | Meaning |\n|-------|---------|\n| `type` | usually `\"command\"` |\n| `bash` | Unix/Linux/macOS command |\n| `powershell` | Windows PowerShell command |\n| `command` | cross-platform fallback |\n| `cwd` | working directory |\n| `env` | environment variables for the hook |\n| `timeoutSec` | timeout, default is 30 seconds |\n| `matcher` | optional full-match regex for the event-specific value |\n\nCloud-agent hook environment:\n\n*   Cloud-agent hooks run in Linux.\n*   Cloud-agent working directory is `/workspace` when a repo is cloned.\n*   PowerShell-only hook entries are not enough for cloud agent.\n*   Only `bash` or `command` is useful for cloud agent command hooks.\n*   Cloud agent is non-interactive; an `\"ask\"` decision is treated like denial.\n*   Cloud agent does not load user-level hook files, local settings, or plugins.\n*   Hooks do not replace branch protection or required reviews.\n\nHigh-yield hook events:\n\n| Event | Fires when | Study note |\n|-------|------------|-----------|\n| `sessionStart` | new or resumed session begins | payload has `source`, such as `new` or `resume` |\n| `sessionEnd` | session terminates | useful for cleanup/audit summaries |\n| `userPromptSubmitted` | user prompt is submitted | cloud agent sees only the initial job prompt |\n| `preToolUse` | before a tool executes | can allow, deny, ask, or modify args |\n| `postToolUse` | after a successful tool | can add context or modify result |\n| `postToolUseFailure` | after a failed tool | can provide recovery context |\n| `agentStop` | main agent finishes a turn | can block and force another turn |\n| `permissionRequest` | before CLI permission flow | CLI only; not for cloud-agent permissioning |\n| `notification` | CLI notifications | CLI only; fire-and-forget |\n| `subagentStart` | subagent starts | `matcher` filters by agent name |\n| `subagentStop` | subagent completes | can block and force another turn |\n| `errorOccurred` | agent/runtime error occurs | useful for diagnostics; does not approve/deny |\n\nThe hook input shape is important because it is what you must read when inspecting hook logs or configuration:\n\n```json\n{\n  \"sessionId\": \"s-123\",\n  \"timestamp\": 1779500000000,\n  \"cwd\": \"/workspace\",\n  \"toolName\": \"bash\",\n  \"toolArgs\": \"{\\\"command\\\":\\\"git push origin HEAD\\\"}\"\n}\n```\n\nIn some references `toolArgs` is described as `unknown`; in CLI hook scripts it is commonly handled as a JSON string that must be parsed before reading fields such as `command`. If a payload uses PascalCase event names like `PreToolUse`, the compatible field names are snake_case, such as `tool_name` and `tool_input`.\n\nFor `preToolUse`, the hook controls execution by printing JSON to stdout:\n\n```json\n{\n  \"permissionDecision\": \"deny\",\n  \"permissionDecisionReason\": \"Open a pull request instead of pushing directly.\"\n}\n```\n\nValid `preToolUse` decisions are:\n\n| Value | Meaning |\n|-------|---------|\n| `\"allow\"` | tool executes |\n| `\"deny\"` | tool is blocked; include `permissionDecisionReason` |\n| `\"ask\"` | ask user in interactive CLI; treated as deny in cloud agent |\n\n`permissionRequest` is different. It is CLI-only, runs before the CLI permission service, and uses:\n\n```json\n{\n  \"behavior\": \"deny\",\n  \"message\": \"Do not run destructive shell commands.\",\n  \"interrupt\": true\n}\n```\n\nUse `preToolUse` for cloud-agent permission decisions. Do not pick `permissionRequest` as the cloud-agent answer.\n\n`matcher` filters hook invocations. The regex is anchored, so `\"bash|powershell\"` means exactly `bash` or `powershell`, not any string containing those words.\n\n```json\n{\n  \"version\": 1,\n  \"hooks\": {\n    \"preToolUse\": [\n      {\n        \"type\": \"command\",\n        \"matcher\": \"bash|powershell\",\n        \"bash\": \".github/hooks/scripts/pre-tool-policy.sh\",\n        \"powershell\": \".github/hooks/scripts/pre-tool-policy.ps1\",\n        \"timeoutSec\": 30\n      }\n    ]\n  }\n}\n```\n\nHook tool names are lower-level than the custom-agent `tools` list. Memorize this mapping:\n\n| Hook `toolName` | Rough agent capability | Meaning |\n|-----------------|------------------------|---------|\n| `view` | `read` | read file contents |\n| `grep` | `search` | search file contents |\n| `glob` | `search` | find files by pattern |\n| `edit` | `edit` | modify existing files |\n| `create` | `edit` | create files |\n| `bash` | `execute` | run Unix shell commands |\n| `powershell` | `execute` | run Windows PowerShell commands; not cloud agent |\n| `task` | `agent` | run subagent tasks |\n| `web_fetch` | `web` | fetch web pages |\n| `ask_user` | user interaction | not useful in cloud agent |\n\nWhat to notice in YAML, JSON, or log artifacts:\n\n*   If the hook is in `.github/hooks/*.json`, it can apply to both CLI and cloud agent.\n*   If it only has `powershell`, cloud agent will not use it because cloud agent is Linux.\n*   If the question asks to filter a hook to shell execution, use `matcher` against `toolName`, such as `\"bash\"` or `\"bash|powershell\"`.\n*   If the log says `toolName: \"view\"`, that is file reading. It is not a web/search tool.\n*   If the log says `toolName: \"grep\"` or `toolName: \"glob\"`, that is repository search, not internet browsing.\n*   If the hook returns empty output, default behavior continues.\n*   If any `preToolUse` hook returns `\"deny\"`, the tool is blocked.\n*   Hook failures usually fail open; use branch protection, required checks, and reviews for hard enforcement.\n\n### Security Controls\n\nUse:\n\n*   CodeQL/code scanning for code vulnerabilities.\n*   Secret scanning/push protection for secrets.\n*   Dependency review for dependency changes.\n*   Rulesets/branch protection for merge policy.\n*   Environment approvals for deployment.\n*   Audit logs for accountability.\n\n### Auditability Evidence\n\nEvidence includes:\n\n*   PR timeline.\n*   Session logs.\n*   Workflow logs.\n*   Workflow artifacts.\n*   Commit history.\n*   Check runs.\n*   Audit log events.\n\nArtifact deletion:\n\n```\nartifact.destroy\n```\n\nLook in organization/enterprise audit logs.\n\n### Domain 6 Control Selection\n\nChoose the control that enforces the outcome.\n\n| Scenario | Better answer |\n|----------|---------------|\n| prevent direct merge | branch protection or ruleset |\n| require human deploy approval | environment required reviewer |\n| prevent direct shell push | deny tool or pre-tool hook plus branch protection |\n| detect hardcoded secret | secret scanning/push protection |\n| detect vulnerable code | CodeQL/code scanning |\n| review dependency changes | dependency review |\n| restrict MCP servers | MCP registry/allowlist |\n| restrict network egress | firewall allowlist |\n| know who deleted artifact | audit log event `artifact.destroy` |\n| know what agent did | session logs and PR timeline |\n\nPolicy versus guidance:\n\n*   Instructions guide model behavior.\n*   Tool lists limit capabilities.\n*   Hooks intercept behavior.\n*   Workflows validate behavior.\n*   Rulesets/branch protection enforce repository policy.\n*   Audit logs record accountability.\n\nUse multiple layers for high-risk tasks.\n\n## 8. Artifact Reading Labs\n\nThese labs are synthetic study examples based on official product behavior.\n\n### Lab 1: Which Branch Is Checked Out?\n\n```yaml\non:\n  pull_request:\n\njobs:\n  inspect:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n        with:\n          ref: ${{ github.head_ref }}\n      - run: test -f .github/agents/reviewer.agent.md\n```\n\nAnswer:\n\n*   Checks out the PR source branch.\n*   Checks whether the custom agent file exists on that branch.\n\n### Lab 2: Which Runs Are Cancelled?\n\n```yaml\nconcurrency:\n  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}\n  cancel-in-progress: true\n```\n\nAnswer:\n\n*   New runs cancel older in-progress runs with the same workflow and PR branch/fallback group.\n\n### Lab 3: What Can This Agent Do?\n\n```yaml\ntools:\n  - read\n  - search\n  - agent\n```\n\nAnswer:\n\n*   Read files.\n*   Search repository files/text.\n*   Invoke another custom agent.\n*   Cannot edit files unless `edit` is available.\n*   Cannot run shell commands unless `execute` is available.\n\n### Lab 4: Where Does MCP Belong?\n\n```yaml\n---\nname: triage\ndescription: Triage external issue context\ntools:\n  - read\n  - search\n  - sentry/get_issue\nmcp-servers:\n  sentry:\n    type: local\n    command: npx\n    args: [\"-y\", \"sentry-mcp\"]\n    tools: [\"get_issue\"]\n---\n```\n\nAnswer:\n\n*   `mcp-servers` belongs in custom-agent YAML.\n*   `sentry/get_issue` exposes one MCP tool.\n\n### Lab 5: Which Jobs Must Finish?\n\n```yaml\njobs:\n  review:\n    runs-on: ubuntu-latest\n  audit:\n    runs-on: ubuntu-latest\n  consolidate:\n    needs: [review, audit]\n    runs-on: ubuntu-latest\n```\n\nAnswer:\n\n*   `consolidate` waits for `review` and `audit`.\n\n### Lab 6: Who Deleted The Artifact?\n\n```\naction=artifact.destroy actor=octocat repo=org/app created_at=2026-05-24T09:14:22Z\n```\n\nAnswer:\n\n*   A workflow artifact was manually deleted.\n*   Actor is `octocat`.\n*   Timestamp is `2026-05-24T09:14:22Z`.\n\n### Lab 7: New Session Or Resumed Session?\n\n```\nsession.id=abc123\nloaded ~/.copilot/session-state/abc123/events.jsonl\nresume=true\n```\n\nAnswer:\n\n*   Existing session `abc123` was resumed.\n\n### Lab 8: MCP Enabled Or Disabled?\n\n```\nmcp loaded ~/.copilot/mcp-config.json servers=[github,jira]\n```\n\nAnswer:\n\n*   MCP is enabled and loaded servers `github` and `jira`.\n\nCounterexample:\n\n```\nargv=[\"copilot\",\"--disable-builtin-mcps\",\"-p\",\"review\"]\n```\n\nAnswer:\n\n*   Built-in MCP servers are disabled.\n\n### Lab 9: Stalled Copilot PR\n\nScenario:\n\n*   PR has \"Copilot started work.\"\n*   No new commits appear.\n\nAnswer:\n\n*   Click **View session**.\n*   If issue-assigned and stuck, unassign and reassign Copilot.\n*   If workflow approval is blocking, use **Approve and run workflows**.\n\n## 9. Complete Self-Check\n\n### Domain 1\n\n*   What makes a task suitable for an agent?\n*   What artifact proves the plan was reviewed?\n*   What blocks unreviewed merge?\n*   Why is an instruction not the same as a guardrail?\n\n### Domain 2\n\n*   What is the required field in custom-agent YAML?\n*   What does `search` do?\n*   What does `agent` do?\n*   Where does `mcp-servers` go?\n*   What is the difference between `mcp-servers` and `mcpServers`?\n*   What file configures cloud-agent setup?\n*   Why use `--no-ask-user` in CI?\n*   What is the difference between `/delegate`, `/fleet`, and `--autopilot`?\n\n### Domain 3\n\n*   Where do CLI logs live?\n*   Where does session state live?\n*   How do you identify a resumed session?\n*   What causes context drift?\n*   What should be stored as durable state?\n\n### Domain 4\n\n*   Which evidence helps identify root cause?\n*   When should you tune instructions?\n*   When should you tune tools?\n*   When should you tune setup?\n*   What audit event records manual artifact deletion?\n\n### Domain 5\n\n*   When should you use multiple agents?\n*   What does `needs` do?\n*   What does `matrix.agent` represent?\n*   When do you use workflow-level concurrency?\n*   What does `cancel-in-progress: true` do?\n\n### Domain 6\n\n*   Which controls prevent unsafe merges?\n*   Which controls detect secrets?\n*   Which controls detect vulnerable code?\n*   Which logs prove what an agent did?\n*   How do you recover a stalled Copilot task?\n\n## 10. High-Yield Reference Tables\n\n### Files\n\n| Path | Meaning |\n|------|---------|\n| `.github/copilot-instructions.md` | repo instructions |\n| `.github/instructions/*.instructions.md` | path instructions |\n| `AGENTS.md` | agent instructions |\n| `.github/prompts/*.prompt.md` | prompt templates |\n| `.github/agents/*.agent.md` | custom agents |\n| `.github/skills/<skill>/SKILL.md` | skills |\n| `.github/hooks/*.json` | CLI/cloud hooks |\n| `.github/workflows/copilot-setup-steps.yml` | cloud-agent setup |\n| `.vscode/mcp.json` | VS Code MCP config |\n| `.mcp.json` / `.github/mcp.json` | MCP config |\n| `~/.copilot/mcp-config.json` | CLI MCP config |\n| `~/.copilot/logs/` | CLI logs |\n| `~/.copilot/session-state/` | session state |\n\n### Commands And Slash Commands\n\n| Item | Meaning |\n|------|---------|\n| `copilot -p` | noninteractive prompt |\n| `--agent=NAME` | use custom agent |\n| `--allow-tool` | allow tool pattern |\n| `--deny-tool` | deny tool pattern |\n| `--no-ask-user` | no interactive questions |\n| `--autopilot` | local autonomous continuation |\n| `--resume` | resume named session |\n| `--continue` | continue latest session |\n| `/delegate` | hand off to cloud agent |\n| `/fleet` | parallel subagent decomposition |\n| `/session` | inspect current session |\n| `/ide` | inspect IDE connection |\n| `/mcp` | inspect MCP |\n\n### Actions Keys\n\n| Key | Meaning |\n|-----|---------|\n| `on.workflow_dispatch.inputs` | manual inputs |\n| `on.workflow_call` | reusable workflow |\n| `permissions` | `GITHUB_TOKEN` permissions |\n| `jobs.<id>.needs` | dependency jobs |\n| `jobs.<id>.outputs` | job outputs |\n| `$GITHUB_OUTPUT` | step outputs |\n| `$GITHUB_STEP_SUMMARY` | run summary |\n| `strategy.matrix` | matrix jobs |\n| `strategy.fail-fast` | matrix failure behavior |\n| `concurrency.group` | concurrency identity |\n| `cancel-in-progress` | cancel old run |\n| `queue: max` | queue instead of cancel |\n\n### Contexts\n\n| Context | Meaning |\n|---------|---------|\n| `github.head_ref` | PR source branch |\n| `github.base_ref` | PR target branch |\n| `github.ref` | full ref |\n| `github.ref_name` | short ref |\n| `github.sha` | triggering commit |\n| `github.run_id` | unique run ID |\n| `github.run_number` | workflow run number |\n| `github.run_attempt` | rerun attempt |\n| `github.workflow` | workflow name |\n| `github.actor` | original actor |\n| `github.triggering_actor` | rerun actor |\n\n### Audit/Event Terms\n\n| Term | Meaning |\n|------|---------|\n| `artifact.destroy` | workflow artifact manually deleted |\n| `actor` | user/app that performed action |\n| `created_at` / `@timestamp` | when event happened |\n| `repo` / `repository` | affected repository |\n| `operation_type` | type of audit operation |\n| `user_agent` | client used |\n\n## 11. Official Source Map\n\nGH-600:\n\n*   https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/gh-600\n\nCopilot cloud agent:\n\n*   https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent\n*   https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent\n*   https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents\n*   https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment\n*   https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output\n\nCopilot CLI:\n\n*   https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference\n*   https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference\n*   https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/delegate-tasks-to-cca\n*   https://docs.github.com/en/copilot/concepts/agents/copilot-cli/fleet\n*   https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/invoke-custom-agents\n*   https://docs.github.com/en/copilot/how-tos/copilot-cli/connecting-vs-code\n\nCustomization and custom agents:\n\n*   https://docs.github.com/en/copilot/reference/customization-cheat-sheet\n*   https://docs.github.com/en/copilot/reference/custom-agents-configuration\n*   https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/add-skills\n*   https://docs.github.com/en/copilot/concepts/agents/hooks\n*   https://docs.github.com/en/copilot/reference/hooks-reference\n*   https://docs.github.com/en/copilot/tutorials/copilot-cli-hooks\n\nMCP:\n\n*   https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/extend-cloud-agent-with-mcp\n*   https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-mcp-servers\n*   https://docs.github.com/en/copilot/how-tos/copilot-sdk/use-copilot-sdk/mcp-servers\n*   https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-mcp-usage/configure-mcp-server-access\n*   https://docs.github.com/en/copilot/reference/mcp-allowlist-enforcement\n\nGitHub Actions:\n\n*   https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax\n*   https://docs.github.com/en/actions/reference/workflows-and-actions/contexts\n*   https://docs.github.com/en/actions/reference/workflows-and-actions/expressions\n*   https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency\n*   https://docs.github.com/en/actions/concepts/workflows-and-actions/workflow-artifacts\n*   https://docs.github.com/en/actions/how-tos/manage-workflow-runs/remove-workflow-artifacts\n*   https://github.com/actions/checkout\n\nGovernance and security:\n\n*   https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise\n*   https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets\n*   https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments\n*   https://docs.github.com/en/code-security/concepts/code-scanning/about-code-scanning\n*   https://docs.github.com/en/code-security/secret-scanning/about-secret-scanning\n*   https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review\n\n---\n\n**End of GH-600 Public Study Guide**"},{"id":"ref-readme","title":"Study plan and exam logistics","summary":"The four-week study sequence, domain weightings, and exam logistics from the community guide.","source":"Community study guide (jtur671/gh-600-study-guide)","sourceUrl":"https://github.com/jtur671/gh-600-study-guide/blob/main/README.md","markdown":"Free, open study materials for **GH-600 — _Developing in Agentic AI Systems_**, GitHub's\ncertification for engineers who build, operate, and govern AI agents inside the software\ndevelopment lifecycle.\n\n> ⚠️ **Unofficial.** This is an independent, community-made study aid — not affiliated with\n> or endorsed by GitHub or Microsoft. Always cross-check against the\n> [official study guide](https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/gh-600).\n\n📺 **Companion video series (PromptLab)** — a free 7-video walkthrough, one per exam domain\nplus a 20-minute audio overview:\n\n### ▶ [Watch the full GH-600 playlist on YouTube](https://www.youtube.com/playlist?list=PLxgUmxsBhjMhyjJhNM9dxSCdJj2yExS2Y)\n\n---\n\n## The exam at a glance\n\n- **Code:** GH-600 — _Developing in Agentic AI Systems_\n- **Status:** Beta through **May 31, 2026**; general availability **July 2026**\n- **Format:** ~40–60 questions, 120 minutes (+30 min available if you are not testing in your first language)\n- **Passing score:** 700 / 1000\n- **Beta discount:** the first 100 candidates get **80% off** with promo code `GH600Flanders` at registration\n- ⚠️ The beta is **not available** in Turkey, Pakistan, India, or China — confirm regional availability before registering\n- Beta results are scored in **8–12 weeks**; passing the beta earns the same credential as the GA exam\n\n## The six domains\n\n| # | Domain | Weight |\n|---|--------|--------|\n| 1 | Prepare agent architecture & SDLC processes | 15–20% |\n| 2 | Implement tool use & environment interaction | **20–25%** |\n| 3 | Manage memory, state & execution | 10–15% |\n| 4 | Evaluation, error analysis & tuning | 15–20% |\n| 5 | Orchestrate multi-agent coordination | 15–20% |\n| 6 | Guardrails & accountability | 10–15% |\n\nDomain 2 is the heaviest slice of the exam — budget study time proportionally, not evenly.\n\n## What's in this repo\n\n| File | What it is |\n|------|-----------|\n| [`flashcards.md`](flashcards.md) | 67 flashcards, one per skill bullet, grouped by domain |\n| [`mock-exam.md`](mock-exam.md) | 41 practice questions in exam style, with a full answer key |\n| [`lab-guide.md`](lab-guide.md) | 6 hands-on labs for the tool-use and custom-agent domains |\n| [`diagrams.md`](diagrams.md) | 5 Mermaid diagrams of the core concepts |\n| `media/gh-600.apkg` | The 67 flashcards as an Anki deck, tagged by exam domain |\n| `media/nlm-flashcards.apkg` | A second Anki deck (70 cards) |\n| `media/briefing.md`, `study-guide.md`, `faq.md`, `quiz.md` | Condensed study aids |\n| `scripts/` | Python helpers (flashcards → Anki deck, mind map → Mermaid) |\n\n## Suggested 4-week study sequence\n\n**Week 1 — Foundations & vocabulary.** Work through the official\n[Foundations of Agentic AI in GitHub](https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/)\nmodule. Read the [GH-600 study guide](https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/gh-600)\nend to end until phrases like _\"system of record and control plane\"_ are reflexive.\nReview the Domain 1 set in `flashcards.md`.\n\n**Week 2 — Tool use & MCP (the 20–25% domain).** Work through\n[Tooling, MCP, and Agent Execution Environments](https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/).\nDo the MCP labs in `lab-guide.md` — spin up a real MCP server, configure an allow list,\ntest the agent firewall. Review the Domain 2 flashcards.\n\n**Week 3 — Architecture & governance.** Work through\n[Designing Agent Architecture and SDLC Integration](https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/).\nDo the custom-agent and branch-protection labs in `lab-guide.md`. Review the Domain 1 + 6 flashcards.\n\n**Week 4 — Gap closure & mock exam.** Domains 3–5 have no dedicated free module; read the\nofficial docs: [Copilot memory](https://docs.github.com/en/copilot/concepts/agents/copilot-memory) (D3),\nthe [implementation-planner tutorial](https://docs.github.com/en/copilot/tutorials/customization-library/custom-agents/implementation-planner) (D4),\nand the [custom-agents SDK](https://docs.github.com/en/copilot/how-tos/copilot-sdk/use-copilot-sdk/custom-agents) (D5).\nSit `mock-exam.md` under timed conditions, then re-read the source doc for every miss.\n\n## Using the Anki decks\n\nImport `media/gh-600.apkg` (or `nlm-flashcards.apkg`) into [Anki](https://apps.ankiweb.net/).\nCards are tagged `Domain-1` … `Domain-6` so you can study one domain at a time.\nTo regenerate the deck from `flashcards.md`:\n\n```bash\npip install genanki\npython3 scripts/convert_flashcards.py\n```\n\n## Official sources\n\n- [GH-600 study guide](https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/gh-600)\n- [Certification landing page](https://learn.microsoft.com/en-us/credentials/certifications/agentic-ai-developer/)\n- [Microsoft Reactor deep-dive session (May 28, 2026)](https://developer.microsoft.com/en-us/reactor/events/27225/)\n- [Announcement blog](https://techcommunity.microsoft.com/blog/skills-hub-blog/new-github-certified-agentic-ai-developer/4517571)\n\n---\n\nFound this useful? The [video series](https://www.youtube.com/playlist?list=PLxgUmxsBhjMhyjJhNM9dxSCdJj2yExS2Y)\ncovers each domain in depth. Corrections and pull requests are welcome — and don't buy\n\"braindump\" question packs: the beta is under NDA, so any \"leaked questions\" online are\neither fake or stolen."}]}</script>
<script>
/* ==========================================================================
   GH-600 Study — application
   Vanilla JS, hash-routed, no dependencies. Data is inlined at build time.
   ========================================================================== */
(function () {
"use strict";

const DATA = JSON.parse(document.getElementById("gh600-data").textContent);
const { exam, domains, modules, questions, flashcards, reference } = DATA;

/* ---------------------------------------------------------------- indexes */
const DOMAIN = Object.fromEntries(domains.map(d => [d.id, d]));
const MAX_WEIGHT = Math.max(...domains.map(d => d.weightMid));
const MODULE = Object.fromEntries(modules.map(m => [m.id, m]));
const UNIT = {};
modules.forEach(m => m.units.forEach(u => { UNIT[u.id] = Object.assign({ moduleId: m.id }, u); }));
const QUESTION = Object.fromEntries(questions.map(q => [q.id, q]));
const OBJECTIVE = {};
domains.forEach(d => d.groups.forEach(g => g.objectives.forEach(o => {
  OBJECTIVE[o.id] = Object.assign({ domain: d.id, group: g.title }, o);
})));
const REFERENCE = Object.fromEntries(reference.map(r => [r.id, r]));

const qByModule = {}, qByDomain = {}, qByUnit = {}, qByObjective = {};
questions.forEach(q => {
  (qByModule[q.module] ||= []).push(q);
  (qByDomain[q.domain] ||= []).push(q);
  (qByUnit[q.unit] ||= []).push(q);
  (qByObjective[q.objective] ||= []).push(q);
});

const SOURCE_TAG = {
  official:        { label: "Official knowledge check", short: "Official", cls: "tag-accent" },
  "community-mock":{ label: "Community mock exam",      short: "Community", cls: "" },
  "community-quiz":{ label: "Community question bank",  short: "Community", cls: "" },
  authored:        { label: "Written for this guide",   short: "Written here", cls: "" },
  "advanced-guide":{ label: "Advanced implementation guide", short: "Advanced", cls: "tag-warn" }
};

/* ---------------------------------------------------------------- dom help */
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  kids.flat(3).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  });
  return n;
}
const frag = (...kids) => { const f = document.createDocumentFragment(); kids.flat(3).forEach(c => c && f.appendChild(c)); return f; };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const isPhone = () => window.matchMedia("(max-width: 640px)").matches;
const isNarrow = () => window.matchMedia("(max-width: 1040px)").matches;

/** <details> that stays permanently open above a breakpoint. */
function disclose(summaryText, openWhen, ...kids) {
  const d = el("details", { class: "disclose", open: openWhen || null },
    el("summary", { text: summaryText }), ...kids);
  if (openWhen) d.setAttribute("data-always-open", "");
  return d;
}

const ICON = {
  overview: "M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",
  study: "M4 4h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4zM20 4h-3.5a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H20z",
  objectives: "M4 6h16M4 12h16M4 18h10M2 6h.01M2 12h.01M2 18h.01",
  quiz: "M9 9a3 3 0 1 1 4 2.8c-.8.4-1 1-1 1.7v.5M12 17.5h.01M4 4h16v16H4z",
  exam: "M12 2v4M12 2a9 9 0 1 0 9 9M12 12l4.5 3",
  cards: "M7 5h13v11H7zM4 8v11h13",
  search: "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4",
  ref: "M6 3h9l4 4v14H6zM15 3v4h4"
};
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}
function icon(name) {
  const s = svg("svg", { class: "nav-ico", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    "stroke-width": "1.7", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
  s.appendChild(svg("path", { d: ICON[name] }));
  return s;
}

/* ==========================================================================
   Markdown  (subset matching the pandoc-gfm content we ship)
   ========================================================================== */
function inline(src) {
  let s = esc(src);
  const code = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => `␀${code.push(c) - 1}␀`);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (_, a, u) => `<img src="${u}" alt="${a}" loading="lazy">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (_, t, u) => {
    const ext = /^https?:/.test(u);
    return `<a href="${u}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ""}>${t}</a>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s.,;:)])/g, "$1<em>$2</em>");
  s = s.replace(/␀(\d+)␀/g, (_, i) => `<code>${esc(code[+i])}</code>`);
  return s;
}

const LIST_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const CALLOUT_RE = /^(Note|Tip|Important|Warning|Caution)$/;

function markdown(src) {
  const lines = String(src).replace(/\r/g, "").split("\n");
  let out = "", i = 0;

  const flushList = (ordered, depth) => {
    const tag = ordered ? "ol" : "ul";
    let html = `<${tag}>`;
    while (i < lines.length) {
      const m = lines[i].match(LIST_RE);
      if (!m) {
        // blank line inside a list only continues it if a list item follows
        if (lines[i].trim() === "" && lines[i + 1] && LIST_RE.test(lines[i + 1])) { i++; continue; }
        break;
      }
      const ind = m[1].length, isOrd = /\d/.test(m[2][0]);
      if (ind < depth) break;
      if (ind > depth) { html += flushList(isOrd, ind); continue; }
      if (isOrd !== ordered) break;
      i++;
      let body = m[3];
      // soft-wrapped continuation lines
      while (i < lines.length && lines[i].trim() !== "" && !LIST_RE.test(lines[i]) &&
             !/^\s{4,}\S/.test(lines[i]) && !/^\s*(#{1,6}\s|```|\|)/.test(lines[i])) {
        body += " " + lines[i].trim(); i++;
      }
      html += `<li>${inline(body)}`;
      const nx = lines[i] && lines[i].match(LIST_RE);
      if (nx && nx[1].length > depth) html += flushList(/\d/.test(nx[2][0]), nx[1].length);
      html += "</li>";
    }
    return html + `</${tag}>`;
  };

  while (i < lines.length) {
    const line = lines[i];

    if (line.trim() === "") { i++; continue; }

    // fenced code
    const fence = line.match(/^```+\s*(\S*)[ \t]*(.*)$/);
    if (fence) {
      const lang = fence[1] || "", info = fence[2] || "";
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      const body = buf.join("\n");
      if (lang === "svg") {
        // Build-time figures only (scripts/build_extras.py inlines files from
        // src/diagrams/). Never emit unescaped markup from any other source.
        // Hold the drawing at its natural width so labels stay legible; the
        // figure scrolls rather than shrinking the type.
        const vb = body.match(/viewBox="0 0 ([\d.]+)/);
        const floor = vb ? ` style="min-width:${Math.round(+vb[1])}px"` : "";
        out += `<figure class="diagram"><div class="diagram-scroll"${floor}>${body}</div>` +
               `<button type="button" class="btn btn-sm diagram-zoom" data-zoom>Expand diagram</button>` +
               (info ? `<figcaption>${inline(info)}</figcaption>` : "") + `</figure>`;
      } else if (lang === "mermaid") {
        out += `<pre class="mermaid">${esc(body)}</pre>`;
      } else {
        out += `<pre><code class="lang-${esc(lang)}">${esc(body)}</code></pre>`;
      }
      continue;
    }

    // heading
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const lv = Math.min(h[1].length + 1, 6); out += `<h${lv}>${inline(h[2])}</h${lv}>`; i++; continue; }

    // horizontal rule
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out += "<hr>"; i++; continue; }

    // table
    if (line.includes("|") && lines[i + 1] && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<div class=\"tablewrap\"><table><thead><tr>";
      cells(line).forEach(c => { html += `<th>${inline(c)}</th>`; });
      html += "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        html += "<tr>" + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
        i++;
      }
      out += html + "</tbody></table></div>";
      continue;
    }

    // list
    if (LIST_RE.test(line)) {
      const m = line.match(LIST_RE);
      out += flushList(/\d/.test(m[2][0]), m[1].length);
      continue;
    }

    // indented code (4+ spaces, and not a list continuation)
    if (/^\s{4,}\S/.test(line)) {
      const buf = [];
      while (i < lines.length && (/^\s{4,}\S/.test(lines[i]) || (lines[i].trim() === "" && /^\s{4,}\S/.test(lines[i + 1] || "")))) {
        buf.push(lines[i].replace(/^ {4}/, "")); i++;
      }
      out += `<pre><code>${esc(buf.join("\n").replace(/^\\/gm, ""))}</code></pre>`;
      continue;
    }

    // blockquote
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += `<blockquote>${markdown(buf.join("\n"))}</blockquote>`;
      continue;
    }

    // Learn renders "Note" / "Tip" as a standalone word above the callout body
    if (CALLOUT_RE.test(line.trim())) {
      let j = i + 1;
      while (j < lines.length && lines[j].trim() === "") j++;
      if (j < lines.length && !/^(#{1,6}\s|```)/.test(lines[j])) {
        const kind = line.trim();
        const buf = [];
        i = j;
        while (i < lines.length && lines[i].trim() !== "") buf.push(lines[i++]);
        out += `<div class="callout"><strong>${kind}</strong> ${inline(buf.join(" "))}</div>`;
        continue;
      }
    }

    // paragraph
    const buf = [];
    while (i < lines.length && lines[i].trim() !== "" && !LIST_RE.test(lines[i]) &&
           !/^(#{1,6}\s|```|>|\s{4,}\S)/.test(lines[i]) &&
           !(lines[i].includes("|") && lines[i + 1] && /^\s*\|?[\s:|-]+\|/.test(lines[i + 1]))) {
      buf.push(lines[i++]);
    }
    if (buf.length) out += `<p>${inline(buf.join(" "))}</p>`;
    else i++;
  }
  return out;
}

/* ==========================================================================
   Persistence
   ========================================================================== */
const KEY = "gh600-study.v1";
const store = {
  data: { read: {}, answers: {}, flagged: {}, exams: [], cards: {}, theme: "system" },
  load() {
    try { Object.assign(this.data, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { /* first run */ }
  },
  save() {
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* quota or private mode */ }
  },
  record(qid, correct, picked) {
    this.data.answers[qid] = { correct, picked, at: Date.now() };
    this.save();
  },
  toggleFlag(qid) {
    if (this.data.flagged[qid]) delete this.data.flagged[qid]; else this.data.flagged[qid] = 1;
    this.save();
  },
  markRead(unitId) { this.data.read[unitId] = 1; this.save(); },
  reset() { this.data = { read: {}, answers: {}, flagged: {}, exams: [], cards: {}, theme: this.data.theme }; this.save(); }
};
store.load();

const answered = qid => store.data.answers[qid];
/** The unit most of an objective's questions point at - the best "read this" link. */
function modalUnit(list) {
  const tally = {};
  list.forEach(q => { tally[q.unit] = (tally[q.unit] || 0) + 1; });
  return Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
}

function statsFor(list) {
  let seen = 0, right = 0;
  list.forEach(q => { const a = answered(q.id); if (a) { seen++; if (a.correct) right++; } });
  return { total: list.length, seen, right, pct: pct(right, seen) };
}

/* ==========================================================================
   Theme
   ========================================================================== */
function applyTheme(mode) {
  store.data.theme = mode; store.save();
  const root = document.documentElement;
  if (mode === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", mode);
  document.querySelectorAll(".theme-row button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
}

/* ==========================================================================
   Quiz session
   ========================================================================== */
let session = null;

function startSession(cfg) {
  session = {
    title: cfg.title,
    subtitle: cfg.subtitle || "",
    mode: cfg.mode,                    // "practice" | "exam"
    questions: cfg.questions,
    picked: cfg.questions.map(() => []),
    checked: cfg.questions.map(() => false),
    index: 0,
    startedAt: Date.now(),
    limitMs: cfg.limitMs || 0,
    finished: false
  };
  location.hash = cfg.mode === "exam" ? "#/exam/run" : "#/quiz/run";
}

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor((rng ? rng() : Math.random()) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isCorrect(q, picked) {
  const want = q.options.map((o, i) => (o.correct ? i : -1)).filter(i => i >= 0);
  return want.length === picked.length && want.every(i => picked.includes(i));
}

/** Weighted sample across domains, honouring the published exam percentages. */
function buildExam(size) {
  const weights = domains.map(d => d.weightMid);
  const raw = weights.map(w => (w / 100) * size);
  const counts = raw.map(Math.floor);
  let left = size - counts.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - counts[i], i]).sort((a, b) => b[0] - a[0])
     .forEach(([, i]) => { if (left > 0) { counts[i]++; left--; } });

  const picked = [];
  domains.forEach((d, i) => {
    const pool = shuffle(qByDomain[d.id] || []);
    // lead with official items, then everything else, so each domain's
    // sample is anchored in the module authors' own questions
    pool.sort((a, b) => (a.source === "official" ? -1 : 0) - (b.source === "official" ? -1 : 0));
    picked.push(...pool.slice(0, counts[i]));
  });
  return shuffle(picked);
}

/* ==========================================================================
   Shared components
   ========================================================================== */
function pageHead(eyebrow, title, lede) {
  return el("header", { class: "page-head" },
    eyebrow && el("div", { class: "eyebrow", text: eyebrow }),
    el("h1", { class: "page-title", text: title }),
    lede && el("p", { class: "page-lede", text: lede }));
}

function meter(value, cls) {
  return el("div", { class: "meter " + (cls || "") }, el("i", { style: `width:${Math.max(0, Math.min(100, value))}%` }));
}

function sourceTag(q) {
  const s = SOURCE_TAG[q.source];
  return el("span", { class: "tag " + s.cls, title: q.sourceLabel }, s.short);
}

function domainTag(id) {
  const d = DOMAIN[id];
  return el("span", { class: "tag", title: d.title }, "D" + d.number);
}

/* ==========================================================================
   View: Overview
   ========================================================================== */
function viewOverview() {
  const all = statsFor(questions);
  const readCount = modules.reduce((n, m) => n + m.units.filter(u => store.data.read[u.id]).length, 0);
  const unitTotal = modules.reduce((n, m) => n + m.units.length, 0);
  const attempts = store.data.exams;
  const last = attempts[attempts.length - 1];

  const domainRows = domains.map(d => {
    const s = statsFor(qByDomain[d.id] || []);
    const cls = s.seen === 0 ? "" : s.pct >= 80 ? "good" : s.pct >= 60 ? "warn" : "bad";
    return el("a", { class: "dom-row", href: `#/quiz/domain/${d.id}` },
      el("span", { class: "dom-num", text: d.number }),
      el("span", {},
        el("div", { class: "dom-name", text: d.title }),
        el("div", { class: "dom-sub", text: `${(qByDomain[d.id] || []).length} questions · ${d.groups.reduce((n, g) => n + g.objectives.length, 0)} objectives` })),
      el("span", { class: "dom-weight" },
        el("span", { class: "dom-weight-n", text: d.weight + " weight" }),
        meter((d.weightMid / MAX_WEIGHT) * 100)),
      el("span", { class: "dom-score" },
        el("span", { class: "dom-score-n", text: s.seen ? `${s.pct}% correct · ${s.seen}/${s.total} tried` : "not started" }),
        meter(s.seen ? s.pct : 0, cls)));
  });

  // weakest domain with at least a few answers
  const ranked = domains.map(d => ({ d, s: statsFor(qByDomain[d.id] || []) }))
                        .filter(x => x.s.seen >= 3).sort((a, b) => a.s.pct - b.s.pct);
  const weak = ranked[0];

  return frag(
    pageHead(exam.credential, "GH-600 exam workbench",
      `Everything the two official learning paths teach, every knowledge-check question they ask, and ${questions.length} practice questions mapped to all ${Object.keys(OBJECTIVE).length} published objectives.`),

function unitToc(currentId) {
  const box = el("nav", { class: "toc card", "aria-label": "Course contents" });
  modules.forEach(m => {
    const done = m.units.filter(u => store.data.read[u.id]).length;
    box.appendChild(el("div", { class: "toc-mod" },
      el("div", { class: "toc-mod-title", text: m.title }),
      el("div", { class: "toc-mod-meta", text: `${m.domains.map(d => "D" + DOMAIN[d].number).join(" · ")} — ${done}/${m.units.length} read` })));
    m.units.forEach(u => {
      box.appendChild(el("a", {
        href: "#/study/" + u.id,
        class: store.data.read[u.id] ? "done" : "",
        "aria-current": u.id === currentId ? "page" : null
      },
        el("span", { class: "toc-dot" }),
        el("span", { text: u.title }),
        u.kind !== "reading" ? el("span", { class: "toc-kind", text: u.kind === "knowledge-check" ? "check" : "lab" }) : null));
    });
  });
  return box;
}

function viewStudy(unitId, fromQid) {
  if (!unitId) unitId = modules[0].units[0].id;
  const u = UNIT[unitId];
  if (!u) return notFound("That unit does not exist.");
  const m = MODULE[u.moduleId];
  const idx = m.units.findIndex(x => x.id === u.id);
  const flat = modules.flatMap(mm => mm.units);
  const pos = flat.findIndex(x => x.id === u.id);
  const prev = flat[pos - 1], next = flat[pos + 1];
  const tests = qByUnit[u.id] || [];
  const fromQ = fromQid && QUESTION[fromQid];

  store.markRead(u.id);

  const body = el("div", { class: "study-body" },
    fromQ ? el("div", { class: "from-q" },
      el("span", {}, el("b", {}, "You came from a question: "), fromQ.text)) : null,

    el("div", { class: "unit-head" },
      el("div", { class: "row" },
        el("span", { class: "eyebrow", text: m.title }),
        el("span", { class: "tag" }, m.domains.map(d => "Domain " + DOMAIN[d].number).join(" / ")),
        u.minutes ? el("span", { class: "tag" }, u.minutes + " min") : null),
      el("h1", { class: "unit-title", text: u.title }),
      el("div", { class: "row" },
        el("span", { class: "sec-note", text: `Unit ${idx + 1} of ${m.units.length}` }),
        el("a", { class: "sec-note", href: u.url, target: "_blank", rel: "noopener noreferrer" }, "View on Microsoft Learn ↗"))),

    u.kind === "knowledge-check"
      ? el("div", { class: "card pad", style: "display:flex;flex-direction:column;gap:12px" },
          el("p", { text: `This unit is the module's knowledge check — ${(qByModule[m.id] || []).filter(q => q.source === "official").length} questions with the module authors' own explanations.` }),
          el("a", { class: "btn btn-primary", href: `#/quiz/module/${m.id}` }, "Take the " + m.title + " quiz"))
      : el("div", { class: "md", html: markdown(u.markdown) }),

    el("div", { class: "unit-foot" },
      tests.length ? el("div", { class: "card pad", style: "display:flex;gap:14px;align-items:center;flex-wrap:wrap" },
        el("div", { style: "flex:1;min-width:200px" },
          el("div", { class: "eyebrow", text: "Check yourself" }),
          el("div", { style: "font-size:14.5px;margin-top:2px", text: `${tests.length} question${tests.length > 1 ? "s" : ""} in the bank test this unit.` })),
        el("a", { class: "btn btn-primary", href: `#/quiz/unit/${u.id}` }, "Quiz this unit")) : null,
      el("div", { class: "row" },
        prev ? el("a", { class: "btn btn-sm", href: "#/study/" + prev.id }, "← " + prev.title) : null,
        el("span", { class: "spacer" }),
        next ? el("a", { class: "btn btn-sm", href: "#/study/" + next.id }, next.title + " →") : null)));

  const toc = unitToc(u.id);
  if (isNarrow()) {
    const wrap = disclose(`Browse all ${flat.length} units`, false, toc);
    wrap.classList.add("toc-wrap");
    return el("div", { class: "study" }, body, wrap);
  }
  return el("div", { class: "study" }, body, toc);
}

function resolveQuizSet(kind, id) {
  if (kind === "module") { const m = MODULE[id]; return m && { title: m.title, subtitle: "Module quiz", questions: qByModule[id] || [] }; }
  if (kind === "domain") { const d = DOMAIN[id]; return d && { title: `Domain ${d.number} — ${d.title}`, subtitle: d.weight + " of the exam", questions: qByDomain[id] || [] }; }
  if (kind === "unit")   { const u = UNIT[id]; return u && { title: u.title, subtitle: "Unit quiz — " + MODULE[u.moduleId].title, questions: qByUnit[id] || [] }; }
  if (kind === "set") {
    const sets = {
      official: ["Official knowledge checks", questions.filter(q => q.source === "official")],
      missed:   ["Everything you got wrong", questions.filter(q => answered(q.id) && !answered(q.id).correct)],
      flagged:  ["Flagged for review", questions.filter(q => store.data.flagged[q.id])],
      unseen:   ["Not yet attempted", questions.filter(q => !answered(q.id))],
      all:      ["Full question bank", shuffle(questions)],
      advanced: ["Advanced tier", questions.filter(q => q.difficulty === "advanced")],
      standard: ["Module-level bank", questions.filter(q => q.difficulty !== "advanced")]
    };
    const s = sets[id];
    return s && { title: s[0], subtitle: s[1].length + " questions", questions: s[1] };
  }
  return null;
}

/* ==========================================================================
   View: Quiz / exam runner
   ========================================================================== */
let timerHandle = null;

function viewRunner() {
  if (!session) return notFound("No quiz in progress.", "#/quiz");
  if (session.finished) return viewSessionResult();

  const i = session.index;
  const q = session.questions[i];
  const picked = session.picked[i];
  const checked = session.checked[i];
  const isExam = session.mode === "exam";
  const multi = q.type === "multi";

  const paletteGrid = el("div", { class: "palette" }, session.questions.map((qq, n) => {
    const cls = ["palette-btn"];
    if (n === i) cls.push("current");
    if (session.checked[n]) cls.push(isCorrect(session.questions[n], session.picked[n]) ? "correct" : "wrong");
    else if (session.picked[n].length) cls.push("answered");
    return el("button", {
      class: cls.join(" "),
      title: (store.data.flagged[qq.id] ? "flagged · " : "") + "question " + (n + 1),
      onclick: () => { session.index = n; render(); }
    }, store.data.flagged[qq.id] ? "•" + (n + 1) : String(n + 1));
  }));
  const answeredNow = session.picked.filter(p => p.length).length;
  const palette = disclose(
    `Jump to question — ${answeredNow}/${session.questions.length} answered`,
    !isPhone(), paletteGrid);

  const opts = el("div", { class: "opts" }, q.options.map((o, n) => {
    const cls = ["opt"];
    if (checked) {
      if (o.correct) cls.push("is-correct");
      else if (picked.includes(n)) cls.push("is-wrong");
    } else if (picked.includes(n)) cls.push("picked");

    return el("button", {
      class: cls.join(" "),
      disabled: checked || null,
      "aria-pressed": String(picked.includes(n)),
      onclick: () => {
        if (session.checked[i]) return;
        if (multi) {
          const at = picked.indexOf(n);
          if (at >= 0) picked.splice(at, 1); else picked.push(n);
        } else {
          session.picked[i] = [n];
          if (!isExam) { commit(); return; }
        }
        render();
      }
    },
      el("span", { class: "opt-key", text: String.fromCharCode(65 + n) }),
      el("span", { class: "opt-body" },
        el("span", { class: "opt-text", html: inline(o.text) }),
        checked ? el("span", { class: "opt-why" },
          el("span", { class: "opt-verdict", text: o.correct ? "Correct answer — " : "Not this — " }),
          el("span", { html: inline(o.why) })) : null));
  }));

  function commit() {
    session.checked[i] = true;
    const ok = isCorrect(q, session.picked[i]);
    store.record(q.id, ok, session.picked[i].slice());
    render();
  }

  const unit = UNIT[q.unit];
  const feedback = checked ? el("div", { class: "feedback" },
    el("div", { class: "verdict-strip " + (isCorrect(q, picked) ? "ok" : "no") },
      isCorrect(q, picked) ? "Correct" : (picked.length ? "Not quite" : "No answer given")),
    q.takeaway ? el("div", { class: "takeaway" }, el("b", {}, "Remember this"), el("span", { html: inline(q.takeaway) })) : null,
    el("div", { class: "source-links" },
      // advanced items are not taught by the Learn modules, so send the reader
      // to the guide they actually come from and keep the unit as context
      q.source === "advanced-guide"
        ? el("a", { class: "btn btn-sm btn-primary", href: "#/reference/ref-advanced" }, "Read the advanced guide →")
        : (unit ? el("a", { class: "btn btn-sm btn-primary", href: `#/study/${unit.id}?from=${q.id}` }, "Read where this is taught →") : null),
      q.source === "advanced-guide" && unit
        ? el("a", { class: "btn btn-sm", href: `#/study/${unit.id}?from=${q.id}` }, "Related unit")
        : null,
      unit ? el("a", { class: "btn btn-sm", href: unit.url, target: "_blank", rel: "noopener noreferrer" }, "On Microsoft Learn ↗") : null,
      q.sourceUrl ? el("a", { class: "btn btn-sm", href: q.sourceUrl, target: "_blank", rel: "noopener noreferrer" }, "Question source ↗") : null,
      el("a", { class: "btn btn-sm", href: "#/objectives" }, "Objective " + q.objective))) : null;

  const last = i === session.questions.length - 1;
  const nav = el("div", { class: "qnav" },
    el("button", { class: "btn", disabled: i === 0 || null, onclick: () => { session.index--; render(); } }, "← Previous"),
    (!checked && !isExam)
      ? el("button", { class: "btn btn-primary", disabled: !picked.length || null, onclick: commit }, "Check answer")
      : null,
    el("button", {
      class: "btn " + (checked || isExam ? "btn-primary" : ""),
      disabled: last && !isExam && !checked ? null : null,
      onclick: () => { if (last) finishSession(); else { session.index++; render(); } }
    }, last ? (isExam ? "Finish exam" : "See results") : "Next →"),
    el("span", { class: "spacer" }),
    el("button", {
      class: "btn btn-sm btn-ghost",
      onclick: () => { store.toggleFlag(q.id); render(); }
    }, store.data.flagged[q.id] ? "★ Flagged" : "☆ Flag"));

  const answeredCount = session.picked.filter(p => p.length).length;

  return el("div", { class: "wrap-narrow" },
    el("div", { class: "qbar" },
      el("div", {},
        el("div", { class: "qbar-title", text: session.title }),
        el("div", { class: "qbar-meta", text: `Question ${i + 1} of ${session.questions.length} · ${answeredCount} answered` })),
      el("span", { class: "spacer" }),
      isExam ? el("span", { class: "timer", id: "timer" }, "--:--") : null,
      el("a", { class: "btn btn-sm", href: isExam ? "#/exam" : "#/quiz",
        onclick: e => { if (!confirm("Leave this " + (isExam ? "exam" : "quiz") + "? Answers you have already checked are saved.")) e.preventDefault(); else session = null; } }, "Exit")),
    meter(pct(i + 1, session.questions.length)),
    palette,
    el("div", { class: "card qcard" },
      el("div", { class: "q-meta" },
        domainTag(q.domain), sourceTag(q),
        el("span", { class: "tag", title: OBJECTIVE[q.objective] ? OBJECTIVE[q.objective].text : "" }, q.objective),
        q.beyondModules ? el("span", { class: "tag tag-warn", title: "Drawn from GitHub product documentation rather than the Learn modules" }, "Beyond modules") : null,
        q.difficulty === "advanced" ? el("span", { class: "tag tag-bad", title: "Implementation-level: exact keys, flags, and behaviours" }, "Hard") : null,
        multi ? el("span", { class: "q-multi", text: "select all that apply" }) : null),
      el("p", { class: "q-text", html: inline(q.text) }),
      q.hint && !checked ? el("p", { class: "q-hint", text: "Hint: " + q.hint }) : null,
      opts, feedback, nav));
}

function finishSession() {
  // grade anything left unchecked (exam mode never reveals as you go)
  session.questions.forEach((q, n) => {
    if (!session.checked[n]) {
      session.checked[n] = true;
      store.record(q.id, isCorrect(q, session.picked[n]), session.picked[n].slice());
    }
  });
  session.finished = true;

  if (session.mode === "exam") {
    const right = session.questions.filter((q, n) => isCorrect(q, session.picked[n])).length;
    const total = session.questions.length;
    const raw = pct(right, total);
    const scaled = raw <= 70 ? Math.round((raw / 70) * 700) : Math.round(700 + ((raw - 70) / 30) * 300);
    const byDomain = {};
    domains.forEach(d => { byDomain[d.id] = { right: 0, total: 0 }; });
    session.questions.forEach((q, n) => {
      byDomain[q.domain].total++;
      if (isCorrect(q, session.picked[n])) byDomain[q.domain].right++;
    });
    store.data.exams.push({
      at: Date.now(), right, total, raw, scaled, byDomain,
      ids: session.questions.map(q => q.id),
      picked: session.picked
    });
    store.save();
    session = null;
    location.hash = "#/exam/result/" + (store.data.exams.length - 1);
    return;
  }
  render();
}

function viewSessionResult() {
  const right = session.questions.filter((q, n) => isCorrect(q, session.picked[n])).length;
  const total = session.questions.length;
  const missed = session.questions.map((q, n) => ({ q, ok: isCorrect(q, session.picked[n]) })).filter(x => !x.ok);

  return el("div", { class: "wrap-narrow" },
