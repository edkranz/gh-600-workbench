 but not infra/ unless explicitly requested","correct":true,"why":"Scope and constraints are what the agent receives before it starts - alongside the issue context and boundaries. They define the box the agent works inside."},{"text":"A bounded changeset of commits on an agent branch","correct":false,"why":"Commits are produced by the work, so they are an output."},{"text":"Evidence links to the workflow run","correct":false,"why":"Evidence is generated during execution and attached to the PR, making it an output."}],"takeaway":"Inputs are context, constraints, and boundaries. Outputs are plan, changeset, and evidence. Success criteria are how the outputs get judged."},{"id":"auth-d1-07","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.2.1","module":"m2","unit":"m2-plan-reason-execution","type":"single","text":"Your team runs a plan-first pull request workflow for infrastructure changes and a plan-plus-execution workflow for application code. What is the actual difference between the two?","options":[{"text":"Plan-first requires review; plan-plus-execution does not.","correct":false,"why":"Both are reviewed. GitHub's merge controls - required checks, CODEOWNERS, branch protection - apply identically to both."},{"text":"Plan-first uses pull requests; plan-plus-execution pushes directly to the default branch.","correct":false,"why":"Neither pattern pushes to the default branch. Both converge on a pull request as the governance surface."},{"text":"The timing of human validation relative to code generation.","correct":true,"why":"Both options use the same controls; the choice is when the system allows code to be generated relative to human validation. Plan-first approves intent before any code exists, which reduces early exposure. Plan-plus-execution generates code immediately but still cannot merge without approval."},{"text":"Plan-first uses a read-only agent; plan-plus-execution grants write access to main.","correct":false,"why":"A read-only planning agent is one way to enforce the capability boundary, but it is not what distinguishes the two workflows, and neither grants write access to main."}],"takeaway":"The choice is not whether work is reviewed - it always is. It is when code is allowed to exist relative to human validation."},{"id":"auth-d1-08","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.2.1","module":"m2","unit":"m2-plan-reason-execution","type":"single","text":"A planning agent's instructions say \"do not edit any files during planning\", but it occasionally edits files anyway. What is the correct fix?","options":[{"text":"Restate the instruction more forcefully and add it to the repository instructions file.","correct":false,"why":"The modules are explicit: treat \"instructions not to edit\" as guidance, not enforcement. Restating guidance does not make it a control."},{"text":"Limit the planning agent to a read-only toolset so file modification is not an available capability.","correct":true,"why":"Capability boundaries are enforcement. A planning agent restricted to read-only tools cannot modify files regardless of what it reasons. Execution then happens through an explicit handoff to an implementation agent after the plan is approved."},{"text":"Add a required status check that fails when the planning PR contains code changes.","correct":false,"why":"This is a useful backstop, but it catches the violation after the fact rather than preventing it. Tool allowlists stop the action from happening at all."},{"text":"Switch the planning agent to a model that follows instructions more reliably.","correct":false,"why":"This reduces frequency and still relies on model compliance. The published guidance is to enforce with allowlists and gates, not to rely on reasoning."}],"takeaway":"Treat instructions as guidance and tool allowlists or gates as enforcement. If the platform cannot enforce it, it will eventually be bypassed."},{"id":"auth-d1-09","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.2.2","module":"m2","unit":"m2-pull-request-governance-controls","type":"multi","text":"Your pull request template must force every agent PR to carry a usable structured plan. Which sections most directly serve that goal? (Select all that apply.)","options":[{"text":"Goal and scope (paths/files to be changed)","correct":true,"why":"Yes. Goal and scope let a reviewer check the changeset against declared intent - the core of plan validation."},{"text":"Verifiable success criteria as a checklist","correct":true,"why":"Yes. Criteria written as checkable items turn a narrative plan into something a reviewer, and often a check, can evaluate objectively."},{"text":"Risks, mitigations, and a rollback or escalation plan","correct":true,"why":"Yes. The modules call out rollback and escalation explicitly - a plan that cannot be undone is not a complete plan."},{"text":"A rendering of the full diff pasted into the description","correct":false,"why":"No. The diff is already visible in the Files tab. Duplicating it adds noise and tells the reviewer nothing about intent."}],"takeaway":"A structured plan states goal, scope, steps, verifiable success criteria, risks, and a rollback or escalation path."},{"id":"auth-d1-10","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.2.2","module":"m2","unit":"m2-reliable-workflows","type":"single","text":"A planning job produces a plan that a later job in the same workflow must consume. What is the correct mechanism?","options":[{"text":"Echo the plan to the job log and have the downstream job parse the log.","correct":false,"why":"Logs are not a data contract. The modules are explicit that data downstream steps must consume should be an explicit output, not \"just logs\"."},{"text":"Declare a job output on the plan job and reference it from the dependent job via needs.","correct":true,"why":"Job outputs pass values across jobs through job dependencies: the plan job declares outputs, and the dependent job reads needs.plan.outputs.plan. Step outputs cover the same-job case; environment variables configure runtime behavior rather than carrying structured data."},{"text":"Write the plan into an environment variable at workflow level.","correct":false,"why":"Environment variables configure runtime behavior. They are not the mechanism for structured data flow between jobs."},{"text":"Commit the plan file back to the branch so the next job can check it out.","correct":false,"why":"Committing generated files back to the repository pollutes history. Artifacts (upload where produced, download where consumed) or job outputs are the intended patterns."}],"takeaway":"Step outputs move data within a job; job outputs plus needs move it across jobs; artifacts carry files. Logs are for humans."},{"id":"auth-d1-11","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.2.3","module":"m2","unit":"m2-pull-request-governance-controls","type":"single","text":"Your repository has a pull request template with a required Plan section, but agent PRs still merge with the section left empty. What converts this expectation into a guarantee?","options":[{"text":"Make the template's fields required in repository settings.","correct":false,"why":"Pull request templates prefill the description; they do not validate that a contributor filled anything in."},{"text":"Add a plan-gate workflow that fails when the plan is missing, and mark it as a required status check via rulesets or branch protection.","correct":true,"why":"This is the published pattern: a check that validates the plan exists, promoted to a required status check by an administrator. That turns a process expectation into a system guarantee - the PR cannot merge without it."},{"text":"Add a CODEOWNERS entry for the pull request template file.","correct":false,"why":"CODEOWNERS routes review when that file itself changes. It has no effect on whether an individual PR body contains a plan."},{"text":"Ask the agent to self-check its description before opening the PR.","correct":false,"why":"Self-checking is voluntary behavior. Governance in GitHub is enforced through policy, not trust."}],"takeaway":"Templates encourage; required checks enforce. Validate the plan in CI and make that check required."},{"id":"auth-d1-12","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.2.3","module":"m2","unit":"m2-plan-reason-execution","type":"single","text":"A reviewer is validating an agent's plan before approving execution. Which check is the most direct test of the plan's quality?","options":[{"text":"Whether the plan is shorter than one page.","correct":false,"why":"Length is not a quality signal. A short plan that omits scope and rollback is worse than a longer complete one."},{"text":"Whether the declared scope, success criteria, and rollback path match the risk of the change.","correct":true,"why":"Plan validation asks whether intent is stated clearly enough to judge: what will change, how you will know it worked, and what happens if it does not. High-risk work needs proportionally stronger criteria and an explicit rollback or escalation path."},{"text":"Whether the agent expressed high confidence in the approach.","correct":false,"why":"Agent confidence is exactly the signal the modules tell you not to rely on. Evaluation must be grounded in system signals and stated criteria."},{"text":"Whether the plan names the model that generated it.","correct":false,"why":"Provenance metadata is useful for auditing but says nothing about whether the approach is sound."}],"takeaway":"Validate a plan against scope, verifiable success criteria, and a rollback path proportionate to the change's risk."},{"id":"auth-d1-13","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.2.4","module":"m2","unit":"m2-plan-reason-execution","type":"single","text":"In an automated orchestration, you need the agent to produce a plan and then genuinely stop until that plan is accepted. Which design achieves this?","options":[{"text":"Run planning and execution in one job and add a log line saying \"awaiting approval\".","correct":false,"why":"Nothing pauses. The job continues past the log line and executes the unapproved plan."},{"text":"Force the planning phase to run with tools disabled, then enable execution tools only after the plan is accepted.","correct":true,"why":"This is tool gating in orchestrators: planning runs without tool execution, and tools are enabled only once the plan is accepted. Combined with an explicit handoff to an implementation agent, the transition becomes deliberate rather than implicit."},{"text":"Give the planning agent write access but instruct it to wait for a comment on the PR.","correct":false,"why":"The capability still exists, so the boundary depends on the agent choosing to honor it. Capability boundaries beat instructions."},{"text":"Set a long timeout-minutes on the execution job so a human has time to intervene.","correct":false,"why":"A timeout is a deadline, not an approval gate. If nobody intervenes in time, the unapproved work still runs."}],"takeaway":"Prevent premature action with capability boundaries and explicit transitions - tool gating, plan-mode workflows, environment approvals - not with instructions to wait."},{"id":"auth-d1-14","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.2.4","module":"m1","unit":"m1-describe-github-system-record-control-plane","type":"single","text":"For pull requests from untrusted contributors and agents, GitHub can require a human to click \"Approve and run workflows\" before any workflow executes. What risk does this guardrail primarily address?","options":[{"text":"It stops the pull request from being merged before review.","correct":false,"why":"Merge protection comes from rulesets, required reviews, and required checks. This gate is about execution, not merge."},{"text":"It prevents privileged workflows from running automatically against changes nobody has looked at yet.","correct":true,"why":"The gate stops workflow execution - and therefore access to runners, tokens, and potentially secrets - until a human with write access has looked at the change. It is a built-in guardrail against privileged execution on untrusted input."},{"text":"It reduces GitHub Actions minutes consumption on draft pull requests.","correct":false,"why":"Cost may drop as a side effect, but the control exists for security, not billing."},{"text":"It guarantees the agent's commits are signed.","correct":false,"why":"Commit signing is enforced by rulesets. It is unrelated to workflow-run approval."}],"takeaway":"Approval before workflow execution is a distinct gate from approval before merge - it protects the runner, token, and secrets."},{"id":"auth-d1-15","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.3.1","module":"m2","unit":"m2-reliable-workflows","type":"single","text":"Using the risk-based autonomy model from the architecture module, how should changes under .github/workflows/ be governed compared with changes under docs/?","options":[{"text":"Identically - both are text files and both go through a pull request.","correct":false,"why":"Uniform rules are exactly what risk-based autonomy replaces. Workflow files are a \"small diff, big consequence\" area."},{"text":"docs/ can be automerged after required checks pass; .github/workflows/ needs CODEOWNERS review, multiple approvals, and stricter rulesets.","correct":true,"why":"The published model tiers autonomy by risk: low-risk paths such as docs and formatting can be automerged after checks; high-risk paths such as infra/ and .github/workflows/ require CODEOWNERS plus multiple reviews and stronger rules. Critical actions such as production deploys and secrets go further, to environment approvals."},{"text":"Workflow changes should be blocked entirely for agents; docs changes need two human reviewers.","correct":false,"why":"This inverts the intent: it over-restricts high-risk work into impossibility and taxes the low-risk work that should flow freely."},{"text":"docs/ needs an environment approval; .github/workflows/ needs required checks only.","correct":false,"why":"This applies the strongest control to the least risky path and the weakest to the most dangerous one."}],"takeaway":"Tier autonomy by risk: low (automerge after checks), medium (PR plus checks plus a review), high (CODEOWNERS plus stricter rules), critical (environment approval)."},{"id":"auth-d1-16","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.3.2","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"During an audit you must answer: \"Which workflow run produced this test report, and against what code state?\" What design principle makes that answerable?","options":[{"text":"Evidence must be traceable to a specific workflow run and a specific commit.","correct":true,"why":"This is the naming and metadata principle the operations unit teaches. Without run-and-commit traceability you have an artifact you cannot tie to a code state, which defeats both audit and debugging."},{"text":"Artifacts should be committed back into the repository so git history holds them.","correct":false,"why":"Committing generated files back is the pattern the modules steer you away from. Upload where produced, download where consumed."},{"text":"Every artifact should be uploaded with a random unique name to avoid collisions.","correct":false,"why":"Random names guarantee uniqueness and destroy meaning. The point is traceability, not just distinctness."},{"text":"Logs should be retained indefinitely.","correct":false,"why":"Indefinite retention is neither available by default nor sufficient - an unbounded log pile without run and commit linkage still cannot answer the question."}],"takeaway":"Evidence is only useful when it points at a specific run and a specific commit. Design artifact naming and metadata for that."},{"id":"auth-d1-17","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.3.3","module":"m6","unit":"m6-design-human-workflows","type":"single","text":"A team added mandatory human approval to every agent action. Six weeks later, approvals are rubber-stamped within seconds and one bad production change slipped through. What is the correct remedy?","options":[{"text":"Add a second required approver to every action.","correct":false,"why":"Doubling an approval nobody reads doubles the friction and halves nothing. Rubber-stamping is a named governance anti-pattern; more of the same makes it worse."},{"text":"Move humans to decision points that matter - merge, deploy, secret access - and let analysis, formatting, and routine checks run automatically.","correct":true,"why":"The published guidance is to put humans at decision points, not at every step. Concentrating approvals where risk is material restores the reviewer's attention and preserves velocity for reversible work."},{"text":"Remove human approval entirely and rely on required status checks.","correct":false,"why":"Checks validate only what they were designed to detect. High-impact and irreversible actions still need human judgment."},{"text":"Require approvals only outside business hours so reviewers are less rushed.","correct":false,"why":"Approval quality is a function of relevance and evidence, not of the clock."}],"takeaway":"Every approval should buy meaningful safety. Approval everywhere produces approval theater and hides the decisions that matter."},{"id":"auth-d1-18","source":"authored","sourceLabel":"Authored for coverage","domain":"d1","objective":"1.3.3","module":"m6","unit":"m6-design-human-workflows","type":"multi","text":"Which practices reduce governance fatigue while keeping oversight intact? (Select all that apply.)","options":[{"text":"Require evidence - tests, scans, artifacts - so review is fast","correct":true,"why":"Yes. A reviewer with the evidence in front of them decides quickly and correctly. Missing evidence is what makes review slow and shallow."},{"text":"Route reviews via CODEOWNERS so reviewers already have context","correct":true,"why":"Yes. Path-based routing sends the change to people who understand it, instead of taxing everyone with everything."},{"text":"Keep pull requests small and scoped","correct":true,"why":"Yes. Small PRs are faster to review and safer to revert - the modules tie small scope directly to rollback safety."},{"text":"Batch a week of agent changes into one large pull request to reduce review count","correct":false,"why":"No. Fewer, larger reviews means each one is harder, riskier, and less likely to be read properly - and rollback becomes coarse."}],"takeaway":"Fast review comes from good evidence, targeted routing, and small scope - not from removing the review."},{"id":"auth-d2-01","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.1.1","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"You are deciding which tools to give a code-review agent that must read source, search the repository, and leave review comments - but must never modify files. Which toolset selection follows the module's guidance?","options":[{"text":"Grant the full default toolset; the agent's instructions tell it not to write.","correct":false,"why":"Instructions are guidance. A capability the agent holds is a capability it can use, and tool allowlists are the enforcement layer."},{"text":"Grant a read-only toolset plus the specific comment capability, and nothing else.","correct":true,"why":"The capability boundary should match the job: read-only toolsets for planning and review agents, implementation tools reserved for execution agents. Prefer allowlists over broad wildcards, and treat changes to the allowlist as a governance-sensitive change."},{"text":"Grant read plus write, since review agents occasionally need to fix trivial typos.","correct":false,"why":"\"Occasionally needs\" is how scope creep starts. If typo fixing is in scope, that is a different agent with a different, deliberately granted capability."},{"text":"Grant no tools and paste the diff into the prompt manually.","correct":false,"why":"This removes the agent's ability to gather its own context and does not scale. Least privilege means the minimum needed, not zero."}],"takeaway":"Identify tools from the task's actual verbs, then allowlist exactly those. Read-only for planning and review; write tools for execution agents only."},{"id":"auth-d2-02","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.1.1","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"Agent profile configuration provides three kinds of control. Which pairing is correct?","options":[{"text":"Capability boundary = which tools are allowed; visibility boundary = whether the agent is user-selectable; delegation boundary = which subagents can be invoked.","correct":true,"why":"These are the three controls the operations unit names. Capability governs tools, visibility governs whether a human can pick the agent in interactive UI, and delegation governs which subagents it may hand off to."},{"text":"Capability boundary = the model used; visibility boundary = log verbosity; delegation boundary = runner size.","correct":false,"why":"None of these are governance boundaries. Model, logging, and runner sizing are operational settings."},{"text":"Capability boundary = branch protection; visibility boundary = repository visibility; delegation boundary = CODEOWNERS.","correct":false,"why":"These are repository controls, not agent-profile controls. They act on the change after it exists, not on what the agent may do."},{"text":"Capability boundary = token scope; visibility boundary = artifact retention; delegation boundary = concurrency group.","correct":false,"why":"Token scope is related but is a workflow permission concern; retention and concurrency are unrelated to agent-profile boundaries."}],"takeaway":"Agent profiles set three boundaries: capability (tools), visibility (user-selectable or not), and delegation (which subagents can be invoked)."},{"id":"auth-d2-03","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.1.2","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"You want a custom agent that only looks at JavaScript files and the src/auth/ tree, and can only read and search. Where and how do you express that?","options":[{"text":"In a .agent.md file under .github/agents/, using applyTo for the file scope and tools for the allowed actions.","correct":true,"why":"Custom agents live in .github/agents/ with the .agent.md extension. applyTo narrows which files or directories the agent focuses on and tools defines what actions it can perform - for example read_file and search_files."},{"text":"In .github/workflows/agent.yml, using a paths filter on the trigger.","correct":false,"why":"A paths filter decides whether a workflow runs at all. It does not scope what an agent may touch once it is running."},{"text":"In CODEOWNERS, by assigning the agent as owner of those paths.","correct":false,"why":"CODEOWNERS routes review requests to owners; it grants and restricts nothing at execution time."},{"text":"In the repository's Copilot settings, by listing allowed directories.","correct":false,"why":"Repository settings enable the cloud agent for the repository. Within-repository focus is refined in the agent file."}],"takeaway":"Repository scope defines where an agent operates; the custom agent file (applyTo, tools) defines what it may access and do inside that boundary."},{"id":"auth-d2-04","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.1.3","module":"m6","unit":"m6-control-agent-capabilities","type":"single","text":"A workflow's analysis job only reads code, but a later job must open a pull request. Which permissions layout is correct?","options":[{"text":"Set permissions: write-all at workflow level so neither job can fail on a permission error.","correct":false,"why":"This grants every job far more than it needs and is the \"excess permissions\" anti-pattern: a small mistake in the read-only job becomes a repository-wide incident."},{"text":"Set contents: read at workflow level, then grant contents: write and pull-requests: write on the job that writes.","correct":true,"why":"Read-only defaults at workflow level with job-level elevation is the published least-privilege pattern. Only the job that must write gets write capability, so the blast radius of the analysis job stays minimal."},{"text":"Omit the permissions block entirely and rely on repository defaults.","correct":false,"why":"Defaults vary by repository and organization settings. The guidance is to define permissions explicitly and minimize them."},{"text":"Store a personal access token as a secret and use it in both jobs.","correct":false,"why":"A PAT carries the user's broad access and bypasses the per-run scoping that GITHUB_TOKEN provides. It is a wider blast radius, not a narrower one."}],"takeaway":"Default to read at workflow level; elevate write only on the specific job that needs it. pull-requests: write is an elevated capability."},{"id":"auth-d2-05","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.2.1","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"In VS Code, you are adding the GitHub remote MCP server to an agent. Which sequence matches the documented flow?","options":[{"text":"Edit .github/workflows/mcp.yml and add the server URL under tools.","correct":false,"why":"That is workflow configuration, not the IDE flow. MCP servers are added through the Copilot Chat interface and become tools the agent can use."},{"text":"Open Copilot Chat in Agent mode, choose Configure tools, Add MCP server, select HTTP, enter https://api.githubcopilot.com/mcp/, pick a scope, then authenticate and save.","correct":true,"why":"This is the documented VS Code flow: the Tools icon, Configure tools, Add MCP server, HTTP server type, the server URL, a workspace or all-workspaces scope, then Authenticate and Save. The server then appears as a tool the agent can call."},{"text":"Install the server as a GitHub App from the Marketplace and grant it repository access.","correct":false,"why":"GitHub Apps are a different integration model. MCP servers are registered as tools for the client, not installed as apps on the repository."},{"text":"Add the server to CODEOWNERS so the agent is authorized to call it.","correct":false,"why":"CODEOWNERS has no relationship to tool authorization."}],"takeaway":"MCP servers are added through the client (Copilot Chat, Agent mode, Configure tools) and become callable tools; remote is the recommended setup for most users."},{"id":"auth-d2-06","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.2.2","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"A developer needs an MCP server that can reach files on their own machine and a bespoke internal script. Which configuration fits, and what changes?","options":[{"text":"A remote server, because remote is always recommended.","correct":false,"why":"Remote is recommended for most users of the GitHub MCP server, but it cannot reach local resources. The recommendation is a default, not a rule."},{"text":"A local server pointed at something like http://localhost:3000; setup in VS Code is otherwise identical and it typically needs no external authentication.","correct":true,"why":"Local MCP servers run on the developer's machine, can access local resources and custom workflows, and typically require no external authentication. The VS Code setup steps are the same - only the endpoint differs."},{"text":"A remote server with a firewall exception for the developer's machine.","correct":false,"why":"Inverting the direction does not help. A hosted server still does not have the local filesystem."},{"text":"Neither - MCP cannot expose local resources.","correct":false,"why":"Bridging to local resources is one of the documented capabilities of a local MCP server."}],"takeaway":"Local MCP servers reach local resources and usually skip external auth; remote servers reduce setup and travel across environments."},{"id":"auth-d2-07","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.2.2","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"Which statement about MCP server hosting options across GitHub deployments is accurate?","options":[{"text":"GitHub Enterprise Server supports local MCP server configuration, while GitHub Enterprise Cloud with data residency supports both local and remote.","correct":true,"why":"This is the documented split. Deployment model constrains which hosting options are available, so it is worth checking before you standardize on remote."},{"text":"Remote MCP servers are the only supported option on every GitHub deployment.","correct":false,"why":"Local configuration is supported, and on GitHub Enterprise Server it is the supported path."},{"text":"Local MCP servers are only supported in GitHub Enterprise Cloud.","correct":false,"why":"This reverses the actual situation for GitHub Enterprise Server."},{"text":"MCP server hosting is identical across all GitHub deployments.","correct":false,"why":"Support differs by deployment, which is exactly why the modules call it out."}],"takeaway":"Check the deployment: Enterprise Server supports local configuration; Enterprise Cloud with data residency supports both local and remote."},{"id":"auth-d2-08","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.2.3","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"multi","text":"Your enterprise is hosting a custom MCP registry for Copilot. Which requirements must it satisfy? (Select all that apply.)","options":[{"text":"Follow the MCP registry v0.1 specification","correct":true,"why":"Yes. The registry must conform to the specification for Copilot to consume it."},{"text":"Expose HTTPS endpoints including GET /v0.1/servers and the per-server version endpoints","correct":true,"why":"Yes - GET /v0.1/servers, GET /v0.1/servers/{serverName}/versions/latest, and GET /v0.1/servers/{serverName}/versions/{version}."},{"text":"Include CORS headers such as Access-Control-Allow-Origin, Access-Control-Allow-Methods, and Access-Control-Allow-Headers","correct":true,"why":"Yes. Without the required CORS headers Copilot cannot access the registry from the client."},{"text":"Be hosted inside the same repository as the agent that consumes it","correct":false,"why":"No. A registry is an org- or enterprise-level service. You can fork and self-host the open-source registry, run it locally with Docker, build your own, or use Azure API Center as a managed registry."}],"takeaway":"A custom registry needs the v0.1 spec, the three HTTPS endpoints, and CORS headers - then the registry URL goes into Copilot policy settings."},{"id":"auth-d2-09","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.2.3","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"An enterprise sets Restrict MCP access to registry servers to \"Registry only\". A developer's local MCP server stops working. Why, and what fixes it?","options":[{"text":"Local servers are always exempt from the policy; the failure must be a network issue.","correct":false,"why":"Local servers are not exempt. Under Registry only, they must be listed in the registry too."},{"text":"Under Registry only, local servers must also be listed in the registry, with server IDs matching exactly.","correct":true,"why":"That is the documented behavior. Registry only limits developers to servers defined in the configured registry, and local MCP servers must be included with exactly matching server IDs."},{"text":"The developer must switch to Allow all in their personal Copilot settings.","correct":false,"why":"The policy is set at organization or enterprise level and applies immediately to all developers. Individuals cannot override it."},{"text":"Local servers require a paid Copilot seat upgrade under Registry only.","correct":false,"why":"Allowlist enforcement is tied to the Copilot seat that governs the user, but the fix here is registry listing, not a seat change."}],"takeaway":"\"Allow all\" means any server; \"Registry only\" means registry-listed servers only - including local ones, with exactly matching IDs."},{"id":"auth-d2-10","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.2.4","module":"m3","unit":"m3-mcp-servers-registry-allowlists","type":"single","text":"MCP servers, registries, and allow lists each solve a different part of the same problem. Which mapping is correct?","options":[{"text":"Server exposes tools; registry makes servers discoverable and trustable; allow list decides which servers are permitted.","correct":true,"why":"This is the three-part model the module summarizes. Together they let teams discover useful servers while the organization keeps governance over what is actually allowed."},{"text":"Server decides what is permitted; registry exposes tools; allow list makes servers discoverable.","correct":false,"why":"The roles are shuffled. Permission is policy (allow list), discovery is catalog (registry), and exposure is the server."},{"text":"Registry enforces read/write permissions; allow list exposes tools; server catalogs available clients.","correct":false,"why":"None of these are the documented responsibilities. A registry is a catalog, not a permission engine."},{"text":"All three are alternative names for the same organization policy setting.","correct":false,"why":"They are three distinct components, configured in different places."}],"takeaway":"Server = exposes tools. Registry = discovery and distribution. Allow list = the policy gate."},{"id":"auth-d2-11","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.1","module":"m3","unit":"m3-execution-context-boundaries","type":"multi","text":"Which elements make up an agent's execution context in GitHub? (Select all that apply.)","options":[{"text":"The repository the agent is working in","correct":true,"why":"Yes. Repository scope is the first boundary; agents cannot reach other repositories unless explicitly granted."},{"text":"The branch the agent is targeting","correct":true,"why":"Yes. Branch-based isolation keeps changes off the default branch until review."},{"text":"The workflow executing the tasks and the permissions granted to it","correct":true,"why":"Yes. The workflow is the controlled execution container and its permissions determine capability."},{"text":"The number of contributors with write access to the repository","correct":false,"why":"No. Contributor count has no bearing on what an agent may do; capability comes from permissions, not from headcount."}],"takeaway":"Execution context = repository + branch + workflow + permissions. Together they determine both visibility and capability."},{"id":"auth-d2-12","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.2","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"Where do you enable and scope the Copilot cloud agent for a single repository?","options":[{"text":"Organization settings, Copilot, Policies - then list the repository.","correct":false,"why":"Organization Copilot policies govern features such as MCP usage across the org. Enabling the cloud agent for a specific repository is a repository-level action."},{"text":"Repository Settings, under Code & automation, Copilot, Cloud agent - enable and configure it there.","correct":true,"why":"That is the documented path. Once configured, the agent is scoped to that repository and cannot operate outside it."},{"text":"By adding a .github/agents/ directory - creating the directory is what enables the agent.","correct":false,"why":"Custom agent files refine scope and capability within a repository, but they do not enable the cloud agent for it."},{"text":"By adding the agent to the repository's CODEOWNERS file.","correct":false,"why":"CODEOWNERS routes reviews. It does not enable or scope an agent."}],"takeaway":"Repository scope is configured at the repository level; the agent then cannot operate outside that repository."},{"id":"auth-d2-13","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.3","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"You are writing .github/workflows/agent-task.yml to run an agent nightly and on demand. Which combination of workflow elements is required for it to be a controlled execution path?","options":[{"text":"A trigger and a runner only - permissions are inherited automatically.","correct":false,"why":"Inherited defaults are exactly what the guidance says to replace. Permissions should always be explicitly defined and minimized."},{"text":"A trigger (for example workflow_dispatch plus schedule), an explicit permissions block, a job and runner, checkout, and authentication passed via env from secrets.","correct":true,"why":"The workflow becomes the execution boundary: a defined trigger, a defined runner, a defined repository context, and only the permissions granted to that workflow. Authentication is supplied at runtime from secrets rather than embedded in the file."},{"text":"A schedule trigger and a hard-coded personal access token in the run step.","correct":false,"why":"Secrets must never appear in workflow YAML in plain text. They are injected at runtime through protected secret boundaries."},{"text":"A pull_request trigger only, since agents should never run on a schedule.","correct":false,"why":"Scheduled agent work - reporting, dependency checks, triage - is a normal and supported pattern."}],"takeaway":"Invoking an agent in CI means wrapping it in a workflow with an explicit trigger, explicit minimal permissions, and runtime-injected credentials."},{"id":"auth-d2-14","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.3","module":"m3","unit":"m3-interact-github-apis-workflows","type":"single","text":"How does a GitHub Agentic Workflow differ structurally from a traditional GitHub Actions workflow?","options":[{"text":"It replaces GitHub Actions with a separate agent runtime.","correct":false,"why":"Agentic workflows compile to a lock file that GitHub Actions executes. They augment CI/CD rather than replacing it."},{"text":"It pairs frontmatter (triggers, permissions, tools, safe outputs) with Markdown that describes the intended outcome, and the agent works out the steps within those guardrails.","correct":true,"why":"The Markdown expresses intent; the frontmatter defines the boundaries. That is the whole difference: traditional workflows specify every step deterministically, while agentic workflows describe outcomes and let the agent determine how, inside declared constraints."},{"text":"It removes the need for permissions because the agent decides its own access.","correct":false,"why":"The opposite - permissions are declared in frontmatter, and the model defaults to read-only tokens."},{"text":"It runs only on self-hosted runners.","correct":false,"why":"Runner choice is unrelated to the distinction."}],"takeaway":"Agentic workflows: Markdown states the outcome, frontmatter states the guardrails, and it compiles to a lock file that Actions runs."},{"id":"auth-d2-15","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.4","module":"m3","unit":"m3-execution-context-boundaries","type":"single","text":"A team believes they can control which branch an agent works on by setting a field in the custom agent file. Are they right?","options":[{"text":"Yes - the branch field in the .agent.md file sets the working branch.","correct":false,"why":"No such control exists in the agent file. Custom agents define applyTo, tools, and instructions."},{"text":"No - branch-based scope is enforced by the execution context, not the custom agent. With a cloud agent you select a base branch and the system creates the working branch; in CI the workflow determines the branch.","correct":true,"why":"Custom agents define what files they focus on, what actions they can perform, and how they behave - but not branch creation, pull request behavior, or execution isolation. Those come from the system executing the agent."},{"text":"Yes - applyTo accepts branch patterns as well as file globs.","correct":false,"why":"applyTo limits which files or directories the agent focuses on. It is a path filter, not a ref filter."},{"text":"No - agents always work directly on the default branch.","correct":false,"why":"The opposite is true: agents create a branch, change files there, and open a pull request against a base branch."}],"takeaway":"Custom agents control focus and capability. Branch creation, PR behavior, and execution isolation belong to the execution context."},{"id":"auth-d2-16","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.5","module":"m3","unit":"m3-agent-execution-limits-protections","type":"single","text":"Which statement best describes how far the Copilot cloud agent goes on its own once it has finished working?","options":[{"text":"It creates a pull request and merges it once required checks pass.","correct":false,"why":"Merging is never automatic here. Even where a PR exists, merge remains gated by policy and human decision."},{"text":"It prepares changes on a separate branch for review; you decide whether to create a pull request, request updates, or discard the work.","correct":true,"why":"The limits unit is explicit: the agent works on a separate branch and prepares changes for review, but does not finalize them. The final decision stays in human control."},{"text":"It pushes directly to the default branch and opens an issue describing what it did.","correct":false,"why":"Agents do not work directly on the default branch - branch-based isolation is a core safety mechanism."},{"text":"It waits for a human to create the branch before it can make any change.","correct":false,"why":"The agent creates its own working branch from the base branch you selected."}],"takeaway":"The agent prepares; you dispose. Branch isolation plus a human decision point on the pull request is the safety model."},{"id":"auth-d2-17","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.6","module":"m3","unit":"m3-execution-context-boundaries","type":"multi","text":"Which guardrails are part of the defense-in-depth model in GitHub Agentic Workflows? (Select all that apply.)","options":[{"text":"Read-only tokens by default, so the agent inspects state without directly changing it","correct":true,"why":"Yes. The default posture is read-only; writes go through a separate controlled path."},{"text":"Safe outputs - the agent proposes actions and a separate gated step decides what is allowed","correct":true,"why":"Yes. This creates an explicit boundary between reasoning and writing."},{"text":"Zero secrets in the agent process, plus sandboxed containerized execution and network isolation with allowlisted egress","correct":true,"why":"Yes. Keeping credentials out of the agent runtime and constraining the sandbox and network limits what a compromised or misled agent can reach."},{"text":"Automatic merge of agent pull requests once threat detection passes","correct":false,"why":"No. Threat detection scans proposed outputs before a write action is applied; it does not authorize a merge. Merge stays under policy and human control."}],"takeaway":"Agentic workflow guardrails: read-only defaults, safe outputs, no secrets in the agent process, sandboxing, network allowlists, and output threat detection."},{"id":"auth-d2-18","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.6","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"A workflow's CI secrets work fine, but the agent's runtime cannot see them. What principle explains this?","options":[{"text":"Secrets are only available on self-hosted runners.","correct":false,"why":"Secret availability is about boundaries and scoping, not runner type."},{"text":"The agent's runtime environment has its own secret boundary and does not automatically inherit repository CI secrets.","correct":true,"why":"This is stated directly in the operations unit. Secrets should be injected at runtime into the components that need them, and scoped - for example by environment - to reduce exposure."},{"text":"Secrets expire after 90 days, matching artifact retention.","correct":false,"why":"Ninety days is the default retention for workflow logs and artifacts, not a secret lifetime."},{"text":"Secrets can only be read by jobs with contents: write.","correct":false,"why":"Secret access is not derived from the contents permission."}],"takeaway":"Do not assume the agent runtime inherits CI secrets. Inject at runtime, pass only to the component that needs it, and scope by environment."},{"id":"auth-d2-19","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.4.1","module":"m3","unit":"m3-agent-execution-limits-protections","type":"single","text":"An agent step fails midway, but the workflow keeps going and later steps commit half-finished work. Which change addresses the root problem?","options":[{"text":"Keep continue-on-error: false so a failing step stops the run instead of silently continuing, and log a meaningful error.","correct":true,"why":"The error-handling guidance is to fail fast, log meaningfully, and prevent partial or inconsistent changes. Letting execution continue past a failure is what produced the half-finished commit."},{"text":"Set continue-on-error: true so the workflow always reaches the cleanup step.","correct":false,"why":"That is the opposite: it explicitly allows execution to continue after an error, which is how partial changes get committed."},{"text":"Increase timeout-minutes so the step has more time to recover.","correct":false,"why":"The step failed, it did not run out of time. More time changes nothing."},{"text":"Move the agent step to a separate workflow triggered by workflow_run.","correct":false,"why":"Splitting workflows changes sequencing, not whether a failure halts execution."}],"takeaway":"Fail fast, log meaningfully, and never let a failed step leave partial state behind."},{"id":"auth-d2-20","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.4.2","module":"m2","unit":"m2-agent-operations-controls","type":"single","text":"Your safe-iteration policy needs a rule for what happens when the same required check keeps failing on an agent's pull request. Which policy matches the module's guidance?","options":[{"text":"Let the agent keep revising until the check passes - convergence is the goal.","correct":false,"why":"Unbounded iteration is how workflows flap. The published policy exists precisely to prevent infinite loops."},{"text":"The agent may revise and re-run, but if the same required check fails twice, escalate to a human with what failed, what was attempted, what evidence exists, and a suggested next step.","correct":true,"why":"This is the safe-iteration policy: bounded retries plus a defined escalation threshold, and an escalation payload that makes the handoff actionable rather than just a notification."},{"text":"Escalate on the first failure so a human always sees it.","correct":false,"why":"That trades one problem for another - a human interrupted by every transient failure will stop reading escalations."},{"text":"Disable the failing check so the pull request can proceed.","correct":false,"why":"Removing a required check is a governance-drift move. Treat renaming or removing required checks as high risk."}],"takeaway":"Bounded retries plus a clear escalation threshold - and escalate with failure, attempts, evidence, and a suggested next step."},{"id":"auth-d2-21","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.4.3","module":"m3","unit":"m3-agent-execution-limits-protections","type":"single","text":"Which pair correctly separates rollback that GitHub gives you for free from rollback you have to perform deliberately?","options":[{"text":"Free: branch isolation and pull request review before merge. Deliberate: closing or discarding the PR, or reverting commits after a merge.","correct":true,"why":"Branch isolation plus pre-merge review means unmerged agent work never touched the main codebase - rollback is the default state. Once merged, you must act: revert the commits. Before merge, discarding the PR is the cheap path."},{"text":"Free: reverting merged commits. Deliberate: creating a branch.","correct":false,"why":"Reverting a merge is a deliberate corrective action, and branch creation is part of the normal agent flow."},{"text":"Free: environment approvals. Deliberate: required status checks.","correct":false,"why":"Neither is a rollback mechanism; both are gates that prevent the change rather than undo it."},{"text":"Free: workflow re-runs. Deliberate: artifact deletion.","correct":false,"why":"Re-running a workflow does not undo a change, and deleting artifacts destroys evidence rather than reversing code."}],"takeaway":"Branch isolation plus pre-merge review is rollback by default. Post-merge, rollback means an explicit revert - which is why small, scoped PRs matter."},{"id":"auth-d2-22","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.4.4","module":"m3","unit":"m3-agent-execution-limits-protections","type":"multi","text":"Which mechanisms implement an escalation path for an agent that cannot complete its task? (Select all that apply.)","options":[{"text":"Requiring pull request review before the change can proceed","correct":true,"why":"Yes. Review is the built-in handoff point where a human takes over a decision the agent could not make."},{"text":"Automatically assigning reviewers - for example via CODEOWNERS on the affected paths","correct":true,"why":"Yes. Automatic assignment routes the escalation to people with the right context instead of leaving it unowned."},{"text":"A workflow step that notifies maintainers when the agent reports it is blocked","correct":true,"why":"Yes. Notification steps make escalation active rather than relying on someone noticing a stalled PR."},{"text":"Increasing the retry count until the agent eventually succeeds","correct":false,"why":"No. Unbounded retries are the alternative to escalation, not a form of it - and for security failures the guidance is explicitly to investigate rather than retry."}],"takeaway":"Escalation is a designed route to a human: required review, automatic reviewer assignment, and active notification - not more retries."},{"id":"auth-d2-23","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.4.5","module":"m3","unit":"m3-agent-execution-limits-protections","type":"single","text":"A team notices that agent actions performed with GITHUB_TOKEN do not kick off further workflow runs, but the same actions using a GitHub App token do. What is the practical implication?","options":[{"text":"GITHUB_TOKEN is broken and should be replaced with an App token.","correct":false,"why":"This is documented behavior, not a defect. Most actions taken with GITHUB_TOKEN do not trigger additional workflow runs."},{"text":"The GITHUB_TOKEN restriction helps prevent unintended loops; App tokens and PATs enable richer chaining but require deliberate design to avoid recursive execution.","correct":true,"why":"The restriction is a loop guard. Other authentication methods can trigger further runs depending on configuration, which enables more flexible automation patterns but demands careful design to avoid recursion and runaway automation."},{"text":"App tokens should never be used with agents.","correct":false,"why":"They are legitimate when you actually need downstream workflows to fire; you just have to design for it."},{"text":"Workflow chaining is impossible on GitHub.","correct":false,"why":"workflow_run triggers and other patterns support chaining explicitly."}],"takeaway":"GITHUB_TOKEN's non-triggering behavior is a deliberate loop guard. If you switch to App tokens or PATs, design against recursive execution."},{"id":"auth-d2-24","source":"authored","sourceLabel":"Authored for coverage","domain":"d2","objective":"2.3.5","module":"m3","unit":"m3-exercise","type":"single","text":"In the Agentic Workflows exercise, the workflow gathers information from Mona's notes, the GitHub Blog, and the Changelog and then proposes website updates. How does it deliver those updates?","options":[{"text":"It commits directly to the default branch so the site stays current.","correct":false,"why":"Direct-to-default is the pattern the whole exercise is designed to avoid. Proposed changes must be reviewable before they land."},{"text":"It opens a pull request containing the proposed changes and a summary of the sources used, so a human can review before merging.","correct":true,"why":"The exercise's expected outcome is a pull request with proposed website updates and a clear summary of sources and reasoning - proposals reviewed by a human, not applied automatically."},{"text":"It emails maintainers a diff for manual application.","correct":false,"why":"That takes the work off-platform and loses the review surface, the checks, and the audit trail."},{"text":"It writes the updates into a workflow artifact only, with no repository change proposed.","correct":false,"why":"An artifact alone would not propose the change. The exercise explicitly produces a PR."}],"takeaway":"Agentic workflows land their work as reviewable pull requests with a summary of sources - proposal first, human decision second."},{"id":"auth-d3-01","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.1.1","module":"m4","unit":"m4-agent-memory-strategies","type":"single","text":"Match the information to the right memory tier: the acceptance criteria for the task currently in flight, the team's reusable review conventions, and the recent chat turns in this session.","options":[{"text":"Acceptance criteria to external memory (issue), conventions to long-term memory (repository instructions), recent turns to short-term memory.","correct":true,"why":"External memory is durable and reviewable, which is why requirements and acceptance criteria belong in issues or PR descriptions. Long-term memory holds curated, reusable knowledge such as conventions and repeatable processes. Short-term memory is the working context for the current task and is not preserved across sessions."},{"text":"All three to short-term memory, since the agent needs them all right now.","correct":false,"why":"Short-term memory does not survive the session, so requirements and conventions would be lost the moment work pauses."},{"text":"Acceptance criteria to short-term memory, conventions to external memory, recent turns to long-term memory.","correct":false,"why":"This inverts durability. Ephemeral chat turns do not deserve long-term storage, and criteria need to outlive the session."},{"text":"All three to long-term memory, so nothing is ever lost.","correct":false,"why":"Storing everything forever produces stale, diluted context. Memory should be selective and pruned."}],"takeaway":"Short-term = current working context. Long-term = curated reusable knowledge. External (GitHub artifacts) = the durable source of truth."},{"id":"auth-d3-02","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.1.1","module":"m4","unit":"m4-agent-memory-strategies","type":"single","text":"Why does the module call external memory the source of truth rather than long-term memory?","options":[{"text":"Because external memory is faster to query.","correct":false,"why":"Speed is not the criterion. Issues and PRs are not necessarily faster to read than in-context memory."},{"text":"Because it is persistent and can be reviewed at any time by anyone, not just by the agent.","correct":true,"why":"External memory lives in durable systems - issues, pull requests, documentation, workflow outputs. Persistence plus reviewability is what makes it authoritative: a human can inspect it, correct it, and hold the agent to it."},{"text":"Because long-term memory is deleted at the end of every session.","correct":false,"why":"That describes short-term memory. Long-term memory persists but is not independently inspectable in the same way."},{"text":"Because external memory is encrypted at rest.","correct":false,"why":"Encryption is unrelated to why the module designates it the source of truth."}],"takeaway":"External memory wins because it is durable and inspectable - the same property that makes GitHub the system of record."},{"id":"auth-d3-03","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.1.2","module":"m4","unit":"m4-agent-memory-strategies","type":"multi","text":"Which information is relevant enough to keep in an agent's memory for a task? (Select all that apply.)","options":[{"text":"Requirements and constraints for the task","correct":true,"why":"Yes. These directly affect the outcome and are the first thing to preserve."},{"text":"Decisions that affect the implementation","correct":true,"why":"Yes. Losing prior decisions is how an agent contradicts itself across sessions."},{"text":"The validation and testing approach","correct":true,"why":"Yes. How the work will be judged shapes how it should be done."},{"text":"Every intermediate step the agent took while exploring the repository","correct":false,"why":"No. Temporary intermediate steps and duplicated context do not affect the outcome. Keeping them dilutes signal and raises the chance of acting on outdated information."}],"takeaway":"Keep what changes the outcome - requirements, constraints, decisions, validation approach. Drop transient exploration and duplicated context."},{"id":"auth-d3-04","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.1.3","module":"m4","unit":"m4-agent-state-context-drift","type":"single","text":"By default, how long does GitHub retain workflow logs and artifacts, and how far can that be adjusted?","options":[{"text":"30 days by default, adjustable up to 90 days for all repositories.","correct":false,"why":"The default is longer than 30 days, and the private-repository ceiling is considerably higher."},{"text":"90 days by default; retention is configurable at repository, organization, or enterprise level, with public repositories typically allowing 1-90 days and private repositories up to 400 days.","correct":true,"why":"This matters for memory expiration design: evidence you expect to audit later must either be retained deliberately or summarized into a durable artifact before it expires."},{"text":"Indefinitely, unless manually deleted.","correct":false,"why":"Logs and artifacts are automatically deleted after the retention period."},{"text":"400 days by default for every repository.","correct":false,"why":"400 days is the upper bound configurable for private repositories, not the default."}],"takeaway":"90 days by default; configurable (roughly 1-90 for public, up to 400 for private). Plan expiration and summarization around that."},{"id":"auth-d3-05","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.1.3","module":"m4","unit":"m4-agent-state-context-drift","type":"single","text":"Requirements in the linked issue changed significantly halfway through an agent's task. Which memory-maintenance rule applies?","options":[{"text":"Pruning - delete the workflow artifacts produced so far.","correct":false,"why":"Pruning removes outdated or unnecessary artifacts to reduce clutter. It does not address carrying forward assumptions that are now wrong."},{"text":"A reset rule - update or rewrite the pull request description, or close and recreate the PR, and document the new direction before continuing.","correct":true,"why":"Reset rules exist for exactly this: requirements change significantly, a new implementation approach is chosen, or prior assumptions are no longer valid. The practical steps are to rewrite the PR description, recreate the PR if needed, and clearly document the new direction."},{"text":"Summarization - condense the execution history into key points.","correct":false,"why":"Summarization keeps memory manageable while preserving traceability. It does not invalidate assumptions that have become wrong."},{"text":"Expiration - wait for the 90-day retention window to clear the old context.","correct":false,"why":"Waiting three months is not a strategy, and the stale assumptions live in the PR description, not only in logs."}],"takeaway":"Expiration is time-based, pruning is clutter-based, summarization is volume-based - reset is for when the premises themselves changed."},{"id":"auth-d3-06","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.2.1","module":"m4","unit":"m4-agent-state-context-drift","type":"multi","text":"Which GitHub artifacts collectively act as durable state for an agent task? (Select all that apply.)","options":[{"text":"An issue holding requirements and acceptance criteria","correct":true,"why":"Yes. The issue anchors what \"done\" means and survives every session."},{"text":"A pull request tracking implementation, plan, and decisions","correct":true,"why":"Yes. GitHub aggregates commits, checks, and discussion in the PR, making it the primary place to track progress and decisions."},{"text":"Commits representing incremental progress and workflow runs capturing validation results","correct":true,"why":"Yes. Commits show what has already been done; workflow runs show what has been validated."},{"text":"The agent's in-session chat transcript","correct":false,"why":"No. Chat history is short-term context. The guidance is explicit: avoid storing critical information only in prompts or chat history."}],"takeaway":"Issue plus pull request plus commits plus workflow runs is the durable state set. Chat history is not state."},{"id":"auth-d3-07","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.2.2","module":"m4","unit":"m4-agent-state-context-drift","type":"single","text":"An agent resumes a task after a pause. Which sequence correctly reconstructs where it left off?","options":[{"text":"Re-read the original prompt and start the implementation again from scratch.","correct":false,"why":"This is the duplication the resume pattern exists to prevent, and it risks contradicting decisions already made."},{"text":"Open the existing pull request, review its description and the linked issue, check commits already made, review workflow results in the Checks tab, then continue from the latest state.","correct":true,"why":"This is the documented resume flow. Because GitHub preserves commit history and workflow runs, the agent can identify completed work and avoid repeating it."},{"text":"Query the previous session's chat transcript to recover context.","correct":false,"why":"Session context is not preserved across sessions and is not reviewable by anyone else."},{"text":"Re-run every workflow first to regenerate all evidence.","correct":false,"why":"Existing runs already record validation results. Blind re-runs burn time without telling you what is done."}],"takeaway":"Resume by re-anchoring to durable state - PR, issue, commits, checks - not by replaying the conversation."},{"id":"auth-d3-08","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.2.3","module":"m4","unit":"m4-agent-state-context-drift","type":"multi","text":"Which observations would indicate context drift during an extended agent execution? (Select all that apply.)","options":[{"text":"The pull request's changes no longer satisfy the stated acceptance criteria","correct":true,"why":"Yes. Divergence from acceptance criteria is the primary drift signal."},{"text":"Recent commits contradict decisions recorded earlier in the PR","correct":true,"why":"Yes. Contradicting prior decisions means the agent is no longer working from the agreed picture."},{"text":"Workflow checks that used to run are now failing or missing entirely","correct":true,"why":"Yes. Missing or newly failing checks suggest the agent's actions have moved away from the validated path."},{"text":"The workflow run took longer than the previous run","correct":false,"why":"No. Run duration is a performance observation. Drift is about alignment with goal and prior decisions, not speed."}],"takeaway":"Detect drift by comparing current changes against acceptance criteria, recorded decisions, and expected checks. Correct it by re-reading the source of truth."},{"id":"auth-d3-09","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.3.1","module":"m4","unit":"m4-memory-state-continuity","type":"single","text":"A task starts in the IDE, continues in the CLI, and finishes on GitHub. How should state be shared across those surfaces?","options":[{"text":"Copy the accumulated context into each tool's prompt as the work moves.","correct":false,"why":"Copied context is the mechanism by which conflicting versions appear. The guidance is to share durable references, not copied context."},{"text":"Share durable references - pull request numbers, branch names, commit SHAs, workflow run links, issue and PR URLs - so every environment retrieves the same state.","correct":true,"why":"Because all environments can access the same repository data, referencing rather than copying lets the agent maintain continuity without transferring session context. The pull request becomes the central reference point."},{"text":"Export the session to a local file and re-import it in the next tool.","correct":false,"why":"A local export is invisible to reviewers, not versioned, and diverges the moment the repository changes."},{"text":"Keep each tool's state private and reconcile at the end.","correct":false,"why":"Private per-tool state is precisely what produces conflicting context. No tool should keep private mutable state."}],"takeaway":"Share references, not copies. The PR, branch, commit SHA, and run links resolve to the same state from any environment."},{"id":"auth-d3-10","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.3.1","module":"m4","unit":"m4-memory-state-continuity","type":"single","text":"Which mapping of information type to source of truth matches the module's guidance?","options":[{"text":"Requirements to issues; decisions and progress to pull requests; validation rules to repository instructions; execution results to workflow runs and artifacts.","correct":true,"why":"Defining exactly one home per information type is what prevents conflicting context. Each type has a clear location and updates go to the original rather than to a new copy."},{"text":"Requirements to the agent's prompt; decisions to chat history; results to reviewer memory.","correct":false,"why":"None of these are durable or inspectable, and the guidance explicitly warns against storing critical information only in prompts or chat."},{"text":"Everything to a single README file for simplicity.","correct":false,"why":"One file for everything makes concurrent updates collide and cannot carry per-run execution evidence."},{"text":"Requirements to pull requests; decisions to issues; results to commit messages.","correct":false,"why":"This shuffles the roles. Issues define requirements; PRs carry decisions and progress; results live in workflow runs and artifacts."}],"takeaway":"One information type, one home. Issues for requirements, PRs for decisions and progress, instructions for rules, runs and artifacts for results."},{"id":"auth-d3-11","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.3.2","module":"m4","unit":"m4-memory-state-continuity","type":"single","text":"Acceptance criteria have been restated - slightly differently - in the issue, in the PR description, and in the agent's prompt. What is the correct correction?","options":[{"text":"Pick whichever version is most recent and delete the other two.","correct":false,"why":"Right instinct, wrong rule. Recency is not authority; the fix is to designate the source of truth and update it, not to race timestamps."},{"text":"Keep the issue as the single source of truth for requirements, remove the duplicates, and have the PR and prompt reference it instead of restating it.","correct":true,"why":"Conflicting context happens when the same information exists in multiple places with different values. The remedy is one source of truth per information type, no duplication, and updating the original rather than creating new copies."},{"text":"Have the agent reconcile the three versions itself at the start of each run.","correct":false,"why":"Reconciling ambiguity every run is expensive and non-deterministic. Removing the ambiguity is cheaper and reliable."},{"text":"Add a required status check that compares the three copies.","correct":false,"why":"This automates the maintenance of a structure that should not exist."}],"takeaway":"Prevent conflicting context by refusing to duplicate it: one home per information type, and always update the original."},{"id":"auth-d3-12","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.3.3","module":"m4","unit":"m4-memory-state-continuity","type":"multi","text":"Which practices prevent stale context in GitHub agent workflows? (Select all that apply.)","options":[{"text":"Ensure the branch is up to date with the base branch before continuing work","correct":true,"why":"Yes. An out-of-date branch is the classic stale-context case, and branch protection can require branches to be up to date before merging."},{"text":"Review the latest commits and workflow runs before making changes","correct":true,"why":"Yes. Re-anchoring to current state at the start of work is how you avoid acting on a cached picture."},{"text":"Update issues and pull requests whenever requirements change","correct":true,"why":"Yes. Stale context often originates from requirements that moved while the artifacts did not."},{"text":"Cache the repository tree at the start of a long task and reuse it throughout","correct":false,"why":"No. That is how stale context is created: the cached copy diverges from the real repository as other work lands."}],"takeaway":"Stale context is defeated by re-reading current state - up-to-date branches, latest commits and runs, and artifacts kept current."},{"id":"auth-d3-13","source":"authored","sourceLabel":"Authored for coverage","domain":"d3","objective":"3.1.3","module":"m4","unit":"m4-agent-state-context-drift","type":"single","text":"A compliance reviewer asks for evidence from an agent run that happened four months ago in a public repository. Artifacts are gone. What should the team have done?","options":[{"text":"Restored the deleted artifacts from the Actions tab.","correct":false,"why":"Deleted artifacts cannot be restored, and expired ones are gone as well."},{"text":"Summarized the outcome into durable artifacts - final decisions in the PR description, key commits referenced, workflow runs linked - before retention expired.","correct":true,"why":"Summarization is the documented answer to the retention limit: reduce detailed execution history into key points and references while preserving traceability. That summary lives in the PR and outlives the artifacts."},{"text":"Extended public repository retention to 400 days.","correct":false,"why":"The 400-day ceiling applies to private repositories; public repositories typically allow around 1-90 days."},{"text":"Disabled artifact expiration in organization settings.","correct":false,"why":"Retention can be configured within limits, but it cannot be disabled outright."}],"takeaway":"Retention is finite. Summarize decisions and link key runs into durable artifacts before evidence expires."},{"id":"auth-d4-01","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.1.1","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"single","text":"Where should the success criteria for an agent task be written so that both the agent and the reviewer can verify completion?","options":[{"text":"In the workflow file, as comments above each job.","correct":false,"why":"Workflow comments are invisible in the pull request review surface and are not tied to the specific task."},{"text":"As acceptance criteria in the issue, referenced from the pull request and used as the basis for validation.","correct":true,"why":"Success criteria belong in the issue or pull request, where they describe what must be true for the task to be complete. Writing them in the issue and referencing them from the PR gives both the agent and the reviewer the same yardstick."},{"text":"In the agent's system prompt only, so it always has them in context.","correct":false,"why":"Criteria held only in a prompt are not durable and not reviewable, so a human cannot check the work against them."},{"text":"In a spreadsheet the team maintains outside GitHub.","correct":false,"why":"Off-platform criteria break the system-of-record model and cannot be enforced as checks."}],"takeaway":"Write acceptance criteria in the issue, reference them from the PR, then enforce the checkable ones as required status checks."},{"id":"auth-d4-02","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.1.1","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"single","text":"Put the end-to-end evaluation flow in the right order.","options":[{"text":"Agent opens PR, reviewer approves, workflows run, required checks pass, issue defines criteria, merge.","correct":false,"why":"Criteria cannot be defined after the work is judged - the issue comes first."},{"text":"Issue defines the task and success criteria, agent branches and opens a PR, workflows run automatically, status checks appear on the PR, required checks must pass, a reviewer approves, then merge.","correct":true,"why":"This is the documented flow. Criteria are set before work starts, automation produces objective signals, required checks turn those signals into a gate, and human judgment closes the loop before merge."},{"text":"Workflows run, issue defines criteria, agent branches, merge, reviewer approves.","correct":false,"why":"Merging before review inverts the entire control model."},{"text":"Agent branches, merges to main, workflows run post-merge, reviewer inspects afterwards.","correct":false,"why":"Post-merge validation removes the gate. Validation must happen before changes are accepted."}],"takeaway":"Criteria first, evidence second, enforcement third, judgment fourth - then merge."},{"id":"auth-d4-03","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.1.2","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"multi","text":"Which of these are quantitative evaluation signals for agent output, as opposed to qualitative ones? (Select all that apply.)","options":[{"text":"Test pass rate and coverage delta","correct":true,"why":"Quantitative. These are numeric, comparable, and can be gated automatically."},{"text":"Count of new code scanning alerts","correct":true,"why":"Quantitative. An alert count is a number you can threshold in a required check."},{"text":"Performance delta against a benchmark","correct":true,"why":"Quantitative. A measured regression percentage is exactly the kind of signal you turn into a gate."},{"text":"Reviewer commentary on whether the approach fits the architecture","correct":false,"why":"Qualitative. It is a genuinely important signal - the modules pair it with automated ones - but it is human judgment, not a measurement."}],"takeaway":"Use both: quantitative signals (tests, alerts, coverage, performance) gate mechanically; qualitative signals (review, convention adherence) catch what checks cannot."},{"id":"auth-d4-04","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.1.2","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"single","text":"A team evaluates its agent solely on the number of pull requests merged per week. What is the flaw?","options":[{"text":"The metric is qualitative and therefore unreliable.","correct":false,"why":"It is a perfectly quantitative metric. The problem is what it measures, not how it is measured."},{"text":"It measures throughput rather than whether the work met its intent, so the agent can score well by producing many low-value or unsafe changes.","correct":true,"why":"Evaluation must align with development intent and be grounded in the signals a human contributor is judged on. Volume is neither an outcome nor a quality bar, and optimizing it actively rewards the wrong behavior."},{"text":"Merged pull requests cannot be counted automatically.","correct":false,"why":"They can be counted trivially. Measurability was never the issue."},{"text":"The metric should be gathered monthly rather than weekly.","correct":false,"why":"Changing the sampling period does not fix a metric that measures the wrong thing."}],"takeaway":"Evaluate against intent and the team's real quality bar. Volume metrics reward output, not outcomes."},{"id":"auth-d4-05","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.1.3","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"single","text":"Your organization wants agent work held to the same bar as human contributions. Which evaluation design achieves that most directly?","options":[{"text":"Add an agent-specific quality scorecard maintained by the platform team.","correct":false,"why":"A parallel bar for agents drifts from the team's real standards and creates two definitions of \"good\"."},{"text":"Use the same required checks, security scans, and review process that any contributor's pull request goes through.","correct":true,"why":"This is the contributor model applied to evaluation: judge the work by the standards of the workflow, not by the novelty of the author. It also avoids both failure modes - excessive suspicion and excessive trust."},{"text":"Require agent PRs to pass a stricter threshold than human PRs.","correct":false,"why":"Excessive suspicion is a named error. A double standard slows delivery without improving safety."},{"text":"Exempt agent PRs from review so you can measure raw agent capability.","correct":false,"why":"Excessive trust is the opposite named error, and it removes the qualitative signal entirely."}],"takeaway":"Aligning evaluation with intent means using the signals a human contributor is judged on - no special lane in either direction."},{"id":"auth-d4-06","source":"authored","sourceLabel":"Authored for coverage","domain":"d4","objective":"4.1.4","module":"m4","unit":"m4-evaluation-signals-quality-gates","type":"multi","text":"Which automated scanning capabilities can generate evaluation signals on an agent's pull request? (Select all that apply.)","options":[{"text":"Code scanning for vulnerabilities
