const SEARCH_DOCS = [
  ...modules.flatMap(m => m.units.filter(u => u.markdown).map(u => ({
    kind: "Unit", title: u.title, sub: m.title, href: "#/study/" + u.id, body: u.markdown
  }))),
  ...reference.map(r => ({ kind: "Reference", title: r.title, sub: r.source, href: "#/reference/" + r.id, body: r.markdown })),
  ...questions.map(q => ({
    kind: "Question", title: q.text, sub: SOURCE_TAG[q.source].label, href: "#/study/" + q.unit + "?from=" + q.id,
    body: q.text + " " + q.options.map(o => o.text + " " + o.why).join(" ") + " " + (q.takeaway || "")
  })),
  ...flashcards.map(c => ({ kind: "Flashcard", title: c.front, sub: c.section || "", href: "#/cards", body: c.front + " " + c.back }))
];

function viewSearch(query) {
  const input = el("input", {
    class: "search-input", type: "search", value: query || "",
    placeholder: "Search units, questions, explanations, flashcards…", autofocus: true,
    oninput: e => {
      const v = e.target.value;
      clearTimeout(input._t);
      input._t = setTimeout(() => {
        history.replaceState(null, "", "#/search?q=" + encodeURIComponent(v));
        renderResults(v);
      }, 160);
    }
  });
  const results = el("div", {});

  function renderResults(q) {
    results.textContent = "";
    const term = (q || "").trim().toLowerCase();
    if (term.length < 2) { results.appendChild(el("p", { class: "empty", text: "Type at least two characters." })); return; }
    const hits = [];
    for (const d of SEARCH_DOCS) {
      const hay = d.body.toLowerCase();
      const at = hay.indexOf(term);
      if (at < 0) continue;
      const titleHit = d.title.toLowerCase().includes(term);
      hits.push({ d, at, score: (titleHit ? 1000 : 0) + (d.kind === "Unit" ? 200 : d.kind === "Question" ? 100 : 0) - at / 1000 });
    }
    hits.sort((a, b) => b.score - a.score);
    if (!hits.length) { results.appendChild(el("p", { class: "empty", text: `Nothing matches “${q}”.` })); return; }
    results.appendChild(el("p", { class: "sec-note", style: "margin:14px 0 8px", text: `${hits.length} match${hits.length > 1 ? "es" : ""}` }));
    const box = el("div", { class: "card" });
    hits.slice(0, 60).forEach(({ d, at }) => {
      const start = Math.max(0, at - 90);
      const raw = d.body.slice(start, at + 190).replace(/\s+/g, " ");
      const snip = esc((start ? "…" : "") + raw + "…")
        .replace(new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>");
      box.appendChild(el("a", { class: "hit", href: d.href },
        el("div", { class: "row", style: "gap:8px" },
          el("span", { class: "tag" }, d.kind),
          el("span", { class: "hit-title", text: d.title })),
        el("div", { class: "hit-snip", html: snip }),
        d.sub ? el("div", { class: "hit-snip", style: "color:var(--faint);font-size:12.5px", text: d.sub }) : null));
    });
    results.appendChild(box);
  }

  renderResults(query);
  return el("div", { class: "wrap-narrow" },
    pageHead("Search", "Find anything",
      "Across all 52 module units, the reference shelf, every question and its explanations, and the flashcards."),
    input, results);
}

/* ==========================================================================
   Full-screen diagram viewer
   A drawing that has to shrink to a phone's width stops being readable, so the
   page shows it fitted and offers this to inspect it at its real size.
   ========================================================================== */
let dlgOpen = null;

function openDiagram(figure) {
  closeDiagram();
  const svg = figure.querySelector("svg");
  const caption = figure.querySelector("figcaption");
  const copy = svg.cloneNode(true);
  const vb = (svg.getAttribute("viewBox") || "").split(" ");
  const natural = Math.round(+vb[2] || 800);
  copy.setAttribute("width", natural);
  copy.removeAttribute("height");

  const dlg = el("div", { class: "dlg", role: "dialog", "aria-modal": "true",
                          "aria-label": svg.getAttribute("aria-label") || "Diagram" },
    el("div", { class: "dlg-head" },
      el("span", { class: "dlg-title", text: caption ? caption.textContent : "Diagram" }),
      el("button", { class: "btn btn-sm", type: "button", onclick: closeDiagram }, "Close")),
    el("div", { class: "dlg-hint", text: "drag or pinch to explore" }),
    el("div", { class: "dlg-body" }, copy));

  document.body.appendChild(dlg);
  document.body.style.overflow = "hidden";
  dlg.querySelector("button").focus();
  dlgOpen = dlg;
}

function closeDiagram() {
  if (!dlgOpen) return;
  dlgOpen.remove();
  dlgOpen = null;
  document.body.style.overflow = "";
}

document.addEventListener("click", e => {
  const zoom = e.target.closest && e.target.closest("[data-zoom]");
  if (zoom) { openDiagram(zoom.closest("figure.diagram")); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDiagram(); });

function notFound(msg, back) {
  return el("div", { class: "wrap-narrow" },
    pageHead(null, "Nothing here", msg),
    el("a", { class: "btn btn-primary", href: back || "#/" }, "Go back"));

function parseHash() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  return { parts: path.split("/").filter(Boolean), params: new URLSearchParams(qs || "") };
}

function render() {
  const { parts, params } = parseHash();
  closeDiagram();
  const main = document.getElementById("main");
  main.textContent = "";

  let view, section = "#/";
  switch (parts[0]) {
    case undefined:
      view = el("div", { class: "wrap" }, viewOverview()); break;

    case "study":
      section = "#/study";
      view = el("div", { class: "wrap" }, viewStudy(parts[1], params.get("from"))); break;

    case "objectives":
      section = "#/objectives";
      view = el("div", { class: "wrap" }, viewObjectives()); break;

    case "quiz": {
      section = "#/quiz";
      if (!parts[1]) { view = el("div", { class: "wrap" }, viewQuizPicker()); break; }
      if (parts[1] === "run") { view = viewRunner(); break; }
      const set = resolveQuizSet(parts[1], parts[2]);
      if (!set || !set.questions.length) { view = notFound("That quiz set is empty.", "#/quiz"); break; }
      startSession({ title: set.title, subtitle: set.subtitle, mode: "practice", questions: shuffle(set.questions) });
      return;
    }

    case "exam":
      section = "#/exam";
      if (parts[1] === "run") view = viewRunner();
      else if (parts[1] === "result") view = el("div", { class: "wrap" }, viewExamResult(parts[2]));
      else view = viewExamIntro();
      break;

    case "cards":
      section = "#/cards";
      view = viewCards(); break;

    case "reference":
      section = "#/reference";
      view = el("div", { class: "wrap" }, viewReference(parts[1])); break;

    case "search":
      section = "#/search";
      view = viewSearch(params.get("q") || ""); break;

    default:
      view = notFound("That address does not match anything in this guide.");
  }

  main.appendChild(view);
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.setAttribute("aria-current", a.dataset.nav === section ? "page" : "false"));

  // exam clock
  clearInterval(timerHandle);
  if (session && session.mode === "exam" && !session.finished && session.limitMs) {
    const tick = () => {
      const left = session.startedAt + session.limitMs - Date.now();
      const node = document.getElementById("timer");
      if (!node) return;
      if (left <= 0) { clearInterval(timerHandle); finishSession(); return; }
      const mm = String(Math.floor(left / 60000)).padStart(2, "0");
      const ss = String(Math.floor((left % 60000) / 1000)).padStart(2, "0");
      node.textContent = mm + ":" + ss;
      node.classList.toggle("low", left < 5 * 60 * 1000);
    };
    tick();
    timerHandle = setInterval(tick, 1000);
  }

  if (!(parts[0] === "quiz" && parts[1] === "run") && !(parts[0] === "exam" && parts[1] === "run")) {
    window.scrollTo(0, 0);
  }
}

document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (!session || session.finished) return;
  const { parts } = parseHash();
  if (!(parts[1] === "run")) return;
  const i = session.index, q = session.questions[i];
  if (/^[1-9]$/.test(e.key)) {
    const n = +e.key - 1;
    if (n < q.options.length) {
      const btn = document.querySelectorAll(".opts .opt")[n];
      if (btn && !btn.disabled) btn.click();
    }
  } else if (e.key === "ArrowRight" && i < session.questions.length - 1) { session.index++; render(); }
  else if (e.key === "ArrowLeft" && i > 0) { session.index--; render(); }
});

/* ---------------------------------------------------------------- boot */
function boot() {
  try {
    buildChrome();
    applyTheme(store.data.theme || "system");
    window.addEventListener("hashchange", render);
    render();
  } catch (err) {
    // never leave a blank page behind
    document.body.appendChild(el("div", { class: "wrap-narrow", style: "padding:40px 20px" },
      el("h1", { class: "page-title", text: "This page failed to start" }),
      el("p", { class: "page-lede", text: String(err && err.message || err) })));
    throw err;
  }
}

// published as a bare fragment the host wraps in <body>, and as a standalone
// document where this script parses into <head> - wait for the body either way
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();

</script>
